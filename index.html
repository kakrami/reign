  class Hazard extends Entity {
    constructor(type, x, width = 55) {
      super(x, terrainSurfaceY(x + width / 2) - 24, width, 24);
      this.type = type;
      this.timer = (type === "flame" || type === "plasma" || type === "acid" || type === "laser") ? rand(0, 1.2) : 0;
      this.active = type === "mine" || type === "saw";
      this.warning = false;
      this.baseY = terrainSurfaceY(this.cx);
      this.phase = rand(0, Math.PI * 2);
    }

    update(dt) {
      this.baseY = terrainSurfaceY(this.cx);
      if (this.type === "mine") {
        this.y = this.baseY - 28;
        this.h = 28;
        return;
      }
      if (this.type === "saw") {
        this.y = this.baseY - 48;
        this.h = 48;
        this.active = true;
        return;
      }

      const cycle = this.type === "laser" ? 3.45 : this.type === "acid" ? 3.7 : 4.0;
      this.timer = (this.timer + dt) % cycle;
      this.warning = this.timer >= cycle * 0.38 && this.timer < cycle * 0.60;
      this.active = this.timer >= cycle * 0.60 && this.timer < cycle * 0.82;

      if (this.type === "laser") {
        this.y = this.baseY - 72;
        this.h = 18;
      } else {
        this.y = this.active ? this.baseY - 138 : this.baseY - 22;
        this.h = this.active ? 138 : 22;
      }
    }

    isDangerous() {
      return this.type === "mine" ? !this.dead : this.type === "saw" ? true : this.active;
    }

    damagePlayer(player) {
      if (this.type === "mine") {
        this.dead = true;
        explode(this.cx, this.baseY - 10, "#ff6d43", 22);
        player.hit(22 * enemyDamageScale());
      } else {
        player.hit((this.type === "saw" ? 20 : this.type === "laser" ? 18 : this.type === "acid" ? 18 : this.type === "plasma" ? 17 : 15) * enemyDamageScale());
      }
    }

    dangerColor() {
      if (this.type === "laser") return "#ff5ed7";
      if (this.type === "plasma") return "#b95cff";
      if (this.type === "acid") return "#8dff5d";
      if (this.type === "saw") return "#ff6b55";
      return "#ff5a43";
    }

    drawDangerBadge(y, label = "!") {
      const pulse = 1 + Math.sin(time * 8 + this.phase) * 0.08;
      ctx.save();
      ctx.translate(this.cx, y);
      ctx.scale(pulse, pulse);
      ctx.fillStyle = "#190609";
      ctx.strokeStyle = this.dangerColor();
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, -20);
      ctx.lineTo(22, 18);
      ctx.lineTo(-22, 18);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#fff36d";
      ctx.font = `900 24px ${UI_FONT}`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(label, 0, 5);
      ctx.restore();
    }

    drawWarningBase(height = 22) {
      const color = this.dangerColor();
      ctx.fillStyle = "#241014";
      ctx.fillRect(this.x, this.baseY - height, this.w, height);
      ctx.strokeStyle = color;
      ctx.lineWidth = 4;
      ctx.strokeRect(this.x, this.baseY - height, this.w, height);
      for (let x = this.x - height; x < this.x + this.w + height; x += 18) {
        ctx.fillStyle = (Math.floor((x - this.x) / 18) & 1) ? color : "#ffd34d";
        ctx.beginPath();
        ctx.moveTo(x, this.baseY - height);
        ctx.lineTo(x + 10, this.baseY - height);
        ctx.lineTo(x + height, this.baseY);
        ctx.lineTo(x + height - 10, this.baseY);
        ctx.closePath();
        ctx.fill();
      }
    }

    draw() {
      if (this.dead) return;
      const color = this.dangerColor();

      if (this.type === "mine") {
        this.drawWarningBase(18);
        ctx.fillStyle = "#4a2023";
        ctx.strokeStyle = "#ff5a43";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(this.x + 3, this.baseY - 2);
        ctx.lineTo(this.x + 12, this.baseY - 27);
        ctx.lineTo(this.x + 22, this.baseY - 2);
        ctx.lineTo(this.x + 32, this.baseY - 27);
        ctx.lineTo(this.x + 43, this.baseY - 2);
        ctx.lineTo(this.x + this.w - 4, this.baseY - 27);
        ctx.lineTo(this.x + this.w - 1, this.baseY - 2);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = Math.floor(time * 8) % 2 ? "#fff36d" : "#ff4f46";
        ctx.fillRect(this.cx - 6, this.baseY - 23, 12, 8);
        this.drawDangerBadge(this.baseY - 55, "!");
        return;
      }

      if (this.type === "saw") {
        this.drawWarningBase(18);
        ctx.save();
        ctx.translate(this.cx, this.baseY - 25);
        ctx.rotate(time * 7 + this.phase);
        ctx.fillStyle = "#4c2526";
        ctx.strokeStyle = color;
        ctx.lineWidth = 4;
        ctx.beginPath();
        for (let i = 0; i < 16; i++) {
          const angle = i * Math.PI / 8;
          const radius = i % 2 ? 21 : 34;
          const x = Math.cos(angle) * radius;
          const y = Math.sin(angle) * radius;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#fff36d";
        ctx.fillRect(-7, -7, 14, 14);
        ctx.restore();
        this.drawDangerBadge(this.baseY - 76, "!");
        return;
      }

      if (this.type === "laser") {
        this.drawWarningBase(22);
        ctx.fillStyle = "#3b2442";
        ctx.strokeStyle = color;
        ctx.lineWidth = 4;
        ctx.fillRect(this.x - 10, this.baseY - 78, 18, 78);
        ctx.fillRect(this.x + this.w - 8, this.baseY - 78, 18, 78);
        ctx.strokeRect(this.x - 10, this.baseY - 78, 18, 78);
        ctx.strokeRect(this.x + this.w - 8, this.baseY - 78, 18, 78);

        const beamAlpha = this.active ? 1 : this.warning ? 0.62 + Math.sin(time * 22) * 0.24 : 0.20;
        ctx.globalAlpha = beamAlpha;
        ctx.fillStyle = color;
        ctx.fillRect(this.x, this.baseY - 72, this.w, this.active ? 18 : 5);
        if (this.active) {
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(this.x, this.baseY - 66, this.w, 5);
        }
        ctx.globalAlpha = 1;
        this.drawDangerBadge(this.baseY - 112, "!");
        return;
      }

      this.drawWarningBase(22);
      this.drawDangerBadge(this.baseY - 64, "!");

      if (this.warning && !this.active) {
        ctx.globalAlpha = 0.48 + Math.sin(time * 20) * 0.24;
        ctx.fillStyle = color;
        ctx.fillRect(this.x + 8, this.baseY - 34, this.w - 16, 8);
        ctx.globalAlpha = 1;
      }

      if (this.active) {
        const flicker = Math.floor(time * 15 + this.x) % 3;
        ctx.fillStyle = this.type === "plasma" ? "#6d2fd1" : this.type === "acid" ? "#2d7a35" : "#d9342b";
        ctx.fillRect(this.x + 4, this.y + 34 + flicker * 5, this.w - 8, this.baseY - this.y - 34 - flicker * 5);
        ctx.fillStyle = this.type === "plasma" ? "#b95cff" : this.type === "acid" ? "#8dff5d" : "#ff8a2b";
        ctx.fillRect(this.x + 13, this.y + 16 - flicker * 4, this.w - 26, this.baseY - this.y - 16 + flicker * 4);
        ctx.fillStyle = this.type === "plasma" ? "#f0c8ff" : this.type === "acid" ? "#e3ffb8" : "#ffe05a";
        ctx.fillRect(this.cx - 7, this.y + flicker * 6, 14, this.baseY - this.y - 18);
      }
    }
  }

  class Platform {
    constructor(x, y, w, collapsible = false, motion = null) {
      this.x = x;
      this.y = y;
      this.baseX = x;
      this.baseY = y;
      this.prevX = x;
      this.prevY = y;
      this.dx = 0;
      this.dy = 0;
      this.w = w;
      this.h = 20;
      this.collapsible = collapsible;
      this.motion = motion;
      this.dead = false;
      this.triggered = false;
      this.collapseTimer = 0;
      this.respawnTimer = 0;
    }

    stepOn() {
      if (!this.collapsible || this.dead || this.triggered) return;
      this.triggered = true;
      this.collapseTimer = 1.15;
    }

    update(dt) {
      this.prevX = this.x;
      this.prevY = this.y;

      if (this.motion && !this.dead) {
        const offset = Math.sin(time * this.motion.speed + (this.motion.phase || 0)) * this.motion.range;
        this.x = this.baseX + (this.motion.axis === "x" ? offset : 0);
        this.y = this.baseY + (this.motion.axis === "y" ? offset : 0);
      }

      this.dx = this.x - this.prevX;
      this.dy = this.y - this.prevY;

      if (this.triggered && !this.dead) {
        this.collapseTimer -= dt;
        if (this.collapseTimer <= 0) {
          this.dead = true;
          this.respawnTimer = 3.8;
          audio.crash(clamp(this.w / 150, 0.9, 1.8));
          burst(this.x + this.w / 2, this.y, "#77706a", 18, 180);
        }
      } else if (this.dead) {
        this.respawnTimer -= dt;
        if (this.respawnTimer <= 0) {
          this.dead = false;
          this.triggered = false;
        }
      }
    }
  }

  function solidArenaInterval(zone, focusX) {
    let segments = [{ start: zone.start + 80, end: zone.end - 80 }];
    for (const gap of TERRAIN_GAPS) {
      const next = [];
      for (const segment of segments) {
        if (gap.end <= segment.start || gap.start >= segment.end) {
          next.push(segment);
          continue;
        }
        if (gap.start - segment.start > 260) next.push({ start: segment.start, end: gap.start - 36 });
        if (segment.end - gap.end > 260) next.push({ start: gap.end + 36, end: segment.end });
      }
      segments = next;
    }
    if (!segments.length) return { start: zone.start + 80, end: zone.end - 80 };
    const containing = segments.find(segment => focusX >= segment.start && focusX <= segment.end);
    if (containing) return containing;
    return segments.reduce((best, segment) => {
      const distance = focusX < segment.start ? segment.start - focusX : focusX - segment.end;
      const bestDistance = focusX < best.start ? best.start - focusX : focusX - best.end;
      return distance < bestDistance ? segment : best;
    }, segments[0]);
  }

  class ArenaPlatform extends Platform {
    constructor(x, targetY, w, accent, delay = 0) {
      super(x, targetY + 92, w, false, null);
      this.targetY = targetY;
      this.startY = targetY + 92;
      this.accent = accent;
      this.delay = delay;
      this.deployTime = 0;
      this.retractTime = 0;
      this.retracting = false;
      this.arenaOwned = true;
      this.collidable = false;
      this.visualAlpha = 0;
      this.cycleState = "ready";
      this.cycleTimer = 0;
      this.cycleDuration = 0;
      this.warningPulse = 0;
    }

    beginRetract() {
      if (this.retracting) return;
      this.retracting = true;
      this.retractTime = 0;
      this.collidable = false;
    }

    beginOverload() {
      if (this.retracting || this.cycleState !== "ready" || this.visualAlpha < 0.9) return false;
      this.cycleState = "warning";
      this.cycleDuration = 0.90;
      this.cycleTimer = this.cycleDuration;
      this.warningPulse = 1;
      audio.toneAt(360, 0.10, "square", 0.045, 170);
      return true;
    }

    update(dt) {
      this.prevX = this.x;
      this.prevY = this.y;
      this.warningPulse = Math.max(0, this.warningPulse - dt * 1.7);

      if (this.delay > 0) {
        this.delay -= dt;
        this.visualAlpha = 0;
        this.dx = 0;
        this.dy = 0;
        return;
      }

      if (this.retracting) {
        this.retractTime += dt;
        const t = smoothStep(clamp(this.retractTime / 0.62, 0, 1));
        this.y = mix(this.targetY, this.startY, t);
        this.visualAlpha = 1 - t;
        if (t >= 1) this.dead = true;
      } else if (this.deployTime < 0.72) {
        this.deployTime += dt;
        const t = smoothStep(clamp(this.deployTime / 0.72, 0, 1));
        this.y = mix(this.startY, this.targetY, t);
        this.visualAlpha = t;
        this.collidable = t >= 0.82;
      } else if (this.cycleState === "warning") {
        this.cycleTimer -= dt;
        this.warningPulse = Math.max(this.warningPulse, 0.65 + Math.sin(time * 20) * 0.25);
        this.y = this.targetY;
        this.visualAlpha = 1;
        this.collidable = true;
        if (this.cycleTimer <= 0) {
          this.cycleState = "down";
          this.cycleDuration = 1.72;
          this.cycleTimer = this.cycleDuration;
          this.collidable = false;
          audio.crash(0.72);
          burst(this.x + this.w / 2, this.y + 6, this.accent, 9, 130);
        }
      } else if (this.cycleState === "down") {
        this.cycleTimer -= dt;
        const elapsed = this.cycleDuration - this.cycleTimer;
        const lowerT = smoothStep(clamp(elapsed / 0.40, 0, 1));
        this.y = mix(this.targetY, this.startY + 26, lowerT);
        this.visualAlpha = 1 - lowerT * 0.58;
        this.collidable = false;
        if (this.cycleTimer <= 0) {
          this.cycleState = "returning";
          this.cycleDuration = 0.72;
          this.cycleTimer = this.cycleDuration;
        }
      } else if (this.cycleState === "returning") {
        this.cycleTimer -= dt;
        const t = smoothStep(clamp(1 - this.cycleTimer / this.cycleDuration, 0, 1));
        this.y = mix(this.startY + 26, this.targetY, t);
        this.visualAlpha = 0.42 + t * 0.58;
        this.collidable = t >= 0.86;
        if (this.cycleTimer <= 0) {
          this.cycleState = "ready";
          this.y = this.targetY;
          this.visualAlpha = 1;
          this.collidable = true;
        }
      } else {
        this.y = this.targetY;
        this.visualAlpha = 1;
        this.collidable = true;
      }

      this.dx = this.x - this.prevX;
      this.dy = this.y - this.prevY;
    }
  }

  class ArenaCover {
    constructor(x, groundY, accent, delay = 0) {
      this.x = x - 28;
      this.y = groundY - 142;
      this.w = 56;
      this.h = 142;
      this.accent = accent;
      this.delay = delay;
      this.disabled = 0;
      this.energy = 4;
      this.pulse = rand(0, Math.PI * 2);
      this.alpha = 0;
      this.blockSound = 0;
      this.retracting = false;
    }

    update(dt, arenaState) {
      this.pulse += dt * 4.5;
      this.blockSound = Math.max(0, this.blockSound - dt);
      if (this.delay > 0) this.delay -= dt;
      if (this.disabled > 0) {
        this.disabled -= dt;
        if (this.disabled <= 0) this.energy = 4;
      }
      const targetAlpha = this.retracting || arenaState === "exit" ? 0 : this.delay <= 0 ? 1 : 0;
      this.alpha += (targetAlpha - this.alpha) * Math.min(1, dt * 7);
    }

    active() {
      return this.alpha > 0.65 && this.disabled <= 0 && this.energy > 0;
    }

    overlaps(projectile) {
      return projectile.x < this.x + this.w && projectile.x + projectile.w > this.x &&
        projectile.y < this.y + this.h && projectile.y + projectile.h > this.y;
    }

    block(projectile) {
      if (!this.active() || !this.overlaps(projectile)) return false;
      projectile.dead = true;
      this.energy--;
      burst(projectile.cx, projectile.cy, this.accent, projectile instanceof BossMissile ? 8 : 4, projectile instanceof BossMissile ? 150 : 95);
      if (projectile instanceof BossMissile) blastEffects.push(new BlastEffect(projectile.cx, projectile.cy, this.accent, 1));
      if (this.blockSound <= 0) {
        this.blockSound = 0.11;
        audio.toneAt(390, 0.055, "square", 0.035, -120);
      }
      if (this.energy <= 0) {
        this.disabled = 2.4;
        burst(this.x + this.w / 2, this.y + this.h * 0.45, this.accent, 10, 150);
      }
      return true;
    }

    draw() {
      if (this.alpha <= 0.02) return;
      const active = this.active();
      const shimmer = 0.55 + Math.sin(this.pulse) * 0.16;
      ctx.save();
      ctx.globalAlpha = this.alpha;
      ctx.fillStyle = "#121722";
      ctx.fillRect(this.x + 10, this.y + this.h - 58, this.w - 20, 58);
      ctx.strokeStyle = this.accent;
      ctx.lineWidth = 4;
      ctx.strokeRect(this.x + 10, this.y + this.h - 58, this.w - 20, 58);
      ctx.fillStyle = this.accent;
      ctx.fillRect(this.x + 18, this.y + this.h - 48, this.w - 36, 11);
      if (active) {
        ctx.globalAlpha *= 0.20 + shimmer * 0.22;
        ctx.fillStyle = this.accent;
        ctx.fillRect(this.x, this.y, this.w, this.h - 30);
        ctx.globalAlpha = this.alpha * (0.58 + shimmer * 0.24);
        ctx.strokeStyle = this.accent;
        ctx.lineWidth = 4;
        ctx.strokeRect(this.x, this.y, this.w, this.h - 30);
        for (let y = this.y + 12; y < this.y + this.h - 38; y += 25) {
          ctx.beginPath();
          ctx.moveTo(this.x + 7, y);
          ctx.lineTo(this.x + this.w - 7, y + 11);
          ctx.stroke();
        }
      } else {
        ctx.globalAlpha *= 0.36;
        ctx.strokeStyle = "#6c7482";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(this.x + 5, this.y + 18);
        ctx.lineTo(this.x + this.w - 5, this.y + this.h - 45);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  class BossArena {
    constructor(boss) {
      this.boss = boss;
      this.layout = BOSS_ARENA_LAYOUTS[boss.profile.form] || BOSS_ARENA_LAYOUTS.walker;
      this.major = Number.isInteger(boss.profile.levelEnd) || boss.profile.campaignFinal || boss.finalEncounter;
      this.state = "fight";
      this.elapsed = 0;
      this.introDuration = 0;
      this.exitDuration = 0.72;
      this.cameraBlend = 0;
      this.gateBlend = 0;
      this.combatReady = true;
      this.phaseRecovery = 0;
      this.phasePulse = 0;
      this.cleaned = false;
      this.suppressedPlatforms = [];
      this.platforms = [];
      this.covers = [];
      this.campPlatform = null;
      this.campTime = 0;
      this.counterStrike = null;
      this.attackCommitPulse = 0;

      const zone = WORLD_ZONES[clamp(zoneIndexAt(boss.cx), 0, WORLD_ZONES.length - 1)];
      const interval = solidArenaInterval(zone, boss.cx);
      // Arena geometry is authoritative world state and must be identical on
      // every device. Portrait/landscape only changes the local camera view.
      const sizeFactor = this.layout.sizeWide;
      const minimumWidth = 1460;
      const maximumWidth = this.major ? 2180 : 1980;
      const desiredWidth = clamp(1500 * sizeFactor, minimumWidth, maximumWidth);
      const availableWidth = Math.max(980, interval.end - interval.start);
      this.width = Math.min(desiredWidth, availableWidth);

      const bossShare = this.major ? 0.77 : 0.73;
      let left = boss.cx - this.width * bossShare;
      left = clamp(left, interval.start, Math.max(interval.start, interval.end - this.width));
      this.left = left;
      this.right = left + this.width;
      this.center = (this.left + this.right) * 0.5;
      this.entryX = this.left + Math.max(112, this.width * 0.085);
      this.bossHomeX = clamp(
        this.right - boss.w - Math.max(92, this.width * 0.065),
        this.left + this.width * 0.57,
        this.right - boss.w - 58
      );
      this.bossEntryX = this.bossHomeX;
      this.bossStartY = boss.y;

      boss.arenaLeft = this.left;
      boss.arenaRight = this.right;
      boss.arenaLock = "arena";
      boss.cameraBlend = 0;
      boss.introTimer = Math.min(boss.introTimer, 0.42);
      boss.attackTimer = Math.min(Math.max(boss.attackTimer, 0.72), 1.05);
      boss.x = this.bossHomeX;
      this.updateBossGrounding();

      if ("homeX" in boss) boss.homeX = this.bossHomeX;
      if ("baseX" in boss && boss.finalEncounter) boss.baseX = this.bossHomeX;

      // The arena reuses the existing level geometry. Suppressing platforms or
      // deploying replacement geometry caused visible clipping and position
      // corrections when the encounter started.
      this.createArenaObjects();
    }

    cameraBounds(viewWidth) {
      const worldMaximum = Math.max(0, LEVEL_W - viewWidth);
      if (viewWidth >= this.width) {
        const centered = clamp(this.center - viewWidth * 0.5, 0, worldMaximum);
        return { min: centered, max: centered };
      }
      const minimum = clamp(this.left - 36, 0, worldMaximum);
      const maximum = clamp(this.right - viewWidth + 36, minimum, worldMaximum);
      return { min: minimum, max: maximum };
    }

    targetViewWidth() {
      const factor = portrait ? this.layout.viewTall : this.layout.viewWide;
      const player = cameraFocusPlayer();
      const boss = this.boss && !this.boss.dead ? this.boss : null;
      let desired = baseVisibleWorldW * factor;
      if (player && boss) {
        const span = Math.abs(boss.cx - player.cx) + boss.w * 0.45 + (portrait ? 270 : 340);
        desired = Math.max(desired, span);
      }
      const cap = baseVisibleWorldW * (portrait ? (this.major ? 1.26 : 1.20) : (this.major ? 1.23 : 1.18));
      desired = clamp(desired, baseVisibleWorldW, Math.min(cap, this.width + 110));
      return mix(baseVisibleWorldW, desired, smoothStep(this.cameraBlend));
    }

    cameraTargetX(viewWidth) {
      const player = cameraFocusPlayer();
      const boss = this.boss && !this.boss.dead ? this.boss : null;
      let focus = this.center;
      if (player && boss) {
        const minX = Math.min(player.cx, boss.cx - boss.w * 0.12);
        const maxX = Math.max(player.cx, boss.cx + boss.w * 0.12);
        focus = (minX + maxX) * 0.5;
      } else if (player) {
        focus = player.cx + viewWidth * 0.10;
      }
      const bounds = this.cameraBounds(viewWidth);
      return clamp(focus - viewWidth * 0.5, bounds.min, bounds.max);
    }

    cameraTargetY(viewHeight, fallback) {
      const player = cameraFocusPlayer();
      const boss = this.boss && !this.boss.dead ? this.boss : null;
      const ground = terrainSurfaceY(this.center);
      let top = ground - 260;
      if (player) top = Math.min(top, player.y - 36);
      if (boss) top = Math.min(top, boss.y - 42);
      for (const platform of this.platforms) top = Math.min(top, platform.targetY - 36);
      let target = ground - viewHeight * (portrait ? 0.60 : 0.70);
      const topSafe = target + viewHeight * (portrait ? 0.13 : 0.16);
      if (top < topSafe) target -= topSafe - top;
      return clampCameraY(mix(fallback, target, smoothStep(this.cameraBlend)));
    }

    createArenaObjects() {
      const coverShares = this.layout.cover > 1 ? [0.30, 0.54] : [0.34];
      for (let i = 0; i < Math.min(this.layout.cover, coverShares.length); i++) {
        const x = this.left + this.width * coverShares[i];
        const ground = terrainSurfaceY(x);
        if (Number.isFinite(ground)) this.covers.push(new ArenaCover(x, ground, this.boss.profile.accent, 0.45 + i * 0.16));
      }
    }

    onAttackCommitted() {
      this.attackCommitPulse = 1;
    }

    updatePlatformPressure(dt) {
      this.attackCommitPulse = Math.max(0, this.attackCommitPulse - dt * 2.4);
      const player = frontAlivePlayer();
      const platform = player && player.supportPlatform && player.supportPlatform.arenaOwned
        ? player.supportPlatform
        : null;
      const activelyCamping = Boolean(
        platform &&
        platform.cycleState === "ready" &&
        player.shotActivity > 0 &&
        Math.abs(player.vx) < 55 &&
        Math.abs(player.vy) < 30
      );

      if (activelyCamping) {
        if (this.campPlatform !== platform) {
          this.campPlatform = platform;
          this.campTime = 0;
        }
        this.campTime += dt;
      } else {
        this.campTime = Math.max(0, this.campTime - dt * 1.6);
        if (this.campTime <= 0) this.campPlatform = null;
      }

      const threshold = [4.25, 3.45, 2.95, 2.55][menuDifficulty] ?? 3.45;
      if (!this.counterStrike && this.campPlatform && this.campTime >= threshold) {
        const target = this.campPlatform;
        if (target.beginOverload()) {
          this.counterStrike = {
            x: target.x + target.w * 0.5,
            y: target.targetY,
            timer: 0.90,
            maxTimer: 0.90,
            platform: target
          };
          this.campTime = 0;
          this.campPlatform = null;
          audio.toneAt(118, 0.18, "sawtooth", 0.07, 220);
        }
      }

      if (!this.counterStrike) return;
      this.counterStrike.timer -= dt;
      if (this.counterStrike.timer > 0) return;

      const strike = this.counterStrike;
      const damage = [12, 14, 17, 20][menuDifficulty] ?? 14;
      hazards.push(new ArenaEruption(
        strike.x,
        "energy",
        this.boss.profile.accent,
        0.02,
        0.42,
        Math.max(82, strike.platform.w * 0.62),
        390,
        damage
      ));
      blastEffects.push(new BlastEffect(strike.x, strike.y - 34, this.boss.profile.accent, 1));
      burst(strike.x, strike.y - 18, this.boss.profile.accent, 12, 175);
      this.counterStrike = null;
    }

    placeCombatants() {
      checkpointX = Math.max(checkpointX, this.entryX);
      for (const player of players) {
        if (player.dead) continue;
        // Preserve the exact position, velocity, support platform, and camera
        // relationship the player had while walking into the encounter.
        player.health = Math.max(player.health, difficulty.bossHealthFloor);
        player.specials = Math.max(player.specials, difficulty.bossSpecialFloor);
        player.invuln = Math.max(player.invuln, 0.55);
      }
      enemyBullets = enemyBullets.filter(bullet => bullet.x >= this.left - 120 && bullet.x <= this.right + 120);
    }

    updateBossGrounding() {
      if (!this.boss || this.boss.dead) return;
      const centerX = this.boss.x + this.boss.w * 0.5;
      const ground = terrainSurfaceY(centerX);
      const floatingOffset = this.boss.profile.floating ? 150 : 0;
      this.boss.baseY = ground - this.boss.h - floatingOffset;
      this.boss.y = this.boss.baseY;
    }

    update(dt) {
      this.phasePulse = Math.max(0, this.phasePulse - dt * 1.8);
      for (const cover of this.covers) cover.update(dt, this.state);

      if (this.state === "intro") {
        // Backward-compatible network recovery from older snapshots. Promote
        // directly to normal combat without replaying the removed transition.
        this.state = "fight";
        this.elapsed = 0;
        this.combatReady = true;
        if (this.boss && !this.boss.dead) {
          this.boss.x = this.bossHomeX;
          this.updateBossGrounding();
          this.boss.introTimer = Math.min(this.boss.introTimer, 0.20);
        }
      }

      if (this.state === "fight") {
        this.elapsed += dt;
        this.cameraBlend = 0;
        this.gateBlend = smoothStep(clamp(this.elapsed / 0.34, 0, 1));
        this.updatePlatformPressure(dt);
        if (this.phaseRecovery > 0) {
          this.phaseRecovery -= dt;
          this.combatReady = false;
          if (this.phaseRecovery <= 0) this.combatReady = true;
        } else {
          this.combatReady = true;
        }
        return;
      }

      if (this.state === "exit") {
        this.elapsed += dt;
        const t = smoothStep(clamp(this.elapsed / this.exitDuration, 0, 1));
        this.cameraBlend = 1 - t;
        this.gateBlend = 1 - t;
        if (t >= 1 && bossArena === this) {
          bossArena = null;
          this.cleanup();
        }
      }
    }

    onBossPhase(tier) {
      this.phaseRecovery = tier >= 2 ? 1.05 : 0.82;
      this.combatReady = false;
      this.phasePulse = 1;
      this.campTime = 0;
      this.campPlatform = null;
      this.counterStrike = null;
      for (const cover of this.covers) {
        cover.disabled = 0;
        cover.energy = 4;
      }
    }

    beginExit() {
      if (this.state === "exit") return;
      this.state = "exit";
      this.elapsed = 0;
      this.combatReady = false;
      this.campTime = 0;
      this.campPlatform = null;
      this.counterStrike = null;
      for (const platform of this.platforms) platform.beginRetract();
      for (const cover of this.covers) cover.retracting = true;
    }

    isLocked() {
      return this.state !== "exit" && this.gateBlend > 0.18;
    }

    blockHostileProjectile(projectile) {
      if (this.state !== "fight" || !projectile || projectile.dead) return false;
      for (const cover of this.covers) {
        if (cover.block(projectile)) return true;
      }
      return false;
    }

    cleanup() {
      if (this.cleaned) return;
      this.cleaned = true;
      for (const platform of this.suppressedPlatforms) platform.arenaSuppressed = false;
      for (const player of players) {
        if (player.supportPlatform && player.supportPlatform.arenaOwned) player.supportPlatform = null;
      }
      platforms = platforms.filter(platform => !platform.arenaOwned);
      this.platforms.length = 0;
      this.covers.length = 0;
      this.counterStrike = null;
      this.campPlatform = null;
      this.campTime = 0;
    }

    drawGate(x, ground, alpha, inward) {
      if (alpha <= 0.01) return;
      const top = Math.min(cameraY + 48, ground - 570);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = this.boss.profile.accent;
      ctx.lineWidth = 9;
      ctx.beginPath();
      ctx.moveTo(x, top);
      ctx.lineTo(x, ground);
      ctx.stroke();
      ctx.globalAlpha *= 0.48;
      ctx.lineWidth = 3;
      for (let y = top + 18; y < ground; y += 34) {
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + inward * 24, y + 16);
        ctx.stroke();
      }
      ctx.restore();
    }

    drawWorld() {
      const alpha = clamp(this.gateBlend, 0, 1);
      const leftGround = terrainSurfaceY(this.left);
      const rightGround = terrainSurfaceY(this.right);
      ctx.save();
      ctx.globalAlpha = alpha * 0.42;
      ctx.strokeStyle = this.boss.profile.accent;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(this.left + 34, leftGround - 8);
      ctx.lineTo(this.right - 34, rightGround - 8);
      ctx.stroke();
      const segment = Math.max(90, this.width / 12);
      for (let x = this.left + 60; x < this.right - 40; x += segment) {
        const y = terrainSurfaceY(x) - 12;
        ctx.fillStyle = this.boss.profile.accent;
        ctx.fillRect(x, y, 34, 5);
      }
      ctx.restore();

      this.drawGate(this.left + 14, leftGround, alpha, 1);
      this.drawGate(this.right - 14, rightGround, alpha, -1);
      for (const cover of this.covers) cover.draw();

      if (this.counterStrike && this.boss && !this.boss.dead) {
        const strike = this.counterStrike;
        const progress = 1 - strike.timer / Math.max(0.001, strike.maxTimer);
        const pulse = 18 + Math.sin(time * 20) * 4;
        ctx.save();
        ctx.globalAlpha = 0.28 + progress * 0.56;
        ctx.strokeStyle = this.boss.profile.accent;
        ctx.lineWidth = 4 + progress * 3;
        ctx.setLineDash([12, 10]);
        ctx.beginPath();
        ctx.moveTo(this.boss.cx, this.boss.cy - 8);
        ctx.lineTo(strike.x, strike.y - 34);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.ellipse(strike.x, strike.y - 5, strike.platform.w * 0.42 + pulse, 18 + pulse * 0.18, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      if (this.state === "fight" && this.boss && !this.boss.dead) {
        const vulnerable = this.boss.vulnerableTimer > 0;
        const pulse = vulnerable ? 0.55 + Math.sin(time * 16) * 0.18 : 0.28 + Math.sin(time * 8) * 0.08;
        ctx.save();
        ctx.globalAlpha = pulse + (this.boss.armorPulse > 0 ? 0.28 : 0);
        ctx.strokeStyle = vulnerable ? "#fff36d" : this.boss.profile.accent;
        ctx.lineWidth = vulnerable ? 7 : 4;
        ctx.setLineDash(vulnerable ? [] : [18, 12]);
        ctx.beginPath();
        ctx.ellipse(this.boss.cx, this.boss.cy, this.boss.w * 0.58, this.boss.h * 0.56, 0, -0.3, Math.PI * 1.65);
        ctx.stroke();
        ctx.restore();
      }

      if (this.phasePulse > 0) {
        ctx.save();
        ctx.globalAlpha = this.phasePulse * 0.32;
        ctx.strokeStyle = this.boss.profile.accent;
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.arc(this.boss.cx, this.boss.cy, 120 + (1 - this.phasePulse) * 220, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }
  }


  const NETWORK_PROTOTYPES = () => ({
    Player, Enemy, Bullet, EnemyBullet, BossMissile, Pickup, FallingDebris,
    SiegeMortar, RailSweeper, ClockworkSweeper, ArenaEruption, GravitySeed,
    GravityWell, TimeEcho, BossFlyby, Hazard, StageBoss, OmegaTank,
    AegisGunshipBoss, BioLeviathanBoss, FrostTitanBoss, ReignEmperorBoss,
    RivalHunter
  });

  function sendServer(payload) {
    if (!connectedSocket()) return false;
    try {
      // Never build a queue of obsolete world snapshots. Inputs remain small and
      // are always allowed through, while state waits for the socket to drain.
      if (payload && payload.t === "state" && net.socket.bufferedAmount > 196608) {
        net.droppedStatePackets++;
        return false;
      }
      net.socket.send(JSON.stringify({ ...payload, pv: MULTIPLAYER_PROTOCOL }));
      return true;
    } catch (_) {
      return false;
    }
  }

  function setNetworkStatus(message, tone = "info") {
    net.status = String(message || "");
    net.statusTone = tone;
  }

  function networkActiveRoster() {
    const source = net.matchRoster.length ? net.matchRoster : [...net.roster.values()];
    return source.filter(row => row && row.connected !== false).sort((a, b) => a.id - b.id);
  }

  function inputPacketChanged(a, b) {
    if (!a || !b) return true;
    return a.moveX !== b.moveX || a.down !== b.down || a.fire !== b.fire ||
      a.fireSeq !== b.fireSeq || a.jumpSeq !== b.jumpSeq || a.powerSeq !== b.powerSeq ||
      Math.abs(a.aimX - b.aimX) > 0.025 || Math.abs(a.aimY - b.aimY) > 0.025;
  }

  function publishNeutralNetworkInput() {
    if (!onlineSession() || !running || net.localId < 0) return;
    const previous = net.localInput || neutralNetworkInput();
    const next = {
      ...neutralNetworkInput(),
      aimX: Number.isFinite(Number(previous.aimX)) ? Number(previous.aimX) : 1,
      aimY: Number.isFinite(Number(previous.aimY)) ? Number(previous.aimY) : 0,
      fireSeq: Math.max(0, Number(previous.fireSeq) || 0),
      jumpSeq: Math.max(0, Number(previous.jumpSeq) || 0),
      powerSeq: Math.max(0, Number(previous.powerSeq) || 0),
      seq: Math.max(0, Number(previous.seq) || 0) + 1
    };
    net.localInput = next;
    net.inputs.set(net.localId, next);
    net.inputSendAt = performance.now() + 50;
    sendServer({ t: "input", v: next, seq: next.seq });
  }

  function captureNetworkInput() {
    if (!onlineSession() || !running) return;
    const player = localPlayer();
    if (!player) return;
    const controls = readLocalControls(player, true);
    const previous = net.localInput || neutralNetworkInput();
    const next = {
      moveX: Math.round(clamp(controls.moveX, -1, 1) * 100) / 100,
      aimX: Math.round(clamp(controls.aimX, -1, 1) * 1000) / 1000,
      aimY: Math.round(clamp(controls.aimY, -1, 1) * 1000) / 1000,
      down: Boolean(controls.down),
      fire: Boolean(controls.fire),
      fireSeq: (previous.fireSeq || 0) + (controls.firePressed ? 1 : 0),
      jumpSeq: (previous.jumpSeq || 0) + (controls.jumpPressed ? 1 : 0),
      powerSeq: (previous.powerSeq || 0) + (controls.powerPressed ? 1 : 0),
      seq: (previous.seq || 0) + 1
    };
    net.localInput = next;
    net.inputs.set(net.localId, next);
    const now = performance.now();
    if (inputPacketChanged(previous, next) || now >= net.inputSendAt) {
      net.inputSendAt = now + 50;
      sendServer({ t: "input", v: next, seq: next.seq });
    }
  }

  function packNetworkValue(value, depth = 0, seen = new WeakSet()) {
    if (typeof value === "number") {
      if (Number.isFinite(value)) return Math.round(value * 1000) / 1000;
      return value > 0 ? "__INF__" : "__NINF__";
    }
    if (typeof value === "string" || typeof value === "boolean" || value === null) return value;
    if (depth >= 5 || typeof value !== "object") return undefined;
    if (seen.has(value)) return undefined;
    seen.add(value);

    if (Array.isArray(value)) {
      if (value.length > 64) return undefined;
      const packed = [];
      for (const item of value) {
        const row = packNetworkValue(item, depth + 1, seen);
        if (row !== undefined) packed.push(row);
      }
      return packed;
    }

    const prototype = Object.getPrototypeOf(value);
    const constructorName = prototype && prototype.constructor ? prototype.constructor.name : "Object";
    if (constructorName !== "Object") return undefined;
    const entries = Object.entries(value);
    if (entries.length > 40) return undefined;
    const packed = {};
    for (const [key, item] of entries) {
      const row = packNetworkValue(item, depth + 1, seen);
      if (row !== undefined) packed[key] = row;
    }
    return packed;
  }

  function unpackNetworkValue(value) {
    if (value === "__INF__") return Infinity;
    if (value === "__NINF__") return -Infinity;
    if (Array.isArray(value)) return value.map(unpackNetworkValue);
    if (value && typeof value === "object") {
      const restored = {};
      for (const [key, item] of Object.entries(value)) restored[key] = unpackNetworkValue(item);
      return restored;
    }
    return value;
  }

  function packNetworkObject(object) {
    if (!object) return null;
    const row = { __type: object.constructor && object.constructor.name ? object.constructor.name : "Entity" };
    for (const [key, value] of Object.entries(object)) {
      if (["profile", "supportPlatform", "dropPlatform", "target", "pendingAttack",
        "netSyncX", "netSyncY", "netSyncVx", "netSyncVy", "netSyncClock"].includes(key)) continue;
      const packed = packNetworkValue(value);
      if (packed !== undefined) row[key] = packed;
    }
    return row;
  }

  function restoreNetworkObject(row, existing = null) {
    if (!row || typeof row !== "object") return null;
    const prototypes = NETWORK_PROTOTYPES();
    let object = existing;
    const hadExisting = Boolean(existing);
    if (!object) {
      if (row.__type === "Player") object = new Player(row.index || 0, row.x || 0, row.characterIndex || 0);
      else if (row.__type === "Enemy") object = new Enemy(row.type || "runner", row.x || 0, (row.y || 0) + (row.h || 70));
      else if (row.__type === "Bullet") object = new Bullet(row.x || 0, row.y || 0, row.vx || 0, row.vy || 0, row.owner || 0, row.damage || 1, row.type || "normal");
      else if (row.__type === "EnemyBullet") object = new EnemyBullet(row.x || 0, row.y || 0, row.vx || 0, row.vy || 0, row.damage || 1, row.w || 10, row.color || "#ff6750");
      else if (row.__type === "BossMissile") object = new BossMissile(row.x || 0, row.y || 0, localPlayer(), row.color || "#ff6750", row.damage || 1, row.launchDelay || 0);
      else if (row.__type === "Pickup") object = new Pickup((row.x || 0) + 26, (row.y || 0) + 26, row.type, Boolean(row.persistent));
      else {
        const Constructor = prototypes[row.__type];
        object = Constructor ? Object.create(Constructor.prototype) : Object.create(Entity.prototype);
      }
    }

    const before = hadExisting ? {
      x: object.x, y: object.y, vx: object.vx, vy: object.vy,
      dead: Boolean(object.dead), portalTransit: Boolean(object.portalTransit)
    } : null;
    const incomingMotion = {
      x: unpackNetworkValue(row.x), y: unpackNetworkValue(row.y),
      vx: unpackNetworkValue(row.vx), vy: unpackNetworkValue(row.vy)
    };
    const smoothMotion = hadExisting && onlineSession() && !isNetworkAuthority() &&
      Number.isFinite(incomingMotion.x) && Number.isFinite(incomingMotion.y);

    for (const [key, value] of Object.entries(row)) {
      if (key === "__type") continue;
      if (smoothMotion && ["x", "y", "vx", "vy"].includes(key)) continue;
      object[key] = unpackNetworkValue(value);
    }

    if (smoothMotion) {
      const revived = object instanceof Player && before.dead && !object.dead;
      const portalChanged = before.portalTransit !== Boolean(object.portalTransit);
      const dx = incomingMotion.x - before.x;
      const dy = incomingMotion.y - before.y;
      const localPlayerObject = object instanceof Player && object.index === net.localId;
      const hardDistance = localPlayerObject ? 360 : object instanceof Player ? 300 :
        object instanceof Bullet || object instanceof EnemyBullet ? 230 : object instanceof StageBoss ? 520 : 360;
      const forceSnap = revived || portalChanged || Math.hypot(dx, dy) > hardDistance;
      if (forceSnap) {
        object.x = incomingMotion.x;
        object.y = incomingMotion.y;
        if (Number.isFinite(incomingMotion.vx)) object.vx = incomingMotion.vx;
        if (Number.isFinite(incomingMotion.vy)) object.vy = incomingMotion.vy;
        object.netSyncX = undefined;
        object.netSyncY = undefined;
      } else {
        object.x = before.x;
        object.y = before.y;
        object.vx = before.vx;
        object.vy = before.vy;
        object.netSyncX = incomingMotion.x;
        object.netSyncY = incomingMotion.y;
        object.netSyncVx = Number.isFinite(incomingMotion.vx) ? incomingMotion.vx : before.vx;
        object.netSyncVy = Number.isFinite(incomingMotion.vy) ? incomingMotion.vy : before.vy;
        object.netSyncClock = time;
      }
      if (revived) presentLocalRespawn(object);
    } else {
      for (const key of ["x", "y", "vx", "vy"]) {
        if (Number.isFinite(incomingMotion[key])) object[key] = incomingMotion[key];
      }
    }

    if (Number.isFinite(object.netId)) networkEntityCounter = Math.max(networkEntityCounter, (object.netId | 0) + 1);
    if (object instanceof Player) {
      object.characterIndex = clamp(object.characterIndex | 0, 0, CHARACTER_PROFILES.length - 1);
      object.profile = CHARACTER_PROFILES[object.characterIndex];
      object.color = object.profile.color;
    }
    if (object instanceof StageBoss) {
      object.profile = BOSS_PROFILES[object.key] || object.profile;
      object.name = object.profile ? object.profile.name : object.name;
    }
    if (object instanceof Bullet) object.target = null;
    if (object instanceof BossMissile) object.target = localPlayer();
    return object;
  }

  function mergeNetworkList(current, packedRows, preserve = null) {
    if (!Array.isArray(packedRows)) return current;
    const byId = new Map(current.filter(Boolean).map(item => [item.netId, item]));
    const incomingIds = new Set(packedRows.map(row => row && row.netId));
    const merged = packedRows.map(row => restoreNetworkObject(row, byId.get(row.netId))).filter(Boolean);
    if (typeof preserve === "function") {
      for (const item of current) {
        if (item && !incomingIds.has(item.netId) && preserve(item)) merged.push(item);
      }
    }
    return merged;
  }

  function reconcileNetworkObject(object, dt) {
    if (!object || !Number.isFinite(object.netSyncX) || !Number.isFinite(object.netSyncY)) return;
    const localPlayerObject = object instanceof Player && object.index === net.localId;
    const projectile = object instanceof Bullet || object instanceof EnemyBullet || object instanceof BossMissile;
    const response = localPlayerObject ? 4.2 : object instanceof Player ? 8.5 : projectile ? 13 : object instanceof StageBoss ? 7 : 9;
    const maxSpeed = localPlayerObject ? 180 : object instanceof Player ? 620 : projectile ? 1200 : object instanceof StageBoss ? 520 : 720;
    const blend = 1 - Math.exp(-response * dt);
    const dx = object.netSyncX - object.x;
    const dy = object.netSyncY - object.y;
    object.x += clamp(dx * blend, -maxSpeed * dt, maxSpeed * dt);
    object.y += clamp(dy * blend, -maxSpeed * dt, maxSpeed * dt);
    if (Number.isFinite(object.netSyncVx)) object.vx += (object.netSyncVx - object.vx) * Math.min(1, blend * 0.72);
    if (Number.isFinite(object.netSyncVy)) object.vy += (object.netSyncVy - object.vy) * Math.min(1, blend * 0.72);
    if (Math.abs(dx) < 0.45 && Math.abs(dy) < 0.45) {
      object.x = object.netSyncX;
      object.y = object.netSyncY;
      object.netSyncX = undefined;
      object.netSyncY = undefined;
    }
  }

  function reconcileNetworkWorld(dt) {
    if (!onlineSession() || isNetworkAuthority()) return;
    for (const list of [players, enemies, bullets, enemyBullets, pickups, setPieces, hazards]) {
      for (const object of list) reconcileNetworkObject(object, dt);
    }
    reconcileNetworkObject(activeBoss, dt);
    if (Number.isFinite(net.clockTarget)) {
      const difference = net.clockTarget - time;
      if (Math.abs(difference) > 1.5) time = net.clockTarget;
      else time += clamp(difference * 0.08, -0.012, 0.012);
      if (Math.abs(net.clockTarget - time) < 0.01) net.clockTarget = null;
    }
  }

  function queueNetworkSnapshot(snapshot) {
    if (!snapshot || typeof snapshot !== "object") return;
    const sequence = Math.max(0, Number(snapshot.seq) || 0);
    const queuedSequence = Math.max(0, Number(net.pendingSnapshot && net.pendingSnapshot.seq) || 0);
    if (sequence && sequence <= Math.max(net.lastSnapshotSeq, queuedSequence)) return;
    net.pendingSnapshot = snapshot;
    net.lastSnapshotAt = performance.now();
  }

  function packBossArenaState() {
    if (!bossArena || !activeBoss) return null;
    return {
      bossNetId: activeBoss.netId,
      state: bossArena.state,
      elapsed: bossArena.elapsed,
      left: bossArena.left,
      right: bossArena.right,
      width: bossArena.width,
      center: bossArena.center,
      entryX: bossArena.entryX,
      bossHomeX: bossArena.bossHomeX,
      cameraBlend: bossArena.cameraBlend,
      gateBlend: bossArena.gateBlend,
      combatReady: bossArena.combatReady,
      phaseRecovery: bossArena.phaseRecovery,
      phasePulse: bossArena.phasePulse,
      campTime: bossArena.campTime,
      attackCommitPulse: bossArena.attackCommitPulse,
      platforms: bossArena.platforms.map(platform => ({
        y: platform.y, targetY: platform.targetY, delay: platform.delay,
        deployTime: platform.deployTime, retractTime: platform.retractTime,
        retracting: platform.retracting, collidable: platform.collidable,
        visualAlpha: platform.visualAlpha, cycleState: platform.cycleState,
        cycleTimer: platform.cycleTimer, cycleDuration: platform.cycleDuration
      })),
      covers: bossArena.covers.map(cover => ({
        delay: cover.delay, disabled: cover.disabled, energy: cover.energy,
        pulse: cover.pulse, alpha: cover.alpha, retracting: cover.retracting
      }))
    };
  }

  function applyBossArenaState(state, bossRow = null) {
    if (!state || !activeBoss) {
      if (!activeBoss) clearBossArena();
      return;
    }
    if (!bossArena || bossArena.boss !== activeBoss) {
      clearBossArena();
      bossArena = new BossArena(activeBoss);
      if (bossRow) restoreNetworkObject(bossRow, activeBoss);
    }
    bossArena.boss = activeBoss;
    for (const key of ["state", "elapsed", "left", "right", "width", "center", "entryX", "bossHomeX", "cameraBlend", "gateBlend", "combatReady", "phaseRecovery", "phasePulse", "campTime", "attackCommitPulse"]) {
      if (state[key] !== undefined) bossArena[key] = state[key];
    }
    activeBoss.arenaLeft = bossArena.left;
    activeBoss.arenaRight = bossArena.right;
    if ("homeX" in activeBoss) activeBoss.homeX = bossArena.bossHomeX;
    if (Array.isArray(state.platforms)) {
      state.platforms.forEach((row, index) => {
        const platform = bossArena.platforms[index];
        if (platform) Object.assign(platform, row);
      });
    }
    if (Array.isArray(state.covers)) {
      state.covers.forEach((row, index) => {
        const cover = bossArena.covers[index];
        if (cover) Object.assign(cover, row);
      });
    }
  }

  function makeNetworkSnapshot() {
    const simulationView = gameplaySimulationView();
    return {
      t: "state",
      seq: ++net.snapshotSeq,
      clock: time,
      simulationX: simulationView.left,
      simulationY: simulationView.top,
      campaignLevel,
      checkpointX,
      levelState,
      gameOver,
      randomState: gameRandomState,
      entityCounter: networkEntityCounter,
      triggered: [...triggered],
      defeatedBosses: [...defeatedBosses],
      players: players.map(packNetworkObject),
      enemies: enemies.map(packNetworkObject),
      bullets: bullets.map(packNetworkObject),
      enemyBullets: enemyBullets.map(packNetworkObject),
      pickups: pickups.map(packNetworkObject),
      setPieces: setPieces.map(packNetworkObject),
      hazards: hazards.map(packNetworkObject),
      activeBoss: packNetworkObject(activeBoss),
      bossArena: packBossArenaState()
    };
  }

  function applyNetworkSnapshot(snapshot) {
    if (!snapshot || !running) return;
    const sequence = Math.max(0, Number(snapshot.seq) || 0);
    if (sequence && sequence <= net.lastSnapshotSeq) return;
    net.lastSnapshotSeq = sequence;
    if (Number.isFinite(snapshot.clock)) net.clockTarget = snapshot.clock;
    if (Number.isFinite(snapshot.simulationX)) net.simulationX = snapshot.simulationX;
    if (Number.isFinite(snapshot.simulationY)) net.simulationY = snapshot.simulationY;
    if (Number.isFinite(snapshot.randomState)) gameRandomState = Number(snapshot.randomState) >>> 0;
    if (Number.isFinite(snapshot.entityCounter)) networkEntityCounter = Math.max(1, Number(snapshot.entityCounter) | 0);
    if (Number.isFinite(snapshot.checkpointX)) checkpointX = snapshot.checkpointX;
    if (typeof snapshot.levelState === "string") levelState = snapshot.levelState;
    if (typeof snapshot.gameOver === "boolean") gameOver = snapshot.gameOver;
    const incomingLevel = clamp(Number(snapshot.campaignLevel) || 0, 0, WORLD_ZONES.length - 1);
    if (incomingLevel !== campaignLevel) {
      campaignLevel = incomingLevel;
      rebuildStageWorld(campaignLevel);
    }
    if (Array.isArray(snapshot.triggered)) triggered = new Set(snapshot.triggered);
    if (Array.isArray(snapshot.defeatedBosses)) defeatedBosses = new Set(snapshot.defeatedBosses);
    players = mergeNetworkList(players, snapshot.players);
    enemies = mergeNetworkList(enemies, snapshot.enemies);
    bullets = mergeNetworkList(bullets, snapshot.bullets, bullet =>
      bullet.owner === net.localId && !bullet.dead && time - Number(bullet.netBornAt || 0) < 0.45);
    enemyBullets = mergeNetworkList(enemyBullets, snapshot.enemyBullets);
    pickups = mergeNetworkList(pickups, snapshot.pickups);
    setPieces = mergeNetworkList(setPieces, snapshot.setPieces);
    hazards = mergeNetworkList(hazards, snapshot.hazards);
    if (snapshot.activeBoss) {
      activeBoss = restoreNetworkObject(snapshot.activeBoss, activeBoss && activeBoss.netId === snapshot.activeBoss.netId ? activeBoss : null);
    } else if (activeBoss && activeBoss.dead) {
      activeBoss = null;
    }
    applyBossArenaState(snapshot.bossArena, snapshot.activeBoss || null);
  }

  function updateNetwork(dt) {
    if (!onlineSession() || !running) return;
    if (!isNetworkAuthority() && net.pendingSnapshot) {
      const snapshot = net.pendingSnapshot;
      net.pendingSnapshot = null;
      applyNetworkSnapshot(snapshot);
    }
    captureNetworkInput();
    reconcileNetworkWorld(dt);
    if (isNetworkAuthority()) {
      net.stateSendAt -= dt;
      if (net.stateSendAt <= 0) {
        const sent = sendServer(makeNetworkSnapshot());
        net.stateSendAt = sent ? 0.20 : 0.06;
      }
    }
  }

  function resetNetwork(role = "solo", preserveRoom = false) {
    if (net.reconnectTimer) clearTimeout(net.reconnectTimer);
    net.reconnectTimer = 0;
    net.reconnectAttempt = 0;
    net.manualClose = true;
    if (net.socket) {
      try { net.socket.close(1000, "Reset"); } catch (_) {}
    }
    net.socket = null;
    net.connected = false;
    net.role = role;
    net.phase = "lobby";
    net.localId = -1;
    net.ownerId = -1;
    net.authorityId = -1;
    net.roster = new Map();
    net.matchRoster = [];
    net.inputs = new Map();
    net.localInput = neutralNetworkInput();
    net.lastSnapshotSeq = 0;
    net.pendingStartSnapshot = null;
    net.pendingSnapshot = null;
    net.clockTarget = null;
    net.lastSnapshotAt = 0;
    net.droppedStatePackets = 0;
    net.simulationX = null;
    net.simulationY = null;
    onlineMenuOpen = false;
    if (!preserveRoom) net.roomCode = "";
    net.manualClose = false;
  }

  function reconnectNetwork() {
    if (!onlineSession() || net.manualClose || !net.roomCode || net.reconnectTimer) return;
    const delay = Math.min(8000, 500 * 2 ** Math.min(4, net.reconnectAttempt++));
    net.reconnectTimer = setTimeout(() => {
      net.reconnectTimer = 0;
      openNetworkSocket(net.role, net.roomCode, true);
    }, delay);
  }

  function socketUrl(code, role) {
    return `${ONLINE_API.replace(/^http/, "ws")}/rooms/${encodeURIComponent(code)}/socket?role=${encodeURIComponent(role)}&client=${encodeURIComponent(net.clientToken)}`;
  }

  function updateRoster(rows) {
    net.roster = new Map();
    for (const row of Array.isArray(rows) ? rows : []) {
      const id = Math.max(0, Math.min(MAX_ONLINE_PLAYERS - 1, Number(row.id) || 0));
      net.roster.set(id, {
        id,
        connected: row.connected !== false,
        ready: Boolean(row.ready),
        character: boundedIndex(row.character, 0, CHARACTER_PROFILES.length),
        owner: Boolean(row.owner)
      });
    }
  }

  function handleNetworkMessage(message) {
    if (!message || typeof message !== "object") return;
    if (message.t === "versionError") {
      setNetworkStatus("CLIENT AND SERVER VERSIONS DO NOT MATCH", "error");
      return;
    }
    if (message.t === "welcome") {
      net.connected = true;
      net.localId = Number(message.id);
      net.ownerId = Number(message.ownerId);
      net.authorityId = Number(message.authorityId);
      net.roomCode = normalizeRoomCode(message.code);
      net.phase = message.phase || "lobby";
      net.seed = Number(message.seed) || 1;
      updateRoster(message.roster);
      if (message.settings) {
        menuLevel = boundedIndex(message.settings.level, menuLevel, WORLD_ZONES.length);
        menuDifficulty = boundedIndex(message.settings.difficulty, menuDifficulty, DIFFICULTY_OPTIONS.length);
      }
      const localRow = net.roster.get(net.localId);
      const preferred = boundedIndex(net.preferredCharacter, 0, CHARACTER_PROFILES.length);
      menuCharacter = preferred;
      if (localRow && localRow.character !== preferred) sendServer({ t: "character", character: preferred });
      setNetworkStatus("CONNECTED", "success");
      menuScreen = "lobby";
      if (message.phase === "playing" && message.start) {
        startOnlineMatch(message.start);
        if (message.snapshot) queueNetworkSnapshot(message.snapshot);
      }
      return;
    }
    if (message.t === "lobby") {
      net.ownerId = Number(message.ownerId);
      net.authorityId = Number(message.authorityId);
      net.phase = message.phase || net.phase;
      updateRoster(message.roster);
      if (message.settings) {
        menuLevel = boundedIndex(message.settings.level, menuLevel, WORLD_ZONES.length);
        menuDifficulty = boundedIndex(message.settings.difficulty, menuDifficulty, DIFFICULTY_OPTIONS.length);
      }
      return;
    }
    if (message.t === "authority") {
      net.authorityId = Number(message.id);
      if (isNetworkAuthority() && running) net.stateSendAt = 0;
      return;
    }
    if (message.t === "input") {
      const id = Number(message.id);
      if (id >= 0 && message.v) net.inputs.set(id, message.v);
      return;
    }
    if (message.t === "start") {
      startOnlineMatch(message);
      return;
    }
    if (message.t === "state") {
      if (!isNetworkAuthority()) queueNetworkSnapshot(message);
      return;
    }
    if (message.t === "returnLobby") {
      if (running) returnToOnlineLobby(false);
      menuScreen = "lobby";
      net.phase = "lobby";
      return;
    }
    if (message.t === "notice") {
      setNetworkStatus(message.text || "", message.tone || "info");
      if (message.text) showBanner(message.text, 1.8);
      return;
    }
    if (message.t === "roomClosed") {
      setNetworkStatus(message.reason || "ROOM CLOSED", "error");
      leaveOnlineSession(false);
      return;
    }
    if (message.t === "pong") return;
  }

  function openNetworkSocket(role, code, reconnecting = false) {
    const roomCode = normalizeRoomCode(code);
    if (roomCode.length !== ROOM_CODE_LENGTH) return;
    net.role = role === "host" ? "host" : "client";
    net.roomCode = roomCode;
    net.manualClose = false;
    setNetworkStatus(reconnecting ? "RECONNECTING" : "CONNECTING", "pending");
    let socket;
    try {
      socket = new WebSocket(socketUrl(roomCode, net.role));
    } catch (_) {
      setNetworkStatus("COULD NOT OPEN MULTIPLAYER CONNECTION", "error");
      reconnectNetwork();
      return;
    }
    net.socket = socket;
    socket.addEventListener("open", () => {
      net.reconnectAttempt = 0;
      sendServer({ t: "activity", visible: !document.hidden });
    });
    socket.addEventListener("message", event => {
      try { handleNetworkMessage(JSON.parse(event.data)); } catch (_) {}
    });
    socket.addEventListener("close", event => {
      if (socket !== net.socket) return;
      net.connected = false;
      if (!net.manualClose && event.code !== 1000) {
        setNetworkStatus("CONNECTION LOST • RECONNECTING", "error");
        reconnectNetwork();
      }
    });
    socket.addEventListener("error", () => setNetworkStatus("MULTIPLAYER SERVER UNREACHABLE", "error"));
  }

  async function createOnlineRoom() {
    net.preferredCharacter = menuCharacter;
    resetNetwork("host");
    menuScreen = "multiplayer";
    setNetworkStatus("CREATING ROOM", "pending");
    try {
      const response = await fetch(`${ONLINE_API}/rooms`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          client: net.clientToken,
          level: menuLevel,
          difficulty: menuDifficulty,
          character: net.preferredCharacter
        }),
        cache: "no-store"
      });
      if (!response.ok) throw new Error("Room creation failed");
      const data = await response.json();
      const code = normalizeRoomCode(data.code);
      if (code.length !== ROOM_CODE_LENGTH) throw new Error("Invalid room code");
      net.roomCode = code;
      openNetworkSocket("host", code);
    } catch (error) {
      console.error(error);
      setNetworkStatus("COULD NOT CREATE ROOM", "error");
    }
  }

  function joinOnlineRoom(value) {
    net.preferredCharacter = menuCharacter;
    const code = normalizeRoomCode(value);
    if (code.length !== ROOM_CODE_LENGTH) {
      setNetworkStatus("ENTER A 5 CHARACTER ROOM CODE", "error");
      return;
    }
    resetNetwork("client");
    menuScreen = "multiplayer";
    net.roomCode = code;
    openNetworkSocket("client", code);
  }

  function promptForRoomCode() {
    const value = prompt("Enter the 5 character room code:", net.roomCode || "");
    if (value !== null) joinOnlineRoom(value);
  }

  async function refreshOnlineRooms() {
    if (net.roomsLoading) return;
    net.roomsLoading = true;
    try {
      const response = await fetch(`${ONLINE_API}/rooms`, { cache: "no-store" });
      if (!response.ok) throw new Error("Directory failed");
      const data = await response.json();
      net.rooms = Array.isArray(data.rooms) ? data.rooms.slice(0, 6) : [];
      if (!net.rooms.length) setNetworkStatus("NO ACTIVE ROOMS", "info");
    } catch (error) {
      console.error(error);
      setNetworkStatus("COULD NOT REACH MULTIPLAYER SERVER", "error");
    } finally {
      net.roomsLoading = false;
    }
  }

  function openMultiplayerMenu() {
    net.preferredCharacter = menuCharacter;
    if (onlineSession()) resetNetwork("solo");
    menuScreen = "multiplayer";
    setNetworkStatus("SELECT A ROOM OR CREATE ONE", "info");
    refreshOnlineRooms();
    audio.ui("confirm");
  }

  function leaveOnlineSession(returnToMain = true) {
    onlineMenuOpen = false;
    net.manualClose = true;
    if (connectedSocket()) sendServer({ t: "leave" });
    if (net.socket) {
      try { net.socket.close(1000, "Left room"); } catch (_) {}
    }
    resetNetwork("solo");
    if (running) {
      running = false;
      paused = false;
      levelState = "menu";
      audio.stopMusic();
      clearControls();
    }
    if (returnToMain) {
      menuScreen = "main";
      menuFocus = 3;
      menuResult = "";
    }
  }

  function copyInviteLink() {
    const link = inviteUrl(net.roomCode);
    if (!link) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link).then(() => setNetworkStatus("INVITE LINK COPIED", "success")).catch(() => prompt("Copy this invite link:", link));

  function setLocalReady(ready) {
    if (!onlineSession() || isRoomOwner()) return;
    sendServer({ t: "ready", ready: Boolean(ready) });
  }

  function selectLobbyCharacter(index, playSound = true) {
    const nextCharacter = boundedIndex(index, menuCharacter, CHARACTER_PROFILES.length);
    const localRow = net.roster.get(net.localId);
    const changed = nextCharacter !== menuCharacter ||
      net.preferredCharacter !== nextCharacter ||
      Boolean(localRow && localRow.character !== nextCharacter);
    menuCharacter = nextCharacter;
    net.preferredCharacter = nextCharacter;
    if (localRow) localRow.character = nextCharacter;
    if (!changed) return;
    sendServer({ t: "character", character: nextCharacter });
    if (playSound) audio.ui("move");
  }

  function cycleLobbyCharacter(delta = 1) {
    selectLobbyCharacter((menuCharacter + delta + CHARACTER_PROFILES.length) % CHARACTER_PROFILES.length);
  }

  function sendLobbySettings() {
    if (!isRoomOwner()) return;
    sendServer({ t: "settings", level: menuLevel, difficulty: menuDifficulty });
  }

  function startOnlineMatch(message) {
    onlineMenuOpen = false;
    net.phase = "playing";
    net.seed = Number(message.seed) || net.seed || 1;
    if (message.settings) {
      menuLevel = boundedIndex(message.settings.level, menuLevel, WORLD_ZONES.length);
      menuDifficulty = boundedIndex(message.settings.difficulty, menuDifficulty, DIFFICULTY_OPTIONS.length);
    }
    if (Array.isArray(message.roster)) updateRoster(message.roster);
    net.matchRoster = [...net.roster.values()].filter(row => row.connected).sort((a, b) => a.id - b.id);
    net.inputs = new Map(net.matchRoster.map(row => [row.id, neutralNetworkInput()]));
    net.localInput = neutralNetworkInput();
    net.lastSnapshotSeq = 0;
    net.snapshotSeq = 0;
    net.pendingSnapshot = null;
    net.clockTarget = null;
    begin();
    if (message.snapshot) queueNetworkSnapshot(message.snapshot);
  }

  function requestOnlineStart() {
    if (!isRoomOwner()) return;

  }

  function onlineLobbyReady() {
    const rows = [...net.roster.values()].filter(row => row.connected);

  function startNetworkHeartbeat() {
    if (net.heartbeatTimer) return;
    net.heartbeatTimer = setInterval(() => {
      if (menuScreen === "multiplayer" && Date.now() >= net.browserTimer) {
        net.browserTimer = Date.now() + 12000;
        refreshOnlineRooms();
      }
      if (!connectedSocket()) return;
      sendServer({ t: "ping", at: Date.now() });
      sendServer({ t: "activity", visible: !document.hidden });
    }, 5000);

    const tier = explicitTier || (count >= 64 ? 3 : count >= 34 ? 2 : 1);
    burst(x, y, color, count, tier >= 3 ? 520 : tier === 2 ? 440 : 380);
    const blastLimit = touchUi ? 18 : 28;
    if (blastEffects.length >= blastLimit) blastEffects.splice(0, blastEffects.length - blastLimit + 1);

    if (tier >= 2) impactFeedback(0, tier >= 3 ? 18 : 10);
    if (sound) {

      else if (tier === 2) audio.bigExplosion(1.3);
      else audio.explode(1);
    }

  function updateStageIntro(dt) {
    if (!stageIntro) return false;
    stageIntro.timer -= dt;
    const elapsed = stageIntro.duration - stageIntro.timer;
    const player = localPlayer() || players[0];

    if (stageIntro.nextState === "vehicle" && introVehicle) {
      player.x = introVehicle.x + 66;
      player.y = introVehicle.y - 63;
    } else if (stageIntro.sequence && player) {
      const targetX = stageIntro.targetX;
      const targetY = stageIntro.targetY;
      const sequence = stageIntro.sequence;

      if (sequence === "dropship") {
        const approach = smoothStep(clamp((elapsed - 0.45) / 1.35, 0, 1));
        const depart = smoothStep(clamp((elapsed - 2.75) / 1.35, 0, 1));
        stageIntro.vehicleX = targetX + 470 - approach * 450 + depart * 390;
        stageIntro.vehicleY = targetY - 245 - depart * 250;
        const descent = smoothStep(clamp((elapsed - 1.72) / 1.12, 0, 1));
        player.portalHidden = elapsed < 1.68 ? 999 : 0;
        player.x = targetX;
        player.y = targetY - (1 - descent) * 235;
        if (!stageIntro.impactPlayed && descent >= 1) {
          stageIntro.impactPlayed = true;
          burst(player.cx, targetY + player.h - 2, player.color, 15, 185);
          audio.impact(0.9, "metal");
        }
      } else if (sequence === "pod") {
        const drop = 1 - Math.pow(1 - clamp((elapsed - 0.42) / 1.25, 0, 1), 3);
        stageIntro.vehicleX = targetX - 5;
        stageIntro.vehicleY = targetY - 380 + drop * 410;
        player.portalHidden = elapsed < 2.12 ? 999 : 0;
        const exit = smoothStep(clamp((elapsed - 2.12) / 1.05, 0, 1));
        player.x = targetX - 35 + exit * 35;
        player.y = targetY - (1 - exit) * 18;
        if (!stageIntro.impactPlayed && drop >= 1) {
          stageIntro.impactPlayed = true;
          burst(targetX, targetY + player.h - 4, "#69ffb0", 24, 250);
          impactFeedback(0.06, 8);
          audio.crash(1.15);
        }
      } else if (sequence === "skimmer") {
        const approach = smoothStep(clamp((elapsed - 0.42) / 1.65, 0, 1));
        const depart = smoothStep(clamp((elapsed - 2.58) / 1.25, 0, 1));
        stageIntro.vehicleX = targetX - 520 + approach * 470 + depart * 470;
        stageIntro.vehicleY = terrainSurfaceY(stageIntro.vehicleX + 115) - 54 - Math.sin(elapsed * 8) * 5;
        player.portalHidden = 0;
        if (elapsed < 2.35) {
          player.x = stageIntro.vehicleX + 112;
          player.y = stageIntro.vehicleY - player.h + 8;
          player.animTime += dt * 1.5;
        } else {
          const jump = smoothStep(clamp((elapsed - 2.35) / 0.92, 0, 1));
          player.x = stageIntro.vehicleX + 112 + (targetX - (stageIntro.vehicleX + 112)) * jump;
          player.y = targetY - Math.sin(jump * Math.PI) * 92;
        }
      } else if (sequence === "maglev") {
        const approach = smoothStep(clamp((elapsed - 0.35) / 1.38, 0, 1));
        const depart = smoothStep(clamp((elapsed - 3.0) / 1.05, 0, 1));
        stageIntro.vehicleX = targetX - 760 + approach * 590 + depart * 720;
        stageIntro.vehicleY = targetY - 62;
        player.portalHidden = elapsed < 2.0 ? 999 : 0;
        const exit = smoothStep(clamp((elapsed - 2.0) / 1.05, 0, 1));
        player.x = targetX - 92 + exit * 92;
        player.y = targetY;
        if (!stageIntro.impactPlayed && approach >= 1) {
          stageIntro.impactPlayed = true;
          audio.toneAt(92, 0.28, "sawtooth", 0.08, -35);
          burst(targetX - 120, targetY + player.h - 4, "#8ff7ff", 12, 130);
        }
      } else if (sequence === "rift") {
        stageIntro.vehicleX = targetX;
        stageIntro.vehicleY = targetY + player.h * 0.5;
        stageIntro.effect = clamp((elapsed - 0.48) / 1.25, 0, 1) * clamp((4.15 - elapsed) / 0.8, 0, 1);
        const materialize = smoothStep(clamp((elapsed - 1.42) / 1.2, 0, 1));
        const blink = elapsed > 2.28 || Math.floor(Math.max(0, elapsed - 1.42) / 0.08) % 2 === 0;
        player.portalHidden = materialize <= 0 || !blink ? 999 : 0;
        player.x = targetX;
        player.y = targetY - (1 - materialize) * 120;
        if (!stageIntro.impactPlayed && materialize >= 1) {
          stageIntro.impactPlayed = true;
          burst(player.cx, player.cy, "#ff8df4", 22, 210);
          audio.powerStart("nova");
        }
      }
    }

    if (!stageIntro.goCue && stageIntro.timer <= 0.58) {
      stageIntro.goCue = true;
      audio.toneAt(330, 0.08, "square", 0.09, 180);
      audio.toneAt(520, 0.12, "square", 0.08, 220, 0.07);
    }

    if (stageIntro.timer <= 0) {
      const intro = stageIntro;
      stageIntro = null;
      levelState = intro.nextState;
      stageEntryGrace = levelState === "onfoot" ? (intro.continuing ? 1.1 : intro.level > 0 ? 2.0 : 0) : 0;
      if (levelState === "vehicle" && introVehicle) introVehicle.speed = introVehicle.cruiseSpeed;
      for (const member of players) {
        member.portalHidden = 0;

        if (levelState === "onfoot") {
          placePlayerOnSafeGround(member, intro.targetX + member.index * 62, WORLD_ZONES[intro.level].start + 24, WORLD_ZONES[intro.level].end - member.w - 40);
          member.onGround = true;
          member.vx = 0;
          member.vy = 0;
        }
      }
      checkpointX = (frontAlivePlayer() || players[0]).x;
      clearControls();
      showBanner(intro.cue);
    }
    return true;
  }
