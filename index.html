        ctx.fillRect(-24, -22 + crouch, 48, 42 - crouch);
        ctx.fillStyle = "#8dff5d";
        ctx.fillRect(9, -13 + crouch, 12, 8);
        ctx.fillStyle = "#17251c";
        ctx.fillRect(-28, 15, 20, 9);
        ctx.fillRect(8, 15, 20, 9);
        ctx.strokeStyle = "#b7ff61";
        ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(-18, -18 + crouch); ctx.lineTo(-31, -34 + crouch);
        ctx.moveTo(18, -18 + crouch); ctx.lineTo(31, -34 + crouch); ctx.stroke();
      } else if (this.type === "sentinel") {
        ctx.fillStyle = "#3a4b32";
        ctx.fillRect(-30, -42, 60, 78);
        ctx.fillStyle = "#b7ff61";
        ctx.fillRect(-22, -31, 44, 11);
        ctx.fillStyle = "#17251c";
        ctx.fillRect(-18, 36, 13, 12);
        ctx.fillRect(7, 36, 13, 12);
        ctx.fillStyle = "#8dff5d";
        ctx.fillRect(20, -13, 49, 13);
      } else if (this.type === "bomber") {
        ctx.fillStyle = "#304c36";
        ctx.fillRect(-36, -15, 72, 30);
        ctx.fillStyle = "#8dff5d";
        ctx.fillRect(-17, -24, 34, 10);
        ctx.fillStyle = "#17251c";
        ctx.fillRect(-48, -6, 24, 12);
        ctx.fillRect(24, -6, 24, 12);
        ctx.fillStyle = "#ffd75e";
        ctx.fillRect(-7, 15, 14, 14);
      } else if (this.type === "specter") {
        ctx.globalAlpha = 0.62 + Math.sin(time * 9 + this.phase) * 0.24;
        ctx.fillStyle = this.teleportFlash > 0 ? "#ffffff" : "#5b347f";
        ctx.fillRect(-24, -34, 48, 62);
        ctx.fillStyle = "#ff8df4";
        ctx.fillRect(-16, -22, 32, 9);
        ctx.fillRect(-5, 28, 10, 18);
        ctx.strokeStyle = "#ff8df4";
        ctx.lineWidth = 4;
        ctx.strokeRect(-31, -41, 62, 76);
        ctx.globalAlpha = 1;
      } else {
        ctx.fillStyle = "#48525f";
        roundRect(-29, -29, 58, 58, 9);
        ctx.fill();
        ctx.fillStyle = "#1c232d";
        ctx.fillRect(-8, -44, 16, 32);
        ctx.fillRect(-4, -50, 45, 9);
      }

      if (this.health < this.maxHealth) {
        ctx.fillStyle = "rgba(0,0,0,.55)";
        ctx.fillRect(-25, -this.h / 2 - 16, 50, 5);
        ctx.fillStyle = "#ff5e4f";
        ctx.fillRect(-25, -this.h / 2 - 16, 50 * this.health / this.maxHealth, 5);
      }

      ctx.restore();
    }
  }

  function bossPolygon(points, fill, stroke = null, width = 5) {
    ctx.beginPath();
    points.forEach(([x, y], index) => index ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    if (stroke) {
      ctx.strokeStyle = stroke;
      ctx.lineWidth = width;
      ctx.stroke();
    }
  }

  function bossEye(x, y, color, direction = -1) {
    ctx.fillStyle = "#100d12";
    ctx.fillRect(x - 8, y - 6, 16, 12);
    ctx.fillStyle = color;
    ctx.fillRect(x + direction * 1 - 3, y - 3, 7, 6);
  }

  function drawBossAura(profile, phase, radius = 140) {
    ctx.save();
    ctx.globalAlpha = 0.30;
    ctx.strokeStyle = profile.accent;
    ctx.lineWidth = 4;
    ctx.rotate(phase * 0.35);
    for (let i = 0; i < 4; i++) {
      ctx.strokeRect(-radius + i * 14, -radius + i * 14, (radius - i * 14) * 2, (radius - i * 14) * 2);
      ctx.rotate(Math.PI / 8);
    }
    ctx.restore();
  }

  function drawBossForm(profile, phase, warning = false) {
    const p = profile;
    const accent = warning ? "#fff36d" : p.accent;
    const body = warning ? "#6b3b45" : p.color;
    const bob = Math.round(Math.sin(phase * 3) * 4);
    ctx.lineJoin = "miter";
    ctx.lineCap = "square";

    if (p.floating || ["core", "serpent", "mantis"].includes(p.form)) drawBossAura(p, phase, Math.max(p.w, p.h) * 0.43);

    if (p.form === "walker") {
      const step = Math.sin(phase * 3.4) * 16;
      ctx.strokeStyle = "#171c24"; ctx.lineWidth = 24;
      ctx.beginPath();
      ctx.moveTo(-48, 48); ctx.lineTo(-66 - step, 105); ctx.lineTo(-88 - step, 132);
      ctx.moveTo(48, 48); ctx.lineTo(66 + step, 105); ctx.lineTo(88 + step, 132); ctx.stroke();
      ctx.fillStyle = accent;
      ctx.beginPath(); ctx.arc(-65 - step, 104, 13, 0, Math.PI * 2); ctx.arc(65 + step, 104, 13, 0, Math.PI * 2); ctx.fill();
      bossPolygon([[-88, 118],[-43,118],[-32,137],[-96,137]], "#232c38", accent, 5);
      bossPolygon([[43,118],[88,118],[96,137],[32,137]], "#232c38", accent, 5);
      bossPolygon([[-83,-48],[-36,-86],[48,-78],[88,-28],[68,58],[-64,58]], body, accent, 7);
      ctx.fillStyle = "#17202a"; ctx.fillRect(-34, -56, 72, 48);
      ctx.fillStyle = "#69e8ff"; ctx.fillRect(-24, -47, 52, 23);
      ctx.fillStyle = accent; ctx.fillRect(-77, -71, 52, 18); ctx.fillRect(56, -38, 72, 18);
      ctx.fillStyle = "#1b222b"; ctx.fillRect(117, -43, 45, 28);
      bossEye(10, -34, accent);
    } else if (p.form === "tank") {
      ctx.fillStyle = "#151b22";
      ctx.beginPath(); ctx.ellipse(0, 82, 132, 54, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = accent; ctx.lineWidth = 8; ctx.stroke();
      for (let x = -92; x <= 92; x += 46) {
        ctx.fillStyle = "#3c4853"; ctx.beginPath(); ctx.arc(x, 82, 21, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#13171d"; ctx.beginPath(); ctx.arc(x, 82, 9, 0, Math.PI * 2); ctx.fill();
      }
      bossPolygon([[-120,55],[-88,-12],[-22,-48],[96,-25],[132,48]], body, accent, 7);
      ctx.save(); ctx.translate(22, -44 + bob); ctx.rotate(-0.08 + Math.sin(phase) * 0.03);
      bossPolygon([[-58,15],[-42,-38],[38,-52],[72,-8],[52,30]], "#273641", accent, 6);
      ctx.fillStyle = accent; ctx.fillRect(42, -25, 155, 22);
      ctx.fillStyle = "#1b222b"; ctx.fillRect(180, -30, 35, 32);
      ctx.restore();
      ctx.fillStyle = "#ff9b42"; ctx.fillRect(-118, 24 + bob, 18, 28); ctx.fillRect(-92, 12 - bob, 14, 22);
      bossEye(8, -62, accent);
    } else if (p.form === "gunship") {
      const wing = Math.sin(phase * 2.6) * 8;
      bossPolygon([[-154,8],[-76,-56],[-12,-70],[35,-55],[158,2],[68,26],[28,64],[-80,48]], body, accent, 7);
      bossPolygon([[-138,3],[-48,-3],[-92,54]], "#1b203d", accent, 5);
      bossPolygon([[52,-8],[145,2],[78,50]], "#1b203d", accent, 5);
      ctx.fillStyle = "#77f4ff"; ctx.fillRect(-20, -56, 58, 25);
      ctx.fillStyle = "#12182d"; ctx.fillRect(-9, -49, 40, 12);
      ctx.fillStyle = accent;
      ctx.fillRect(-105, 38 + wing, 38, 22); ctx.fillRect(76, 32 - wing, 38, 22);
      ctx.fillStyle = "#fff36d"; ctx.fillRect(-96, 46 + wing, 21, 7); ctx.fillRect(84, 40 - wing, 21, 7);
      ctx.fillStyle = "#ff6949"; ctx.fillRect(-171, -7, 32, 12); ctx.fillRect(-160, 14, 28, 10);
    } else if (p.form === "rail") {
      ctx.fillStyle = "#171721";
      ctx.beginPath(); ctx.ellipse(0, 94, 138, 42, 0, 0, Math.PI * 2); ctx.fill();
      for (let x = -100; x <= 100; x += 40) { ctx.fillStyle = "#3d3547"; ctx.beginPath(); ctx.arc(x, 94, 14, 0, Math.PI * 2); ctx.fill(); }
      bossPolygon([[-126,78],[-108,-35],[-58,-85],[48,-90],[110,-34],[132,78]], body, accent, 7);
      ctx.save(); ctx.translate(-15, -53); ctx.rotate(-0.22 + Math.sin(phase * 0.7) * 0.04);
      bossPolygon([[-48,24],[-30,-36],[44,-48],[70,1],[48,35]], "#211b2d", accent, 6);
      ctx.fillStyle = accent; ctx.fillRect(35, -29, 205, 27);
      ctx.fillStyle = "#17131e"; ctx.fillRect(222, -34, 45, 38);
      ctx.restore();
      ctx.fillStyle = "#ff5ed7"; ctx.fillRect(-84, 25, 34, 16); ctx.fillRect(48, 25, 34, 16);
      bossEye(22, -55, accent);
    } else if (p.form === "mantis") {
      ctx.save(); ctx.rotate(Math.sin(phase * 1.7) * 0.08);
      ctx.globalAlpha = 0.45;
      bossPolygon([[-10,-25],[-116,-104],[-72,7]], "#58d0a8", accent, 4);
      bossPolygon([[10,-25],[116,-104],[72,7]], "#58d0a8", accent, 4);
      ctx.globalAlpha = 1;
      ctx.fillStyle = body; ctx.beginPath(); ctx.ellipse(0, 28, 48, 90, 0, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = accent; ctx.lineWidth = 7; ctx.stroke();
      bossPolygon([[-42,-28],[0,-112],[42,-28]], body, accent, 7);
      ctx.strokeStyle = "#1a2a2f"; ctx.lineWidth = 18;
      ctx.beginPath(); ctx.moveTo(-35,-5); ctx.lineTo(-104,24); ctx.lineTo(-154,-72); ctx.moveTo(35,-5); ctx.lineTo(104,24); ctx.lineTo(154,-72); ctx.stroke();
      ctx.strokeStyle = accent; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.moveTo(-104,24); ctx.lineTo(-154,-72); ctx.moveTo(104,24); ctx.lineTo(154,-72); ctx.stroke();
      bossEye(-15, -61, accent); bossEye(15, -61, accent, 1);
      ctx.restore();
    } else if (p.form === "core") {
      ctx.save(); ctx.rotate(phase * 0.75); ctx.strokeStyle = accent; ctx.lineWidth = 12;
      ctx.beginPath(); ctx.arc(0, 0, 122, 0, Math.PI * 2); ctx.stroke();
      for (let i = 0; i < 4; i++) { ctx.rotate(Math.PI / 2); ctx.fillStyle = body; ctx.fillRect(96, -18, 58, 36); ctx.strokeRect(96, -18, 58, 36); }
      ctx.restore();
      ctx.save(); ctx.rotate(-phase * 1.15);
      bossPolygon([[0,-94],[88,0],[0,94],[-88,0]], body, accent, 8);
      ctx.restore();
      ctx.fillStyle = "#15111e"; ctx.beginPath(); ctx.arc(0, 0, 58 + Math.sin(phase * 4) * 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = accent; ctx.beginPath(); ctx.arc(0, 0, 36 + Math.sin(phase * 5) * 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fff7bd"; ctx.fillRect(-12, -12, 24, 24);
    } else if (p.form === "hydra") {
      bossPolygon([[-125,76],[-106,-10],[-58,-55],[0,-35],[56,-58],[112,-8],[130,76]], body, accent, 7);
      for (let i = -1; i <= 1; i++) {
        const sway = Math.sin(phase * 2.2 + i * 1.3) * 18;
        const neckX = i * 68;
        ctx.strokeStyle = body; ctx.lineWidth = 31; ctx.beginPath(); ctx.moveTo(neckX, 5); ctx.quadraticCurveTo(neckX + sway, -76, neckX + i * 18, -128 + Math.abs(i) * 10); ctx.stroke();
        ctx.strokeStyle = accent; ctx.lineWidth = 6; ctx.stroke();
        ctx.save(); ctx.translate(neckX + i * 18, -132 + Math.abs(i) * 10); ctx.rotate(sway * 0.006);
        bossPolygon([[-35,-15],[12,-30],[39,-5],[24,24],[-25,25],[-42,5]], body, accent, 6);
        ctx.fillStyle = "#111a12"; ctx.fillRect(16, -7, 9, 7);
        ctx.fillStyle = accent; ctx.fillRect(22, -5, 6, 4);
        ctx.fillStyle = "#d9ffb7"; ctx.fillRect(-19, 21, 7, 13); ctx.fillRect(2, 22, 7, 12);
        ctx.restore();
      }
      ctx.fillStyle = "#1b2b1d"; ctx.beginPath(); ctx.ellipse(0, 58, 92, 42, 0, 0, Math.PI * 2); ctx.fill();

  class StageBoss extends Entity {
    constructor(key, x) {
      const profile = BOSS_PROFILES[key];
      const surfaceY = terrainSurfaceY(x + profile.w / 2);
      const baseY = profile.floating ? surfaceY - profile.h - 150 : surfaceY - profile.h;
      super(x, baseY, profile.w, profile.h);
      this.key = key;
      this.profile = profile;
      this.name = profile.name;
      this.maxHealth = profile.health * difficulty * (coop ? 1.38 : 1);
      this.health = this.maxHealth;
      this.phase = 0;
      this.introTimer = 1.25;
      this.attackTimer = 1.65;
      this.telegraphTimer = 0;
      this.pendingAttack = null;
      this.telegraphLabel = "";
      this.flashTimer = 0;
      this.attackMode = 0;
      this.combatTier = 0;
      this.phaseShield = 0;
      this.comboTimer = 0;
      this.comboAttackName = null;
      this.arenaLock = true;
      this.hudHidden = false;
      this.baseX = x;
      const zoneIndex = WORLD_ZONES.findIndex(zone => x >= zone.start && x < zone.end);
      const zone = WORLD_ZONES[Math.max(0, zoneIndex)];
      const arenaTargetWidth = Math.min(
        zone.end - zone.start - 180,
        Math.max(1500, baseVisibleWorldW * (portrait ? 1.14 : 1.18) + (portrait ? 360 : 520))
      );

      if (Number.isInteger(profile.levelEnd) || profile.campaignFinal) {
        this.arenaRight = Math.min(zone.end - 40, x + Math.max(profile.right, profile.w + 70));
        this.arenaLeft = Math.max(zone.start + 90, this.arenaRight - arenaTargetWidth);
      } else {
        const leftShare = profile.floating ? 0.62 : 0.68;
        this.arenaLeft = Math.max(zone.start + 90, x - arenaTargetWidth * leftShare);
        this.arenaRight = Math.min(zone.end - 90, this.arenaLeft + arenaTargetWidth);
        if (this.arenaRight - this.arenaLeft < arenaTargetWidth) {
          this.arenaLeft = Math.max(zone.start + 90, this.arenaRight - arenaTargetWidth);
        }
      }
      this.score = profile.score;
      this.baseY = baseY;
    }

    target() {
      let best = null;
      let bestDistance = Infinity;
      for (const player of players) {
        if (player.dead) continue;
        const distance = Math.abs(player.cx - this.cx);
        if (distance < bestDistance) { bestDistance = distance; best = player; }
      }
      return best;
    }

    update(dt) {
      this.phase += dt;
      this.flashTimer = Math.max(0, this.flashTimer - dt);
      this.phaseShield = Math.max(0, this.phaseShield - dt);
      if (this.introTimer > 0) { this.introTimer -= dt; return; }
      const target = this.target();
      if (!target) return;
      if (specialAttack) { this.attackTimer = Math.max(this.attackTimer, 0.45); return; }

      const healthRatio = clamp(this.health / Math.max(1, this.maxHealth), 0, 1);
      const nextTier = healthRatio <= 0.34 ? 2 : healthRatio <= 0.68 ? 1 : 0;
      if (nextTier > this.combatTier) this.enterCombatTier(nextTier);

      const formFloat = {
        gunship: [34, 1.85], carrier: [28, 1.5], mantis: [38, 1.8],
        serpent: [45, 1.55], core: [24, 1.2], hydra: [7, 0.9], beast: [5, 1.15],
        hunter: [30, 1.75]
      }[this.profile.form] || [this.profile.floating ? 24 : 8, this.profile.floating ? 1.55 : 0.9];
      this.y = this.baseY + Math.sin(this.phase * formFloat[1]) * formFloat[0];

      if (this.telegraphTimer > 0) {
        this.telegraphTimer -= dt;
        if (this.telegraphTimer <= 0 && this.pendingAttack) {
          const attack = this.pendingAttack;
          this.pendingAttack = null;
          attack(target);
        }
        return;
      }

      if (this.comboTimer > 0) {
        this.comboTimer -= dt;
        if (this.comboTimer <= 0 && this.comboAttackName) {
          const comboName = this.comboAttackName;
          this.comboAttackName = null;
          this.beginBossAttack(comboName, true);
          return;
        }
      }

      this.attackTimer -= dt;
      if (this.attackTimer <= 0) {
        const attackName = this.profile.attacks[this.attackMode % this.profile.attacks.length];
        this.attackMode++;
        this.beginBossAttack(attackName, false);
        const baseCadence = this.profile.cadence || (2.85 - Math.min(0.72, campaignLevel * 0.16));
        const tierPressure = this.combatTier * 0.28;
        const levelPressure = campaignLevel * 0.035;
        this.attackTimer = Math.max(1.08, (baseCadence - tierPressure - levelPressure) / Math.sqrt(difficulty));
      }

      for (const player of players) {
        if (!player.dead && this.overlaps(player)) player.hit(18 + campaignLevel * 2 + this.combatTier * 2);
      }
    }

    enterCombatTier(tier) {
      this.combatTier = tier;
      this.phaseShield = 0.48;
      this.attackTimer = Math.min(this.attackTimer, tier === 1 ? 0.62 : 0.42);
      this.comboTimer = 0;
      this.comboAttackName = null;
      blastEffects.push(new BlastEffect(this.cx, this.cy, this.profile.accent, tier + 1));
      burst(this.cx, this.cy, this.profile.accent, 18 + tier * 8, 250 + tier * 60);
      addFloatingText(this.cx, this.y - 20, tier === 1 ? "OVERDRIVE" : "FINAL PATTERN", this.profile.accent, 17);
      audio.tone(145 + tier * 90, 0.32, "sawtooth", 0.13, 220);
    }

    attackDefinition(name) {
      const attackMap = {
        horizontal: ["HIGH / LOW", () => this.horizontalBurst(), 0.58],
        rain: ["VERTICAL STRIKE", () => this.verticalRain(), 0.68],
        debris: ["IMPACT ZONES", () => this.overheadDrop(), 0.72],
        cross: ["CROSS FIRE", () => this.crossFire(), 0.70],
        laser: ["RAIL SWEEP", () => this.laserSweep(), 0.78],
        wave: ["SHOCKWAVE", () => this.shockwave(), 0.72],
        spiral: ["ENERGY RING", () => this.energyRing(), 0.76],
        fan: ["HUNTER FAN", () => this.fanBurst(), 0.66],
        summon: ["REINFORCEMENTS", () => this.summonMinions(), 0.78],
        missiles: ["MISSILE LOCK", () => this.missileSalvo(), 0.76],
        nova: ["CORE NOVA", () => this.novaPulse(), 0.82]
      };
      return attackMap[name] || attackMap.horizontal;
    }

    selectComboAttack(previousName) {
      const attacks = this.profile.attacks;
      if (!attacks || attacks.length < 2) return null;
      for (let offset = 0; offset < attacks.length; offset++) {
        const candidate = attacks[(this.attackMode + offset) % attacks.length];
        if (candidate !== previousName && candidate !== "summon") return candidate;
      }
      return attacks[(this.attackMode + 1) % attacks.length];
    }

    beginBossAttack(name, combo = false) {
      const entry = this.attackDefinition(name);
      const duration = entry[2] * (combo ? 0.68 : 1);
      this.telegraph(entry[0], () => {
        entry[1]();
        if (!combo && this.combatTier > 0 && !this.retreating) {
          const comboEvery = this.combatTier >= 2 ? 2 : 3;
          if (this.attackMode % comboEvery === 0) {
            const followUp = this.selectComboAttack(name);
            if (followUp) {
              this.comboAttackName = followUp;
              this.comboTimer = this.combatTier >= 2 ? 0.18 : 0.30;
            }
          }
        }
      }, duration);
    }

    telegraph(label, attack, duration) {
      this.telegraphLabel = label;
      this.pendingAttack = () => { this.telegraphLabel = ""; attack(); };
      this.telegraphTimer = duration;
      audio.tone(210 + campaignLevel * 55, duration * 0.55, "sawtooth", 0.08, 120);
    }

    horizontalBurst() {
      const laneY = terrainLaneY((this.arenaLeft + this.arenaRight) * 0.5, this.attackMode % 2 !== 0);
      const count = 2 + campaignLevel + this.combatTier;
      for (let i = 0; i < count; i++) enemyBullets.push(new EnemyBullet(this.x + 10 + i * 42, laneY, -300 - campaignLevel * 30, 0, (13 + campaignLevel) * difficulty, 12, this.profile.accent));
      audio.boss();
    }

    verticalRain() {
      const count = 3 + campaignLevel * 2 + this.combatTier * 2;
      const width = this.arenaRight - this.arenaLeft - 180;
      const shift = this.attackMode % 2 ? 70 : 0;
      for (let i = 0; i < count; i++) {
        const x = this.arenaLeft + 100 + shift + width * (i + 0.5) / count;
        enemyBullets.push(new EnemyBullet(x, cameraY - 70, 0, 270 + campaignLevel * 30, (11 + campaignLevel) * difficulty, 11, this.profile.accent));
      }
      audio.boss();
    }

    overheadDrop() {
      const count = 4 + campaignLevel + this.combatTier;
      const width = this.arenaRight - this.arenaLeft - 220;
      const shift = this.attackMode % 2 ? 85 : 0;
      for (let i = 0; i < count; i++) {
        const x = this.arenaLeft + 110 + shift + width * (i + 0.5) / count;
        debris.push(new FallingDebris(x, cameraY - 110, 34 + campaignLevel * 4, true));
      }
      audio.boss();
    }

    crossFire() {
      this.verticalRain();
      const target = this.target();
      if (!target) return;
      const laneY = terrainLaneY(target.cx, target.crouching);
      enemyBullets.push(new EnemyBullet(this.cx, laneY, -340, 0, 14 * difficulty, 12, this.profile.accent));
      enemyBullets.push(new EnemyBullet(this.cx, laneY, 340, 0, 14 * difficulty, 12, this.profile.accent));
    }

    laserSweep() {
      const y = terrainLaneY((this.arenaLeft + this.arenaRight) * 0.5, true) - 14;
      const beams = 6 + this.combatTier * 2;
      for (let i = 0; i < beams; i++) enemyBullets.push(new EnemyBullet(this.arenaRight - 40 + i * 60, y, -410 - this.combatTier * 25, 0, (15 + this.combatTier) * difficulty, 15, this.profile.accent));
      if (this.combatTier >= 2) {
        const highY = terrainLaneY((this.arenaLeft + this.arenaRight) * 0.5, false);
        for (let i = 0; i < 5; i++) enemyBullets.push(new EnemyBullet(this.arenaRight + 130 + i * 72, highY, -455, 0, 17 * difficulty, 13, this.profile.accent));
      }
      audio.tone(95, 0.22, "sawtooth", 0.12, 180);
    }

    shockwave() {
      const groundY = terrainLaneY((this.arenaLeft + this.arenaRight) * 0.5, true) - 3;
      const count = 3 + Math.floor(campaignLevel / 2) + this.combatTier;
      for (let i = 0; i < count; i++) {
        const speed = 270 + i * 48 + campaignLevel * 15;
        enemyBullets.push(new EnemyBullet(this.cx - 40, groundY, -speed, 0, (14 + campaignLevel) * difficulty, 15, this.profile.accent));
        enemyBullets.push(new EnemyBullet(this.cx + 40, groundY, speed, 0, (14 + campaignLevel) * difficulty, 15, this.profile.accent));
      }
      burst(this.cx, terrainSurfaceY(this.cx) - 12, this.profile.accent, 18, 220);
      audio.tone(72, 0.28, "sawtooth", 0.14, 110);
    }

    energyRing() {
      const count = 10 + Math.min(4, campaignLevel) + this.combatTier * 2;
      const gap = this.attackMode % count;
      for (let i = 0; i < count; i++) {
        if (i === gap || i === (gap + 1) % count) continue;
        const angle = i * Math.PI * 2 / count;
        const speed = 245 + campaignLevel * 18;
        enemyBullets.push(new EnemyBullet(this.cx, this.cy, Math.cos(angle) * speed, Math.sin(angle) * speed, (13 + campaignLevel) * difficulty, 12, this.profile.accent));
      }
      audio.tone(460, 0.17, "square", 0.10, -210);
    }

    fanBurst() {
      const target = this.target();
      if (!target) return;
      const base = Math.atan2(target.cy - this.cy, target.cx - this.cx);
      const count = (campaignLevel >= 4 ? 7 : 5) + this.combatTier * 2;
      for (let i = 0; i < count; i++) {
        if (i === Math.floor(count / 2) && this.attackMode % 2 === 0) continue;
        const offset = (i - (count - 1) / 2) * 0.13;
        const speed = 300 + campaignLevel * 14;
        enemyBullets.push(new EnemyBullet(this.cx, this.cy, Math.cos(base + offset) * speed, Math.sin(base + offset) * speed, (12 + campaignLevel) * difficulty, 11, this.profile.accent));
      }
      audio.tone(330, 0.16, "square", 0.11, -170);
    }

    summonMinions() {
      const sets = [
        ["runner", "gunner"], ["jet", "drone"], ["orb", "jet"],
        ["stalker", "bomber"], ["sentinel", "jet"], ["specter", "stalker"]
      ];
      const types = sets[campaignLevel] || sets[0];
      const living = enemies.filter(enemy => !enemy.dead && enemy.x > this.arenaLeft && enemy.x < this.arenaRight).length;
      if (living > 5 + this.combatTier) { this.fanBurst(); return; }
      types.forEach((type, index) => {
        const x = clamp(this.arenaRight - 270 - index * 120, this.arenaLeft + 180, this.arenaRight - 160);
        const y = ["jet", "drone", "orb", "bomber", "specter"].includes(type) ? terrainSurfaceY(x) - 300 - index * 35 : null;
        spawn(type, x, y);
        burst(x, y == null ? terrainSurfaceY(x) - 60 : y, this.profile.accent, 10, 150);
      });
      audio.tone(175, 0.25, "sawtooth", 0.12, 140);
    }

    missileSalvo() {
      const livingPlayers = players.filter(player => !player.dead);
      const count = Math.min(4, (campaignLevel >= 3 ? 3 : 2) + this.combatTier);
      for (let i = 0; i < count; i++) {
        const target = livingPlayers[i % Math.max(1, livingPlayers.length)] || this.target();
        enemyBullets.push(new BossMissile(
          this.cx - 25,
          this.cy - 46 + i * 34,
          target,
          this.profile.accent,
          (13 + campaignLevel) * difficulty,
          i * 0.22
        ));
      }
      audio.tone(124, 0.22, "sawtooth", 0.12, 180);
    }

    novaPulse() {
      const count = 16 + this.combatTier * 2;
      const gap = (this.attackMode * 3) % count;
      for (let i = 0; i < count; i++) {
        if (Math.abs(i - gap) <= 1 || Math.abs(i - gap) >= count - 1) continue;
        const angle = i * Math.PI * 2 / count;
        const speed = 215 + (i % 2) * 55;
        enemyBullets.push(new EnemyBullet(this.cx, this.cy, Math.cos(angle) * speed, Math.sin(angle) * speed, (13 + campaignLevel) * difficulty, 13, this.profile.accent));
      }
      blastEffects.push(new BlastEffect(this.cx, this.cy, this.profile.accent, 2));
      audio.tone(72, 0.36, "sawtooth", 0.15, 260);
    }

    hit(damage, owner) {
      if (this.introTimer > 0) return;
      this.health -= damage;
      this.flashTimer = 0.065;
      burst(rand(this.x, this.x + this.w), rand(this.y, this.y + this.h), "#ffe081", 3, 145);
      if (damage >= 45) impactFeedback(0.022);

      if (this.health <= 0) {
        this.dead = true;
        this.health = 0;
        defeatedBosses.add(this.key);
        if (players[owner]) players[owner].score += this.score;
        enemyBullets = [];
        impactFeedback(0.10);
        bossDeaths.push(new BossDeathSequence(this));
        victoryScene = new BossVictoryScene(this);
        activeBoss = null;

        if (this.profile.checkpoint) checkpointX = this.profile.checkpoint;
        if (this.profile.reward && !Number.isInteger(this.profile.levelEnd) && !this.profile.campaignFinal) {
          const rewardY = terrainSurfaceY(this.cx) - 72;
          this.profile.reward.forEach((type, index) => spawnPickup(this.cx - 65 + index * 130, rewardY, type, true));
        }

        if (this.profile.campaignFinal) finalWinTimer = victoryScene.duration + 1.0;
      }
    }

    draw() {
      const warning = this.telegraphTimer > 0 && Math.floor(this.telegraphTimer * 10) % 2 === 0;
      ctx.save();
      ctx.translate(this.cx, this.cy);
      if (this.flashTimer > 0) ctx.globalAlpha = 0.62;
      drawBossForm(this.profile, this.phase, warning);
      ctx.globalAlpha = 1;
      if (this.telegraphLabel) {
        ctx.font = `900 13px ${UI_FONT}`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const labelWidth = ctx.measureText(this.telegraphLabel).width + 14;
        ctx.fillStyle = "#12070a";
        ctx.fillRect(-labelWidth / 2, -this.h / 2 - 43, labelWidth, 20);
        ctx.strokeStyle = this.profile.accent;
        ctx.lineWidth = 3;
        ctx.strokeRect(-labelWidth / 2, -this.h / 2 - 43, labelWidth, 20);
        ctx.fillStyle = "#fff36d";
        ctx.fillText(this.telegraphLabel, 0, -this.h / 2 - 33);
      }
      ctx.restore();
    }
  }

  class RivalHunter extends StageBoss {
    constructor(stage, x, finalEncounter = false) {
      super("reignHunter", x);
      const gadget = RIVAL_GADGETS[clamp(stage | 0, 0, RIVAL_GADGETS.length - 1)];
      this.stage = clamp(stage | 0, 0, RIVAL_GADGETS.length - 1);
      this.finalEncounter = Boolean(finalEncounter);
      this.key = this.finalEncounter ? "reignHunterFinal" : `reignHunter${this.stage}`;
      this.profile = {
        ...BOSS_PROFILES.reignHunter,
        name: this.finalEncounter ? "REIGN HUNTER • FINAL RIG" : "REIGN HUNTER",
        gadget: gadget.id,
        accent: gadget.accent,
        attacks: this.finalEncounter
          ? RIVAL_GADGETS.flatMap(item => item.attacks).filter((name, index, all) => all.indexOf(name) === index)
          : [...gadget.attacks],
        cadence: this.finalEncounter ? 2.05 : Math.max(1.75, 2.35 - this.stage * 0.08),
        reward: this.finalEncounter ? ["health", "special"] : null,
        checkpoint: this.finalEncounter ? 49900 : null
      };
      this.name = this.profile.name;
      this.maxHealth = (this.finalEncounter ? 3850 : 620 + this.stage * 170) * difficulty * (coop ? 1.32 : 1);
      this.health = this.maxHealth;
      this.score = this.finalEncounter ? 24500 : 1100 + this.stage * 350;
      this.arenaLock = this.finalEncounter;
      this.hudHidden = false;
      this.retreating = false;
      this.retreatTimer = 0;
      this.duration = this.finalEncounter ? Infinity : 8.8 + this.stage * 0.45;
      this.exitX = x + Math.max(980, 1320 - this.stage * 45);
      this.baseX = x;
      this.attackTimer = this.finalEncounter ? 1.0 : 0.72;
      this.introTimer = this.finalEncounter ? 1.0 : 0.55;
      this.combatTier = this.finalEncounter ? 0 : Math.min(1, Math.floor(this.stage / 3));

      if (this.finalEncounter) {
        const zone = WORLD_ZONES[5];
        const width = Math.max(1560, baseVisibleWorldW * (portrait ? 1.18 : 1.22) + 420);
        this.arenaRight = Math.min(zone.end - 80, x + 620);
        this.arenaLeft = Math.max(zone.start + 90, this.arenaRight - width);
      }
    }

    update(dt) {
      if (this.retreating) {
        this.phase += dt;
        this.retreatTimer -= dt;
        this.x += (430 + this.stage * 24) * dt;
        this.y -= (180 + this.stage * 12) * dt;
        if (this.retreatTimer <= 0 && activeBoss === this) activeBoss = null;
        return;
      }

      if (this.finalEncounter) {
        const tier = clamp(this.combatTier, 0, 2);
        const phaseGadget = tier >= 2 ? RIVAL_GADGETS[5] : tier === 1 ? RIVAL_GADGETS[4] : RIVAL_GADGETS[2];
        this.profile.gadget = phaseGadget.id;
        this.profile.accent = phaseGadget.accent;
        this.profile.attacks = tier >= 2
          ? [...RIVAL_GADGETS[5].attacks]
          : tier === 1
            ? [...RIVAL_GADGETS[4].attacks, "laser"]
            : [...RIVAL_GADGETS[2].attacks];
        super.update(dt);
        return;
      }

      const target = this.target();
      if (!target) return;
      if (this.introTimer <= 0) this.duration -= dt;

      const desiredX = clamp(
        Math.max(this.baseX, target.cx + visibleWorldW * 0.48),
        target.cx + 420,
        Math.min(LEVEL_W - this.w - 100, target.cx + visibleWorldW * 0.72)
      );
      this.x += (desiredX - this.x) * (1 - Math.exp(-3.6 * dt));
      this.baseY = terrainSurfaceY(this.cx) - this.h - 165 - Math.sin(this.phase * 0.6) * 18;

      if (this.duration <= 0 || target.cx >= this.exitX) {
        this.beginRetreat(false);
        return;
      }

      super.update(dt);
    }

    beginRetreat(damagedOut, owner = 0) {
      if (this.retreating) return;
      this.retreating = true;
      this.retreatTimer = 1.15;
      this.hudHidden = true;
      this.pendingAttack = null;
      this.telegraphTimer = 0;
      this.comboTimer = 0;
      this.comboAttackName = null;
      this.health = Math.max(0, this.health);
      burst(this.cx, this.cy, this.profile.accent, damagedOut ? 24 : 13, damagedOut ? 280 : 190);
      blastEffects.push(new BlastEffect(this.cx, this.cy, this.profile.accent, damagedOut ? 2 : 1));
      audio.tone(260, 0.24, "sawtooth", 0.11, 260);

      if (damagedOut) {
        if (players[owner]) players[owner].score += this.score;
        addFloatingText(this.cx, this.y - 12, "+BREAK", this.profile.accent, 18);
        if (this.stage === 1 || this.stage === 3) {
          spawnPickup(this.cx - 20, terrainSurfaceY(this.cx) - 78, "health", true);
        } else if (this.stage === 4) {
          spawnPickup(this.cx - 20, terrainSurfaceY(this.cx) - 78, "special", true);
        }
      } else {
        addFloatingText(this.cx, this.y - 12, "ESCAPED", this.profile.accent, 16);
      }
    }

    hit(damage, owner) {
      if (this.finalEncounter) {
        super.hit(damage, owner);
        return;
      }
      if (this.introTimer > 0 || this.retreating) return;
      this.health -= damage;
      this.flashTimer = 0.065;
      burst(rand(this.x, this.x + this.w), rand(this.y, this.y + this.h), "#ffe081", 3, 145);
      if (damage >= 45) impactFeedback(0.018);
      if (this.health <= 0) this.beginRetreat(true, owner);
    }

    draw() {
      ctx.save();
      if (this.retreating) ctx.globalAlpha = clamp(this.retreatTimer / 0.85, 0, 1);
      ctx.translate(this.cx, this.cy);
      if (this.retreating) ctx.rotate(-0.18);
      if (this.flashTimer > 0) ctx.globalAlpha *= 0.62;
      drawBossForm(this.profile, this.phase, this.telegraphTimer > 0 && Math.floor(this.telegraphTimer * 10) % 2 === 0);
      ctx.globalAlpha = 1;
      if (!this.retreating && this.telegraphLabel) {
        ctx.font = `900 12px ${UI_FONT}`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const labelWidth = ctx.measureText(this.telegraphLabel).width + 14;
        ctx.fillStyle = "#12070a";
        ctx.fillRect(-labelWidth / 2, -this.h / 2 - 40, labelWidth, 18);
        ctx.strokeStyle = this.profile.accent;
        ctx.lineWidth = 2.5;
        ctx.strokeRect(-labelWidth / 2, -this.h / 2 - 40, labelWidth, 18);
        ctx.fillStyle = "#fff36d";
        ctx.fillText(this.telegraphLabel, 0, -this.h / 2 - 31);
      }
      ctx.restore();
    }
  }

  class BlastEffect {
    constructor(x, y, color, tier = 1) {
      this.x = x;
      this.y = y;
      this.w = 1;
      this.h = 1;
      this.color = color;
      this.tier = tier;
      this.life = tier >= 3 ? 1.05 : tier === 2 ? 0.78 : 0.48;
      this.maxLife = this.life;
      this.dead = false;
      this.seed = rand(0, 1000);
    }

    update(dt) {
      this.life -= dt;
      if (this.life <= 0) this.dead = true;
    }

    draw() {
      const t = 1 - this.life / this.maxLife;
      const radius = (28 + this.tier * 30) * (0.35 + t * 1.25);
      ctx.save(); ctx.translate(this.x, this.y);
      ctx.globalAlpha = clamp(1 - t, 0, 1);
      ctx.strokeStyle = this.color; ctx.lineWidth = Math.max(4, 13 - t * 8);
      ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = "#fff36d"; ctx.lineWidth = Math.max(3, 8 - t * 5);
      ctx.beginPath(); ctx.arc(0, 0, radius * 0.62, 0, Math.PI * 2); ctx.stroke();
      const blocks = 7 + this.tier * 3;
      for (let i = 0; i < blocks; i++) {
        const angle = i * Math.PI * 2 / blocks + this.seed;
        const distance = radius * (0.25 + ((i * 37) % 70) / 100);
        const size = Math.max(5, 18 - t * 10 + this.tier * 2);
        ctx.fillStyle = i % 3 === 0 ? "#fff2a4" : i % 2 ? this.color : "#ff6a42";
        ctx.fillRect(Math.cos(angle) * distance - size / 2, Math.sin(angle) * distance - size / 2, size, size);
      }
      ctx.globalAlpha *= 0.55;
      ctx.fillStyle = "#403b49";
      for (let i = 0; i < 4 + this.tier; i++) {
        const x = ((i * 43 + this.seed) % 120) - 60;
        const y = -t * 65 - i * 12;
        const s = 20 + i * 5;
        ctx.fillRect(x - s / 2, y - s / 2, s, s);
      }
      ctx.restore();
    }
  }

  class BossDeathSequence {
    constructor(boss) {
      this.x = boss.x;
      this.y = boss.y;
      this.w = boss.w;
      this.h = boss.h;
      this.profile = boss.profile;
      this.phase = boss.phase;
      this.life = boss.profile.campaignFinal ? 4.6 : Number.isInteger(boss.profile.levelEnd) ? 3.7 : 3.0;
      this.maxLife = this.life;
      this.nextBlast = 0;
      this.blastIndex = 0;
      this.dead = false;
      audio.bossExplosion();
    }

    update(dt) {
      this.life -= dt;
      this.phase += dt * 2;
      this.nextBlast -= dt;
      if (this.nextBlast <= 0 && this.life > 0.22) {
        this.nextBlast = this.profile.campaignFinal ? 0.10 : 0.14;
        const index = this.blastIndex++;
        const angle = index * 2.31;
        const rx = Math.cos(angle) * this.w * (0.18 + (index % 3) * 0.10);
        const ry = Math.sin(angle * 1.37) * this.h * 0.32;
        explode(this.x + this.w / 2 + rx, this.y + this.h / 2 + ry, this.profile.accent, 26, false, 2);
      }
      if (this.life <= 0.34 && !this.finalBlast) {
        this.finalBlast = true;
        explode(this.x + this.w / 2, this.y + this.h / 2, this.profile.accent, 82, false, 3);
      }
      if (this.life <= 0) this.dead = true;
    }

    draw() {
      const t = 1 - this.life / this.maxLife;
      ctx.save();
      ctx.translate(this.x + this.w / 2, this.y + this.h / 2 + t * 58);
      ctx.rotate(Math.sin(t * 16) * 0.08 + t * 0.18);
      ctx.scale(1 - t * 0.18, 1 - t * 0.06);
      ctx.globalAlpha = clamp(1 - t * 0.82, 0, 1);
      drawBossForm(this.profile, this.phase, false);
      ctx.restore();
    }
  }

  class BossVictoryScene {
    constructor(boss) {
      this.x = boss.x;
      this.y = boss.y;
      this.w = boss.w;
      this.h = boss.h;
      this.name = boss.name;
      this.profile = boss.profile;
      this.major = Number.isInteger(boss.profile.levelEnd) || boss.profile.campaignFinal;
      this.final = Boolean(boss.profile.campaignFinal);
      this.duration = this.final ? 6.4 : this.major ? 5.0 : 3.8;
      this.life = this.duration;
      this.elapsed = 0;
      this.dead = false;
      this.nextBurst = 0.32;
      this.nextFirework = 1.05;
      this.flyoverX = cameraX - 360;
      this.flyoverY = cameraY + 120;
      this.medalSpin = 0;
      this.bossScore = boss.score;
      this.bonus = Math.round(boss.score * (this.major ? 0.5 : 0.25));
      bannerUntil = 0;
      bannerText = "";

      levelState = "victory";
      enemyBullets = [];
      bullets = [];
      for (const player of players) {
        if (player.dead) continue;
        player.entryTimer = Math.max(player.entryTimer, this.duration);
        player.victoryPose = this.duration;
        player.invuln = Math.max(player.invuln, this.duration);
        player.score += this.bonus;
      }
      audio.victoryFanfare(this.major, this.final);
    }

    update(dt) {
      this.elapsed += dt;
      this.life -= dt;
      this.medalSpin += dt * 3.4;
      this.flyoverX += (this.final ? 470 : 390) * dt;

      this.nextBurst -= dt;
      if (this.nextBurst <= 0 && this.life > 0.7) {
        this.nextBurst = this.final ? 0.13 : this.major ? 0.18 : 0.26;
        const angle = this.elapsed * 4.7 + this.nextBurst * 13;
        const x = this.x + this.w / 2 + Math.cos(angle) * this.w * 0.48;
        const y = this.y + this.h / 2 + Math.sin(angle * 1.37) * this.h * 0.42;
        blastEffects.push(new BlastEffect(x, y, this.profile.accent, chance(this.major ? 0.45 : 0.22) ? 2 : 1));
        burst(x, y, chance(0.5) ? "#fff36d" : this.profile.accent, this.major ? 13 : 8, 190);
      }

      this.nextFirework -= dt;
      if (this.elapsed > 1.1 && this.nextFirework <= 0) {
        this.nextFirework = this.final ? 0.24 : this.major ? 0.38 : 0.55;
        const x = cameraX + visibleWorldW * rand(0.18, 0.82);
        const y = cameraY + visibleWorldH * rand(0.15, 0.42);
        blastEffects.push(new BlastEffect(x, y, chance(0.5) ? "#63e5ff" : "#fff36d", this.major ? 2 : 1));
        audio.toneAt(rand(330, 620), 0.08, "square", 0.045, rand(-80, 120));
      }

      if (this.life <= 0) {
        this.dead = true;
        for (const player of players) {
          player.entryTimer = 0;
          player.victoryPose = 0;
        }
        if (Number.isInteger(this.profile.levelEnd) && !this.final) {
          startLevelTransition(this.profile.levelEnd + 1);
        } else {
          levelState = "onfoot";
        }
      }
    }

    drawWorld() {
      const craftY = this.flyoverY + Math.sin(this.elapsed * 4) * 7;
      ctx.save();
      ctx.translate(this.flyoverX, craftY);
      ctx.fillStyle = "#17243a";
      ctx.fillRect(-95, -18, 190, 36);
      ctx.fillStyle = "#314b70";
      ctx.fillRect(-52, -36, 104, 72);
      ctx.fillStyle = "#63e5ff";
      ctx.fillRect(-25, -42, 50, 9);
      ctx.fillStyle = "#fff36d";
      ctx.fillRect(88, -7, 22, 14);
      ctx.fillStyle = "#ff7848";
      ctx.fillRect(-116, -6, 23, 12);
      ctx.restore();
    }

    drawOverlay() {
      const width = screenW;
      const height = screenH;
      const reveal = clamp(this.elapsed / 0.45, 0, 1);
      const exit = clamp(this.life / 0.45, 0, 1);
      const alpha = Math.min(reveal, exit);
      const victoryTitle = this.final ? "MISSION COMPLETE" : this.major ? "GUARDIAN DOWN" : "BOSS DOWN";

      ctx.save();
      ctx.globalAlpha = alpha;
      const panelW = Math.min(width * 0.76, 470);
      const panelH = 92;
      const x = width / 2 - panelW / 2;
      const y = Math.max(16 + safeTop, height * 0.12);
      drawPixelPanel(x, y, panelW, panelH, "rgba(5,13,23,.94)", this.final ? "#fff36d" : this.profile.accent, true);

      drawUiIcon(this.final ? "special" : "check", x + 35, y + 33, 23, this.final ? "#fff36d" : this.profile.accent, 3);
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillStyle = this.final ? "#fff36d" : "#f4f1d0";
      ctx.font = `900 ${fitCanvasText(victoryTitle, panelW - 92, 22, 14)}px ${UI_FONT}`;
      ctx.fillText(victoryTitle, x + 67, y + 25);
      ctx.fillStyle = "#9db3bd";
      ctx.font = `800 ${fitCanvasText(this.name, panelW - 92, 10, 8)}px ${UI_FONT}`;
      ctx.fillText(this.name, x + 67, y + 46);

      const metricY = y + 70;
      drawUiIcon("score", x + 70, metricY, 9, "#63e5ff", 1.5);
      ctx.fillStyle = "#dce8ee";
      ctx.font = `800 9px ${UI_FONT}`;
      ctx.fillText(`+${this.bossScore}`, x + 81, metricY + 0.5);
      drawUiIcon("special", x + 150, metricY, 9, "#fff36d", 1.4);
      ctx.fillStyle = "#fff36d";
      ctx.fillText(`+${this.bonus}`, x + 161, metricY + 0.5);

      if (this.major && this.elapsed > 1.15) {
        const medalY = height * 0.58;
        const radius = Math.max(20, Math.min(38, width * 0.038));
        ctx.save();
        ctx.translate(width / 2, medalY);
        ctx.rotate(Math.sin(this.medalSpin) * 0.09);
        ctx.strokeStyle = this.profile.accent;
        ctx.lineWidth = Math.max(3, radius * 0.12);
        ctx.strokeRect(-radius, -radius, radius * 2, radius * 2);
        ctx.rotate(Math.PI / 4);
        ctx.strokeStyle = "#fff36d";
        ctx.strokeRect(-radius * 0.62, -radius * 0.62, radius * 1.24, radius * 1.24);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(-radius * 0.10, -radius * 0.55, radius * 0.20, radius * 1.10);
        ctx.fillRect(-radius * 0.55, -radius * 0.10, radius * 1.10, radius * 0.20);
        ctx.restore();
      }
      ctx.restore();
    }
  }

  class LaunchPad extends Entity {
    constructor(x, style = "neon", force = 930) {
      const y = terrainSurfaceY(x);
      super(x - 42, y - 20, 84, 20);
      this.style = style;
      this.force = force;
      this.cooldown = 0;
      this.phase = rand(0, Math.PI * 2);
    }

    update(dt) {
      this.y = terrainSurfaceY(this.cx) - this.h;
      this.cooldown = Math.max(0, this.cooldown - dt);
      for (const player of players) {
        if (player.dead || this.cooldown > 0 || player.vy < -40) continue;
        const feet = player.y + player.h;
        if (player.x + player.w > this.x && player.x < this.x + this.w && feet >= this.y - 8 && feet <= this.y + 28) {
          player.y = this.y - player.h - 2;
          player.vy = -this.force;
          player.onGround = false;
          player.supportPlatform = null;
          player.jumpCount = 1;
          this.cooldown = 0.45;
          const color = this.style === "bio" ? "#9dff5d" : this.style === "chrono" ? "#ff8df4" : "#63e5ff";
          burst(player.cx, this.y, color, 15, 225);
          audio.tone(this.style === "bio" ? 240 : 360, 0.16, "square", 0.12, 260);
        }
      }
    }

    draw() {
      const color = this.style === "bio" ? "#9dff5d" : this.style === "chrono" ? "#ff8df4" : "#63e5ff";
      const pulse = Math.floor((Math.sin(time * 7 + this.phase) + 1) * 2);
      ctx.fillStyle = "#111723"; ctx.fillRect(this.x, this.y, this.w, this.h);
      ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.strokeRect(this.x, this.y, this.w, this.h);
      ctx.fillStyle = color;
      for (let i = 0; i < 3; i++) {
        const x = this.x + 12 + i * 24;
        ctx.beginPath(); ctx.moveTo(x, this.y + 13); ctx.lineTo(x + 8, this.y + 4 - pulse); ctx.lineTo(x + 16, this.y + 13); ctx.closePath(); ctx.fill();
      }
      if (this.style === "bio") {
        ctx.fillStyle = "#315d2f"; ctx.beginPath(); ctx.ellipse(this.cx, this.y + 2, 38, 16, 0, Math.PI, Math.PI * 2); ctx.fill();
      }
    }
  }

  class PortalGate extends Entity {
    constructor(x, color = "#ff8df4") {
      const y = terrainSurfaceY(x) - 118;
      super(x - 36, y, 72, 118);
      this.color = color;
      this.partner = null;
      this.phase = rand(0, Math.PI * 2);
    }

    link(partner) { this.partner = partner; partner.partner = this; }

    update() {
      this.y = terrainSurfaceY(this.cx) - this.h;
    }

    canActivate(player) {
      if (!this.partner || player.dead) return false;
      const horizontalOverlap = player.x + player.w > this.x + 6 && player.x < this.x + this.w - 6;
      const feet = player.y + player.h;
      const floorY = this.y + this.h;
      const atPortalBase = feet >= floorY - 28 && feet <= floorY + 16;
      return horizontalOverlap && atPortalBase && player.onGround;
    }

    transport(player) {
      if (!this.partner || player.dead || portalWarp) return false;

      const direction = this.partner.cx >= this.cx ? 1 : -1;
      const exitMargin = 34;
      const travelers = players
        .filter(member => !member.dead && !member.portalTransit)
        .sort((a, b) => a.index - b.index)
        .map(member => {
          member.setCrouching(false);
          const squadOffset = direction * member.index * (member.w + 14);
          const exitX = (direction > 0
            ? this.partner.x + this.partner.w + exitMargin
            : this.partner.x - member.w - exitMargin) + squadOffset;
          const exitCenterX = exitX + member.w / 2;
          const exitSurfaceY = terrainSurfaceY(exitCenterX);

          member.vx = 0;
          member.vy = 0;
          member.smashing = false;
          member.supportPlatform = null;
          member.dropPlatform = null;
          member.portalCooldown = 1.1;
          member.portalContact = false;
          member.portalTransit = true;
          member.portalHidden = 0;
          member.invuln = Math.max(member.invuln, 1.4);

          return {
            player: member,
            exitX,
            exitY: exitSurfaceY - member.h,
            exitSurfaceY
          };
        });

      if (!travelers.length) return false;

      const exitCenterX = travelers.reduce(
        (sum, traveler) => sum + traveler.exitX + traveler.player.w / 2,
        0
      ) / travelers.length;
      const exitSurfaceY = terrainSurfaceY(exitCenterX);
      const maxCameraX = Math.max(0, LEVEL_W - visibleWorldW);
      const endCameraX = clamp(exitCenterX - visibleWorldW * 0.43, 0, maxCameraX);
      const endCameraY = clampCameraY(
        exitSurfaceY - visibleWorldH * cameraGroundAnchor()
      );

      enemyBullets = [];
      portalArrivalGrace = 0;
      portalWarp = {
        phase: "enter",
        phaseTime: 0,
        travelers,
        source: this,
        destination: this.partner,
        direction,
        startCameraX: cameraX,
        startCameraY: cameraY,
        endCameraX,
        endCameraY,
        color: this.partner.color
      };

      audio.toneAt(220, 0.13, "square", 0.08, 180);
      return true;
    }

    draw() {
      const spin = time * 2.2 + this.phase;
      ctx.save(); ctx.translate(this.cx, this.cy);
      ctx.strokeStyle = this.color; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.ellipse(0, 0, 31, 54, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 0.55; ctx.lineWidth = 4;
      for (let i = 0; i < 4; i++) {
        const y = Math.sin(spin + i * 1.5) * 35;
        ctx.beginPath(); ctx.ellipse(0, y, 24 - Math.abs(y) * 0.25, 7, 0, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalAlpha = 1;
      drawUiIcon("down", 0, 74, 17, "#fff36d", 2.4);
      ctx.restore();
    }
  }

  class Pickup extends Entity {
    constructor(x, y, type, persistent = false) {
      super(x - 26, y - 26, 52, 52);
      this.type = type;
      this.persistent = persistent;
      this.vy = persistent ? 0 : -120;
      this.life = persistent ? Infinity : 18;
      this.phase = rand(0, Math.PI * 2);
      this.anchorY = this.y;
    }

    update(dt) {
      if (this.persistent) {
        this.y = this.anchorY + Math.sin(time * 3.2 + this.phase) * 5;
      }
      const ground = terrainSurfaceY(this.cx) - 4;
      if (!this.persistent) {
        if (this.y + this.h < ground - 0.1 || this.vy < 0) {
          this.vy += GRAVITY * 0.42 * dt;
          this.y += this.vy * dt;
        }

        if (this.y + this.h >= ground) {
          this.y = ground - this.h;
          if (Math.abs(this.vy) < 55) this.vy = 0;
          else this.vy *= -0.38;
        }
      }

      if (!this.persistent) {
        this.life -= dt;
        if (this.life <= 0) this.dead = true;
      }

      for (const player of players) {
        if (!player.dead && this.overlaps(player) && player.upgrade(this.type)) {
          this.dead = true;
          const message = this.type === "health"
            ? "+50"
            : this.type === "special"
              ? "+1 STRIKE"
              : this.name();
          showBanner(message);
          addFloatingText(this.cx, this.y - 18, message, this.color(), 16);
          impactFeedback(0.025);
          burst(this.cx, this.cy, this.color(), 12, 180);
          break;
        }
      }
    }

    color() {
      if (this.type === "health") return "#6bff91";
      if (this.type === "special") return "#ffd35c";
      if (this.type === 1) return "#66e4ff";
      if (this.type === 2) return "#ff6fcf";
      return "#ff8f52";
    }

    name() {
      if (this.type === "health") return "HEALTH";
      if (this.type === "special") return "STRIKE";
      if (this.type === 1) return "SPREAD";
      if (this.type === 2) return "RAPID";
      return "ROCKET";
    }

    draw() {
      if (!this.persistent && this.life < 4 && Math.floor(this.life * 9) % 2 === 0) return;
      const pulse = 1 + Math.sin(time * 6 + this.phase) * 0.07;
      const color = this.color();
      const clarityScale = portrait ? 1.35 : 1;
      ctx.save();
      ctx.translate(this.cx, this.cy);
      ctx.scale(pulse * clarityScale, pulse * clarityScale);

      ctx.globalAlpha = 0.20;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(0, 0, 31, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      if (this.type === "health") {
        ctx.fillStyle = color;
        roundRect(-21, -21, 42, 42, 9);
        ctx.fill();
        ctx.fillStyle = "#092117";
        ctx.fillRect(-5, -14, 10, 28);
        ctx.fillRect(-14, -5, 28, 10);
      } else if (this.type === "special") {
        ctx.fillStyle = color;
        ctx.fillRect(-25, -8, 50, 16);
        ctx.fillRect(-10, -21, 24, 13);
        ctx.fillRect(-18, 8, 12, 10);
        ctx.fillRect(8, 8, 12, 10);
        ctx.fillStyle = "#2b2107";
        ctx.fillRect(-18, -3, 37, 6);
        ctx.fillRect(10, -14, 9, 6);
        ctx.fillStyle = "#63e5ff";
        ctx.fillRect(-5, -16, 12, 5);
      } else if (this.type === 1) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(-24, 20);
        ctx.lineTo(0, -25);
        ctx.lineTo(24, 20);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#09202a";
        for (const x of [-9, 0, 9]) {
          ctx.beginPath();
          ctx.arc(x, 7 - Math.abs(x) * 0.35, 3.5, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (this.type === 2) {
        ctx.fillStyle = color;
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const angle = Math.PI / 3 * i - Math.PI / 6;
          const x = Math.cos(angle) * 24;
          const y = Math.sin(angle) * 24;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#2a0b22";
        ctx.beginPath();
        ctx.moveTo(5, -17);
        ctx.lineTo(-8, 2);
        ctx.lineTo(1, 2);
        ctx.lineTo(-5, 18);
        ctx.lineTo(12, -4);
        ctx.lineTo(3, -4);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, -25);
        ctx.lineTo(15, -8);
        ctx.lineTo(15, 15);
        ctx.lineTo(0, 24);
        ctx.lineTo(-15, 15);
        ctx.lineTo(-15, -8);
        ctx.closePath();
        ctx.fill();
        ctx.save();
        ctx.rotate(-Math.PI / 4);
        ctx.fillStyle = "#301509";
        roundRect(-3, -14, 8, 25, 3);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(1, -19);
        ctx.lineTo(7, -10);
        ctx.lineTo(-5, -10);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      ctx.restore();
    }
  }

  class Particle extends Entity {
    constructor(x, y, color, speed) {
      const size = rand(3, 8);
      super(x, y, size, size);
      const angle = rand(0, Math.PI * 2);
      this.vx = Math.cos(angle) * rand(speed * 0.35, speed);
      this.vy = Math.sin(angle) * rand(speed * 0.35, speed);
      this.life = rand(0.25, 0.68);
      this.maxLife = this.life;
      this.color = color;
      this.gravity = rand(280, 760);
    }

    update(dt) {
      this.vy += this.gravity * dt;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.life -= dt;
      if (this.life <= 0) this.dead = true;
    }

    draw() {
      ctx.globalAlpha = clamp(this.life / this.maxLife, 0, 1);
      ctx.fillStyle = this.color;
      ctx.fillRect(this.x, this.y, this.w, this.h);
      ctx.globalAlpha = 1;
    }
  }

  class FloatingText {
    constructor(x, y, text, color, size) {
      this.x = x;
      this.y = y;
      this.text = text;
      this.color = color;
      this.size = size;
      this.life = 0.85;
      this.maxLife = this.life;

      this.y -= 42 * dt;

  class FallingDebris extends Entity {
    constructor(x, y, size = 34, telegraphed = true) {
      super(x - size / 2, y, size, size);
      this.telegraphTimer = telegraphed ? 0.9 : 0.35;
      this.vy = 0;
      this.hit = false;
      this.life = 5;
    }

    update(dt) {
      this.life -= dt;
      if (this.life <= 0) {
        this.dead = true;
        return;
      }

      if (this.telegraphTimer > 0) {
        this.telegraphTimer -= dt;
        return;
      }

      this.vy += GRAVITY * 0.72 * dt;
      this.y += this.vy * dt;

      for (const player of players) {
        if (!player.dead && !this.hit && this.overlaps(player)) {
          this.hit = true;
          audio.impact(1.15, "metal");
          player.hit(20);
          this.dead = true;
          burst(this.cx, this.cy, "#77706a", 12, 180);
          return;
        }
      }

      const groundY = terrainSurfaceY(this.cx);
      if (this.y + this.h >= groundY) {
        this.dead = true;
        audio.impact(clamp(this.w / 30, 0.8, 1.7), "stone");
        burst(this.cx, groundY - 6, "#77706a", 10, 145);
      }
    }

    draw() {
      if (this.telegraphTimer > 0) {
        ctx.globalAlpha = 0.35 + Math.sin(time * 18) * 0.15;
        ctx.fillStyle = "#ff4f46";
        ctx.beginPath();
        ctx.ellipse(this.cx, terrainSurfaceY(this.cx) - 5, this.w * 0.8, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        return;
      }

      ctx.fillStyle = "#77706a";
      ctx.save();
      ctx.translate(this.cx, this.cy);
      ctx.rotate(time * 2.5 + this.x);
      ctx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
      ctx.restore();
    }
  }

  class Hazard extends Entity {
    constructor(type, x, width = 55) {
      super(x, terrainSurfaceY(x + width / 2) - 24, width, 24);
      this.type = type;
      this.timer = (type === "flame" || type === "plasma" || type === "acid" || type === "laser") ? rand(0, 1.2) : 0;
      this.active = type === "mine" || type === "saw";
      this.warning = false;
      this.baseY = terrainSurfaceY(this.cx);
      this.phase = rand(0, Math.PI * 2);
    }

    update(dt) {
      this.baseY = terrainSurfaceY(this.cx);
      if (this.type === "mine") {
        this.y = this.baseY - 28;
        this.h = 28;
        return;
      }
      if (this.type === "saw") {
        this.y = this.baseY - 48;
        this.h = 48;
        this.active = true;
        return;
      }

      const cycle = this.type === "laser" ? 3.45 : this.type === "acid" ? 3.7 : 4.0;
      this.timer = (this.timer + dt) % cycle;
      this.warning = this.timer >= cycle * 0.38 && this.timer < cycle * 0.60;
      this.active = this.timer >= cycle * 0.60 && this.timer < cycle * 0.82;

      if (this.type === "laser") {
        this.y = this.baseY - 72;
        this.h = 18;
      } else {
        this.y = this.active ? this.baseY - 138 : this.baseY - 22;
        this.h = this.active ? 138 : 22;
      }
    }

    isDangerous() {
      return this.type === "mine" ? !this.dead : this.type === "saw" ? true : this.active;
    }

    damagePlayer(player) {
      if (this.type === "mine") {
        this.dead = true;
        explode(this.cx, this.baseY - 10, "#ff6d43", 22);
        player.hit(22);
      } else {
        player.hit(this.type === "saw" ? 20 : this.type === "laser" ? 18 : this.type === "acid" ? 18 : this.type === "plasma" ? 17 : 15);
      }
    }

    dangerColor() {
      if (this.type === "laser") return "#ff5ed7";
      if (this.type === "plasma") return "#b95cff";
      if (this.type === "acid") return "#8dff5d";
      if (this.type === "saw") return "#ff6b55";
      return "#ff5a43";
    }

    drawDangerBadge(y, label = "!") {
      const pulse = 1 + Math.sin(time * 8 + this.phase) * 0.08;
      ctx.save();
      ctx.translate(this.cx, y);
      ctx.scale(pulse, pulse);
      ctx.fillStyle = "#190609";
      ctx.strokeStyle = this.dangerColor();
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, -20);
      ctx.lineTo(22, 18);
      ctx.lineTo(-22, 18);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#fff36d";
      ctx.font = `900 24px ${UI_FONT}`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(label, 0, 5);
      ctx.restore();
    }

    drawWarningBase(height = 22) {
      const color = this.dangerColor();
      ctx.fillStyle = "#241014";
      ctx.fillRect(this.x, this.baseY - height, this.w, height);
      ctx.strokeStyle = color;
      ctx.lineWidth = 4;
      ctx.strokeRect(this.x, this.baseY - height, this.w, height);
      for (let x = this.x - height; x < this.x + this.w + height; x += 18) {
        ctx.fillStyle = (Math.floor((x - this.x) / 18) & 1) ? color : "#ffd34d";
        ctx.beginPath();
        ctx.moveTo(x, this.baseY - height);
        ctx.lineTo(x + 10, this.baseY - height);
        ctx.lineTo(x + height, this.baseY);
        ctx.lineTo(x + height - 10, this.baseY);
        ctx.closePath();
        ctx.fill();
      }
    }

    draw() {
      if (this.dead) return;
      const color = this.dangerColor();

      if (this.type === "mine") {
        this.drawWarningBase(18);
        ctx.fillStyle = "#4a2023";
        ctx.strokeStyle = "#ff5a43";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(this.x + 3, this.baseY - 2);
        ctx.lineTo(this.x + 12, this.baseY - 27);
        ctx.lineTo(this.x + 22, this.baseY - 2);
        ctx.lineTo(this.x + 32, this.baseY - 27);
        ctx.lineTo(this.x + 43, this.baseY - 2);
        ctx.lineTo(this.x + this.w - 4, this.baseY - 27);
        ctx.lineTo(this.x + this.w - 1, this.baseY - 2);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = Math.floor(time * 8) % 2 ? "#fff36d" : "#ff4f46";
        ctx.fillRect(this.cx - 6, this.baseY - 23, 12, 8);
        this.drawDangerBadge(this.baseY - 55, "!");
        return;
      }

      if (this.type === "saw") {
        this.drawWarningBase(18);
        ctx.save();
        ctx.translate(this.cx, this.baseY - 25);
        ctx.rotate(time * 7 + this.phase);
        ctx.fillStyle = "#4c2526";
        ctx.strokeStyle = color;
        ctx.lineWidth = 4;
        ctx.beginPath();
        for (let i = 0; i < 16; i++) {
          const angle = i * Math.PI / 8;
          const radius = i % 2 ? 21 : 34;
          const x = Math.cos(angle) * radius;
          const y = Math.sin(angle) * radius;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#fff36d";
        ctx.fillRect(-7, -7, 14, 14);
        ctx.restore();
        this.drawDangerBadge(this.baseY - 76, "!");
        return;
      }

      if (this.type === "laser") {
        this.drawWarningBase(22);
        ctx.fillStyle = "#3b2442";
        ctx.strokeStyle = color;
        ctx.lineWidth = 4;
        ctx.fillRect(this.x - 10, this.baseY - 78, 18, 78);
        ctx.fillRect(this.x + this.w - 8, this.baseY - 78, 18, 78);
        ctx.strokeRect(this.x - 10, this.baseY - 78, 18, 78);
        ctx.strokeRect(this.x + this.w - 8, this.baseY - 78, 18, 78);

        const beamAlpha = this.active ? 1 : this.warning ? 0.62 + Math.sin(time * 22) * 0.24 : 0.20;
        ctx.globalAlpha = beamAlpha;
        ctx.fillStyle = color;
        ctx.fillRect(this.x, this.baseY - 72, this.w, this.active ? 18 : 5);
        if (this.active) {
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(this.x, this.baseY - 66, this.w, 5);
        }
        ctx.globalAlpha = 1;
        this.drawDangerBadge(this.baseY - 112, "!");
        return;
      }

      this.drawWarningBase(22);
      this.drawDangerBadge(this.baseY - 64, "!");

      if (this.warning && !this.active) {
        ctx.globalAlpha = 0.48 + Math.sin(time * 20) * 0.24;
        ctx.fillStyle = color;
        ctx.fillRect(this.x + 8, this.baseY - 34, this.w - 16, 8);
        ctx.globalAlpha = 1;
      }

      if (this.active) {
        const flicker = Math.floor(time * 15 + this.x) % 3;
        ctx.fillStyle = this.type === "plasma" ? "#6d2fd1" : this.type === "acid" ? "#2d7a35" : "#d9342b";
        ctx.fillRect(this.x + 4, this.y + 34 + flicker * 5, this.w - 8, this.baseY - this.y - 34 - flicker * 5);
        ctx.fillStyle = this.type === "plasma" ? "#b95cff" : this.type === "acid" ? "#8dff5d" : "#ff8a2b";
        ctx.fillRect(this.x + 13, this.y + 16 - flicker * 4, this.w - 26, this.baseY - this.y - 16 + flicker * 4);
        ctx.fillStyle = this.type === "plasma" ? "#f0c8ff" : this.type === "acid" ? "#e3ffb8" : "#ffe05a";
        ctx.fillRect(this.cx - 7, this.y + flicker * 6, 14, this.baseY - this.y - 18);
      }
    }
  }

  class Platform {
    constructor(x, y, w, collapsible = false, motion = null) {
      this.x = x;
      this.y = y;
      this.baseX = x;
      this.baseY = y;
      this.prevX = x;
      this.prevY = y;
      this.dx = 0;
      this.dy = 0;
      this.w = w;
      this.h = 20;
      this.collapsible = collapsible;
      this.motion = motion;
      this.dead = false;
      this.triggered = false;
      this.collapseTimer = 0;
      this.respawnTimer = 0;
    }

    stepOn() {
      if (!this.collapsible || this.dead || this.triggered) return;
      this.triggered = true;
      this.collapseTimer = 1.15;
    }

    update(dt) {
      this.prevX = this.x;
      this.prevY = this.y;

      if (this.motion && !this.dead) {
        const offset = Math.sin(time * this.motion.speed + (this.motion.phase || 0)) * this.motion.range;
        this.x = this.baseX + (this.motion.axis === "x" ? offset : 0);
        this.y = this.baseY + (this.motion.axis === "y" ? offset : 0);
      }

      this.dx = this.x - this.prevX;
      this.dy = this.y - this.prevY;

      if (this.triggered && !this.dead) {
        this.collapseTimer -= dt;
        if (this.collapseTimer <= 0) {
          this.dead = true;
          this.respawnTimer = 3.8;
          audio.crash(clamp(this.w / 150, 0.9, 1.8));
          burst(this.x + this.w / 2, this.y, "#77706a", 18, 180);
        }
      } else if (this.dead) {
        this.respawnTimer -= dt;
        if (this.respawnTimer <= 0) {
          this.dead = false;
          this.triggered = false;
        }
      }
    }
  }

  function particleLimit() {
    return isTouch ? 230 : 420;
  }

  function burst(x, y, color, count = 8, speed = 180) {
    const limit = particleLimit();
    for (let i = 0; i < count && particles.length < limit; i++) {
      particles.push(new Particle(x, y, color, speed));
    }
  }

  function explode(x, y, color, count = 22, sound = true, explicitTier = 0) {
    const tier = explicitTier || (count >= 64 ? 3 : count >= 34 ? 2 : 1);
    burst(x, y, color, count, tier >= 3 ? 520 : tier === 2 ? 440 : 380);
    blastEffects.push(new BlastEffect(x, y, color, tier));
    if (sound) {
      if (tier >= 3) audio.bossExplosion();
      else if (tier === 2) audio.bigExplosion(1.3);
      else audio.explode(1);
    }
  }

  function spawnPickup(x, y, type = null, persistent = false) {
    if (type === null) {
      const roll = Math.random();
      type = roll < 0.30 ? "health" : roll < 0.38 ? "special" : roll < 0.68 ? 1 : roll < 0.88 ? 2 : 3;
    }
    pickups.push(new Pickup(x, y, type, persistent));
  }

  function spawn(type, x, y = null) {
    enemies.push(new Enemy(type, x, y == null ? terrainSurfaceY(x) : y));
  }

  function spawnGroup(group) {
    for (const entry of group) spawn(entry[0], entry[1], entry.length > 2 ? entry[2] : null);
  }

  function spawnSurfacePickup(x, type, lift = 78, persistent = true) {
    spawnPickup(x, terrainSurfaceY(x) - lift, type, persistent);
  }

  function setupLevel() {
    setupTerrain();

    platforms = [
      // Level 1: stacked ruins, upper routes, and drop-through shortcuts
      new Platform(1450, 585, 250), new Platform(1770, 505, 245), new Platform(2090, 575, 260),
      new Platform(2750, 640, 210, true), new Platform(3060, 550, 225, true),
      new Platform(3380, 470, 235, true), new Platform(3710, 545, 250),
      new Platform(5530, 595, 245), new Platform(5850, 505, 250), new Platform(6180, 425, 245),
      new Platform(7040, 650, 235, true), new Platform(7350, 555, 235, true),
      new Platform(7670, 465, 250, true), new Platform(8010, 585, 220),

      // Level 2: long ascent, split high/low fortress routes, rail deck
      new Platform(10030, 590, 230), new Platform(10340, 495, 240), new Platform(10670, 405, 250),

  function rebuildStageWorld(index) {
    setupLevel();
    const zone = WORLD_ZONES[index];
    const minX = zone.start - 520;
    const maxX = zone.end + 520;
    const keep = entity => {
      const x = Number.isFinite(entity.x) ? entity.x : 0;
      const width = Number.isFinite(entity.w) ? entity.w : 0;
      return x + width >= minX && x <= maxX;
    };

    enemies = enemies.filter(keep);
    pickups = pickups.filter(keep);
    hazards = hazards.filter(keep);
    platforms = platforms.filter(keep);
    launchPads = launchPads.filter(keep);
    portals = portals.filter(keep);
    decorations = decorations.filter(item => item.x >= minX && item.x <= maxX);
    stars = stars.filter(item => item.x >= minX && item.x <= maxX);
    clouds = clouds.filter(item => item.x + item.w >= minX && item.x <= maxX);
  }
