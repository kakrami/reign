  function updateLevelTransition(dt) {
    if (!levelTransition) return false;
    levelTransition.timer -= dt;
    if (levelTransition.timer <= 0) {
      const nextLevel = levelTransition.nextLevel;
      levelTransition = null;
      enterCampaignLevel(nextLevel);
    }
    return true;
  }

  function startStageIntro(index, nextState, focusX, initial = false) {
    stageIntro = {
      level: index,
      nextState,
      focusX,
      duration: initial ? 2.45 : 2.15,
      timer: initial ? 2.45 : 2.15,
      goCue: false
    };
    levelState = "stage_intro";
    enemyBullets = [];
    bullets = [];
    clearControls();

    if (nextState === "vehicle" && introVehicle) {
      introVehicle.speed = 0;
      introVehicle.cruiseSpeed = introVehicle.cruiseSpeed || 165;
      for (let i = 0; i < players.length; i++) {
        players[i].x = introVehicle.x + 66 + i * 58;
        players[i].y = introVehicle.y - 63;
        players[i].vx = 0;
        players[i].vy = 0;
        players[i].onGround = true;
      }
    } else {
      for (let i = 0; i < players.length; i++) {
        const player = players[i];
        player.vx = 0;
        player.vy = 0;
        player.onGround = true;
        player.jumpCount = 0;
        player.smashing = false;
        player.setCrouching(false);
        player.y = terrainSurfaceY(player.x) - player.h;
        player.invuln = Math.max(player.invuln, stageIntro.duration + 0.7);
      }
    }

    setOpeningCamera(focusX);
  }

  function updateStageIntro(dt) {
    if (!stageIntro) return false;
    stageIntro.timer -= dt;

    if (stageIntro.nextState === "vehicle" && introVehicle) {
      for (let i = 0; i < players.length; i++) {
        players[i].x = introVehicle.x + 66 + i * 58;
        players[i].y = introVehicle.y - 63;
      }
    }

    if (!stageIntro.goCue && stageIntro.timer <= 0.58) {
      stageIntro.goCue = true;
      audio.toneAt(330, 0.08, "square", 0.09, 180);
      audio.toneAt(520, 0.12, "square", 0.08, 220, 0.07);
    }

    if (stageIntro.timer <= 0) {
      const intro = stageIntro;
      stageIntro = null;
      levelState = intro.nextState;
      if (levelState === "vehicle" && introVehicle) introVehicle.speed = introVehicle.cruiseSpeed || 165;
      for (const player of players) player.entryTimer = 0;
      clearControls();
      showBanner(levelState === "vehicle" ? "ARMORED BREACH • FIRE!" : "MOVE OUT!");
    }
    return true;
  }

  function setOpeningCamera(focusX) {
    const maxCameraX = Math.max(0, LEVEL_W - visibleWorldW);
    cameraX = clamp(focusX - visibleWorldW * 0.27, 0, maxCameraX);
    cameraTargetX = cameraX;
    const focusY = terrainSurfaceY(focusX);
    cameraY = clampCameraY(focusY - visibleWorldH * cameraGroundAnchor());
    cameraTargetY = cameraY;
  }

  function begin(twoPlayers) {
    audio.ensure();
    coop = twoPlayers;
    difficulty = DIFFICULTY_OPTIONS[menuDifficulty].value;
    const startLevel = clamp(menuLevel, 0, WORLD_ZONES.length - 1);
    const startX = startLevel === 0 ? 175 : WORLD_ZONES[startLevel].start + 180;

    players = [new Player(0, startX)];
    if (coop) players.push(new Player(1, startX + 63));

    enemies = [];
    bullets = [];
    enemyBullets = [];
    pickups = [];
    particles = [];
    floatingTexts = [];
    blastEffects = [];
    bossDeaths = [];
    victoryScene = null;
    launchPads = [];
    portals = [];
    chronoPulse = 0;
    chronoPulseClock = 0;
    portalWarp = null;
    portalArrivalGrace = 0;
    stageIntro = null;
    levelTransition = null;
    specialAttack = null;
    debris = [];
    triggered = new Set();
    activeBoss = null;
    defeatedBosses = new Set();
    campaignLevel = startLevel;
    finalWinTimer = 0;
    checkpointX = startLevel === 0 ? 1100 : startX;
    hitStop = 0;
    cameraX = 0;
    cameraY = 0;
    cameraTargetX = 0;
    cameraTargetY = 0;
    cameraHoldX = null;
    time = 0;
    running = true;
    paused = false;
    gameOver = false;
    levelState = "stage_intro";
    introVehicle = startLevel === 0
      ? { x: 90, y: GROUND_Y - 74, w: 190, h: 74, speed: 0, cruiseSpeed: 165 }
      : null;
    crashTimer = 0;

    rebuildStageWorld(startLevel);
    if (startLevel > 0) prepareDirectLevelStart(startLevel, startX);

    menuResult = "";
    clearControls();
    resize();

    if (startLevel > 0) {
      audio.levelStinger(startLevel);
      addFloatingText(startX + 120, terrainSurfaceY(startX + 120) - 150, `LOADOUT • ${weaponName(DIRECT_START_LOADOUTS[startLevel])}`, "#fff36d", 20);
    }
    startStageIntro(startLevel, startLevel === 0 ? "vehicle" : "onfoot", startX, true);

    audio.startMusic(startLevel);
    last = performance.now();
    accumulator = 0;
  }

  function startCrash() {
    if (levelState !== "vehicle" || !introVehicle) return;
    levelState = "crash";
    crashTimer = 0.9;
    cameraHoldX = cameraX;
    introVehicle.speed = 0;
    audio.crash(2.0);
    explode(introVehicle.x + 130, GROUND_Y - 45, "#ff6a42", 42);
    showBanner("BAIL OUT");
  }

  function completeCrash() {
    const landingX = introVehicle ? introVehicle.x + 155 : 1060;
    levelState = "onfoot";
    cameraHoldX = null;
    enemyBullets = [];

    for (let i = 0; i < players.length; i++) {
      const player = players[i];
      player.x = landingX + i * 62;
      player.y = terrainSurfaceY(player.x) - 155 - i * 14;
      player.vx = 0;
      player.vy = -245 - i * 25;
      player.onGround = false;
      player.jumpCount = 1;
      player.entryTimer = 0.28;
      player.invuln = 2.0;
      burst(player.cx, player.cy + 30, player.color, 8, 145);
    }

    introVehicle = null;
    checkpointX = Math.round(landingX);
    cameraTargetX = Math.max(cameraTargetX, landingX - visibleWorldW * 0.34);
  }

  function enterCampaignLevel(index) {
    campaignLevel = index;
    const entryX = WORLD_ZONES[index].start + 180;
    checkpointX = entryX;
    levelState = "stage_intro";
    introVehicle = null;
    activeBoss = null;
    enemyBullets = [];
    bullets = [];
    particles = [];
    floatingTexts = [];
    blastEffects = [];
    bossDeaths = [];
    victoryScene = null;
    specialAttack = null;
    debris = [];
    portalWarp = null;
    portalArrivalGrace = 0;
    chronoPulse = 0;
    chronoPulseClock = 0;
    triggered = new Set();

    rebuildStageWorld(index);
    markScriptsBeforeLevel(index);

    const bonusLife = index === 3 || index === 5;
    let slot = 0;
    for (const player of players) {
      player.dead = false;
      player.respawnTimer = 0;
      player.lives = Math.max(1, player.lives);
      player.x = entryX + slot * 68;
      player.y = terrainSurfaceY(player.x) - player.standingHeight;
      player.h = player.standingHeight;
      player.vx = 0;
      player.vy = 0;
      player.onGround = true;
      player.jumpCount = 0;
      player.smashing = false;
      player.crouching = false;
      player.health = player.maxHealth;
      player.specials = Math.min(3, player.specials + 1);
      if (bonusLife) player.lives = Math.min(5, player.lives + 1);
      player.invuln = 3.0;
      player.entryTimer = 0;
      player.victoryPose = 0;
      slot++;
    }

    setOpeningCamera(entryX);
    audio.levelStinger(index);
    audio.startMusic(index);
    startStageIntro(index, "onfoot", entryX, false);
  }

  function startRival(stage, x, finalEncounter = false) {
    const key = finalEncounter ? "reignHunterFinal" : `reignHunter${stage}`;
    if (activeBoss || defeatedBosses.has(key)) return false;
    const gadget = RIVAL_GADGETS[clamp(stage | 0, 0, RIVAL_GADGETS.length - 1)];
    showBanner(finalEncounter ? "HUNTER • FINAL RIG" : `HUNTER • ${gadget.label}`);
    activeBoss = new RivalHunter(stage, x, finalEncounter);
    return true;
  }

  function startBoss(key, x) {
    if (activeBoss || defeatedBosses.has(key)) return false;
    const profile = BOSS_PROFILES[key];
    showBanner(`WARNING • ${profile.name}`);
    activeBoss = new StageBoss(key, x);
    return true;
  }

  function runScripts() {
    const lead = Math.max(leadingPlayerX(true), introVehicle ? introVehicle.x : 0);

    for (let i = 0; i < scripts.length; i++) {
      if (lead >= scripts[i][0] && !triggered.has(i)) {
        const result = scripts[i][1]();
        if (result !== false) triggered.add(i);
      }
    }
  }

  function resolveEnemySpacing() {
    enemySpacingScratch.length = 0;
    const minX = cameraX - 180;
    const maxX = cameraX + visibleWorldW + 180;
    for (const enemy of enemies) {
      if (!enemy.dead && enemy.grounded && enemy.x + enemy.w >= minX && enemy.x <= maxX) {
        enemySpacingScratch.push(enemy);
      }
    }
    enemySpacingScratch.sort((a, b) => a.x - b.x);

    for (let i = 1; i < enemySpacingScratch.length; i++) {
      const left = enemySpacingScratch[i - 1];
      const right = enemySpacingScratch[i];
      if (left.y + left.h <= right.y + 8 || right.y + right.h <= left.y + 8) continue;

      const gap = right.x - (left.x + left.w);
      if (gap >= 10) continue;
      const correction = 10 - gap;

      if (left.type === "turret" && right.type !== "turret") {
        right.x += correction;
      } else if (right.type === "turret" && left.type !== "turret") {
        left.x -= correction;
      } else if (left.type !== "turret" || right.type !== "turret") {
        left.x -= correction * 0.5;
        right.x += correction * 0.5;
      }

      left.x = clamp(left.x, 0, LEVEL_W - left.w);
      right.x = clamp(right.x, 0, LEVEL_W - right.w);
      left.y = terrainSurfaceY(left.cx) - left.h;
      right.y = terrainSurfaceY(right.cx) - right.h;
    }
  }


  function portalDownForPlayer(player) {
    return player.index === 0
      ? (touchStick.down || pressed("KeyS"))
      : pressed("ArrowDown");
  }

  function updatePortalWarp(dt) {
    if (!portalWarp) return false;

    const warp = portalWarp;
    warp.phaseTime += dt;
    enemyBullets = [];

    if (warp.phase === "enter") {
      const hidden = Math.floor(warp.phaseTime / 0.055) % 2 === 0 ? 0 : 999;
      for (const traveler of warp.travelers) traveler.player.portalHidden = hidden;

      if (warp.phaseTime >= 0.22) {
        for (const traveler of warp.travelers) traveler.player.portalHidden = 999;
        warp.phase = "pan";
        warp.phaseTime = 0;
        audio.toneAt(360, 0.10, "square", 0.07, 220);
      }
    } else if (warp.phase === "pan") {
      const raw = clamp(warp.phaseTime / 0.72, 0, 1);
      const eased = raw * raw * (3 - 2 * raw);
      cameraX = warp.startCameraX + (warp.endCameraX - warp.startCameraX) * eased;
      cameraY = warp.startCameraY + (warp.endCameraY - warp.startCameraY) * eased;
      cameraTargetX = cameraX;
      cameraTargetY = cameraY;

      if (raw >= 1) {
        for (const traveler of warp.travelers) {
          const member = traveler.player;
          member.x = traveler.exitX;
          member.y = traveler.exitY;
          member.vx = 0;
          member.vy = 0;
          member.onGround = true;
          member.jumpCount = 0;
          member.facing = warp.direction;
          member.aimX = warp.direction;
          member.aimY = 0;
        }
        warp.phase = "exit";
        warp.phaseTime = 0;
        burst(warp.destination.cx, warp.destination.cy, warp.color, 10, 115);
        audio.toneAt(520, 0.12, "square", 0.08, -210);
      }
    } else {
      cameraX = warp.endCameraX;
      cameraY = warp.endCameraY;
      cameraTargetX = cameraX;
      cameraTargetY = cameraY;
      const hidden = Math.floor(warp.phaseTime / 0.065) % 2 === 0 ? 999 : 0;
      for (const traveler of warp.travelers) traveler.player.portalHidden = hidden;

      if (warp.phaseTime >= 0.30) {
        for (const traveler of warp.travelers) {
          const member = traveler.player;
          member.portalHidden = 0;
          member.portalTransit = false;
          member.entryTimer = Math.max(member.entryTimer, 0.28);
          member.invuln = Math.max(member.invuln, 1.25);
          member.portalCooldown = 0.85;
        }
        portalArrivalGrace = 0.80;
        enemyBullets = [];
        portalWarp = null;
      }
    }

    return true;
  }

  function updatePortals(dt) {
    for (const portal of portals) portal.update(dt);
    if (portalWarp) return;

    for (const player of players) {
      player.portalCooldown = Math.max(0, (player.portalCooldown || 0) - dt);
      if (player.dead || player.portalTransit) {
        player.portalContact = false;
        player.portalDownHeld = false;
        continue;
      }

      const down = portalDownForPlayer(player);
      const touching = portals.find(portal => portal.canActivate(player)) || null;
      const pressedNow = down && !player.portalDownHeld;
      const enteredWhileHeld = down && Boolean(touching) && !player.portalContact;

      if (touching && player.portalCooldown <= 0 && (pressedNow || enteredWhileHeld)) {
        if (touching.transport(player)) break;
      }

      player.portalContact = portals.some(portal => portal.canActivate(player));
      player.portalDownHeld = down;
    }
  }

  function updateLevelMechanics(dt) {
    for (const pad of launchPads) pad.update(dt);
    updatePortals(dt);

    if (campaignLevel === 5 && levelState === "onfoot" && !specialAttack) {
      chronoPulseClock += dt;
      if (chronoPulseClock >= 7.5) {
        chronoPulseClock = 0;
        chronoPulse = 1.35;
        addFloatingText(cameraX + visibleWorldW * 0.5, cameraY + 150, "TIME DILATION", "#ff8df4", 20);
        audio.tone(92, 0.34, "sawtooth", 0.10, 260);
      }
      chronoPulse = Math.max(0, chronoPulse - dt);
    } else {
      chronoPulse = Math.max(0, chronoPulse - dt * 2);
      if (campaignLevel !== 5) chronoPulseClock = 0;
    }
  }

  function update(dt) {
    time += dt;
    updateWorldView(dt);

    if (levelTransition) {
      updateLevelTransition(dt);
      updateHud();
      return;
    }

    if (stageIntro) {
      updateStageIntro(dt);
      for (const particle of particles) particle.update(dt);
      for (const text of floatingTexts) text.update(dt);
      pruneDead(particles);
      pruneDead(floatingTexts);
      updateCamera(dt);
      updateHud();
      return;
    }

    if (portalWarp) {
      updatePortalWarp(dt);
      for (const particle of particles) particle.update(dt);
      for (const text of floatingTexts) text.update(dt);
      pruneDead(particles);
      pruneDead(floatingTexts);
      updateHud();
      return;
    }

    portalArrivalGrace = Math.max(0, portalArrivalGrace - dt);

    if (levelState === "vehicle" && introVehicle) {
      introVehicle.x += introVehicle.speed * dt;
    }

    if (levelState === "crash") {
      crashTimer -= dt;
      if (crashTimer <= 0) completeCrash();
    }

    const cinematic = Boolean(victoryScene);
    if (!cinematic) runScripts();
    if (stageIntro) {
      updateCamera(dt);
      updateHud();
      return;
    }

    for (const platform of platforms) platform.update(dt);
    if (!cinematic) updateLevelMechanics(dt);
    if (portalWarp) {
      updatePortalWarp(0);
      updateHud();
      return;
    }
    for (const player of players) player.update(dt);
    if (!cinematic && specialAttack) {
      specialAttack.update(dt);
      if (specialAttack.dead) specialAttack = null;
    }
    if (!cinematic) {
      for (const bullet of bullets) bullet.update(dt);
      for (const pickup of pickups) pickup.update(dt);

      if (portalArrivalGrace <= 0) {
        for (const enemy of enemies) enemy.update(dt);
        resolveEnemySpacing();
        if (activeBoss && !activeBoss.dead) activeBoss.update(dt);
        for (const bullet of enemyBullets) bullet.update(dt);
      } else {
        enemyBullets = [];
      }
    }
    if (victoryScene) {
      victoryScene.update(dt);
      if (victoryScene.dead) victoryScene = null;
    }
    for (const particle of particles) particle.update(dt);
    for (const blast of blastEffects) blast.update(dt);
    for (const death of bossDeaths) death.update(dt);
    for (const text of floatingTexts) text.update(dt);
    for (const piece of debris) piece.update(dt);
    for (const hazard of hazards) hazard.update(dt);

    pruneDead(enemies);
    pruneDead(bullets);
    pruneDead(enemyBullets);
    pruneDead(pickups);
    pruneDead(particles);
    pruneDead(blastEffects);
    pruneDead(bossDeaths);
    pruneDead(floatingTexts);
    pruneDead(debris);
    pruneDead(hazards);

    if (finalWinTimer > 0) {
      finalWinTimer -= dt;
      if (finalWinTimer <= 0 && !victoryScene) {
        finish(true);
        return;
      }
    }

    if (players.every(player => player.dead && player.lives <= 0)) {
      finish(false);
      return;
    }

    updateCamera(dt);
    updateHud();
  }

  function updateCamera(dt) {
    const maxCameraX = Math.max(0, LEVEL_W - visibleWorldW);
    let desiredX = cameraX;

    if (victoryScene) {
      desiredX = victoryScene.x + victoryScene.w / 2 - visibleWorldW * 0.5;
    } else if (levelState === "vehicle" && introVehicle) {
      desiredX = introVehicle.x - visibleWorldW * 0.28;
    } else if (levelState === "crash") {
      desiredX = cameraHoldX ?? cameraX;
    } else {
      const lead = leadingPlayerX(true);
      if (lead > 0) desiredX = Math.max(cameraTargetX, lead - visibleWorldW * 0.34);
    }

    if (activeBoss && !activeBoss.dead && activeBoss.arenaLock !== false) {
      const arenaWidth = activeBoss.arenaRight - activeBoss.arenaLeft;
      const rightPadding = portrait ? 48 : 82;
      const framedX = activeBoss.x + activeBoss.w - visibleWorldW + rightPadding;

      if (arenaWidth <= visibleWorldW) {
        desiredX = activeBoss.arenaLeft - (visibleWorldW - arenaWidth) * 0.5;
      } else {
        desiredX = clamp(
          framedX,
          activeBoss.arenaLeft,
          activeBoss.arenaRight - visibleWorldW
        );
      }
    }

    cameraTargetX = clamp(desiredX, 0, maxCameraX);
    const response = levelState === "crash" ? 5.0 : levelState === "vehicle" ? 6.5 : 7.5;
    const blend = 1 - Math.exp(-response * dt);
    const requestedStep = (cameraTargetX - cameraX) * blend;
    const maxCameraSpeed = levelState === "vehicle" ? 240 : 360;
    cameraX += clamp(requestedStep, -maxCameraSpeed * dt, maxCameraSpeed * dt);

    if (Math.abs(cameraTargetX - cameraX) < 0.02) cameraX = cameraTargetX;
    cameraX = clamp(cameraX, 0, maxCameraX);

    const leadPlayer = frontAlivePlayer();
    let focusY = terrainSurfaceY(cameraX + visibleWorldW * 0.36);
    if (leadPlayer) {
      const terrainY = terrainSurfaceY(leadPlayer.cx);
      focusY = leadPlayer.onGround ? Math.min(terrainY, leadPlayer.y + leadPlayer.h) : terrainY;
    }
    if (victoryScene) focusY = victoryScene.y + victoryScene.h * 0.62;

    cameraTargetY = clampCameraY(
      focusY - visibleWorldH * cameraGroundAnchor()
    );
    const yBlend = 1 - Math.exp(-5.4 * dt);
    const yStep = (cameraTargetY - cameraY) * yBlend;
    cameraY += clamp(yStep, -250 * dt, 250 * dt);
    if (Math.abs(cameraTargetY - cameraY) < 0.02) cameraY = cameraTargetY;
  }

  function updateHud() {
    const lead = Math.max(cameraX, leadingPlayerX(false));
    const zone = WORLD_ZONES[campaignLevel] || WORLD_ZONES[0];
    hudState.progress = clamp((lead - zone.start) / Math.max(1, zone.end - zone.start), 0, 1);

    let phase = zone.short;
    if (levelState === "stage_intro") phase = "READY";
    else if (levelState === "vehicle") phase = "ARMORED BREACH";
    else if (levelState === "crash") phase = "BAIL OUT";
    else if (victoryScene) phase = victoryScene.final ? "MISSION COMPLETE" : "VICTORY SEQUENCE";
    else if (activeBoss) phase = activeBoss.name;
    else if (campaignLevel === 0 && lead >= 7180) phase = "HIGHWAY COLLAPSE";
    else if (campaignLevel === 0 && lead >= 6400) phase = "INDUSTRIAL DISTRICT";
    else if (campaignLevel === 0 && lead >= 2050) phase = "RUINED STREETS";
    else if (campaignLevel === 1 && lead >= 16750) phase = "RAIL DECK";
    else if (campaignLevel === 1 && lead >= 14500) phase = "FORTRESS INTERIOR";
    else if (campaignLevel === 1 && lead >= 10900) phase = "NEON ASCENT";
    else if (campaignLevel === 2 && lead >= 25550) phase = "FINAL APPROACH";
    else if (campaignLevel === 2 && lead >= 23200) phase = "REACTOR SPINE";
    else if (campaignLevel === 2 && lead >= 19600) phase = "ZERO-G CONDUIT";
    else if (campaignLevel === 3 && lead >= 34450) phase = "FORGE HEART";
    else if (campaignLevel === 3 && lead >= 32100) phase = "LEVIATHAN NEST";
    else if (campaignLevel === 3 && lead >= 28200) phase = "ACID ROOT BASIN";
    else if (campaignLevel === 4 && lead >= 43300) phase = "TITAN TERMINAL";
    else if (campaignLevel === 4 && lead >= 40950) phase = "ABSOLUTE ZERO LINE";
    else if (campaignLevel === 4 && lead >= 37100) phase = "MAGLEV RIDGE";
    else if (campaignLevel === 5 && lead >= 52700) phase = "EMPEROR'S GATE";
    else if (campaignLevel === 5 && lead >= 50100) phase = "CITADEL CLOCKWORK";
    else if (campaignLevel === 5 && lead >= 46000) phase = "TIMEFALL CHASM";
    const mechanic = campaignLevel === 2 ? " • LOW-G" : campaignLevel === 3 ? " • BIO-PODS" : campaignLevel === 4 ? " • MAGLEV" : campaignLevel === 5 ? (chronoPulse > 0 ? " • TIME SLOWED" : " • TIME GATES") : "";
    hudState.phase = `L${campaignLevel + 1} • ${phase}${mechanic}`;
  }

  function weaponName(weapon) {
    if (weapon === 1) return "SPREAD";
    if (weapon === 2) return "RAPID";
    if (weapon === 3) return "ROCKET";
    return "RIFLE";
  }

  function finish(win) {
    if (gameOver) return;
    running = false;
    paused = false;
    gameOver = true;
    clearControls();
    audio.stopMusic();
    const score = players.reduce((sum, player) => sum + player.score, 0);
    menuResult = win
      ? `COMPLETE • ${String(score).padStart(6, "0")}`
      : `FAILED • ${String(score).padStart(6, "0")}`;
    levelState = "menu";
    updateLevelSelectionPreview();
    resize();
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) clearControls();
    audio.setMusicPaused(paused);
    if (paused) {
      bannerText = "";
      bannerUntil = 0;
    }
  }

  function showBanner(text, duration = 1.4) {
    bannerText = String(text || "");
    bannerUntil = performance.now() + duration * 1000;
  }

  function zoneIndexAt(x) {
    for (let i = WORLD_ZONES.length - 1; i >= 0; i--) {
      if (x >= WORLD_ZONES[i].start) return i;
    }
    return 0;
  }

  function drawBackground() {
    const zone = zoneIndexAt(cameraX + visibleWorldW * 0.5);
    const top = cameraY - 170;
    const bottom = cameraY + visibleWorldH + 200;
    const skyX = cameraX - 300;
    const skyW = visibleWorldW + 600;

    if (zone === 0) {
      ctx.fillStyle = "#050816"; ctx.fillRect(skyX, top, skyW, bottom - top);
      ctx.fillStyle = "#09152a"; ctx.fillRect(skyX, 105, skyW, 150);
      ctx.fillStyle = "#102b43"; ctx.fillRect(skyX, 255, skyW, 165);
      ctx.fillStyle = "#234154"; ctx.fillRect(skyX, 420, skyW, 170);
      ctx.fillStyle = "#704634"; ctx.fillRect(skyX, 590, skyW, GROUND_Y - 590);
    } else if (zone === 1) {
      ctx.fillStyle = "#07051a"; ctx.fillRect(skyX, top, skyW, bottom - top);
      ctx.fillStyle = "#14103a"; ctx.fillRect(skyX, 120, skyW, 170);
      ctx.fillStyle = "#27205a"; ctx.fillRect(skyX, 290, skyW, 165);
      ctx.fillStyle = "#1f4760"; ctx.fillRect(skyX, 455, skyW, GROUND_Y - 455);
    } else if (zone === 2) {
      ctx.fillStyle = "#02030b"; ctx.fillRect(skyX, top, skyW, bottom - top);
      ctx.fillStyle = "#090d24"; ctx.fillRect(skyX, 150, skyW, 190);
      ctx.fillStyle = "#181338"; ctx.fillRect(skyX, 340, skyW, 190);
      ctx.fillStyle = "#252149"; ctx.fillRect(skyX, 530, skyW, GROUND_Y - 530);
    } else if (zone === 3) {
      ctx.fillStyle = "#061108"; ctx.fillRect(skyX, top, skyW, bottom - top);
      ctx.fillStyle = "#102719"; ctx.fillRect(skyX, 120, skyW, 175);
      ctx.fillStyle = "#214225"; ctx.fillRect(skyX, 295, skyW, 170);
      ctx.fillStyle = "#40572a"; ctx.fillRect(skyX, 465, skyW, GROUND_Y - 465);
    } else if (zone === 4) {
      ctx.fillStyle = "#06131f"; ctx.fillRect(skyX, top, skyW, bottom - top);
      ctx.fillStyle = "#12324b"; ctx.fillRect(skyX, 115, skyW, 180);
      ctx.fillStyle = "#28536a"; ctx.fillRect(skyX, 295, skyW, 170);
      ctx.fillStyle = "#6f9aaa"; ctx.fillRect(skyX, 465, skyW, GROUND_Y - 465);
    } else {
      ctx.fillStyle = "#090518"; ctx.fillRect(skyX, top, skyW, bottom - top);
      ctx.fillStyle = "#21103b"; ctx.fillRect(skyX, 120, skyW, 180);
      ctx.fillStyle = "#44255f"; ctx.fillRect(skyX, 300, skyW, 175);

    for (const star of stars) {
      if (star.x < cameraX - 100 || star.x > cameraX + visibleWorldW + 100) continue;

    drawZoneAtmosphere(zone, top, bottom);

    if (zone === 0) {
      for (const cloud of clouds) {

    for (const decoration of decorations) {

  function drawMountains(parallax, base, color, height) {
    ctx.fillStyle = color;
    const start = Math.floor((cameraX * parallax - 320) / 160) * 160;
    ctx.beginPath();
    ctx.moveTo(cameraX - 200, WORLD_H);
    for (let q = start; q < cameraX + visibleWorldW + 500; q += 160) {
      const x = q + (cameraX - cameraX * parallax);
      ctx.lineTo(x, base);
      ctx.lineTo(x + 80, base - height * (0.65 + (Math.abs(q / 160) % 3) * 0.1));
      ctx.lineTo(x + 160, base);
    }
    ctx.lineTo(cameraX + visibleWorldW + 300, WORLD_H);
    ctx.closePath(); ctx.fill();
  }

  function drawPlatform(platform) {
    const zone = zoneIndexAt(platform.x);
    const safeColors = ["#7e93a6", "#59ecff", "#69ffb0", "#8dff5d", "#b8f5ff", "#ff8df4"];
    const bodyColors = ["#465465", "#263b5d", "#2b4148", "#34472f", "#315569", "#49305d"];
    const safe = safeColors[zone] || safeColors[0];
    const body = bodyColors[zone] || bodyColors[0];
    const caution = platform.collapsible ? "#ffd34d" : safe;

    ctx.fillStyle = platform.triggered ? "#6a5446" : body;
    ctx.fillRect(platform.x, platform.y, platform.w, platform.h);
    ctx.strokeStyle = caution;
    ctx.lineWidth = 4;
    ctx.strokeRect(platform.x, platform.y, platform.w, platform.h);

    if (platform.collapsible) {
      for (let x = platform.x + 4; x < platform.x + platform.w - 6; x += 24) {
        ctx.fillStyle = ((x - platform.x) / 24) % 2 < 1 ? "#ffd34d" : "#392d0a";
        ctx.fillRect(x, platform.y + 6, 15, 6);
      }
    } else {
      ctx.fillStyle = safe;
      ctx.fillRect(platform.x + 8, platform.y + 7, platform.w - 16, 5);
    }

    ctx.strokeStyle = zone === 0 ? "#303844" : "#25253d";
    ctx.lineWidth = 5;
    for (let x = platform.x + 20; x < platform.x + platform.w; x += 40) {
      ctx.beginPath();
      ctx.moveTo(x, platform.y + platform.h);
      ctx.lineTo(x - 12, platform.y + 55);
      ctx.stroke();
    }

    if (platform.motion && !platform.triggered) {
      ctx.fillStyle = safe;
      ctx.font = `900 16px ${UI_FONT}`;
      ctx.textAlign = "center";
      const arrow = platform.motion.axis === "x" ? "↔" : "↕";
      ctx.fillText(arrow, platform.x + platform.w / 2, platform.y - 9);
    }

    if (platform.triggered) {
      drawUiIcon("down", platform.x + platform.w / 2, platform.y - 12, 16, "#fff36d", 2.3);
    }
  }

  function drawVehicle() {
    if (!introVehicle) return;

    ctx.save();
    ctx.translate(introVehicle.x, introVehicle.y);
    ctx.fillStyle = "#42515d";
    roundRect(0, 10, 190, 62, 14);
    ctx.fill();
    ctx.fillStyle = "#222b34";
    ctx.fillRect(52, -12, 82, 34);
    ctx.fillStyle = "#0b1016";
    ctx.beginPath();
    ctx.arc(42, 72, 24, 0, Math.PI * 2);
    ctx.arc(150, 72, 24, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ffbd48";
    ctx.fillRect(180, 25, 12, 12);
    ctx.restore();
  }

  function uiRectContains(rect, x, y) {
    return rect && x >= rect.x && x <= rect.x + rect.w && y >= rect.y && y <= rect.y + rect.h;
  }

  function drawPixelPanel(x, y, w, h, fill = "#07101d", edge = "#6f8fa8", shadow = true) {
    const radius = clamp(Math.min(w, h) * 0.18, 5, 13);
    if (shadow) {
      ctx.fillStyle = "rgba(0,0,0,.52)";
      roundRect(x + 4, y + 5, w, h, radius);
      ctx.fill();
    }
    ctx.fillStyle = fill;
    roundRect(x, y, w, h, radius);
    ctx.fill();
    ctx.strokeStyle = edge;
    ctx.lineWidth = 2.2;
    roundRect(x + ctx.lineWidth / 2, y + ctx.lineWidth / 2, w - ctx.lineWidth, h - ctx.lineWidth, radius);
    ctx.stroke();
  }

  function fitCanvasText(text, maxWidth, startSize, minimum = 8) {
    const key = `${text}|${Math.round(maxWidth)}|${startSize}|${minimum}`;
    const cached = fittedTextCache.get(key);
    if (cached != null) return cached;

    let size = startSize;
    while (size > minimum) {
      ctx.font = `900 ${size}px ${UI_FONT}`;
      if (ctx.measureText(text).width <= maxWidth) break;
      size--;
    }
    fittedTextCache.set(key, size);
    return size;
  }

  function wrapCanvasText(text, maxWidth) {
    const value = String(text);
    const key = `${ctx.font}|${Math.round(maxWidth)}|${value}`;
    const cached = wrappedTextCache.get(key);
    if (cached) return cached;

    const words = value.split(/\s+/);
    const lines = [];
    let line = "";
    for (const word of words) {
      const test = line ? `${line} ${word}` : word;
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = word;
      } else line = test;
    }
    if (line) lines.push(line);
    wrappedTextCache.set(key, lines);
    return lines;
  }

  function drawMenuBackdrop() {
    const palettes = [
      ["#07101d", "#ff5c48", "#263b50"],
      ["#080726", "#4ce8ff", "#ff5ed7"],
      ["#030b17", "#69ffb0", "#6b60ff"],
      ["#07150d", "#8dff5d", "#7b3f52"],
      ["#071323", "#d6fbff", "#3c7eb0"],
      ["#10071d", "#ff8df4", "#ffd75e"]
    ];
    const [bg, accent, secondary] = palettes[menuLevel];
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, screenW, screenH);
    const horizon = screenH * 0.58;
    ctx.fillStyle = secondary;
    for (let i = 0; i < 18; i++) {
      const w = 12 + (i * 17 % 42);
      const h = 16 + (i * 31 % Math.max(24, screenH * 0.24));
      const x = (i * 67 + time * (5 + menuLevel)) % (screenW + 80) - 40;
      ctx.globalAlpha = 0.18 + (i % 3) * 0.06;
      ctx.fillRect(x, horizon - h, w, h);
    }
    ctx.globalAlpha = 1;
    ctx.strokeStyle = accent;
    ctx.lineWidth = 2;
    for (let y = horizon; y < screenH; y += 12) {
      const spread = (y - horizon) * 0.55;
      ctx.beginPath();
      ctx.moveTo(screenW / 2 - spread, y);
      ctx.lineTo(screenW / 2 + spread, y);
      ctx.stroke();
    }
    for (let i = -7; i <= 7; i++) {
      ctx.beginPath();
      ctx.moveTo(screenW / 2, horizon);
      ctx.lineTo(screenW / 2 + i * screenW * 0.11, screenH);
      ctx.stroke();
    }
  }

  function drawMenuArrow(rect, direction, active = false) {
    drawPixelPanel(rect.x, rect.y, rect.w, rect.h, active ? "#17344b" : "#0b1727", active ? "#fff36d" : "#4ce8ff", false);
    ctx.fillStyle = active ? "#fff36d" : "#f4f1d0";
    ctx.beginPath();
    const cx = rect.x + rect.w / 2;
    const cy = rect.y + rect.h / 2;
    const s = Math.min(rect.w, rect.h) * 0.22;
    if (direction < 0) {
      ctx.moveTo(cx + s, cy - s); ctx.lineTo(cx - s, cy); ctx.lineTo(cx + s, cy + s);
    } else {
      ctx.moveTo(cx - s, cy - s); ctx.lineTo(cx + s, cy); ctx.lineTo(cx - s, cy + s);
    }
    ctx.closePath(); ctx.fill();
  }


  function drawUiIcon(type, cx, cy, size, color = "#ffffff", lineWidth = 2) {
    const s = Math.max(4, size);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = Math.max(1.4, lineWidth);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    if (type === "play") {
      ctx.beginPath();
      ctx.moveTo(-s * 0.28, -s * 0.42);
      ctx.lineTo(s * 0.46, 0);
      ctx.lineTo(-s * 0.28, s * 0.42);
      ctx.closePath();
      ctx.fill();
    } else if (type === "pause") {
      ctx.fillRect(-s * 0.32, -s * 0.42, s * 0.20, s * 0.84);
      ctx.fillRect(s * 0.12, -s * 0.42, s * 0.20, s * 0.84);
    } else if (type === "coop") {
      ctx.beginPath();
      ctx.arc(-s * 0.22, -s * 0.18, s * 0.18, 0, Math.PI * 2);
      ctx.arc(s * 0.24, -s * 0.14, s * 0.15, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(-s * 0.22, s * 0.35, s * 0.35, Math.PI, Math.PI * 2);
      ctx.arc(s * 0.24, s * 0.34, s * 0.29, Math.PI, Math.PI * 2);
      ctx.stroke();
    } else if (type === "music") {
      ctx.beginPath();
      ctx.moveTo(-s * 0.05, -s * 0.38);
      ctx.lineTo(s * 0.34, -s * 0.49);
      ctx.lineTo(s * 0.34, s * 0.20);
      ctx.moveTo(-s * 0.05, -s * 0.31);
      ctx.lineTo(-s * 0.05, s * 0.30);
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(-s * 0.20, s * 0.32, s * 0.20, s * 0.14, -0.18, 0, Math.PI * 2);
      ctx.ellipse(s * 0.20, s * 0.20, s * 0.20, s * 0.14, -0.18, 0, Math.PI * 2);
      ctx.fill();
    } else if (type === "fullscreen") {
      const a = s * 0.42;
      const b = s * 0.12;
      ctx.beginPath();
      ctx.moveTo(-b, -a); ctx.lineTo(-a, -a); ctx.lineTo(-a, -b);
      ctx.moveTo(b, -a); ctx.lineTo(a, -a); ctx.lineTo(a, -b);
      ctx.moveTo(-a, b); ctx.lineTo(-a, a); ctx.lineTo(-b, a);
      ctx.moveTo(a, b); ctx.lineTo(a, a); ctx.lineTo(b, a);
      ctx.stroke();
    } else if (type === "heart") {
      ctx.beginPath();
      ctx.moveTo(0, s * 0.42);
      ctx.bezierCurveTo(-s * 0.52, s * 0.08, -s * 0.48, -s * 0.38, -s * 0.20, -s * 0.38);
      ctx.bezierCurveTo(-s * 0.04, -s * 0.38, 0, -s * 0.24, 0, -s * 0.18);
      ctx.bezierCurveTo(0, -s * 0.24, s * 0.04, -s * 0.38, s * 0.20, -s * 0.38);
      ctx.bezierCurveTo(s * 0.48, -s * 0.38, s * 0.52, s * 0.08, 0, s * 0.42);
      ctx.fill();
    } else if (type === "life") {
      ctx.beginPath();
      ctx.arc(0, -s * 0.18, s * 0.22, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(0, s * 0.38, s * 0.36, Math.PI, Math.PI * 2);
      ctx.stroke();
    } else if (type === "special") {
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const radius = i % 2 ? s * 0.20 : s * 0.46;
        const angle = -Math.PI / 2 + i * Math.PI / 5;
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
    } else if (type === "score") {
      ctx.beginPath();
      ctx.moveTo(0, -s * 0.44);
      ctx.lineTo(s * 0.38, 0);
      ctx.lineTo(0, s * 0.44);
      ctx.lineTo(-s * 0.38, 0);
      ctx.closePath();
      ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, s * 0.10, 0, Math.PI * 2); ctx.fill();
    } else if (type === "strike") {
      ctx.beginPath();
      for (let i = 0; i < 12; i++) {
        const radius = i % 2 ? s * 0.23 : s * 0.48;
        const angle = i * Math.PI / 6;
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "rgba(0,0,0,.34)";
      ctx.fillRect(-s * 0.13, -s * 0.14, s * 0.26, s * 0.28);
    } else if (type === "fire") {
      ctx.beginPath(); ctx.arc(0, 0, s * 0.28, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-s * 0.50, 0); ctx.lineTo(-s * 0.22, 0);
      ctx.moveTo(s * 0.22, 0); ctx.lineTo(s * 0.50, 0);
      ctx.moveTo(0, -s * 0.50); ctx.lineTo(0, -s * 0.22);
      ctx.moveTo(0, s * 0.22); ctx.lineTo(0, s * 0.50);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, s * 0.08, 0, Math.PI * 2); ctx.fill();
    } else if (type === "jump") {
      ctx.beginPath();
      ctx.moveTo(0, -s * 0.48);
      ctx.lineTo(-s * 0.34, -s * 0.10);
      ctx.moveTo(0, -s * 0.48);
      ctx.lineTo(s * 0.34, -s * 0.10);
      ctx.moveTo(0, -s * 0.42);
      ctx.lineTo(0, s * 0.32);
      ctx.moveTo(-s * 0.28, s * 0.42);
      ctx.lineTo(s * 0.28, s * 0.42);
      ctx.stroke();
    } else if (type === "down") {
      ctx.beginPath();
      ctx.moveTo(0, s * 0.48);
      ctx.lineTo(-s * 0.34, s * 0.10);
      ctx.moveTo(0, s * 0.48);
      ctx.lineTo(s * 0.34, s * 0.10);
      ctx.moveTo(0, s * 0.42);
      ctx.lineTo(0, -s * 0.34);
      ctx.stroke();
    } else if (type === "move") {
      ctx.beginPath();
      ctx.moveTo(-s * 0.48, 0); ctx.lineTo(s * 0.48, 0);
      ctx.moveTo(-s * 0.48, 0); ctx.lineTo(-s * 0.25, -s * 0.22);
      ctx.moveTo(-s * 0.48, 0); ctx.lineTo(-s * 0.25, s * 0.22);
      ctx.moveTo(s * 0.48, 0); ctx.lineTo(s * 0.25, -s * 0.22);
      ctx.moveTo(s * 0.48, 0); ctx.lineTo(s * 0.25, s * 0.22);
      ctx.stroke();
    } else if (type === "check") {
      ctx.beginPath();
      ctx.moveTo(-s * 0.42, 0);
      ctx.lineTo(-s * 0.10, s * 0.32);
      ctx.lineTo(s * 0.48, -s * 0.38);
      ctx.stroke();
    } else if (type === "next") {
      ctx.beginPath();
      ctx.moveTo(-s * 0.42, -s * 0.32);
      ctx.lineTo(s * 0.06, 0);
      ctx.lineTo(-s * 0.42, s * 0.32);
      ctx.moveTo(s * 0.02, -s * 0.32);
      ctx.lineTo(s * 0.48, 0);
      ctx.lineTo(s * 0.02, s * 0.32);
      ctx.stroke();
    } else if (type === "warning") {
      ctx.beginPath();
      ctx.moveTo(0, -s * 0.48);
      ctx.lineTo(s * 0.46, s * 0.38);
      ctx.lineTo(-s * 0.46, s * 0.38);
      ctx.closePath();
      ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -s * 0.18); ctx.lineTo(0, s * 0.12); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, s * 0.26, s * 0.05, 0, Math.PI * 2); ctx.fill();
    } else if (type === "lock") {
      ctx.strokeRect(-s * 0.32, -s * 0.02, s * 0.64, s * 0.46);
      ctx.beginPath();
      ctx.arc(0, -s * 0.04, s * 0.24, Math.PI, 0);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(0, s * 0.18, s * 0.06, 0, Math.PI * 2); ctx.fill();
    } else if (type === "keyboard") {
      ctx.strokeRect(-s * 0.48, -s * 0.32, s * 0.96, s * 0.64);
      for (let row = -1; row <= 1; row++) {
        for (let col = -2; col <= 2; col++) {
          ctx.fillRect(col * s * 0.15 - s * 0.04, row * s * 0.14 - s * 0.03, s * 0.08, s * 0.06);
        }
      }
    } else if (type === "weapon0") {
      ctx.fillRect(-s * 0.42, -s * 0.12, s * 0.68, s * 0.22);
      ctx.fillRect(-s * 0.02, s * 0.08, s * 0.18, s * 0.28);
      ctx.fillRect(s * 0.27, -s * 0.06, s * 0.21, s * 0.10);
    } else if (type === "weapon1") {
      ctx.beginPath();
      ctx.moveTo(-s * 0.40, 0); ctx.lineTo(s * 0.42, 0);
      ctx.moveTo(-s * 0.34, -s * 0.12); ctx.lineTo(s * 0.34, -s * 0.32);
      ctx.moveTo(-s * 0.34, s * 0.12); ctx.lineTo(s * 0.34, s * 0.32);
      ctx.stroke();
    } else if (type === "weapon2") {
      ctx.beginPath();
      ctx.moveTo(-s * 0.42, -s * 0.24); ctx.lineTo(-s * 0.06, 0); ctx.lineTo(-s * 0.42, s * 0.24);
      ctx.moveTo(-s * 0.02, -s * 0.24); ctx.lineTo(s * 0.34, 0); ctx.lineTo(-s * 0.02, s * 0.24);
      ctx.stroke();
    } else if (type === "weapon3") {
      ctx.beginPath();
      ctx.moveTo(s * 0.44, 0); ctx.lineTo(-s * 0.08, -s * 0.20); ctx.lineTo(-s * 0.28, 0); ctx.lineTo(-s * 0.08, s * 0.20); ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-s * 0.28, -s * 0.10); ctx.lineTo(-s * 0.46, -s * 0.26);
      ctx.moveTo(-s * 0.28, s * 0.10); ctx.lineTo(-s * 0.46, s * 0.26);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawMenuIconButton(rect, icon, active, fill, edge, label = "") {
    drawPixelPanel(rect.x, rect.y, rect.w, rect.h, active ? fill : "#0a1421", active ? "#fff36d" : edge, false);
    const iconX = label ? rect.x + rect.h * 0.55 : rect.x + rect.w / 2;
    drawUiIcon(icon, iconX, rect.y + rect.h / 2, Math.min(rect.h * 0.48, 23), active ? "#fff36d" : edge, 2.2);
    if (label) {
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillStyle = active ? "#ffffff" : "#dce8ee";
      ctx.font = `800 ${Math.min(12, rect.h * 0.26)}px ${UI_FONT}`;
      ctx.fillText(label, rect.x + rect.h * 0.96, rect.y + rect.h / 2 + 0.5);
    }
  }

  function drawControlLegend(centerX, y, compact) {
    const gap = compact ? 34 : 40;
    const radius = compact ? 10 : 11;
    const items = [
      ["move", ""],
      ["strike", "A"],
      ["fire", "B"],
      ["jump", "C"]
    ];
    const startX = centerX - gap * 1.5;
    items.forEach(([icon, key], index) => {
      const x = startX + gap * index;
      ctx.fillStyle = "rgba(9,20,34,.92)";
      ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#4f6b7e"; ctx.lineWidth = 1.4; ctx.stroke();
      drawUiIcon(icon, x, y, radius * 0.92, index === 0 ? "#63e5ff" : "#dce8ee", 1.6);
      if (key) {
        ctx.fillStyle = "#fff36d";
        ctx.font = `800 ${compact ? 7 : 8}px ${UI_FONT}`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(key, x + radius * 0.72, y - radius * 0.70);
      }
    });
  }

  function drawCanvasMenu() {
    drawMenuBackdrop();
    const compact = !portrait || screenH < 600;
    const panelW = Math.min(screenW - 18, compact ? 650 : 480);
    const panelH = Math.min(screenH - 14, compact ? 292 : 390);
    const x = Math.round((screenW - panelW) / 2);
    const y = Math.round((screenH - panelH) / 2);
    drawPixelPanel(x, y, panelW, panelH, "#050914", "#56758a", true);

    ctx.textBaseline = "middle";
    const titleSize = clamp(Math.round(panelH * (compact ? 0.12 : 0.105)), 28, 40);

    const titleText = "IRON REIGN";
    const titleWidth = ctx.measureText(titleText).width;
    const titleStart = screenW / 2 - titleWidth / 2;
    const titleY = y + (compact ? 31 : 38);
    ctx.textAlign = "left";
    ctx.fillStyle = "#02040a";
    ctx.fillText(titleText, titleStart + 3, titleY + 3);
    ctx.fillStyle = "#f4f1d0";
    ctx.fillText("IRON ", titleStart, titleY);
    ctx.fillStyle = "#ff4b3e";
    ctx.fillText("REIGN", titleStart + ctx.measureText("IRON ").width, titleY);
    ctx.textAlign = "center";
    ctx.font = `800 ${compact ? 8 : 9}px ${UI_FONT}`;
    ctx.fillStyle = "#6f8fa8";

    const zone = WORLD_ZONES[menuLevel];
    const labelW = Math.min(panelW - 28, 480);

    uiRects.menu.levelPrev = { x: labelX, y: zoneY, w: arrowW, h: rowH };
    uiRects.menu.levelNext = { x: labelX + labelW - arrowW, y: zoneY, w: arrowW, h: rowH };

    drawMenuArrow(uiRects.menu.levelNext, 1, menuFocus === 0);
    drawPixelPanel(labelX + arrowW + 5, zoneY, labelW - arrowW * 2 - 10, rowH, "#091426", menuFocus === 0 ? "#fff36d" : "#385b72", false);
    ctx.textAlign = "center";
    ctx.fillStyle = "#7894a5";

    drawMenuArrow(uiRects.menu.diffPrev, -1, menuFocus === 1);
    drawMenuArrow(uiRects.menu.diffNext, 1, menuFocus === 1);
    drawPixelPanel(labelX + arrowW + 5, diffY, labelW - arrowW * 2 - 10, rowH, "#091426", menuFocus === 1 ? "#fff36d" : "#385b72", false);
    const difficultyCenterX = screenW / 2;
    drawUiIcon("warning", difficultyCenterX - 52, diffY + rowH / 2, compact ? 12 : 13, "#ffb34f", 1.6);
    ctx.fillStyle = "#dce8ee";
    ctx.font = `900 ${compact ? 11 : 12}px ${UI_FONT}`;
    ctx.fillText(DIFFICULTY_OPTIONS[menuDifficulty].label, difficultyCenterX + 8, diffY + rowH / 2 + 0.5);

    const buttonY = diffY + rowH + 10;
    const buttonGap = 10;
    const buttonH = compact ? 45 : 52;
    const buttonW = (labelW - buttonGap) / 2;
    uiRects.menu.solo = { x: labelX, y: buttonY, w: buttonW, h: buttonH };
    uiRects.menu.coop = { x: labelX + buttonW + buttonGap, y: buttonY, w: buttonW, h: buttonH };

      drawUiIcon("keyboard", uiRects.menu.coop.x + uiRects.menu.coop.w - 18, uiRects.menu.coop.y + uiRects.menu.coop.h / 2, 13, "#6f8fa8", 1.5);
    }

    const settingsGap = 10;
    const settingsW = compact ? 52 : 58;
    const settingsStart = screenW / 2 - settingsW - settingsGap / 2;
    uiRects.menu.music = { x: settingsStart, y: settingsY, w: settingsW, h: settingsH };
    uiRects.menu.fullscreen = { x: settingsStart + settingsW + settingsGap, y: settingsY, w: settingsW, h: settingsH };
    drawMenuIconButton(uiRects.menu.music, "music", menuFocus === 4, "#3a3211", audio.musicMuted ? "#ff6b5c" : "#fff36d");
    drawMenuIconButton(uiRects.menu.fullscreen, "fullscreen", menuFocus === 5, "#15344b", fullscreenActive() ? "#fff36d" : "#4ce8ff");
    if (audio.musicMuted) {
      ctx.strokeStyle = "#ff6b5c";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(uiRects.menu.music.x + 15, uiRects.menu.music.y + 8);
      ctx.lineTo(uiRects.menu.music.x + uiRects.menu.music.w - 15, uiRects.menu.music.y + uiRects.menu.music.h - 8);
      ctx.stroke();
    }

    const footerY = y + panelH - (compact ? 18 : 27);
    if (menuResult) {
      ctx.fillStyle = menuResult.startsWith("COMPLETE") ? "#6dff82" : "#ff695b";
      const resultSize = fitCanvasText(menuResult, panelW - 24, compact ? 9 : 10, 7);
      ctx.font = `800 ${resultSize}px ${UI_FONT}`;
      ctx.textAlign = "center";
      ctx.fillText(menuResult, screenW / 2, footerY);
    } else {
      drawControlLegend(screenW / 2, footerY, compact);
    }

    ctx.fillStyle = "#405767";
    ctx.font = `700 7px ${UI_FONT}`;
    ctx.textAlign = "right";
    ctx.fillText("v5.1", x + panelW - 8, y + panelH - 7);
  }

  function drawHealthCard(player, x, y, right = false) {
    const w = Math.min(140, Math.max(108, screenW * 0.31));
    const h = 36;
    drawPixelPanel(x, y, w, h, "rgba(5,13,23,.94)", player.color, true);
    const ratio = clamp(player.health / player.maxHealth, 0, 1);
    const healthColor = ratio > 0.55 ? "#57df6c" : ratio > 0.25 ? "#ffd34d" : "#ff4b3e";

    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    ctx.font = `900 8px ${UI_FONT}`;
    ctx.fillStyle = player.color;
    ctx.fillText(`P${player.index + 1}`, x + 6, y + 7);

    ctx.fillRect(x + 6, y + 13, w - 12, 6);
    ctx.fillStyle = healthColor;
    ctx.fillRect(x + 7, y + 14, (w - 14) * ratio, 4);

    const scoreText = player.score >= 1000000
      ? `${Math.round(player.score / 100000) / 10}M`
      : player.score >= 1000
        ? `${Math.round(player.score / 1000)}K`
        : String(player.score);
    const metricY = y + 27.5;
    const metricColor = "#9db3bd";
    const positions = [x + w * 0.14, x + w * 0.44, x + w * 0.74];
    const metrics = [
      ["life", String(player.lives), positions[0]],
      ["special", String(player.specials), positions[1]],
      ["score", scoreText, positions[2]]
    ];
    ctx.font = `800 ${w < 120 ? 7 : 8}px ${UI_FONT}`;
    ctx.textAlign = "left";
    for (const [icon, value, px] of metrics) {
      drawUiIcon(icon, px, metricY, 7.5, metricColor, 1.3);
      ctx.fillStyle = metricColor;
      ctx.fillText(value, px + 7, metricY + 0.5);
    }
    return w;
  }

  function drawCanvasHud() {
    const pad = 7;
    const topPad = pad + safeTop;
    if (players[0]) drawHealthCard(players[0], pad + safeLeft, topPad, false);
    if (players[1]) {
      const w = Math.min(140, Math.max(108, screenW * 0.31));

    ctx.strokeStyle = "#56758a";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(progressX + 0.75, progressY + 0.75, progressW - 1.5, 6.5);
    ctx.fillStyle = "#4ce8ff";
    ctx.fillRect(progressX + 2.5, progressY + 2.5, (progressW - 5) * hudState.progress, 3);

    const iconSize = isTouch ? 30 : 27;

    drawPixelPanel(uiRects.pause.x, uiRects.pause.y, uiRects.pause.w, uiRects.pause.h, "rgba(5,13,23,.92)", "#56758a", false);
    drawUiIcon(paused ? "play" : "pause", screenW / 2, uiRects.pause.y + uiRects.pause.h / 2, 12, "#dce8ee", 2);

    drawPixelPanel(uiRects.fullscreen.x, uiRects.fullscreen.y, uiRects.fullscreen.w, uiRects.fullscreen.h, "rgba(5,13,23,.92)", fullscreenActive() ? "#fff36d" : "#4ce8ff", false);
    drawPixelPanel(uiRects.mute.x, uiRects.mute.y, uiRects.mute.w, uiRects.mute.h, "rgba(5,13,23,.92)", audio.musicMuted ? "#ff6b5c" : "#56758a", false);

    if (audio.musicMuted) {

    }

    if (activeBoss && !activeBoss.dead && !activeBoss.hudHidden) {

    }

    if (bannerText && performance.now() < bannerUntil) {
      const remaining = Math.max(0, bannerUntil - performance.now());

      ctx.font = `900 ${size}px ${UI_FONT}`;

      ctx.textBaseline = "middle";

      const boxH = size + 12;
      ctx.fillStyle = "rgba(2,7,14,.76)";

      ctx.strokeStyle = "rgba(255,243,109,.55)";
      ctx.lineWidth = 1.5;
      ctx.stroke();

  function drawCanvasTouchControls() {
    if (!isTouch || !running || paused || stageIntro || levelTransition || portalWarp) return;

    uiRects.stick = { x: 0, y: 0, w: screenW * 0.5, h: screenH };
    uiRects.buttons = {};

    ctx.save();
    if (touchStick.active && touchStick.radius > 0) {
      const baseX = touchStick.baseX;
      const baseY = touchStick.baseY;
      const stickRadius = touchStick.radius;
      ctx.globalAlpha = 0.76;
      ctx.fillStyle = "rgba(4,12,24,.40)";
      ctx.beginPath(); ctx.arc(baseX, baseY, stickRadius, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "rgba(177,215,232,.62)";
      ctx.lineWidth = 1.6; ctx.stroke();
      ctx.strokeStyle = "rgba(76,232,255,.28)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(baseX - stickRadius * .62, baseY); ctx.lineTo(baseX + stickRadius * .62, baseY);
      ctx.moveTo(baseX, baseY - stickRadius * .62); ctx.lineTo(baseX, baseY + stickRadius * .62);
      ctx.stroke();

      const kx = baseX + touchStick.knobX;
      const ky = baseY + touchStick.knobY;
      ctx.fillStyle = "rgba(40,63,88,.90)";
      ctx.beginPath(); ctx.arc(kx, ky, stickRadius * 0.34, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#4ce8ff"; ctx.lineWidth = 1.8; ctx.stroke();
    }

    let defs;
    if (portrait) {
      const layoutR = clamp(screenW * 0.086, 32, 42);
      const fireX = screenW - safeRight - layoutR - 14;
      const fireY = screenH - safeBottom - layoutR - 22;
      defs = [
        ["KeyG", "A", "strike", fireX - layoutR * 3.65, fireY + layoutR * 0.12, layoutR * 0.72, layoutR * 0.88, "#d39a28"],
        ["KeyF", "B", "fire", fireX - layoutR * 1.80, fireY, layoutR * 0.82, layoutR, "#b92f35"],
        ["KeyW", "C", "jump", fireX, fireY - layoutR * 0.30, layoutR * 0.82, layoutR, "#285b91"]
      ];
    } else {
      const layoutR = clamp(screenH * 0.073, 26, 31);
      const edgeX = screenW - safeRight - layoutR - 13;
      const edgeY = screenH - safeBottom - layoutR - 13;
      defs = [
        ["KeyG", "A", "strike", edgeX - layoutR * 4.35, edgeY + layoutR * 0.06, layoutR * 0.69, layoutR * 0.82, "#d39a28"],
        ["KeyF", "B", "fire", edgeX - layoutR * 2.18, edgeY, layoutR * 0.82, layoutR, "#b92f35"],
        ["KeyW", "C", "jump", edgeX, edgeY - layoutR * 1.05, layoutR * 0.79, layoutR * 0.96, "#285b91"]
      ];
    }

    for (const [code, letter, icon, x, y, r, hitR, color] of defs) {
      uiRects.buttons[code] = { x, y, r: hitR };
      const held = Boolean(touchKeys[code]);
      ctx.globalAlpha = held ? 0.96 : (portrait ? 0.70 : 0.62);
      ctx.fillStyle = "rgba(0,0,0,.36)";
      ctx.beginPath(); ctx.arc(x + 2, y + 3, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = held ? "#eef3f5" : color;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = held ? "#fff36d" : "rgba(255,255,255,.72)";
      ctx.lineWidth = 1.9; ctx.stroke();
      drawUiIcon(icon, x, y, r * 0.80, held ? color : "#ffffff", 2.2);

      const badgeR = Math.max(7, r * 0.23);
      const badgeX = x + r * 0.68;
      const badgeY = y - r * 0.68;
      ctx.fillStyle = "rgba(4,10,18,.94)";
      ctx.beginPath(); ctx.arc(badgeX, badgeY, badgeR, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = held ? "#fff36d" : "rgba(255,255,255,.58)";
      ctx.lineWidth = 1.2; ctx.stroke();
      ctx.fillStyle = held ? "#fff36d" : "#dce8ee";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `900 ${Math.max(7, badgeR * 1.05)}px ${UI_FONT}`;
      ctx.fillText(letter, badgeX, badgeY + 0.4);
    }
    ctx.restore();
  }

  function drawStageIntroOverlay() {
    if (!stageIntro) return;
    const elapsed = stageIntro.duration - stageIntro.timer;
    const reveal = clamp(elapsed / 0.28, 0, 1);
    const leave = clamp(stageIntro.timer / 0.22, 0, 1);
    const alpha = Math.min(reveal, leave);
    const zone = WORLD_ZONES[stageIntro.level];
    const ready = stageIntro.timer > 0.58;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "rgba(1,4,10,.58)";
    ctx.fillRect(0, 0, screenW, screenH);
    const panelW = Math.min(screenW * 0.78, 430);
    const panelH = Math.min(112, screenH * 0.28);
    const x = screenW / 2 - panelW / 2;
    const y = screenH / 2 - panelH / 2;
    drawPixelPanel(x, y, panelW, panelH, "rgba(5,13,23,.96)", "#4ce8ff", true);

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#6f8fa8";
    ctx.font = `800 8px ${UI_FONT}`;
    ctx.fillText(`LEVEL ${stageIntro.level + 1}`, screenW / 2, y + 19);
    ctx.fillStyle = "#f4f1d0";
    const zoneSize = fitCanvasText(zone.short, panelW * 0.82, 26, 15);
    ctx.font = `900 ${zoneSize}px ${UI_FONT}`;
    ctx.fillText(zone.short, screenW / 2, y + panelH * 0.50);

    const cueY = y + panelH - 18;
    drawUiIcon(ready ? "pause" : "next", screenW / 2 - 24, cueY, 10, ready ? "#fff36d" : "#6dff82", 1.8);
    ctx.textAlign = "left";
    ctx.fillStyle = ready ? "#fff36d" : "#6dff82";
    ctx.font = `900 9px ${UI_FONT}`;
    ctx.fillText(ready ? "READY" : "GO", screenW / 2 - 12, cueY + 0.5);
    ctx.restore();
  }

  function drawLevelTransitionOverlay() {
    if (!levelTransition) return;
    const nextZone = WORLD_ZONES[levelTransition.nextLevel];

    ctx.save();
    ctx.fillStyle = "#010207";
    ctx.fillRect(0, 0, screenW, screenH);

    const panelW = Math.min(screenW * 0.80, 440);
    const panelH = Math.min(128, screenH * 0.34);
    const x = screenW / 2 - panelW / 2;
    const y = screenH / 2 - panelH / 2;
    drawPixelPanel(x, y, panelW, panelH, "#07101d", "#6dff82", true);

    const iconX = x + 38;
    const centerY = y + panelH * 0.43;
    drawUiIcon("check", iconX, centerY, 24, "#6dff82", 3.2);

    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#f4f1d0";
    ctx.font = `900 ${clamp(Math.round(panelH * 0.16), 15, 20)}px ${UI_FONT}`;
    ctx.fillText(`LEVEL ${levelTransition.nextLevel} CLEAR`, x + 68, centerY - 10);
    ctx.fillStyle = "#63e5ff";
    ctx.font = `800 ${clamp(Math.round(panelH * 0.09), 9, 12)}px ${UI_FONT}`;
    ctx.fillText(nextZone.short, x + 68, centerY + 13);
    drawUiIcon("next", x + panelW - 28, centerY + 12, 12, "#63e5ff", 1.8);

    const progress = clamp(1 - levelTransition.timer / levelTransition.duration, 0, 1);
    const barW = panelW - 38;
    const barX = x + 19;
    const barY = y + panelH - 20;
    ctx.fillStyle = "#121925";
    ctx.fillRect(barX, barY, barW, 5);
    ctx.fillStyle = "#fff36d";
    ctx.fillRect(barX, barY, barW * progress, 5);
    ctx.restore();
  }

  function drawPortalTravelWorld() {
    if (!portalWarp) return;
    const warp = portalWarp;
    const gate = warp.phase === "enter" ? warp.source : warp.phase === "exit" ? warp.destination : null;
    if (!gate) return;

    const phaseDuration = warp.phase === "enter" ? 0.22 : 0.30;
    const progress = clamp(warp.phaseTime / phaseDuration, 0, 1);
    const pulse = Math.sin(progress * Math.PI);
    ctx.save();
    ctx.translate(gate.cx, gate.cy);
    ctx.globalAlpha = 0.82 * pulse;
    ctx.strokeStyle = gate.color;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.ellipse(0, 0, 34 + pulse * 18, 57 + pulse * 24, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 0.45 * pulse;
    ctx.fillStyle = gate.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, 22 + pulse * 10, 45 + pulse * 16, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    if (!running && levelState === "menu") {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawCanvasMenu();
      return;
    }

    ctx.fillStyle = "#02040a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    const snappedCameraX = Math.round(cameraX * viewScale) / viewScale;
    const snappedCameraY = Math.round(cameraY * viewScale) / viewScale;
    ctx.setTransform(viewScale, 0, 0, viewScale, -snappedCameraX * viewScale, -snappedCameraY * viewScale);
    drawBackground();
    for (const pad of launchPads) if (inView(pad, 120)) pad.draw();
    for (const portal of portals) if (inView(portal, 120)) portal.draw();
    drawPortalTravelWorld();
    for (const hazard of hazards) if (inView(hazard, 160)) hazard.draw();
    for (const pickup of pickups) if (inView(pickup)) pickup.draw();
    for (const enemy of enemies) if (inView(enemy, 220)) enemy.draw();
    if (activeBoss && !activeBoss.dead) activeBoss.draw();
    for (const death of bossDeaths) if (inView(death, 260)) death.draw();
    if (victoryScene) victoryScene.drawWorld();
    drawVehicle();
    for (const player of players) player.draw();
    for (const bullet of bullets) if (inView(bullet, 300)) bullet.draw();
    for (const bullet of enemyBullets) if (inView(bullet, 300)) bullet.draw();
    if (specialAttack) specialAttack.draw();
    for (const piece of debris) if (inView(piece, 260)) piece.draw();
    for (const particle of particles) if (inView(particle, 170)) particle.draw();
    for (const blast of blastEffects) if (inViewRect(blast.x - 180, blast.y - 180, 360, 360, 100)) blast.draw();
    for (const text of floatingTexts) if (inViewRect(text.x - 100, text.y - 30, 200, 60, 80)) text.draw();
    ctx.restore();

    // All overlays and controls use CSS-pixel coordinates. The backing buffer is
    // independently scaled for Retina sharpness, so text stays crisp without
    // changing the visual size or touch targets.
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = true;

    if (victoryScene) victoryScene.drawOverlay();
    if (levelTransition) {
      drawLevelTransitionOverlay();
    } else if (stageIntro) {
      drawStageIntroOverlay();
    } else {
      drawCanvasHud();
      drawCanvasTouchControls();
    }

    if (paused) {
      ctx.fillStyle = "rgba(0,0,0,.66)";
      ctx.fillRect(0, 0, screenW, screenH);
      const w = Math.min(220, screenW * 0.62);
      const h = 86;
      const px = screenW / 2 - w / 2;
      const py = screenH / 2 - h / 2;
      drawPixelPanel(px, py, w, h, "#07101d", "#fff36d", true);
      drawUiIcon("pause", screenW / 2 - 43, py + 27, 18, "#fff36d", 2.4);
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.font = `900 17px ${UI_FONT}`;
      ctx.fillStyle = "#f4f1d0";
      ctx.fillText("PAUSED", screenW / 2 - 20, py + 27);
      uiRects.pause = { x: screenW / 2 - 31, y: py + 49, w: 62, h: 27 };
      drawPixelPanel(uiRects.pause.x, uiRects.pause.y, uiRects.pause.w, uiRects.pause.h, "#15344b", "#fff36d", false);
      drawUiIcon("play", screenW / 2, uiRects.pause.y + uiRects.pause.h / 2, 13, "#fff36d", 2);
    }
  }

  function inView(entity, padding = 120) {
    return inViewRect(entity.x, entity.y, entity.w, entity.h, padding);
  }

  function inViewRect(x, y, w, h, padding = 120) {
    return x + w > cameraX - padding &&
           x < cameraX + visibleWorldW + padding &&
           y + h > cameraY - padding &&
           y < cameraY + visibleWorldH + padding;
  }

  function roundRect(x, y, w, h, radius) {
    const cut = Math.max(0, Math.min(Math.round(radius), Math.floor(w / 4), Math.floor(h / 4)));
    ctx.beginPath();
    ctx.moveTo(x + cut, y);
    ctx.lineTo(x + w - cut, y);
    ctx.lineTo(x + w, y + cut);
    ctx.lineTo(x + w, y + h - cut);
    ctx.lineTo(x + w - cut, y + h);
    ctx.lineTo(x + cut, y + h);
    ctx.lineTo(x, y + h - cut);
    ctx.lineTo(x, y + cut);
    ctx.closePath();
  }

  function loop(now) {
    if (document.hidden) {
      last = now;
      requestAnimationFrame(loop);
      return;
    }

    const frame = Math.min(0.05, (now - last) / 1000);
    last = now;

    if (!running && levelState === "menu") time += frame;

    if (running && !paused) {
      if (hitStop > 0) {
        hitStop = Math.max(0, hitStop - frame);
      } else {
        accumulator += frame;
        while (accumulator >= STEP) {
          update(STEP);
          accumulator -= STEP;
        }
      }
    }

    draw();
    requestAnimationFrame(loop);
  }

  function resetJoystick(keepAim = false) {
    touchStick.active = false;
    touchStick.pointerId = null;
    touchStick.moveX = 0;
    touchStick.down = false;
    touchStick.knobX = 0;
    touchStick.knobY = 0;
    touchStick.baseX = 0;
    touchStick.baseY = 0;
    touchStick.radius = 0;
    if (!keepAim) {
      touchStick.aimX = 1;
      touchStick.aimY = 0;
    }
  }

  function clearControls() {
    for (const key in keys) keys[key] = false;
    for (const key in touchKeys) touchKeys[key] = false;
    for (const key in queuedPresses) queuedPresses[key] = 0;
    pointerActions.clear();
    uiRects.buttons = {};
    resetJoystick(false);
  }

  function canvasPoint(event) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (event.clientX - rect.left) * screenW / Math.max(1, rect.width),
      y: (event.clientY - rect.top) * screenH / Math.max(1, rect.height)
    };
  }

  function updateStickPoint(x, y) {
    if (!touchStick.active || touchStick.radius <= 0) return;
    const max = touchStick.radius * 0.66;
    let dx = x - touchStick.baseX;
    let dy = y - touchStick.baseY;
    const distance = Math.hypot(dx, dy);
    if (distance > max) { dx *= max / distance; dy *= max / distance; }
    touchStick.knobX = dx;
    touchStick.knobY = dy;
    const strength = Math.hypot(dx, dy) / max;
    if (strength > 0.10) {
      const length = Math.hypot(dx, dy) || 1;
      const nx = dx / length;
      const ny = dy / length;
      const down = dy / max > 0.46 && Math.abs(dx / max) < 0.78;
      touchStick.down = down;
      touchStick.aimX = nx;
      touchStick.aimY = ny;
      touchStick.moveX = down || Math.abs(dx / max) < 0.28 ? 0 : Math.sign(dx);
    } else {
      touchStick.moveX = 0;
      touchStick.down = false;
    }
  }

  function refreshTouchActions() {
    for (const code of ["KeyF", "KeyW", "KeyG"]) touchKeys[code] = false;
    for (const codes of pointerActions.values()) {
      for (const code of codes) touchKeys[code] = true;
    }
  }

  function actionCodesAtPoint(point, event) {
    const contactX = Math.max(0, (event.width || 1) * 0.34);
    const contactY = Math.max(0, (event.height || 1) * 0.34);
    const codes = [];

    for (const [code, rect] of Object.entries(uiRects.buttons)) {
      const rx = rect.r * 1.12 + contactX;
      const ry = rect.r * 1.12 + contactY;
      const dx = (point.x - rect.x) / Math.max(1, rx);
      const dy = (point.y - rect.y) / Math.max(1, ry);
      if (dx * dx + dy * dy <= 1) codes.push(code);
    }
    return codes;
  }

  function updateCanvasActions(pointerId, codes) {
    const previous = pointerActions.get(pointerId);
    if (!previous && !codes.length) return false;

    const next = new Set(codes);
    let changed = !previous || previous.size !== next.size;
    if (!changed) {
      for (const code of next) {
        if (!previous.has(code)) {
          changed = true;
          break;
        }
      }
    }

    for (const code of next) {
      if ((!previous || !previous.has(code)) && (code === "KeyW" || code === "KeyG")) {
        queuePress(code);
      }
    }

    if (changed) {
      pointerActions.set(pointerId, next);
      refreshTouchActions();
    }
    return true;
  }

  function releaseCanvasPointer(pointerId) {
    if (touchStick.active && pointerId === touchStick.pointerId) resetJoystick(true);
    if (pointerActions.delete(pointerId)) refreshTouchActions();
  }

  function cycleMenuLevel(delta) {
    menuLevel = (menuLevel + delta + WORLD_ZONES.length) % WORLD_ZONES.length;
    updateLevelSelectionPreview();
    audio.ensure();
    audio.levelStinger(menuLevel);
  }

  function cycleMenuDifficulty(delta) {
    menuDifficulty = (menuDifficulty + delta + DIFFICULTY_OPTIONS.length) % DIFFICULTY_OPTIONS.length;
    updateLevelSelectionPreview();
    audio.tone(330 + menuDifficulty * 55, 0.06, "square", 0.07, 45);
  }

  function activateMenuFocus() {
    if (menuFocus === 0) cycleMenuLevel(1);
    else if (menuFocus === 1) cycleMenuDifficulty(1);
    else if (menuFocus === 2) begin(false);
    else if (menuFocus === 3) begin(true);
    else if (menuFocus === 4) audio.toggleMusic();
    else if (menuFocus === 5) toggleFullscreen();
  }

  canvas.addEventListener("pointerdown", event => {
    event.preventDefault();
    const point = canvasPoint(event);
    audio.ensure();
    try { canvas.setPointerCapture(event.pointerId); } catch (_) {}

    if (!running && levelState === "menu") {
      const m = uiRects.menu;
      if (uiRectContains(m.levelPrev, point.x, point.y)) cycleMenuLevel(-1);
      else if (uiRectContains(m.levelNext, point.x, point.y)) cycleMenuLevel(1);
      else if (uiRectContains(m.diffPrev, point.x, point.y)) cycleMenuDifficulty(-1);
      else if (uiRectContains(m.diffNext, point.x, point.y)) cycleMenuDifficulty(1);
      else if (uiRectContains(m.solo, point.x, point.y)) begin(false);
      else if (uiRectContains(m.coop, point.x, point.y)) begin(true);
      else if (uiRectContains(m.music, point.x, point.y)) audio.toggleMusic();
      else if (uiRectContains(m.fullscreen, point.x, point.y)) toggleFullscreen();
      return;
    }

    if (uiRectContains(uiRects.pause, point.x, point.y)) { togglePause(); return; }
    if (uiRectContains(uiRects.mute, point.x, point.y)) { audio.toggleMusic(); return; }
    if (uiRectContains(uiRects.fullscreen, point.x, point.y)) { toggleFullscreen(); return; }
    if (paused || stageIntro || levelTransition || portalWarp) return;

    if (isTouch) {
      const actionCodes = actionCodesAtPoint(point, event);
      if (updateCanvasActions(event.pointerId, actionCodes)) return;

      if (!touchStick.active && point.x <= screenW * 0.5) {
        const radius = portrait
          ? clamp(screenW * 0.12, 42, 54)
          : clamp(screenH * 0.105, 34, 43);
        touchStick.active = true;
        touchStick.pointerId = event.pointerId;
        touchStick.radius = radius;
        touchStick.baseX = clamp(point.x, safeLeft + radius * 0.72, screenW * 0.5 - radius * 0.35);
        touchStick.baseY = clamp(point.y, safeTop + radius * 0.72, screenH - safeBottom - radius * 0.72);
        updateStickPoint(point.x, point.y);
        return;
      }
    }
  });

  canvas.addEventListener("pointermove", event => {
    const controlsJoystick = touchStick.active && event.pointerId === touchStick.pointerId;
    const controlsActions = pointerActions.has(event.pointerId);
    if (!controlsJoystick && !controlsActions) return;

    event.preventDefault();
    const point = canvasPoint(event);
    if (controlsJoystick) updateStickPoint(point.x, point.y);

    // Recalculate the buttons under this contact on every move. A broad finger
    // can hold B+C together, and either button releases as soon as contact leaves it.
    if (controlsActions) updateCanvasActions(event.pointerId, actionCodesAtPoint(point, event));
  });

  for (const name of ["pointerup", "pointercancel", "lostpointercapture"]) {
    canvas.addEventListener(name, event => {
      event.preventDefault();
      releaseCanvasPointer(event.pointerId);
    });
  }

  addEventListener("keydown", event => {
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(event.code)) event.preventDefault();
    audio.ensure();

    if (!running && levelState === "menu") {
      if (event.repeat) return;
      if (event.code === "ArrowUp" || event.code === "KeyW") menuFocus = (menuFocus + MENU_FOCUS_COUNT - 1) % MENU_FOCUS_COUNT;
      else if (event.code === "ArrowDown" || event.code === "KeyS") menuFocus = (menuFocus + 1) % MENU_FOCUS_COUNT;
      else if (event.code === "ArrowLeft" || event.code === "KeyA") {
        if (menuFocus === 0) cycleMenuLevel(-1); else if (menuFocus === 1) cycleMenuDifficulty(-1);
      } else if (event.code === "ArrowRight" || event.code === "KeyD") {
        if (menuFocus === 0) cycleMenuLevel(1); else if (menuFocus === 1) cycleMenuDifficulty(1);
      } else if (event.code === "Enter" || event.code === "Space") activateMenuFocus();
      else if (event.code === "KeyM") audio.toggleMusic();
      else if (event.code === "KeyX") toggleFullscreen();
      return;
    }

    keys[event.code] = true;
    if (!event.repeat && ["KeyW", "KeyG", "ArrowUp", "KeyL"].includes(event.code)) queuePress(event.code);
    if (!event.repeat && (event.code === "Escape" || event.code === "KeyP")) togglePause();
    if (!event.repeat && event.code === "KeyM") audio.toggleMusic();
    if (!event.repeat && event.code === "KeyX") toggleFullscreen();
  });

  addEventListener("keyup", event => { keys[event.code] = false; });
  addEventListener("blur", () => {
    clearControls();
    last = performance.now();
    if (running && !paused) togglePause();
  });
  document.addEventListener("visibilitychange", () => {
    clearControls();
    last = performance.now();
    if (document.hidden && running && !paused) togglePause();
  });

  setupLevel();
  updateLevelSelectionPreview();
  levelState = "menu";
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
