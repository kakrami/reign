      if (this.iceAction) {
        this.updateIceAction(dt);
        return;
      }
      super.update(dt);
      if (!this.dead) this.y = terrainSurfaceY(this.cx) - this.h;
    }

    startIceCharge() {
      const target = this.target();
      const direction = target && target.cx < this.cx ? -1 : 1;
      this.iceAction = { direction, speed: 190, turn: difficulty.bossComboMode >= 2 && this.combatTier >= 2 };
      this.contactTimer = 0;
      this.stepTimer = 0;
      this.arenaLock = "arena";
      audio.tone(78, 0.38, "sawtooth", 0.14, 175);
    }

    iceField() {
      const target = this.target();
      const count = Math.max(5, 6 + this.combatTier + bossPatternBonus());
      const span = this.arenaRight - this.arenaLeft - 180;
      const safe = target ? clamp(Math.floor((target.cx - this.arenaLeft - 90) / Math.max(1, span) * count), 0, count - 1) : Math.floor(count / 2);
      for (let i = 0; i < count; i++) {
        if (Math.abs(i - safe) <= 0) continue;
        const x = this.arenaLeft + 90 + span * (i + 0.5) / count;
        hazards.push(new ArenaEruption(x, "ice", this.profile.accent, 0.30 + Math.abs(i - safe) * 0.07, 0.50, 70, 155 + this.combatTier * 18, 19 + this.combatTier * 2));
      }
      audio.tone(410, 0.28, "triangle", 0.11, -180);
    }

    avalanche() {
      const living = players.filter(player => !player.dead);
      const count = scaledEncounterCount(2, 3, 4, 5) + Math.floor(this.combatTier / 2);
      for (let i = 0; i < count; i++) {
        const target = living[i % Math.max(1, living.length)] || this.target();
        const x = clamp((target ? target.cx : this.cx) + (i - (count - 1) / 2) * 92, this.arenaLeft + 70, this.arenaRight - 70);
        debris.push(new FallingDebris(x, gameplaySimulationView().top - 120 - i * 30, 34 + (i % 3) * 8, true));
      }
      hazards.push(new ArenaEruption(clamp(this.target()?.cx ?? this.cx, this.arenaLeft + 120, this.arenaRight - 120), "ice", this.profile.accent, 0.78, 0.46, 92, 190, 22));
      audio.tone(118, 0.32, "sawtooth", 0.12, -70);
    }

    updateIceAction(dt) {
      this.updatePassiveState(dt, false);
      this.contactTimer = Math.max(0, this.contactTimer - dt);
      const action = this.iceAction;
      action.speed = Math.min(550 + this.combatTier * 60, action.speed + (840 + this.combatTier * 115) * dt);
      this.x += action.direction * action.speed * dt;
      this.y = terrainSurfaceY(this.cx) - this.h;
      this.stepTimer -= dt;
      if (this.stepTimer <= 0) {
        this.stepTimer = 0.32;
        const trailX = action.direction > 0 ? this.x + 25 : this.x + this.w - 25;
        hazards.push(new ArenaEruption(trailX, "ice", this.profile.accent, 0.34, 0.34, 56, 105, 15 + this.combatTier));
        burst(trailX, terrainSurfaceY(trailX) - 8, "#d6fbff", 5, 110);
      }
      if (this.contactTimer <= 0) {
        for (const player of players) {
          if (!player.dead && this.overlaps(player)) {
            player.hit((24 + this.combatTier * 3) * enemyDamageScale(), action.direction);
            player.knockbackX = action.direction * 300;
            this.contactTimer = 0.34;
            audio.impact(1.45, "metal");
          }
        }
      }
      const edge = action.direction < 0 ? this.arenaLeft + 55 : this.arenaRight - this.w - 55;
      const reached = action.direction < 0 ? this.x <= edge : this.x >= edge;
      if (reached) {
        this.x = edge;
        const impactX = action.direction < 0 ? this.x : this.x + this.w;
        hazards.push(new ArenaEruption(impactX, "ice", this.profile.accent, 0.05, 0.46, 100, 205, 22 + this.combatTier * 2));
        blastEffects.push(new BlastEffect(impactX, terrainSurfaceY(impactX) - 20, this.profile.accent, 2));
        audio.crash(1.5);
        if (action.turn) {
          action.turn = false;
          action.direction *= -1;
          action.speed = 230;
        } else {
          this.iceAction = null;
          this.attackTimer = Math.max(this.attackTimer, 0.92);
        }
      }
    }
  }

  class ReignEmperorBoss extends StageBoss {
    constructor(key, x) {
      super(key, x);
      this.arenaLock = "arena";
      this.emperorAction = null;
      this.slashTimer = 0;
      this.dashTrail = [];
    }

    displayFacing() {
      if (this.emperorAction && ["windup", "dash"].includes(this.emperorAction.mode)) return this.facing;
      return super.displayFacing();
    }

    attackDefinition(name) {
      if (name === "phaseDash") return [() => this.startPhaseDash(), 0.62];
      if (name === "gearWall") return [() => this.gearWall(), 0.66];
      if (name === "echoes") return [() => this.timeEchoes(), 0.62];
      return super.attackDefinition(name);
    }

    update(dt) {
      this.dashTrail = this.dashTrail.filter(trail => (trail.life -= dt) > 0);
      if (this.emperorAction) {
        this.updateEmperorAction(dt);
        return;
      }
      super.update(dt);
      this.slashTimer = Math.max(0, this.slashTimer - dt);
      if (!this.dead) this.y = terrainSurfaceY(this.cx) - this.h;
    }

    startPhaseDash() {
      const target = this.target();
      const side = target && target.cx < (this.arenaLeft + this.arenaRight) * 0.5 ? 1 : -1;
      const desiredDestination = clamp((target ? target.cx : this.cx) + side * 230, this.arenaLeft + 100, this.arenaRight - this.w - 100);
      const destination = clamp(desiredDestination, this.x - 420, this.x + 420);
      this.emperorAction = {
        mode: "windup",
        timer: 0.30,
        startX: this.x,
        destination,
        struck: false,
        trailTimer: 0
      };
      this.arenaLock = "arena";
      this.facing = destination < this.x ? -1 : 1;
      audio.tone(540, 0.20, "square", 0.10, -300);
    }

    gearWall() {
      const base = terrainSurfaceY((this.arenaLeft + this.arenaRight) * 0.5);
      hazards.push(new ClockworkSweeper(this.arenaLeft - 90, this.arenaRight + 90, base, 1, "low", this.profile.accent, 0.18, 21 + this.combatTier * 2));
      hazards.push(new ClockworkSweeper(this.arenaRight + 90, this.arenaLeft - 90, base, -1, "high", "#ff8df4", 0.92, 19 + this.combatTier * 2));
      if (difficulty.bossComboMode >= 2 && this.combatTier >= 2) hazards.push(new ClockworkSweeper(this.arenaLeft - 90, this.arenaRight + 90, base, 1, "low", "#63e5ff", 1.58, 22));
      audio.tone(170, 0.30, "sawtooth", 0.12, 110);
    }

    timeEchoes() {
      const echoCount = scaledEncounterCount(1, 1, 2, 3);
      const positions = echoCount === 1 ? [0.50] : echoCount === 2 ? [0.30, 0.70] : echoCount === 3 ? [0.24, 0.50, 0.76] : [0.18, 0.39, 0.61, 0.82];
      positions.forEach((share, index) => {
        const x = this.arenaLeft + (this.arenaRight - this.arenaLeft) * share;
        const y = terrainSurfaceY(x) - this.h - (index === 1 ? 70 : 20);
        debris.push(new TimeEcho(x, y, this.profile, index * 0.28, 13 + this.combatTier * 2));
      });
      audio.tone(360, 0.28, "triangle", 0.11, 210);
    }

    updateEmperorAction(dt) {
      this.updatePassiveState(dt, false);
      this.slashTimer = Math.max(0, this.slashTimer - dt);
      const action = this.emperorAction;
      action.timer -= dt;

      if (action.mode === "windup") {
        this.bodyLean = (this.bodyLean || 0) + ((this.facing < 0 ? -0.08 : 0.08) - (this.bodyLean || 0)) * (1 - Math.exp(-10 * dt));
        if (action.timer <= 0) {
          action.mode = "dash";
          action.timer = 0.48;
          action.duration = 0.48;
          action.startX = this.x;
          action.trailTimer = 0;
        }
        return;
      }

      if (action.mode === "dash") {
        const progress = clamp(1 - action.timer / action.duration, 0, 1);
        const eased = smoothStep(progress);
        this.x = mix(action.startX, action.destination, eased);
        this.y = terrainSurfaceY(this.cx) - this.h;
        action.trailTimer -= dt;
        if (action.trailTimer <= 0) {
          action.trailTimer = 0.045;
          this.dashTrail.push({ x: this.x, y: this.y, facing: this.facing, life: 0.22, maxLife: 0.22 });
        }
        if (!action.struck && progress >= 0.62) {
          action.struck = true;
          this.executePhaseSlash();
        }
        if (action.timer <= 0) {
          this.x = action.destination;
          action.mode = "recover";
          action.timer = 0.38;
        }
        return;
      }

      this.bodyLean = (this.bodyLean || 0) * Math.exp(-9 * dt);
      if (action.timer <= 0) {
        this.emperorAction = null;
        this.attackTimer = Math.max(this.attackTimer, 0.88);
      }
    }

    executePhaseSlash() {
      const target = this.target();
      const facing = target && target.cx < this.cx ? -1 : 1;
      this.facing = facing;
      this.slashTimer = 0.30;
      const left = facing < 0 ? this.x - 180 : this.x + this.w - 20;
      const right = facing < 0 ? this.x + 20 : this.x + this.w + 180;
      const top = this.y + 45;
      const bottom = this.y + this.h + 35;
      for (const player of players) {
        if (!player.dead && player.x < right && player.x + player.w > left && player.y < bottom && player.y + player.h > top) {
          player.hit((27 + this.combatTier * 3) * enemyDamageScale(), facing);
          player.knockbackX = facing * 340;
        }
      }
      blastEffects.push(new BlastEffect(facing < 0 ? this.x : this.x + this.w, this.cy, this.profile.accent, 2));
      audio.tone(92, 0.18, "sawtooth", 0.14, 310);
    }

    drawBody(alpha = 1, x = this.x, y = this.y, facing = this.facing) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(x + this.w / 2, y + this.h / 2);
      ctx.rotate(this.bodyLean || 0);
      ctx.scale(facing * (BOSS_FORM_BASE_FACING[this.profile.form] || 1), 1);
      drawBossForm(this.profile, this.phase, false);
      ctx.restore();
    }

    draw() {
      for (const trail of this.dashTrail) {
        this.drawBody(0.20 * clamp(trail.life / trail.maxLife, 0, 1), trail.x, trail.y, trail.facing);
      }

      ctx.save();
      ctx.translate(this.cx, this.cy);
      ctx.rotate(this.bodyLean || 0);
      if (this.flashTimer > 0) ctx.globalAlpha = 0.62;
      ctx.scale(this.visualFacingScale(), 1);
      drawBossForm(this.profile, this.phase, this.telegraphTimer > 0 && Math.floor(this.telegraphTimer * 10) % 2 === 0);
      ctx.restore();

      if (this.slashTimer > 0) {
        const facing = this.facing;
        ctx.save();
        ctx.translate(this.cx, this.cy);
        ctx.strokeStyle = "#fff36d";
        ctx.lineWidth = 18;
        ctx.globalAlpha = clamp(this.slashTimer / 0.30, 0, 1);
        ctx.beginPath();
        ctx.arc(facing * 35, 15, 150, facing < 0 ? Math.PI * 0.55 : -Math.PI * 0.45, facing < 0 ? Math.PI * 1.45 : Math.PI * 0.45);
        ctx.stroke();
        ctx.restore();
      }
      drawBossTelegraph(this);
    }
  }

  class RivalHunter extends StageBoss {
    constructor(stage, x, finalEncounter = false) {
      super("reignHunter", x);
      const gadget = RIVAL_GADGETS[clamp(stage | 0, 0, RIVAL_GADGETS.length - 1)];
      this.stage = clamp(stage | 0, 0, RIVAL_GADGETS.length - 1);

          : [...gadget.attacks],
        cadence: this.finalEncounter ? 2.05 : Math.max(1.75, 2.35 - this.stage * 0.08),

      };

      this.maxHealth = (this.finalEncounter ? 2850 : 540 + this.stage * 140) * enemyHealthScale(true);
      this.health = this.maxHealth;
      this.score = this.finalEncounter ? 24500 : 1100 + this.stage * 350;
      this.arenaLock = this.finalEncounter;
      this.hudHidden = false;

      this.duration = this.finalEncounter ? Infinity : 7.5 + this.stage * 0.35;
      this.exitX = x + Math.max(980, 1320 - this.stage * 45);
      this.baseX = x;
      this.attackTimer = this.finalEncounter ? 1.45 : 1.0;
      this.introTimer = this.finalEncounter ? 1.0 : 0.55;
      this.combatTier = this.finalEncounter ? 0 : Math.min(1, Math.floor(this.stage / 3));

    }

    displayFacing() {
      if (this.retreating) {
        this.facing = 1;
        return this.facing;
      }
      return super.displayFacing();
    }

    update(dt) {
      if (this.retreating) {
        this.phase += dt;
        this.retreatTimer -= dt;
        this.x += (430 + this.stage * 24) * dt;
        this.y -= (180 + this.stage * 12) * dt;
        if (this.retreatTimer <= 0 && activeBoss === this) {
          activeBoss = null;
          if (bossArena && bossArena.boss === this) bossArena.beginExit();
        }
        return;
      }

      if (this.finalEncounter) {
        const tier = clamp(this.combatTier, 0, 2);
        const phaseGadget = tier >= 2 ? RIVAL_GADGETS[5] : tier === 1 ? RIVAL_GADGETS[4] : RIVAL_GADGETS[2];
        this.profile.gadget = phaseGadget.id;
        this.profile.accent = phaseGadget.accent;
        this.profile.attacks = tier >= 2
          ? [...RIVAL_GADGETS[5].attacks]
          : tier === 1
            ? [...RIVAL_GADGETS[4].attacks, "laser"]
            : [...RIVAL_GADGETS[2].attacks];
        super.update(dt);
        return;
      }

      const target = this.target();
      if (!target) return;
      if (this.introTimer <= 0) this.duration -= dt;

      const desiredX = clamp(
        Math.max(this.baseX, target.cx + visibleWorldW * 0.48),
        target.cx + 420,
        Math.min(LEVEL_W - this.w - 100, target.cx + visibleWorldW * 0.72)
      );
      this.x += (desiredX - this.x) * (1 - Math.exp(-3.6 * dt));
      this.baseY = terrainSurfaceY(this.cx) - this.h - 165 - Math.sin(this.phase * 0.6) * 18;

      if (this.duration <= 0 || target.cx >= this.exitX) {
        this.beginRetreat(false);
        return;
      }

      super.update(dt);
    }

    beginRetreat(damagedOut, owner = 0) {
      if (this.retreating) return;
      this.retreating = true;
      this.retreatTimer = 1.15;
      this.hudHidden = true;
      this.pendingAttack = null;
      this.pendingAttackName = null;
      this.pendingAttackCombo = false;
      this.telegraphTimer = 0;
      this.clearTelegraph();
      this.comboTimer = 0;
      this.comboAttackName = null;
      this.health = Math.max(0, this.health);
      burst(this.cx, this.cy, this.profile.accent, damagedOut ? 24 : 13, damagedOut ? 280 : 190);
      blastEffects.push(new BlastEffect(this.cx, this.cy, this.profile.accent, damagedOut ? 2 : 1));
      audio.tone(260, 0.24, "sawtooth", 0.11, 260);

      if (damagedOut) {
        if (players[owner]) players[owner].addScore(this.score);
        if (this.stage === 1 || this.stage === 3) {
          spawnPickup(this.cx - 20, terrainSurfaceY(this.cx) - 78, "health", true);
        } else if (this.stage === 4) {
          spawnPickup(this.cx - 20, terrainSurfaceY(this.cx) - 78, "special", true);
        }
      } else {
      }
    }

    hit(damage, owner) {
      if (this.finalEncounter) {
        super.hit(damage, owner);
        return;
      }
      if (this.introTimer > 0 || this.retreating) return;
      this.health -= damage;
      this.flashTimer = 0.065;
      burst(rand(this.x, this.x + this.w), rand(this.y, this.y + this.h), "#ffe081", 3, 145);
      if (damage >= 45) impactFeedback(0.018);
      if (this.health <= 0) this.beginRetreat(true, owner);
      else audio.bossHit(damage);
    }

    draw() {
      ctx.save();
      if (this.retreating) ctx.globalAlpha = clamp(this.retreatTimer / 0.85, 0, 1);
      ctx.translate(this.cx, this.cy);
      if (this.retreating) {
        this.facing = 1;
        ctx.rotate(-0.18);
      }
      ctx.scale(this.visualFacingScale(), 1);
      if (this.flashTimer > 0) ctx.globalAlpha *= 0.62;
      drawBossForm(this.profile, this.phase, this.telegraphTimer > 0 && Math.floor(this.telegraphTimer * 10) % 2 === 0);
      ctx.restore();
      if (!this.retreating) drawBossTelegraph(this);
    }
  }

  class BlastEffect {
    constructor(x, y, color, tier = 1) {
      this.x = x;
      this.y = y;
      this.w = 1;
      this.h = 1;
      this.color = color;
      this.tier = tier;
      this.life = tier >= 3 ? 1.05 : tier === 2 ? 0.78 : 0.48;
      this.maxLife = this.life;
      this.dead = false;
      this.seed = rand(0, 1000);
    }

    update(dt) {
      this.life -= dt;
      if (this.life <= 0) this.dead = true;
    }

    draw() {
      const t = 1 - this.life / this.maxLife;
      const radius = (28 + this.tier * 30) * (0.35 + t * 1.25);
      ctx.save(); ctx.translate(this.x, this.y);
      ctx.globalAlpha = clamp(1 - t, 0, 1);
      ctx.strokeStyle = this.color; ctx.lineWidth = Math.max(4, 13 - t * 8);
      ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = "#fff36d"; ctx.lineWidth = Math.max(3, 8 - t * 5);
      ctx.beginPath(); ctx.arc(0, 0, radius * 0.62, 0, Math.PI * 2); ctx.stroke();
      const blocks = 7 + this.tier * 3;
      for (let i = 0; i < blocks; i++) {
        const angle = i * Math.PI * 2 / blocks + this.seed;
        const distance = radius * (0.25 + ((i * 37) % 70) / 100);
        const size = Math.max(5, 18 - t * 10 + this.tier * 2);
        ctx.fillStyle = i % 3 === 0 ? "#fff2a4" : i % 2 ? this.color : "#ff6a42";
        ctx.fillRect(Math.cos(angle) * distance - size / 2, Math.sin(angle) * distance - size / 2, size, size);
      }
      ctx.globalAlpha *= 0.55;
      ctx.fillStyle = "#403b49";
      for (let i = 0; i < 4 + this.tier; i++) {
        const x = ((i * 43 + this.seed) % 120) - 60;
        const y = -t * 65 - i * 12;
        const s = 20 + i * 5;
        ctx.fillRect(x - s / 2, y - s / 2, s, s);
      }
      ctx.restore();
    }
  }

  class BossDeathSequence {

      this.maxLife = this.life;
      this.nextBlast = 0;
      this.blastIndex = 0;
      this.dead = false;
      audio.bossExplosion();

    update(dt) {
      this.life -= dt;
      this.phase += dt * 2;
      this.nextBlast -= dt;
      if (this.nextBlast <= 0 && this.life > 0.22) {
        this.nextBlast = this.profile.campaignFinal ? 0.10 : 0.14;
        const index = this.blastIndex++;
        const angle = index * 2.31;
        const rx = Math.cos(angle) * this.w * (0.18 + (index % 3) * 0.10);
        const ry = Math.sin(angle * 1.37) * this.h * 0.32;
        explode(this.x + this.w / 2 + rx, this.y + this.h / 2 + ry, this.profile.accent, 26, false, 2);
      }
      if (this.life <= 0.34 && !this.finalBlast) {
        this.finalBlast = true;
        explode(this.x + this.w / 2, this.y + this.h / 2, this.profile.accent, 82, false, 3);
      }
      if (this.life <= 0) this.dead = true;
    }

    draw() {
      const t = 1 - this.life / this.maxLife;
      ctx.save();
      ctx.translate(this.x + this.w / 2, this.y + this.h / 2 + t * 58);
      ctx.rotate(Math.sin(t * 16) * 0.08 + t * 0.18);
      ctx.scale(this.facingScale * (1 - t * 0.18), 1 - t * 0.06);
      ctx.globalAlpha = clamp(1 - t * 0.82, 0, 1);
      drawBossForm(this.profile, this.phase, false);
      ctx.restore();
    }

  class BossVictoryScene {
    constructor(boss) {
      this.x = boss.x;
      this.y = boss.y;
      this.w = boss.w;
      this.h = boss.h;
      this.name = boss.name;
      this.profile = boss.profile;
      this.major = Number.isInteger(boss.profile.levelEnd) || boss.profile.campaignFinal;
      this.final = Boolean(boss.profile.campaignFinal);
      this.duration = this.final ? 6.4 : this.major ? 5.0 : 3.8;
      this.life = this.duration;
      this.elapsed = 0;
      this.dead = false;
      this.nextBurst = 0.32;
      this.nextFirework = 1.05;
      this.showFlyover = this.major;
      this.flyoverProgress = 0;
      this.medalSpin = 0;
      this.bossScore = boss.score;
      this.bonus = Math.round(boss.score * (this.major ? 0.5 : 0.25));
      bannerUntil = 0;
      bannerText = "";

      levelState = "victory";
      enemyBullets = [];
      bullets = [];
      for (const player of players) {
        if (player.dead) continue;
        player.entryTimer = Math.max(player.entryTimer, this.duration);
        player.victoryPose = this.duration;
        player.invuln = Math.max(player.invuln, this.duration);
        player.addScore(this.bonus);
      }
      audio.victoryFanfare(this.major, this.final);
    }

    update(dt) {
      this.elapsed += dt;
      this.life -= dt;
      this.medalSpin += dt * 3.4;
      if (this.showFlyover) {
        const travelDuration = Math.max(1, this.duration - 1.1);
        this.flyoverProgress = clamp((this.elapsed - 0.55) / travelDuration, 0, 1);
      }

      this.nextBurst -= dt;
      if (this.nextBurst <= 0 && this.life > 0.7) {
        this.nextBurst = this.final ? 0.13 : this.major ? 0.18 : 0.26;
        const angle = this.elapsed * 4.7 + this.nextBurst * 13;
        const x = this.x + this.w / 2 + Math.cos(angle) * this.w * 0.48;
        const y = this.y + this.h / 2 + Math.sin(angle * 1.37) * this.h * 0.42;
        blastEffects.push(new BlastEffect(x, y, this.profile.accent, chance(this.major ? 0.45 : 0.22) ? 2 : 1));
        burst(x, y, chance(0.5) ? "#fff36d" : this.profile.accent, this.major ? 13 : 8, 190);
      }

      this.nextFirework -= dt;
      if (this.elapsed > 1.1 && this.nextFirework <= 0) {
        this.nextFirework = this.final ? 0.24 : this.major ? 0.38 : 0.55;
        const simulationView = gameplaySimulationView();
        const x = simulationView.left + simulationView.width * rand(0.18, 0.82);
        const y = simulationView.top + simulationView.height * rand(0.15, 0.42);
        blastEffects.push(new BlastEffect(x, y, chance(0.5) ? "#63e5ff" : "#fff36d", this.major ? 2 : 1));
        audio.toneAt(rand(330, 620), 0.08, "square", 0.045, rand(-80, 120));
      }

      if (this.life <= 0) {
        this.dead = true;
        for (const player of players) {
          player.entryTimer = 0;
          player.victoryPose = 0;
        }
        if (Number.isInteger(this.profile.levelEnd) && !this.final) {
          startLevelTransition(this.profile.levelEnd + 1);
        } else if (this.final) {
          endingScene = new CampaignEndingScene();
        } else {
          levelState = "onfoot";
        }
      }
    }

    drawWorld() {
      if (!this.showFlyover || this.flyoverProgress <= 0) return;
      const eased = this.flyoverProgress * this.flyoverProgress * (3 - 2 * this.flyoverProgress);
      const craftX = cameraX - 150 + (visibleWorldW + 300) * eased;
      const craftY = cameraY + visibleWorldH * 0.22 + Math.sin(this.elapsed * 4) * 7;
      ctx.save();
      ctx.translate(craftX, craftY);
      ctx.fillStyle = "#17243a";
      ctx.fillRect(-95, -18, 190, 36);
      ctx.fillStyle = "#314b70";
      ctx.fillRect(-52, -36, 104, 72);
      ctx.fillStyle = "#63e5ff";
      ctx.fillRect(-25, -42, 50, 9);
      ctx.fillStyle = "#fff36d";
      ctx.fillRect(88, -7, 22, 14);
      ctx.fillStyle = "#ff7848";
      ctx.fillRect(-116, -6, 23, 12);
      ctx.restore();
    }

    drawOverlay() {
      const width = screenW;
      const height = screenH;
      const scale = uiScaleFactor();
      const reveal = clamp(this.elapsed / 0.45, 0, 1);
      const exit = clamp(this.life / 0.45, 0, 1);
      const alpha = Math.min(reveal, exit);
      const victoryTitle = this.final ? "MISSION COMPLETE" : this.major ? "GUARDIAN DOWN" : "BOSS DOWN";

      ctx.save();
      ctx.globalAlpha = alpha;
      const panelW = Math.min(width * 0.84, 520 * scale);
      const panelH = 106 * scale;
      const x = width / 2 - panelW / 2;
      const y = Math.max(12 * scale + safeTop, height * 0.11);
      drawPixelPanel(x, y, panelW, panelH, "rgba(5,13,23,.94)", this.final ? "#fff36d" : this.profile.accent, true);

      drawUiIcon(this.final ? "special" : "check", x + 38 * scale, y + 36 * scale, 24 * scale, this.final ? "#fff36d" : this.profile.accent, 3 * scale);
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillStyle = this.final ? "#fff36d" : "#f4f1d0";
      ctx.font = `900 ${fitCanvasText(victoryTitle, panelW - 104 * scale, 23 * scale, 14 * scale)}px ${UI_FONT}`;
      ctx.fillText(victoryTitle, x + 74 * scale, y + 28 * scale);
      ctx.fillStyle = "#9db3bd";
      ctx.font = `800 ${fitCanvasText(this.name, panelW - 104 * scale, 11 * scale, 8 * scale)}px ${UI_FONT}`;
      ctx.fillText(this.name, x + 74 * scale, y + 52 * scale);

      const metricY = y + 80 * scale;
      drawUiIcon("score", x + 78 * scale, metricY, 9 * scale, "#63e5ff", 1.5 * scale);
      ctx.fillStyle = "#dce8ee";
      ctx.font = `800 ${9 * scale}px ${UI_FONT}`;
      ctx.fillText(`+${this.bossScore}`, x + 90 * scale, metricY + 0.5 * scale);
      drawUiIcon("special", x + 175 * scale, metricY, 9 * scale, "#fff36d", 1.4 * scale);
      ctx.fillStyle = "#fff36d";
      ctx.fillText(`+${this.bonus}`, x + 187 * scale, metricY + 0.5 * scale);

      if (this.major && this.elapsed > 1.15) {
        const medalY = height * 0.58;
        const radius = clamp(Math.min(width, height) * 0.055, 22 * scale, 42 * scale);
        ctx.save();
        ctx.translate(width / 2, medalY);
        ctx.rotate(Math.sin(this.medalSpin) * 0.09);
        ctx.strokeStyle = this.profile.accent;
        ctx.lineWidth = Math.max(3 * scale, radius * 0.12);
        ctx.strokeRect(-radius, -radius, radius * 2, radius * 2);
        ctx.rotate(Math.PI / 4);
        ctx.strokeStyle = "#fff36d";
        ctx.strokeRect(-radius * 0.62, -radius * 0.62, radius * 1.24, radius * 1.24);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(-radius * 0.10, -radius * 0.55, radius * 0.20, radius * 1.10);
        ctx.fillRect(-radius * 0.55, -radius * 0.10, radius * 1.10, radius * 0.20);
        ctx.restore();
      }
      ctx.restore();
    }
  }

  class CampaignEndingScene {
    constructor() {
      this.duration = 12.4;
      this.elapsed = 0;
      this.dead = false;
      this.profile = (localPlayer() || players[0]) ? (localPlayer() || players[0]).profile : CHARACTER_PROFILES[menuCharacter];
      this.score = players.reduce((sum, player) => sum + player.score, 0);
      this.cue = 0;
      this.stars = Array.from({ length: 90 }, () => ({
        x: Math.random(), y: Math.random() * 0.62, r: rand(0.5, 1.8), a: rand(0.25, 0.9)
      }));
      levelState = "ending";
      enemyBullets = [];
      bullets = [];
      hazards = [];
      debris = [];
      specialAttack = null;
      clearControls();
      audio.stopMusic();
      audio.toneAt(98, 0.85, "sawtooth", 0.10, 85);
    }

    update(dt) {
      this.elapsed += dt;
      if (this.cue === 0 && this.elapsed >= 2.7) {
        this.cue = 1;
        audio.crash(1.55);
        audio.toneAt(196, 0.28, "square", 0.09, 210, 0.18);
      } else if (this.cue === 1 && this.elapsed >= 5.7) {
        this.cue = 2;
        audio.toneAt(147, 0.55, "triangle", 0.10, 145);
        audio.toneAt(220, 0.55, "triangle", 0.08, 120, 0.18);
      } else if (this.cue === 2 && this.elapsed >= 8.8) {
        this.cue = 3;
        audio.victoryFanfare(true, true);
      }
      if (this.elapsed >= this.duration) this.complete();
    }

    skip() {
      if (this.elapsed < 1.25) return;
      this.complete();
    }

    complete() {
      if (this.dead) return;
      this.dead = true;
      endingScene = null;
      finish(true);
    }

    phaseAlpha(start, end, fade = 0.45) {
      const enter = clamp((this.elapsed - start) / fade, 0, 1);
      const leave = clamp((end - this.elapsed) / fade, 0, 1);
      return Math.min(enter, leave);
    }

    drawCraft(x, y, scale = 1, flame = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.fillStyle = "#141d2d";
      ctx.fillRect(-86, -19, 172, 38);
      ctx.fillStyle = "#334b6d";
      ctx.fillRect(-48, -34, 96, 68);
      ctx.fillStyle = "#63e5ff";
      ctx.fillRect(-22, -40, 44, 9);
      ctx.fillStyle = "#7189a8";
      ctx.fillRect(-76, 19, 42, 10);
      ctx.fillRect(34, 19, 42, 10);
      ctx.fillStyle = "#fff36d";
      ctx.fillRect(72, -7, 18, 14);
      ctx.globalAlpha = 0.72 + Math.sin(this.elapsed * 18) * 0.18;
      ctx.fillStyle = "#ff6a42";
      ctx.fillRect(-102 - flame * 16, -8, 18 + flame * 18, 16);
      ctx.fillStyle = "#fff36d";
      ctx.fillRect(-96 - flame * 8, -4, 14 + flame * 8, 8);
      ctx.restore();
    }

    drawOperative(x, y, scale = 1, runningPose = 0) {
      const p = this.profile;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.fillStyle = "rgba(0,0,0,.35)";
      ctx.beginPath(); ctx.ellipse(0, 7, 25, 7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = p.armor;
      ctx.fillRect(-14, -47, 28, 34);
      ctx.fillStyle = p.color;
      ctx.fillRect(-18, -39, 6, 21);
      ctx.fillRect(12, -39, 6, 21);
      ctx.fillStyle = p.helmet;
      ctx.fillRect(-15, -65, 30, 20);
      ctx.fillStyle = p.visor;
      ctx.fillRect(-11, -59, 22, 6);
      const swing = Math.sin(runningPose) * 8;
      ctx.fillStyle = p.armor;
      ctx.fillRect(-13 + swing * 0.22, -13, 9, 22);
      ctx.fillRect(4 - swing * 0.22, -13, 9, 22);
      ctx.fillStyle = p.accent;
      ctx.fillRect(13, -37, 27, 7);
      ctx.restore();
    }

    drawCitadelCollapse(w, h) {
      const alpha = this.phaseAlpha(0, 3.35, 0.35);
      ctx.globalAlpha = alpha;
      const sky = ctx.createLinearGradient(0, 0, 0, h);
      sky.addColorStop(0, "#12051f");
      sky.addColorStop(0.64, "#301047");
      sky.addColorStop(1, "#06040b");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h);
      for (const star of this.stars) {
        ctx.globalAlpha = alpha * star.a;
        ctx.fillStyle = "#ff8df4";
        ctx.fillRect(star.x * w, star.y * h, star.r, star.r);
      }
      ctx.globalAlpha = alpha;
      const ground = h * 0.79;
      ctx.fillStyle = "#09070d";
      ctx.fillRect(0, ground, w, h - ground);
      const collapse = clamp(this.elapsed / 3.1, 0, 1);
      ctx.save();
      ctx.translate(w * 0.72, ground);
      ctx.rotate(collapse * 0.18);
      ctx.fillStyle = "#21152d";
      ctx.fillRect(-w * 0.13, -h * 0.54, w * 0.26, h * 0.54);
      ctx.fillStyle = "#ff8df4";
      for (let y = -h * 0.48; y < -30; y += 42) ctx.fillRect(-w * 0.09, y, w * 0.18, 5);
      ctx.strokeStyle = "#fff36d";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-20, -h * 0.5); ctx.lineTo(15, -h * 0.38); ctx.lineTo(-8, -h * 0.24); ctx.lineTo(32, -h * 0.10);
      ctx.stroke();
      ctx.restore();
      const runnerX = w * (0.08 + clamp(this.elapsed / 3.1, 0, 1) * 0.48);
      this.drawOperative(runnerX, ground - 2, clamp(Math.min(w, h) / 530, 0.72, 1.2), this.elapsed * 15);
      ctx.fillStyle = "#fff36d";
      ctx.textAlign = "center";
      ctx.font = `900 ${clamp(Math.min(w, h) * 0.045, 20, 38)}px ${UI_FONT}`;
      ctx.fillText("CITADEL COLLAPSING", w / 2, h * 0.13);
      ctx.globalAlpha = 1;
    }

    drawExtraction(w, h) {
      const alpha = this.phaseAlpha(3.0, 6.45, 0.45);
      ctx.globalAlpha = alpha;
      const sky = ctx.createLinearGradient(0, 0, 0, h);
      sky.addColorStop(0, "#081126");
      sky.addColorStop(0.62, "#172c4a");
      sky.addColorStop(1, "#090a10");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h);
      const ground = h * 0.78;
      ctx.fillStyle = "#0d1119";
      ctx.fillRect(0, ground, w, h - ground);
      const local = this.elapsed - 3.0;
      const craftX = w * (0.92 - clamp(local / 1.7, 0, 1) * 0.45);
      const craftY = h * (0.34 + Math.sin(local * 3.5) * 0.012);
      this.drawCraft(craftX, craftY, clamp(Math.min(w, h) / 470, 0.72, 1.28), 0.65);
      const playerX = w * (0.22 + clamp(local / 2.4, 0, 1) * 0.31);
      this.drawOperative(playerX, ground - 1, clamp(Math.min(w, h) / 540, 0.68, 1.12), local * 16);
      const beamAlpha = clamp((local - 1.0) / 0.45, 0, 1) * clamp((2.8 - local) / 0.55, 0, 1);
      ctx.globalAlpha = alpha * beamAlpha * 0.42;
      ctx.fillStyle = "#63e5ff";
      ctx.beginPath();
      ctx.moveTo(craftX - 26, craftY + 28);
      ctx.lineTo(craftX + 28, craftY + 28);
      ctx.lineTo(playerX + 32, ground);
      ctx.lineTo(playerX - 32, ground);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = "#63e5ff";
      ctx.textAlign = "center";
      ctx.font = `900 ${clamp(Math.min(w, h) * 0.043, 19, 36)}px ${UI_FONT}`;
      ctx.fillText("EXTRACTION", w / 2, h * 0.14);
      ctx.globalAlpha = 1;
    }

    drawDawn(w, h) {
      const alpha = this.phaseAlpha(6.05, 9.55, 0.5);
      ctx.globalAlpha = alpha;
      const sky = ctx.createLinearGradient(0, 0, 0, h);
      sky.addColorStop(0, "#071024");
      sky.addColorStop(0.55, "#29486d");
      sky.addColorStop(0.78, "#ff9a5f");
      sky.addColorStop(1, "#25172a");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#ffd86a";
      ctx.beginPath(); ctx.arc(w * 0.74, h * 0.57, Math.min(w, h) * 0.09, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#10131d";
      for (let i = 0; i < 18; i++) {
        const bw = w / 18 + 2;
        const bh = h * (0.13 + ((i * 37) % 21) / 100);
        ctx.fillRect(i * w / 18, h * 0.78 - bh, bw, bh + h * 0.22);
      }
      const local = this.elapsed - 6.05;
      const craftX = -120 + (w + 240) * clamp(local / 3.3, 0, 1);
      this.drawCraft(craftX, h * 0.32, clamp(Math.min(w, h) / 560, 0.62, 1.02), 1.25);
      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "center";
      ctx.font = `900 ${clamp(Math.min(w, h) * 0.044, 19, 37)}px ${UI_FONT}`;
      ctx.fillText("THE IRON REIGN IS OVER", w / 2, h * 0.13);
      ctx.fillStyle = "#dce8ee";
      ctx.font = `800 ${clamp(Math.min(w, h) * 0.024, 12, 20)}px ${UI_FONT}`;
      ctx.fillText("A NEW DAWN BEGINS", w / 2, h * 0.19);
      ctx.globalAlpha = 1;
    }

    drawFinalCard(w, h) {
      const alpha = this.phaseAlpha(9.05, this.duration + 0.3, 0.55);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = "#02040a";
      ctx.fillRect(0, 0, w, h);
      const scale = clamp(Math.min(w, h) / 620, 0.72, 1.18);
      const panelW = Math.min(w * 0.84, 590 * scale);
      const panelH = Math.min(h * 0.62, 350 * scale);
      const x = w / 2 - panelW / 2;
      const y = h / 2 - panelH / 2;
      drawPixelPanel(x, y, panelW, panelH, "rgba(5,13,23,.96)", this.profile.color, true);
      this.drawOperative(w / 2, y + panelH * 0.48, scale * 1.45, 0);
      ctx.textAlign = "center";
      ctx.fillStyle = "#fff36d";
      ctx.font = `900 ${fitCanvasText("EARTH IS FREE", panelW * 0.84, 34 * scale, 22 * scale)}px ${UI_FONT}`;
      ctx.fillText("EARTH IS FREE", w / 2, y + 48 * scale);
      ctx.fillStyle = this.profile.color;
      ctx.font = `900 ${18 * scale}px ${UI_FONT}`;
      ctx.fillText(this.profile.name, w / 2, y + panelH - 82 * scale);
      ctx.fillStyle = "#dce8ee";
      ctx.font = `800 ${14 * scale}px ${UI_FONT}`;
      ctx.fillText(`FINAL SCORE  ${this.score.toLocaleString("en-US")}`, w / 2, y + panelH - 55 * scale);
      ctx.fillStyle = UI_THEME.muted;
      ctx.font = `800 ${11 * scale}px ${UI_FONT}`;
      ctx.fillText("THANKS FOR PLAYING", w / 2, y + panelH - 29 * scale);
      ctx.globalAlpha = 1;
    }

    draw() {
      const w = screenW;
      const h = screenH;
      ctx.save();
      ctx.fillStyle = "#02040a";
      ctx.fillRect(0, 0, w, h);
      if (this.elapsed < 3.35) this.drawCitadelCollapse(w, h);
      if (this.elapsed >= 3.0 && this.elapsed < 6.45) this.drawExtraction(w, h);
      if (this.elapsed >= 6.05 && this.elapsed < 9.55) this.drawDawn(w, h);
      if (this.elapsed >= 9.05) this.drawFinalCard(w, h);
      if (this.elapsed > 1.25 && this.elapsed < 9.0) {
        ctx.globalAlpha = 0.56;
        ctx.textAlign = "center";
        ctx.fillStyle = "#dce8ee";
        ctx.font = `700 ${clamp(Math.min(w, h) * 0.018, 10, 14)}px ${UI_FONT}`;
        ctx.fillText(touchUi ? "TAP TO SKIP" : "ENTER OR CLICK TO SKIP", w / 2, h - safeBottom - 18);
      }
      ctx.restore();
    }
  }

  class LaunchPad extends Entity {
    constructor(x, style = "neon", force = 930) {
      const y = terrainSurfaceY(x);
      super(x - 42, y - 20, 84, 20);
      this.style = style;
      this.force = force;
      this.cooldown = 0;
      this.phase = rand(0, Math.PI * 2);
    }

    update(dt) {
      this.y = terrainSurfaceY(this.cx) - this.h;
      this.cooldown = Math.max(0, this.cooldown - dt);
      for (const player of players) {
        if (player.dead || this.cooldown > 0 || player.vy < -40) continue;
        const feet = player.y + player.h;
        if (player.x + player.w > this.x && player.x < this.x + this.w && feet >= this.y - 8 && feet <= this.y + 28) {
          player.y = this.y - player.h - 2;
          player.vy = -this.force;
          player.onGround = false;
          player.supportPlatform = null;
          player.jumpCount = 1;
          this.cooldown = 0.45;
          const color = this.style === "bio" ? "#9dff5d" : this.style === "chrono" ? "#ff8df4" : "#63e5ff";
          burst(player.cx, this.y, color, 15, 225);
          audio.launchPad(this.style);
        }
      }
    }

    draw() {
      const color = this.style === "bio" ? "#9dff5d" : this.style === "chrono" ? "#ff8df4" : "#63e5ff";
      const pulse = Math.floor((Math.sin(time * 7 + this.phase) + 1) * 2);
      ctx.fillStyle = "#111723"; ctx.fillRect(this.x, this.y, this.w, this.h);
      ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.strokeRect(this.x, this.y, this.w, this.h);
      ctx.fillStyle = color;
      for (let i = 0; i < 3; i++) {
        const x = this.x + 12 + i * 24;
        ctx.beginPath(); ctx.moveTo(x, this.y + 13); ctx.lineTo(x + 8, this.y + 4 - pulse); ctx.lineTo(x + 16, this.y + 13); ctx.closePath(); ctx.fill();
      }
      if (this.style === "bio") {
        ctx.fillStyle = "#315d2f"; ctx.beginPath(); ctx.ellipse(this.cx, this.y + 2, 38, 16, 0, Math.PI, Math.PI * 2); ctx.fill();
      }
    }
  }

  class PortalGate extends Entity {
    constructor(x, color = "#ff8df4") {
      const y = terrainSurfaceY(x) - 118;
      super(x - 36, y, 72, 118);
      this.color = color;
      this.partner = null;
      this.phase = rand(0, Math.PI * 2);
    }

    link(partner) { this.partner = partner; partner.partner = this; }

    update() {
      this.y = terrainSurfaceY(this.cx) - this.h;
    }

    canActivate(player) {
      if (!this.partner || player.dead || (activeBoss && !activeBoss.dead)) return false;
      const horizontalOverlap = player.x + player.w > this.x + 6 && player.x < this.x + this.w - 6;
      const feet = player.y + player.h;
      const floorY = this.y + this.h;
      const atPortalBase = feet >= floorY - 28 && feet <= floorY + 16;
      return horizontalOverlap && atPortalBase && player.onGround;
    }

    transport(player) {
      if (!this.partner || player.dead || portalWarp || (activeBoss && !activeBoss.dead)) return false;

      const direction = this.partner.cx >= this.cx ? 1 : -1;
      const exitMargin = 34;
      const travelers = players
        .filter(member => !member.dead && !member.portalTransit)
        .sort((a, b) => a.index - b.index)
        .map(member => {
          member.setCrouching(false);
          const squadOffset = direction * member.index * (member.w + 14);
          const exitX = (direction > 0
            ? this.partner.x + this.partner.w + exitMargin
            : this.partner.x - member.w - exitMargin) + squadOffset;
          const exitCenterX = exitX + member.w / 2;
          const exitSurfaceY = terrainSurfaceY(exitCenterX);

          member.vx = 0;
          member.vy = 0;
          member.smashing = false;
          member.supportPlatform = null;
          member.dropPlatform = null;
          member.portalCooldown = 1.1;
          member.portalContact = false;
          member.portalTransit = true;
          member.portalHidden = 0;
          member.invuln = Math.max(member.invuln, 1.4);

          return {
            player: member,
            exitX,
            exitY: exitSurfaceY - member.h,
            exitSurfaceY
          };
        });

      if (!travelers.length) return false;

      const exitCenterX = travelers.reduce(
        (sum, traveler) => sum + traveler.exitX + traveler.player.w / 2,
        0
      ) / travelers.length;
      const exitSurfaceY = terrainSurfaceY(exitCenterX);
      const maxCameraX = Math.max(0, LEVEL_W - visibleWorldW);
      const endCameraX = clamp(exitCenterX - visibleWorldW * 0.43, 0, maxCameraX);
      const endCameraY = clampCameraY(
        exitSurfaceY - visibleWorldH * cameraGroundAnchor()
      );

      enemyBullets = [];
      portalArrivalGrace = 0;
      portalWarp = {
        phase: "enter",
        phaseTime: 0,
        travelers,
        source: this,
        destination: this.partner,
        direction,
        startCameraX: cameraX,
        startCameraY: cameraY,
        endCameraX,
        endCameraY,
        color: this.partner.color
      };

      audio.portal("enter");
      return true;
    }

    draw() {
      const spin = time * 2.2 + this.phase;
      ctx.save(); ctx.translate(this.cx, this.cy);
      ctx.strokeStyle = this.color; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.ellipse(0, 0, 31, 54, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 0.55; ctx.lineWidth = 4;
      for (let i = 0; i < 4; i++) {
        const y = Math.sin(spin + i * 1.5) * 35;
        ctx.beginPath(); ctx.ellipse(0, y, 24 - Math.abs(y) * 0.25, 7, 0, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalAlpha = 1;
      drawUiIcon("down", 0, 74, 17, "#fff36d", 2.4);
      ctx.restore();
    }
  }

  class Pickup extends Entity {
    constructor(x, y, type, persistent = false) {
      super(x - 26, y - 26, 52, 52);
      this.type = type;
      this.persistent = persistent;
      this.vy = persistent ? 0 : -120;
      this.life = persistent ? Infinity : 18;
      this.phase = rand(0, Math.PI * 2);
      this.anchorY = this.y;
    }

    update(dt) {
      if (this.persistent) {
        this.y = this.anchorY + Math.sin(time * 3.2 + this.phase) * 5;
      }
      const groundY = terrainGroundY(this.cx);
      const ground = Number.isFinite(groundY) ? groundY - 4 : Infinity;
      if (!this.persistent) {
        if (this.y + this.h < ground - 0.1 || this.vy < 0) {
          this.vy += GRAVITY * 0.42 * dt;
          this.y += this.vy * dt;
        }

        if (Number.isFinite(ground) && this.y + this.h >= ground) {
          this.y = ground - this.h;
          if (Math.abs(this.vy) < 55) this.vy = 0;
          else this.vy *= -0.38;
        }
      }

      if (!this.persistent) {
        this.life -= dt;
        if (this.y > WORLD_H + 220 || this.life <= 0) this.dead = true;
      }

      for (const player of players) {
        if (!player.dead && this.overlaps(player) && player.upgrade(this.type)) {
          this.dead = true;
          const message = this.type === "health"
            ? "HEALTH RESTORED"
            : this.type === "special"
              ? "+1 POWER"
              : this.type === "life"
                ? "+1 LIFE"
                : this.name();
          showBanner(message);
          addFloatingText(this.cx, this.y - 18, message, this.color(), 16);
          impactFeedback(0.025);
          burst(this.cx, this.cy, this.color(), 12, 180);
          break;
        }
      }
    }

    color() {
      if (this.type === "health") return "#6bff91";
      if (this.type === "special") return "#ffd35c";
      if (this.type === "life") return "#8fd7ff";
      if (this.type === 1) return "#66e4ff";
      if (this.type === 2) return "#ff6fcf";
      return "#ff8f52";
    }

    name() {
      if (this.type === "health") return "HEALTH";
      if (this.type === "special") return "POWER";
      if (this.type === "life") return "1UP";
      if (this.type === 1) return "SPREAD";
      if (this.type === 2) return "RAPID";
      return "ROCKET";
    }

    draw() {
      if (!this.persistent && this.life < 4 && Math.floor(this.life * 9) % 2 === 0) return;
      const pulse = 1 + Math.sin(time * 6 + this.phase) * 0.07;
      const color = this.color();
      const clarityScale = portrait ? 1.35 : 1;
      ctx.save();
      ctx.translate(this.cx, this.cy);
      ctx.scale(pulse * clarityScale, pulse * clarityScale);

      ctx.globalAlpha = 0.20;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(0, 0, 31, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      if (this.type === "life") {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(0, 0, 23, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = color;

        ctx.fillRect(10, -14, 9, 6);
        ctx.fillStyle = "#63e5ff";
        ctx.fillRect(-5, -16, 12, 5);
      } else if (this.type === 1) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(-24, 20);
        ctx.lineTo(0, -25);
        ctx.lineTo(24, 20);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#09202a";
        for (const x of [-9, 0, 9]) {
          ctx.beginPath();

        }
      } else if (this.type === 2) {
        ctx.fillStyle = color;
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const angle = Math.PI / 3 * i - Math.PI / 6;
          const x = Math.cos(angle) * 24;
          const y = Math.sin(angle) * 24;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#2a0b22";
        ctx.beginPath();
        ctx.moveTo(5, -17);
        ctx.lineTo(-8, 2);
        ctx.lineTo(1, 2);
        ctx.lineTo(-5, 18);
        ctx.lineTo(12, -4);
        ctx.lineTo(3, -4);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, -25);
        ctx.lineTo(15, -8);
        ctx.lineTo(15, 15);
        ctx.lineTo(0, 24);
        ctx.lineTo(-15, 15);
        ctx.lineTo(-15, -8);
        ctx.closePath();
        ctx.fill();
        ctx.save();
        ctx.rotate(-Math.PI / 4);
        ctx.fillStyle = "#301509";
        roundRect(-3, -14, 8, 25, 3);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(1, -19);
        ctx.lineTo(7, -10);
        ctx.lineTo(-5, -10);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

  class Particle extends Entity {
    constructor(x, y, color, speed) {
      const size = rand(3, 8);
      super(x, y, size, size);
      const angle = rand(0, Math.PI * 2);
      this.vx = Math.cos(angle) * rand(speed * 0.35, speed);
      this.vy = Math.sin(angle) * rand(speed * 0.35, speed);

      this.maxLife = this.life;
      this.color = color;
      this.gravity = rand(280, 760);

    update(dt) {
      this.vy += this.gravity * dt;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.life -= dt;
      if (this.life <= 0) this.dead = true;
    }

    draw() {
      ctx.globalAlpha = clamp(this.life / this.maxLife, 0, 1);
      ctx.fillStyle = this.color;
      ctx.fillRect(this.x, this.y, this.w, this.h);
      ctx.globalAlpha = 1;
    }

  class FallingDebris extends Entity {
    constructor(x, y, size = 34, telegraphed = true) {
      super(x - size / 2, y, size, size);
      this.telegraphTimer = telegraphed ? 0.9 : 0.35;
      this.vy = 0;
      this.hit = false;
      this.life = 5;
    }

    update(dt) {
      this.life -= dt;
      if (this.life <= 0) {
        this.dead = true;
        return;
      }

      if (this.telegraphTimer > 0) {
        this.telegraphTimer -= dt;
        return;
      }

      this.vy += GRAVITY * 0.72 * dt;
      this.y += this.vy * dt;

      for (const player of players) {
        if (!player.dead && !this.hit && this.overlaps(player)) {
          this.hit = true;
          audio.impact(1.15, "metal");
          player.hit(20 * enemyDamageScale());
          this.dead = true;
          burst(this.cx, this.cy, "#77706a", 12, 180);
          return;
        }
      }

      const groundY = terrainSurfaceY(this.cx);
      if (this.y + this.h >= groundY) {
        this.dead = true;
        audio.impact(clamp(this.w / 30, 0.8, 1.7), "stone");
        burst(this.cx, groundY - 6, "#77706a", 10, 145);
      }
    }

    draw() {
      if (this.telegraphTimer > 0) {
        ctx.globalAlpha = 0.35 + Math.sin(time * 18) * 0.15;
        ctx.fillStyle = "#ff4f46";
        ctx.beginPath();
        ctx.ellipse(this.cx, terrainSurfaceY(this.cx) - 5, this.w * 0.8, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        return;
      }

      ctx.fillStyle = "#77706a";
      ctx.save();
      ctx.translate(this.cx, this.cy);
      ctx.rotate(time * 2.5 + this.x);
      ctx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
      ctx.restore();
    }
  }


  class SiegeMortar extends Entity {
    constructor(originX, originY, targetX, color, delay = 0, tier = 0) {
      super(originX - 11, originY - 11, 22, 22);
      this.startX = originX;
      this.startY = originY;
      this.targetX = targetX;
      this.targetY = terrainSurfaceY(targetX) - 9;
      this.color = color;
      this.delay = delay;
      this.flight = 0;
      this.flightDuration = Math.max(0.56, 0.76 - tier * 0.07);
      this.arcHeight = 245 + tier * 35;
      this.radius = 76 + tier * 10;
      this.damage = (19 + tier * 3) * enemyDamageScale();
      this.tier = tier;
      this.dead = false;
    }

    update(dt) {
      if (this.delay > 0) {
        this.delay -= dt;
        return;
      }

      this.flight += dt;
      const t = clamp(this.flight / this.flightDuration, 0, 1);
      const x = this.startX + (this.targetX - this.startX) * t;
      const y = this.startY + (this.targetY - this.startY) * t - Math.sin(Math.PI * t) * this.arcHeight;
      this.x = x - this.w / 2;
      this.y = y - this.h / 2;

      if (t < 1) return;
      this.dead = true;
      explode(this.targetX, this.targetY, this.color, 18 + this.tier * 4, true, 1);
      blastEffects.push(new BlastEffect(this.targetX, this.targetY, this.color, this.tier >= 2 ? 2 : 1));
      for (const player of players) {
        if (player.dead) continue;
        const distance = Math.hypot(player.cx - this.targetX, player.cy - this.targetY);
        if (distance <= this.radius) player.hit(this.damage, player.cx < this.targetX ? -1 : 1);
      }
      const groundY = terrainLaneY(this.targetX, true) - 2;
      enemyBullets.push(new EnemyBullet(this.targetX, groundY, -285 - this.tier * 35, 0, (12 + this.tier * 2) * enemyDamageScale(), 12, this.color));
      enemyBullets.push(new EnemyBullet(this.targetX, groundY, 285 + this.tier * 35, 0, (12 + this.tier * 2) * enemyDamageScale(), 12, this.color));
      audio.crash(1.15 + this.tier * 0.12);
    }

    draw() {
      const pulse = 0.7 + Math.sin(time * 16 + this.targetX) * 0.22;
      ctx.save();
      ctx.globalAlpha = 0.55 + pulse * 0.25;
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.ellipse(this.targetX, this.targetY + 4, this.radius * (0.48 + pulse * 0.08), 12, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(this.targetX - 15, this.targetY - 11);
      ctx.lineTo(this.targetX + 15, this.targetY + 19);
      ctx.moveTo(this.targetX + 15, this.targetY - 11);
      ctx.lineTo(this.targetX - 15, this.targetY + 19);
      ctx.stroke();
      ctx.globalAlpha = 1;

      if (this.delay <= 0) {
        ctx.translate(this.cx, this.cy);
        ctx.rotate(this.flight * 13);
        ctx.fillStyle = "#202933";
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(-13, -7);
        ctx.lineTo(8, -11);
        ctx.lineTo(15, 0);
        ctx.lineTo(8, 11);
        ctx.lineTo(-13, 7);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#fff2a2";
        ctx.fillRect(-18, -4, 8, 8);
      }
      ctx.restore();
    }
  }

  class ClockworkSweeper extends Entity {

      this.x = centerX - this.w / 2;

      this.y = this.lane === "high" ? surface - 108 : surface - this.h;

    drawGear(x, y, radius, teeth, rotation) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);
      ctx.fillStyle = "#23283a";
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 4;
      ctx.beginPath();
      for (let i = 0; i < teeth * 2; i++) {
        const angle = i * Math.PI / teeth;
        const r = i % 2 === 0 ? radius : radius * 0.78;
        const px = Math.cos(angle) * r;
        const py = Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#090b13";
      ctx.beginPath();
      ctx.arc(0, 0, radius * 0.34, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    draw() {
      if (!this.started) return;
      ctx.save();
      ctx.translate(this.cx, this.cy);

      ctx.fillStyle = this.color;
      ctx.fillRect(-this.w * 0.62, -this.h * 0.42, this.w * 1.24, this.h * 0.84);
      ctx.globalAlpha = 1;
      if (this.lane === "high") {
        this.drawGear(-25, 0, 26, 10, this.phase * this.direction);
        this.drawGear(25, 0, 26, 10, -this.phase * this.direction);
      } else {
        this.drawGear(-24, 5, 34, 12, this.phase * this.direction);

  class ArenaEruption extends Entity {

      super(x - width / 2, ground - 10, width, 10);

      this.maxActive = activeTime;
      this.fullHeight = height;
      this.damage = damage;
      this.baseY = ground;
      this.active = false;
      this.hitPlayers = new Set();
      this.phase = rand(0, Math.PI * 2);

      this.baseY = terrainSurfaceY(this.cx);
      if (this.delay > 0) {
        this.delay -= dt;
        this.y = this.baseY - 10;
        this.h = 10;
        return;
      }
      this.active = true;
      this.activeTime -= dt;
      const progress = clamp(1 - this.activeTime / Math.max(0.001, this.maxActive), 0, 1);
      const rise = Math.sin(Math.PI * progress);
      this.h = Math.max(18, this.fullHeight * rise);
      this.y = this.baseY - this.h;
      if (this.activeTime <= 0) this.dead = true;
    }

    isDangerous() { return this.active && !this.dead; }

    damagePlayer(player) {
      if (this.hitPlayers.has(player.index)) return;
      this.hitPlayers.add(player.index);
      player.hit(this.damage * enemyDamageScale(), player.cx < this.cx ? -1 : 1);
      player.knockbackX = (player.cx < this.cx ? -1 : 1) * 190;
      audio.impact(1.15, this.kind === "root" ? "wood" : "metal");
    }

    draw() {
      const pulse = 0.65 + Math.sin(time * 16 + this.phase) * 0.25;
      if (!this.active) {
        ctx.save();
        ctx.globalAlpha = 0.45 + pulse * 0.30;
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.ellipse(this.cx, this.baseY - 3, this.w * 0.58, 12, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(this.cx - 16, this.baseY - 22);
        ctx.lineTo(this.cx + 16, this.baseY - 2);
        ctx.moveTo(this.cx + 16, this.baseY - 22);
        ctx.lineTo(this.cx - 16, this.baseY - 2);
        ctx.stroke();
        ctx.restore();
        return;
      }

      ctx.save();
      if (this.kind === "root") {
        ctx.fillStyle = "#24462f";
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(this.cx - this.w * 0.42, this.baseY);
        ctx.quadraticCurveTo(this.cx - 10, this.y + this.h * 0.52, this.cx - 6, this.y);
        ctx.lineTo(this.cx + 12, this.y + 18);
        ctx.quadraticCurveTo(this.cx + 22, this.y + this.h * 0.55, this.cx + this.w * 0.42, this.baseY);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#dfff9b";
        ctx.fillRect(this.cx - 8, this.y + 24, 16, 11);
      } else if (this.kind === "ice") {
        ctx.fillStyle = "#8fd7eb";
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(this.cx, this.y);
        ctx.lineTo(this.x + this.w, this.baseY);
        ctx.lineTo(this.x, this.baseY);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.moveTo(this.cx, this.y + 14);
        ctx.lineTo(this.cx + 10, this.baseY - 18);
        ctx.lineTo(this.cx - 5, this.baseY - 18);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillStyle = "#6d2fd1";
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 5;
        ctx.fillRect(this.x + 8, this.y + 18, this.w - 16, this.h - 18);
        ctx.strokeRect(this.x + 8, this.y + 18, this.w - 16, this.h - 18);
        ctx.fillStyle = "#f0c8ff";
        ctx.fillRect(this.cx - 7, this.y, 14, this.h - 8);
      }
      ctx.restore();
    }
  }

      ctx.stroke();
      ctx.globalAlpha = 0.72;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(0, 0, 18 * pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "#050109";
      ctx.beginPath();
      ctx.arc(0, 0, 11 * pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#fff5b0";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, 22 + Math.sin(this.phase) * 3, this.phase, this.phase + Math.PI * 1.35);
      ctx.stroke();
      ctx.restore();
    }
  }

  class GravityWell extends Entity {
    constructor(x, y, color, tier = 0) {
      super(x - 68, y - 68, 136, 136);
      this.color = color;
      this.tier = tier;
      this.formationDuration = 0.30;
      this.activeDuration = 1.58 + tier * 0.08;
      this.fadeDuration = 0.34;
      this.elapsed = 0;
      this.duration = this.formationDuration + this.activeDuration + this.fadeDuration;
      this.maxDuration = this.duration;
      this.damage = 14 + tier * 2;
      this.range = 430 + tier * 15;
      this.liftRadius = 220 + tier * 10;
      this.contactRadius = 82;
      this.hitPlayers = new Set();
    }

    update(dt) {
      this.elapsed += dt;
      this.duration -= dt;
      if (this.duration <= 0) {
        this.dead = true;
        return;
      }

      const activeElapsed = this.elapsed - this.formationDuration;
      const active = activeElapsed >= 0 && activeElapsed < this.activeDuration;
      if (!active) return;

      for (const player of players) {
        if (player.dead || this.hitPlayers.has(player.index)) continue;

        const dx = this.cx - player.cx;
        const dy = this.cy - player.cy;
        const distance = Math.max(1, Math.hypot(dx, dy));
        if (distance >= this.range) continue;

        const pullRatio = clamp(1 - distance / this.range, 0, 1);
        const pullDirection = Math.sign(dx) || 1;
        const resisting = player.moveIntent === -pullDirection;
        const resistance = resisting ? 0.20 : 1;
        const desiredPull = pullDirection * (55 + pullRatio * (210 + this.tier * 12)) * resistance;
        const pullBlend = 1 - Math.exp(-6.0 * dt);
        player.knockbackX += (desiredPull - player.knockbackX) * pullBlend;
        player.knockbackX = clamp(player.knockbackX, -260, 260);

        if (distance < this.liftRadius) {
          const liftRatio = clamp(1 - distance / this.liftRadius, 0, 1);
          if (player.onGround && liftRatio > 0.08) {
            player.onGround = false;
            player.supportPlatform = null;
            player.dropPlatform = null;
            player.y -= 5;
            player.vy = Math.min(player.vy, -235 - liftRatio * 175);
          }
          const liftForce = (2850 + liftRatio * (1900 + this.tier * 110)) * (resisting ? 0.45 : 1);
          player.vy += dy / distance * liftForce * dt;
        }

        if (pullRatio > 0.58 && Math.floor((this.duration + player.index * 0.17) * 15) % 5 === 0) {
          burst(player.cx, player.cy, this.color, 1, 44);
        }

        if (distance < this.contactRadius) {
          const outward = player.cx < this.cx ? -1 : 1;
          this.hitPlayers.add(player.index);
          player.hit(this.damage * enemyDamageScale(), outward);
          player.x += outward * 30;
          player.vy = Math.max(player.vy, 310);
          player.knockbackX = outward * 470;
          player.invuln = Math.max(player.invuln, 1.05);
          blastEffects.push(new BlastEffect(player.cx, player.cy, this.color, 1));
          audio.tone(72, 0.16, "sawtooth", 0.11, -45);
        }
      }
    }

    isDangerous() { return false; }
    damagePlayer() {}

    draw() {
      const forming = this.elapsed < this.formationDuration;
      const fading = this.elapsed > this.formationDuration + this.activeDuration;
      const life = clamp(this.duration / this.maxDuration, 0, 1);
      const fadeAlpha = fading ? clamp(this.duration / this.fadeDuration, 0, 1) : 1;
      const formation = forming ? clamp(this.elapsed / this.formationDuration, 0, 1) : 1;

      ctx.save();
      ctx.translate(this.cx, this.cy);
      ctx.globalAlpha = fadeAlpha;

      // Continuous rings and curved particle streams read as a gravitational
      // distortion instead of detached warning dashes or UI decoration.
      for (let i = 0; i < 7; i++) {
        const angle = time * (i % 2 ? -1.25 : 1.12) + i * Math.PI * 2 / 7;
        const radius = (82 + i * 28 + Math.sin(time * 4.2 + i) * 9) * formation;
        const particleX = Math.cos(angle) * radius;
        const particleY = Math.sin(angle) * radius * 0.56;
        ctx.globalAlpha = fadeAlpha * (0.18 + life * 0.24);
        ctx.strokeStyle = i % 2 ? this.color : "#fff36d";
        ctx.lineWidth = 3 + (i % 3);
        ctx.beginPath();
        ctx.moveTo(particleX, particleY);
        ctx.quadraticCurveTo(particleX * 0.46, particleY * 0.46, 0, 0);
        ctx.stroke();
      }

      for (let i = 0; i < 5; i++) {
        ctx.strokeStyle = i % 2 ? this.color : "#fff36d";
        ctx.globalAlpha = fadeAlpha * (0.24 + life * 0.17);
        ctx.lineWidth = 7 - i * 0.8;
        const radius = (62 + i * 34 + Math.sin(time * 4 + i) * 8) * formation;
        ctx.beginPath();
        ctx.arc(0, 0, radius, time * (i % 2 ? -1.2 : 1.0), time * (i % 2 ? -1.2 : 1.0) + Math.PI * 1.55);
        ctx.stroke();
      }

      ctx.globalAlpha = fadeAlpha * (0.25 + formation * 0.18);
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(0, 0, 58 * formation, 0, Math.PI * 2);
      ctx.fill();

      ctx.globalAlpha = fadeAlpha;
      ctx.fillStyle = "#030107";
      ctx.beginPath();
      ctx.arc(0, 0, 44 * formation, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 9;
      ctx.stroke();
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(-11 * formation, -13 * formation, 7 * formation, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
