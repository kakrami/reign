    ctx.lineCap = "round";

    const aspect = vw / vh;
    baseVisibleWorldW = portrait ? 820 : (aspect > 2.4 ? 1620 : 1500);

    // View zoom is local presentation state. Arena world dimensions never depend
    // on viewport orientation, and a browser resize must not recreate the arena.
    const previousZoom = clamp(previousViewWidth / previousBaseWidth, 0.82, 1.35);
    let nextZoom = previousZoom;
    if (!running || levelState === "menu") nextZoom = 1;
    if (victoryScene) nextZoom = 1.06;
    visibleWorldW = clamp(baseVisibleWorldW * nextZoom, 620, LEVEL_W);
    viewScale = canvas.width / visibleWorldW;
    visibleWorldH = canvas.height / viewScale;

    const leadPlayer = running ? cameraFocusPlayer() : null;
    const focusX = leadPlayer ? leadPlayer.cx : cameraX + visibleWorldW * 0.36;
    const focusY = terrainSurfaceY(focusX);
    const baselineY = clampCameraY(focusY - visibleWorldH * cameraGroundAnchor());
    const bounds = cameraWorldBounds(visibleWorldW);

    if (orientationChanged && leadPlayer) {
      setCameraPosition(leadPlayer.cx - visibleWorldW * playerScreenRatio, baselineY);
      accumulator = 0;
    } else {
      cameraX = clamp(cameraX, bounds.min, bounds.max);
      cameraTargetX = clamp(cameraTargetX, bounds.min, bounds.max);
      cameraTargetY = baselineY;
      if (!running || levelState === "menu") cameraY = baselineY;
    }
  }

  function updateWorldView(dt) {
    let targetWidth = baseVisibleWorldW;
    if (victoryScene) targetWidth = baseVisibleWorldW * 1.06;

    const response = 4.8;
    const blend = 1 - Math.exp(-response * dt);
    visibleWorldW += (targetWidth - visibleWorldW) * blend;
    if (Math.abs(targetWidth - visibleWorldW) < 0.05) visibleWorldW = targetWidth;
    visibleWorldW = clamp(visibleWorldW, 620, LEVEL_W);

    viewScale = canvas.width / visibleWorldW;
    visibleWorldH = canvas.height / viewScale;

    // View-size changes and camera movement are separate phases. This function
    // only updates projection; updateCamera is the sole per-frame camera writer.
    const bounds = cameraWorldBounds(visibleWorldW);
    cameraX = clamp(cameraX, bounds.min, bounds.max);
    cameraTargetX = clamp(cameraTargetX, bounds.min, bounds.max);
  }

  addEventListener("resize", resize, { passive: true });

  if (window.visualViewport) {
    visualViewport.addEventListener("resize", resize, { passive: true });
  }

  function fullscreenActive() {
    return Boolean(document.fullscreenElement);
  }

  async function toggleFullscreen() {
    audio.ui("confirm");
    try {
      if (fullscreenActive()) await document.exitFullscreen();
      else if (document.fullscreenEnabled) await document.documentElement.requestFullscreen();
      else {
        menuResult = "FULLSCREEN IS NOT SUPPORTED BY THIS BROWSER";
        return;
      }
      menuResult = "";
    } catch (_) {
      menuResult = "FULLSCREEN REQUEST WAS BLOCKED";
    }
    clearControls();
  }

  document.addEventListener("fullscreenchange", resize, { passive: true });

  class Sound {
    constructor() {
      this.ctx = null;
      this.master = null;
      this.sfxGain = null;
      this.musicGain = null;
      this.musicVolume = 0.52;
      this.sfxVolume = 0.70;
      this.noiseBuffer = null;
      this.musicTimer = null;
      this.musicLevel = -1;
      this.musicStep = 0;
      this.musicNextTime = 0;
      this.musicMuted = false;
      this.musicPaused = false;
      this.lastImpactAt = -1;
      this.lastPlayed = Object.create(null);
    }

    ensure() {
      if (this.ctx) {
        if (this.ctx.state === "suspended") this.ctx.resume().catch(() => {});
        return;
      }

      this.ctx = new AudioContext();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.20;
      this.master.connect(this.ctx.destination);
      this.sfxGain = this.ctx.createGain();
      this.sfxGain.gain.value = this.sfxVolume;
      this.sfxGain.connect(this.master);
      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.value = this.musicVolume;
      this.musicGain.connect(this.master);
    }

    toneAt(frequency, duration, type = "square", gain = 0.18, slide = 0, delay = 0) {
      this.ensure();
      if (!this.ctx) return;
      const start = this.ctx.currentTime + Math.max(0, delay);
      const oscillator = this.ctx.createOscillator();
      const amplifier = this.ctx.createGain();
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(Math.max(20, frequency), start);
      if (slide) {
        oscillator.frequency.exponentialRampToValueAtTime(
          Math.max(20, frequency + slide),
          start + duration
        );
      }
      amplifier.gain.setValueAtTime(Math.max(0.001, gain), start);
      amplifier.gain.exponentialRampToValueAtTime(0.001, start + duration);
      oscillator.connect(amplifier);
      amplifier.connect(this.sfxGain);
      oscillator.start(start);
      oscillator.stop(start + duration + 0.02);
    }

    noiseAt(duration = 0.14, gain = 0.25, filterType = "lowpass", frequency = 1250, delay = 0) {
      this.ensure();
      if (!this.ctx) return;
      if (!this.noiseBuffer) {
        this.noiseBuffer = this.ctx.createBuffer(
          1,
          Math.max(1, Math.floor(this.ctx.sampleRate * 0.65)),
          this.ctx.sampleRate
        );
        const data = this.noiseBuffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      }
      const start = this.ctx.currentTime + Math.max(0, delay);
      const source = this.ctx.createBufferSource();
      const amplifier = this.ctx.createGain();
      const filter = this.ctx.createBiquadFilter();
      filter.type = filterType;
      filter.frequency.value = frequency;
      amplifier.gain.setValueAtTime(Math.max(0.001, gain), start);
      amplifier.gain.exponentialRampToValueAtTime(0.001, start + duration);
      source.buffer = this.noiseBuffer;
      source.connect(filter);
      filter.connect(amplifier);
      amplifier.connect(this.sfxGain);
      source.start(start);
      source.stop(start + duration + 0.02);
    }

    tone(frequency, duration, type = "square", gain = 0.18, slide = 0) {
      this.toneAt(frequency, duration, type, gain, slide, 0);
    }

    allow(name, gap = 0) {
      this.ensure();
      if (!this.ctx) return false;
      const now = this.ctx.currentTime;
      const previous = this.lastPlayed[name] ?? -Infinity;
      if (now - previous < gap) return false;
      this.lastPlayed[name] = now;
      return true;
    }

    ui(action = "move") {
      if (!this.allow("ui", 0.035)) return;
      if (action === "confirm") {
        this.toneAt(440, 0.055, "square", 0.065, 90);
        this.toneAt(660, 0.07, "square", 0.05, 80, 0.045);
      } else if (action === "back") {
        this.toneAt(290, 0.065, "square", 0.055, -90);
      } else if (action === "pause") {
        this.toneAt(220, 0.075, "square", 0.06, -45);
        this.toneAt(165, 0.08, "square", 0.045, -30, 0.05);
      } else {
        this.toneAt(360, 0.04, "square", 0.045, 45);
      }
    }

    step() {
      if (!this.allow("step", 0.13)) return;
      this.noiseAt(0.025, 0.022, "bandpass", 620);
      this.toneAt(72, 0.028, "triangle", 0.022, -10);
    }

    dropThrough() {
      this.toneAt(170, 0.07, "square", 0.065, -85);
    }

    doubleJump() {
      this.toneAt(410, 0.08, "square", 0.095, 260);
      this.toneAt(620, 0.07, "triangle", 0.055, 180, 0.05);
    }

    land(speed = 300) {
      if (!this.allow("land", 0.08)) return;
      const strength = clamp((speed - 220) / 650, 0, 1);
      this.noiseAt(0.035 + strength * 0.055, 0.035 + strength * 0.07, "lowpass", 540 - strength * 160);
      this.toneAt(92 - strength * 22, 0.05 + strength * 0.05, "triangle", 0.04 + strength * 0.045, -25);
    }

    dive() {
      this.toneAt(230, 0.10, "sawtooth", 0.085, -150);
      this.noiseAt(0.055, 0.045, "highpass", 1800, 0.025);
    }

    playerHit() {
      if (!this.allow("playerHit", 0.085)) return;
      this.noiseAt(0.065, 0.13, "bandpass", 690);
      this.toneAt(105, 0.09, "square", 0.09, -48);
    }

    playerDeath(kind = "combat") {
      if (kind === "fall") {
        this.toneAt(230, 0.16, "sawtooth", 0.10, -170);
        this.toneAt(92, 0.42, "triangle", 0.11, -42, 0.12);
      } else {
        this.noiseAt(0.34, 0.24, "lowpass", 520);
        this.toneAt(110, 0.22, "sawtooth", 0.13, -75);
        this.toneAt(58, 0.50, "triangle", 0.12, -18, 0.15);
      }
    }

    respawn() {
      this.toneAt(220, 0.08, "square", 0.07, 120);
      this.toneAt(440, 0.10, "square", 0.075, 180, 0.07);
      this.toneAt(660, 0.12, "triangle", 0.06, 120, 0.16);
    }

    checkpoint() {
      if (!this.allow("checkpoint", 0.5)) return;
      this.toneAt(392, 0.08, "triangle", 0.07, 90);
      this.toneAt(523, 0.09, "triangle", 0.065, 80, 0.08);
      this.toneAt(784, 0.12, "triangle", 0.055, -60, 0.17);
    }

    extraLife() {
      this.toneAt(523, 0.08, "square", 0.08, 120);
      this.toneAt(659, 0.08, "square", 0.075, 120, 0.07);
      this.toneAt(784, 0.10, "square", 0.07, 140, 0.14);
      this.toneAt(1047, 0.16, "triangle", 0.065, -80, 0.23);
    }

    pickup(type = "weapon") {
      if (type === "health") {
        this.toneAt(330, 0.08, "sine", 0.07, 90);
        this.toneAt(495, 0.12, "sine", 0.06, 70, 0.07);
      } else if (type === "special") {
        this.toneAt(392, 0.07, "square", 0.075, 180);
        this.toneAt(784, 0.13, "triangle", 0.065, -80, 0.08);
      } else if (type === "life") {
        this.extraLife();
      } else {
        const root = type === 1 ? 440 : type === 2 ? 554 : type === 3 ? 330 : 440;
        this.toneAt(root, 0.065, "square", 0.075, 100);
        this.toneAt(root * 1.5, 0.08, "square", 0.065, 80, 0.055);
        this.toneAt(root * 2, 0.10, "triangle", 0.05, -70, 0.12);
      }
    }

    enemyShot(kind = "horizontal") {
      if (!this.allow(`enemyShot:${kind}`, kind === "rapid" ? 0.04 : 0.065)) return;
      if (kind === "vertical") this.toneAt(330, 0.06, "sawtooth", 0.055, -45);
      else if (kind === "burst") {
        this.toneAt(235, 0.07, "square", 0.06, 80);
        this.toneAt(185, 0.065, "square", 0.045, -55, 0.035);
      } else if (kind === "bomb") this.toneAt(118, 0.10, "sawtooth", 0.065, -55);
      else this.toneAt(145, 0.06, "sawtooth", 0.055, -38);
    }

    enemyHit(damage = 10, type = "enemy") {
      if (!this.allow("enemyHit", 0.045)) return;
      const heavy = damage >= 45 || type === "brute" || type === "sentinel";
      this.noiseAt(heavy ? 0.05 : 0.028, heavy ? 0.065 : 0.038, "bandpass", heavy ? 780 : 1120);
      this.toneAt(heavy ? 118 : 210, heavy ? 0.07 : 0.04, "square", heavy ? 0.055 : 0.035, -35);
    }

    bossHit(damage = 10) {
      if (!this.allow("bossHit", 0.055)) return;
      const heavy = damage >= 55;
      this.noiseAt(heavy ? 0.075 : 0.045, heavy ? 0.09 : 0.055, "bandpass", heavy ? 650 : 900);
      this.toneAt(heavy ? 82 : 135, heavy ? 0.10 : 0.065, "square", heavy ? 0.075 : 0.05, -38);
    }

    bossWarning(level = 0) {
      if (!this.allow("bossWarning", 0.8)) return;
      const root = 105 + clamp(level, 0, 5) * 12;
      this.toneAt(root, 0.13, "sawtooth", 0.10, -22);
      this.toneAt(root * 0.72, 0.16, "square", 0.085, -15, 0.12);
      this.toneAt(root, 0.13, "sawtooth", 0.09, -22, 0.29);
    }

    bossPhase(tier = 1) {
      const root = tier >= 2 ? 88 : 118;
      this.noiseAt(0.18, 0.14, "bandpass", 760);
      this.toneAt(root, 0.28, "sawtooth", 0.13, 210);
      this.toneAt(root * 2, 0.22, "square", 0.08, 150, 0.11);
    }

    portal(phase) {
      if (phase === "enter") this.toneAt(220, 0.13, "square", 0.075, 180);
      else if (phase === "travel") this.toneAt(360, 0.10, "triangle", 0.06, 220);
      else this.toneAt(520, 0.12, "square", 0.075, -210);
    }

    launchPad(style = "neon") {
      const root = style === "bio" ? 235 : style === "chrono" ? 310 : 360;
      this.toneAt(root, 0.14, "square", 0.10, 260);
      this.noiseAt(0.06, 0.045, "highpass", 1700, 0.02);
    }

    missionFailed() {
      this.toneAt(196, 0.18, "square", 0.08, -55);
      this.toneAt(147, 0.22, "square", 0.075, -42, 0.15);
      this.toneAt(98, 0.42, "triangle", 0.09, -18, 0.32);
    }

    powerStart(id = "vanguard") {
      const roots = { vanguard: 118, ember: 146, ghost: 392, nova: 72 };
      const root = roots[id] || 118;
      this.toneAt(root, 0.18, id === "ghost" ? "square" : "sawtooth", 0.105, id === "nova" ? -18 : 165);
      this.toneAt(root * 2, 0.13, "square", 0.085, 190, 0.12);
      this.toneAt(root * 4, 0.16, "triangle", 0.07, -110, 0.27);
    }

    powerStrike(id, index = 0) {
      if (id === "vanguard") {
        this.noiseAt(0.08, 0.09, "bandpass", 920);
        this.toneAt(145 + index * 12, 0.08, "square", 0.07, -75);
      } else if (id === "ember") {
        this.noiseAt(0.10, 0.08, "lowpass", 720);
        this.toneAt(112 + index * 9, 0.10, "sawtooth", 0.07, -55);
      } else if (id === "ghost") {
        this.toneAt(440 + index * 28, 0.06, "square", 0.065, 170);
        this.noiseAt(0.035, 0.035, "highpass", 2300, 0.015);
      } else {
        this.toneAt(76 + index * 24, 0.14, "sine", 0.09, -20);
      }
    }

    powerFinish(id) {
      if (id === "nova") {
        this.noiseAt(0.55, 0.40, "lowpass", 390);
        this.toneAt(46, 0.72, "sawtooth", 0.22, -14);
        this.toneAt(92, 0.28, "square", 0.12, -55, 0.10);
      } else if (id === "ghost") {
        this.noiseAt(0.16, 0.16, "highpass", 2100);
        this.toneAt(620, 0.18, "square", 0.12, -300);
        this.toneAt(155, 0.32, "triangle", 0.10, -40, 0.08);
      } else {
        this.bigExplosion(id === "ember" ? 1.45 : 1.30);
      }
    }

    shoot(weapon) {
      if (weapon === 1) {
        this.noiseAt(0.055, 0.10, "bandpass", 900);
        this.toneAt(138, 0.08, "square", 0.11, -50);
      } else if (weapon === 2) {
        this.toneAt(310, 0.035, "square", 0.078, -105);
      } else if (weapon === 3) {
        this.toneAt(112, 0.13, "sawtooth", 0.14, -62);
        this.noiseAt(0.05, 0.07, "highpass", 1500);
      } else {
        this.toneAt(198, 0.055, "square", 0.115, -72);
      }
    }

    jump() { this.toneAt(260, 0.11, "square", 0.11, 165); }


    explode(scale = 1) {
      if (!this.allow("smallExplosion", 0.035)) return;
      const s = clamp(scale, 0.65, 1.5);
      this.noiseAt(0.16 * s, 0.24 * s, "lowpass", 980 / s);
      this.noiseAt(0.075, 0.10 * s, "highpass", 1700, 0.018);
      this.toneAt(86 / s, 0.22 * s, "square", 0.13 * s, -48);
    }

    impact(strength = 1, material = "metal") {
      this.ensure();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      if (now - this.lastImpactAt < 0.045) return;
      this.lastImpactAt = now;
      const s = clamp(strength, 0.55, 2.2);
      const metallic = material === "metal";
      this.noiseAt(0.07 + 0.055 * s, 0.10 + 0.07 * s, metallic ? "bandpass" : "lowpass", metallic ? 1050 : 520);
      this.toneAt((metallic ? 92 : 66) / Math.sqrt(s), 0.12 + 0.08 * s, metallic ? "square" : "triangle", 0.08 + 0.045 * s, -38);
      if (s > 1.15) this.noiseAt(0.18, 0.10 * s, "lowpass", 360, 0.035);
    }

    crash(strength = 1.4) {
      const s = clamp(strength, 0.8, 2.4);
      this.impact(s, "metal");
      this.noiseAt(0.34 * s, 0.20 * s, "lowpass", 430 / Math.sqrt(s), 0.02);
      this.noiseAt(0.11, 0.12 * s, "highpass", 2200, 0.045);
      this.toneAt(54 / Math.sqrt(s), 0.42 * s, "sawtooth", 0.14 * s, -28, 0.015);
    }

    bigExplosion(scale = 1.35) {
      const s = clamp(scale, 1, 1.9);
      this.noiseAt(0.52, 0.42, "lowpass", 520 / s);
      this.noiseAt(0.19, 0.22, "bandpass", 1050, 0.025);
      this.noiseAt(0.10, 0.16, "highpass", 2400, 0.055);
      this.toneAt(58 / s, 0.55, "sawtooth", 0.24, -34);
      this.toneAt(112, 0.19, "square", 0.12, -76, 0.10);
      this.noiseAt(0.25, 0.18, "lowpass", 760, 0.18);
    }

    bossExplosion() {
      this.bigExplosion(1.8);
      this.toneAt(42, 0.90, "sawtooth", 0.25, -18);
      this.noiseAt(0.40, 0.26, "lowpass", 420, 0.30);
      this.toneAt(74, 0.34, "square", 0.16, -46, 0.34);
      this.noiseAt(0.30, 0.22, "bandpass", 880, 0.62);
      this.toneAt(52, 0.48, "sawtooth", 0.18, -20, 0.68);
      this.noiseAt(0.52, 0.20, "lowpass", 330, 1.02);
      this.toneAt(38, 0.72, "sawtooth", 0.18, -12, 1.04);
    }

    smash() {
      this.noiseAt(0.11, 0.19, "bandpass", 720);
      this.toneAt(82, 0.18, "square", 0.13, -42);
      this.toneAt(164, 0.08, "square", 0.08, 95, 0.035);
    }

    victoryFanfare(major = false, final = false) {
      const notes = final
        ? [98, 147, 196, 294, 392, 588]
        : major
          ? [110, 165, 220, 330, 440]
          : [131, 196, 262, 392];
      notes.forEach((note, i) => {
        this.toneAt(note, major ? 0.22 : 0.16, i % 2 ? "square" : "triangle", 0.095, 35, 0.32 + i * 0.13);
      });
      if (major) {
        this.noiseAt(0.20, 0.11, "bandpass", 1250, 0.48);
        this.toneAt(final ? 49 : 55, final ? 1.15 : 0.78, "sawtooth", 0.12, 22, 0.28);
      }
    }

    boss() {
      this.toneAt(110, 0.10, "square", 0.12, -20);
      this.toneAt(82, 0.12, "square", 0.11, -16, 0.09);
    }


    levelStinger(level) {
      const roots = [110, 147, 165, 131, 123, 98];
      const root = roots[level];
      const pattern = level === 3 ? [1, 1.25, 1.5, 2] : level === 4 ? [1, 1.5, 1.25, 2] : [1, 1.25, 1.5, 2];
      pattern.forEach((ratio, i) => this.toneAt(root * ratio, 0.12, "square", 0.075, 35, i * 0.09));
    }

    midiFrequency(note) {
      return 440 * Math.pow(2, (note - 69) / 12);
    }

    musicTone(note, duration, wave, gain, start, detune = 0) {
      if (!this.ctx || !this.musicGain || note == null) return;
      const oscillator = this.ctx.createOscillator();
      const amplifier = this.ctx.createGain();
      oscillator.type = wave;
      oscillator.frequency.setValueAtTime(this.midiFrequency(note), start);
      oscillator.detune.value = detune;
      amplifier.gain.setValueAtTime(0.0001, start);
      amplifier.gain.exponentialRampToValueAtTime(Math.max(0.001, gain), start + 0.008);
      amplifier.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      oscillator.connect(amplifier);
      amplifier.connect(this.musicGain);
      oscillator.start(start);
      oscillator.stop(start + duration + 0.025);
    }

    musicNoise(duration, gain, frequency, start) {
      if (!this.ctx || !this.musicGain) return;
      if (!this.noiseBuffer) {
        this.noiseBuffer = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * 0.65), this.ctx.sampleRate);
        const data = this.noiseBuffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      }
      const source = this.ctx.createBufferSource();
      const filter = this.ctx.createBiquadFilter();
      const amplifier = this.ctx.createGain();
      source.buffer = this.noiseBuffer;
      filter.type = "bandpass";
      filter.frequency.value = frequency;
      amplifier.gain.setValueAtTime(Math.max(0.001, gain), start);
      amplifier.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      source.connect(filter);
      filter.connect(amplifier);
      amplifier.connect(this.musicGain);
      source.start(start);
      source.stop(start + duration + 0.02);
    }

    scheduleMusicStep(start) {
      const theme = MUSIC_THEMES[this.musicLevel];
      if (!theme || this.musicMuted || this.musicPaused) return;
      const step = this.musicStep;
      const beat = 60 / theme.bpm;
      const sixteenth = beat / 4;
      const leadOffset = theme.lead[step % theme.lead.length];
      const bassOffset = theme.bass[Math.floor(step / 4) % theme.bass.length];
      const arpOffset = theme.arp[step % theme.arp.length];
      const bossBoost = activeBoss && !activeBoss.dead;

      if (step % 2 === 0 && leadOffset != null) {
        this.musicTone(theme.root + 12 + leadOffset, sixteenth * 1.72, theme.wave, bossBoost ? 0.050 : 0.040, start);
      }
      this.musicTone(theme.root + 12 + arpOffset, sixteenth * 0.86, step % 3 ? "square" : "triangle", bossBoost ? 0.026 : 0.020, start, step % 2 ? -5 : 5);
      if (step % 4 === 0) {
        this.musicTone(theme.root - 12 + bassOffset, beat * 0.82, "square", bossBoost ? 0.070 : 0.055, start);
      }

      if (step % 8 === 0) {
        this.musicTone(theme.root - 24, 0.11, "sine", bossBoost ? 0.090 : 0.072, start, 0);
        this.musicNoise(0.045, 0.028, 170, start);
      }
      if (step % 8 === 4) this.musicNoise(0.10, bossBoost ? 0.060 : 0.047, 1150, start);
      if (step % 2 === 1) this.musicNoise(0.024, bossBoost ? 0.020 : 0.014, this.musicLevel === 4 ? 4200 : 3100, start);
      if (bossBoost && step % 8 === 6) this.musicTone(theme.root + 24 + (leadOffset ?? 0), sixteenth * 1.3, "square", 0.034, start);

      this.musicStep = (step + 1) % 64;
    }

    startMusicTimer() {
      if (!this.musicTimer && this.musicLevel >= 0 && !this.musicPaused && !this.musicMuted) {
        this.musicTimer = setInterval(() => this.pumpMusic(), 35);
      }
    }

    stopMusicTimer() {
      if (!this.musicTimer) return;
      clearInterval(this.musicTimer);
      this.musicTimer = null;
    }

    pumpMusic() {
      if (!this.ctx || this.musicLevel < 0 || this.musicPaused || this.musicMuted) return;
      const theme = MUSIC_THEMES[this.musicLevel];
      const stepDuration = 60 / theme.bpm / 4;
      const horizon = this.ctx.currentTime + 0.16;
      if (this.musicNextTime < this.ctx.currentTime - 0.25) this.musicNextTime = this.ctx.currentTime + 0.04;
      while (this.musicNextTime < horizon) {
        this.scheduleMusicStep(this.musicNextTime);
        this.musicNextTime += stepDuration;
      }
    }

    startMusic(level) {
      this.ensure();
      if (!this.ctx) return;
      const nextLevel = clamp(level | 0, 0, MUSIC_THEMES.length - 1);
      if (this.musicLevel !== nextLevel) {
        this.musicLevel = nextLevel;
        this.musicStep = 0;
      }
      this.musicPaused = false;
      this.musicNextTime = this.ctx.currentTime + 0.06;
      const now = this.ctx.currentTime;
      this.musicGain.gain.cancelScheduledValues(now);
      this.musicGain.gain.setTargetAtTime(this.musicMuted ? 0.0001 : this.musicVolume, now, 0.035);
      this.startMusicTimer();
    }

    stopMusic() {
      this.musicLevel = -1;
      this.musicStep = 0;
      if (this.ctx) this.musicGain.gain.setTargetAtTime(0.0001, this.ctx.currentTime, 0.04);
      this.stopMusicTimer();
    }

    setMusicPaused(value) {
      this.musicPaused = Boolean(value);
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      this.musicGain.gain.cancelScheduledValues(now);
      this.musicGain.gain.setTargetAtTime(this.musicPaused || this.musicMuted ? 0.0001 : this.musicVolume, now, 0.03);
      if (this.musicPaused) this.stopMusicTimer();
      else {
        this.musicNextTime = now + 0.05;
        this.startMusicTimer();
      }
    }

    toggleMusic() {
      this.ensure();
      this.musicMuted = !this.musicMuted;
      const now = this.ctx.currentTime;
      this.musicGain.gain.cancelScheduledValues(now);
      this.musicGain.gain.setTargetAtTime(this.musicMuted || this.musicPaused ? 0.0001 : this.musicVolume, now, 0.03);
      if (this.musicMuted) this.stopMusicTimer();
      else {
        this.musicNextTime = now + 0.05;
        this.startMusicTimer();
      }
      this.ui(this.musicMuted ? "back" : "confirm");
      return !this.musicMuted;
    }
  }

  const audio = new Sound();

  let networkEntityCounter = 1;

  class Entity {
    constructor(x, y, w, h) {
      this.x = x;
      this.y = y;
      this.w = w;
      this.h = h;
      this.vx = 0;
      this.vy = 0;
      this.dead = false;
      this.netId = networkEntityCounter++;
      this.netBornAt = Number.isFinite(time) ? time : 0;
    }

    get cx() { return this.x + this.w / 2; }
    get cy() { return this.y + this.h / 2; }

    overlaps(other) {
      return this.x < other.x + other.w &&
             this.x + this.w > other.x &&
             this.y < other.y + other.h &&
             this.y + this.h > other.y;
    }
  }


  function readLocalControls(player, consumePresses = true) {
    if (onlineMenuOpen) {
      if (consumePresses) {
        takePress("KeyW");
        takePress("KeyE");
        takePress("KeyF");
        takePress("KeyG");
      }
      return {
        moveX: 0,
        aimX: player.aimX || player.facing || 1,
        aimY: player.aimY || 0,
        jump: false,
        jumpPressed: false,
        down: false,
        duck: false,
        fire: false,
        firePressed: false,
        power: false,
        powerPressed: false
      };
    }
    const useTouch = touchUi && touchStick.active;
    const keyboardMove = (pressed("KeyD") ? 1 : 0) - (pressed("KeyA") ? 1 : 0);
    const down = useTouch ? touchStick.down : pressed("KeyS");
    const airDown = down && !player.onGround;
    let aimX = useTouch ? touchStick.aimX : player.facing;
    let aimY = useTouch ? touchStick.aimY : 0;

    if (!useTouch && mouseInput.active) {
      const mouseWorldX = cameraX + mouseInput.x / Math.max(1, screenW) * visibleWorldW;
      const mouseWorldY = cameraY + mouseInput.y / Math.max(1, screenH) * visibleWorldH;
      const aimOriginY = player.crouching ? player.y + 14 : player.y + 34;
      aimX = mouseWorldX - player.cx;
      aimY = mouseWorldY - aimOriginY;
    } else if (airDown) {
      aimY = Math.max(0.35, touchStick.aimY);
    } else if (down && player.onGround) {
      aimX = useTouch && Math.abs(touchStick.aimX) > 0.18 ? Math.sign(touchStick.aimX) : player.facing;
      aimY = 0;
    }

    const length = Math.hypot(aimX, aimY) || 1;
    aimX /= length;
    aimY /= length;

    const firePressed = consumePresses && touchUi ? takePress("KeyF") : false;
    return {
      moveX: useTouch ? touchStick.moveX : keyboardMove,
      aimX,
      aimY,
      jump: pressed("KeyW"),
      jumpPressed: consumePresses ? takePress("KeyW") : false,
      down,
      duck: down && player.onGround,
      fire: touchUi ? pressed("KeyF") || firePressed : mouseInput.fire,
      firePressed,
      power: touchUi ? pressed("KeyG") : pressed("KeyE"),
      powerPressed: consumePresses ? (touchUi ? takePress("KeyG") : takePress("KeyE")) : false
    };
  }

  function networkControlsForPlayer(player) {
    const row = net.inputs.get(player.index) || neutralNetworkInput();
    const fireSeq = Math.max(0, Number(row.fireSeq) || 0);
    const jumpSeq = Math.max(0, Number(row.jumpSeq) || 0);
    const powerSeq = Math.max(0, Number(row.powerSeq) || 0);
    const firePressed = fireSeq > (player.netFireSeq || 0);
    const jumpPressed = jumpSeq > (player.netJumpSeq || 0);
    const powerPressed = powerSeq > (player.netPowerSeq || 0);
    if (firePressed) player.netFireSeq = fireSeq;
    if (jumpPressed) player.netJumpSeq = jumpSeq;
    if (powerPressed) player.netPowerSeq = powerSeq;
    return {
      moveX: clamp(Number(row.moveX) || 0, -1, 1),
      aimX: clamp(Number(row.aimX) || player.facing || 1, -1, 1),
      aimY: clamp(Number(row.aimY) || 0, -1, 1),
      jump: false,
      jumpPressed,
      down: Boolean(row.down),
      duck: Boolean(row.down) && player.onGround,
      fire: Boolean(row.fire) || firePressed,
      firePressed,
      power: false,
      powerPressed
    };
  }

  function multiplayerRespawnAnchor(player, minimumX, maximumX) {
    if (!onlineSession()) return clamp(checkpointX, minimumX, maximumX);
    const living = players.filter(member => member !== player && !member.dead && member.lives > 0);
    if (!living.length) return clamp(checkpointX, minimumX, maximumX);
    const teammate = living.reduce((front, member) => !front || member.cx > front.cx ? member : front, null);
    const spacing = 150 + (player.index % 2) * 34;
    const teammateAnchor = teammate.cx - spacing;
    return clamp(Math.max(checkpointX, teammateAnchor), minimumX, maximumX);
  }

  function presentLocalRespawn(player) {
    if (!isLocalPlayerEntity(player)) return;
    const groundY = terrainGroundY(player.cx);
    setCameraPosition(player.x - visibleWorldW * 0.28, groundY - visibleWorldH * cameraGroundAnchor());
    showBanner("REJOINED TEAM", 0.72);
    audio.respawn();
  }

  class Player extends Entity {
    constructor(index, x, characterIndex = menuCharacter) {
      super(x, GROUND_Y - 82, 46, 82);
      this.index = index;
      this.characterIndex = clamp(characterIndex | 0, 0, CHARACTER_PROFILES.length - 1);
      this.profile = CHARACTER_PROFILES[this.characterIndex];
      this.color = this.profile.color;
      this.health = 100;
      this.maxHealth = 100;
      this.lives = difficulty.startLives;
      this.score = 0;
      this.nextLifeScore = FIRST_EXTRA_LIFE_SCORE;
      this.weapon = 0;
      this.specials = 2;
      this.facing = 1;
      this.aimX = 1;
      this.aimY = 0;
      this.onGround = true;
      this.fireCooldown = 0;
      this.invuln = 0;
      this.respawnTimer = 0;
      this.muzzle = 0;
      this.standingHeight = 82;
      this.crouchingHeight = 48;
      this.crouching = false;

      this.maxJumps = 2;
      this.jumpCount = 0;
      this.spinAngle = 0;
      this.landTimer = 0;
      this.recoil = 0;
      this.animTime = 0;
      this.stepTimer = 0;
      this.entryTimer = 0;
      this.airTrailTimer = 0;
      this.supportPlatform = null;
      this.dropPlatform = null;
      this.knockbackX = 0;
      this.specialPose = 0;
      this.smashing = false;
      this.smashTrailTimer = 0;
      this.stompChain = 0;
      this.stompChainTimer = 0;
      this.victoryPose = 0;
      this.portalCooldown = 0;
      this.portalContact = false;
      this.portalDownHeld = false;
      this.portalHidden = 0;
      this.portalTransit = false;
      this.spinShotPhase = 0;
      this.recoveryCharge = 0;
      this.shotActivity = 0;
    }

    controls() {
      return onlineSession() ? networkControlsForPlayer(this) : readLocalControls(this, true);
    }

    update(dt) {
      if (this.dead) {
        this.respawnTimer -= dt;
        if (this.respawnTimer <= 0 && this.lives > 0 && (!onlineSession() || isNetworkAuthority())) this.revive();
        return;
      }

      if (this.portalTransit) return;

      if (this.onGround && this.supportPlatform && !this.supportPlatform.dead) {
        this.x += this.supportPlatform.dx;
        this.y += this.supportPlatform.dy;
      }

      const controls = this.controls();
      this.setAim(controls.aimX, controls.aimY);
      this.updateTimers(dt);

      if (levelState === "vehicle") {
        this.x = introVehicle.x + 66 + this.index * 58;
        this.y = introVehicle.y - 63;
        this.setCrouching(false);
        this.vx = 0;
        this.vy = 0;
        this.onGround = true;
        this.jumpCount = 0;
        this.handleActions(controls);
        return;
      }

      if (levelState === "crash") {
        if (introVehicle) {
          this.x = introVehicle.x + 66 + this.index * 58;
          this.y = introVehicle.y - 63;
        }
        this.setCrouching(false);
        this.vx = 0;
        this.vy = 0;
        this.onGround = true;
        return;
      }

      const controlsLocked = this.entryTimer > 0;
      const wantsDuck = Boolean(!controlsLocked && controls.duck && this.onGround);
      this.setCrouching(wantsDuck);

      const move = !controlsLocked && !this.crouching && Math.abs(controls.moveX) >= 0.5
        ? Math.sign(controls.moveX)
        : 0;
      this.moveIntent = move;
      this.knockbackX *= Math.exp(-13 * dt);
      if (Math.abs(this.knockbackX) < 1) this.knockbackX = 0;
      this.vx = move * PLAYER_SPEED + this.knockbackX;

      if (move && this.onGround) {
        this.stepTimer -= dt;
        if (this.stepTimer <= 0) {
          this.stepTimer = 0.12;
          burst(this.cx - move * 15, this.y + this.h - 2, "#8f8a73", 1, 42);
          audio.step();
        }
      } else {
        this.stepTimer = 0;
      }

      if (!controlsLocked && controls.jumpPressed) {
        if (controls.down && this.onGround && this.supportPlatform) {
          this.setCrouching(false);
          this.dropPlatform = this.supportPlatform;
          this.onGround = false;
          this.supportPlatform = null;
          this.vy = 185;
          this.y += 12;
          burst(this.cx, this.y + this.h - 2, "#ffd34d", 5, 82);
          audio.dropThrough();
        } else if (controls.down && !this.onGround) {
          this.beginDiveSmash();
        } else {
          const canGroundJump = this.onGround;
          const canAirJump = !this.onGround && this.jumpCount < this.maxJumps;

          if (canGroundJump || canAirJump) {
            const doubleJump = !this.onGround;
            this.setCrouching(false);
            const gravityScale = gravityScaleAt(this.cx);
            this.vy = doubleJump
              ? (gravityScale < 0.8 ? -610 : -690)
              : (gravityScale < 0.8 ? -680 : -760);
            this.onGround = false;
            this.supportPlatform = null;
            this.smashing = false;
            this.jumpCount = doubleJump ? Math.max(2, this.jumpCount + 1) : 1;

            if (doubleJump) {
              this.spinAngle = -Math.PI * 0.45 * this.facing;
              this.airTrailTimer = 0;
              burst(this.cx, this.y + this.h - 3, this.color, 14, 235);
              audio.doubleJump();
            } else {
              audio.jump();
            }
          }
        }
      }

      const wasOnGround = this.onGround;
      const previousSupport = this.supportPlatform;
      const fallSpeed = this.vy;
      const previousBottom = this.y + this.h;

      this.vy += GRAVITY * gravityScaleAt(this.cx) * dt;
      this.x += this.vx * dt;
      this.y += this.vy * dt;

      if (this.y > WORLD_H + 170) {
        this.fallOut();
        return;
      }

      const stompedEnemy = this.resolveEnemySmash(previousBottom);
      if (!stompedEnemy) this.resolveCollision(previousBottom, wasOnGround, previousSupport);

      if (this.onGround) {
        if (!wasOnGround && fallSpeed > 260) {
          this.landTimer = 0.16;
          burst(this.cx, this.y + this.h - 2, "#a29b80", 7, 115);
          audio.land(fallSpeed);
          if (this.smashing) this.finishGroundSmash();
        }
        this.jumpCount = 0;
        this.spinAngle = 0;
        this.smashing = false;
      } else {
        this.setCrouching(false);
        if (this.smashing) {
          this.spinAngle += dt * 26 * this.facing;
          this.smashTrailTimer -= dt;
          if (this.smashTrailTimer <= 0) {
            this.smashTrailTimer = 0.035;
            burst(this.cx, this.y + 10, chance(0.5) ? "#fff36d" : this.color, 2, 55);
          }
        } else if (this.jumpCount >= 2) {
          this.spinAngle += dt * 22 * this.facing;
          this.airTrailTimer -= dt;
          if (this.airTrailTimer <= 0) {
            this.airTrailTimer = 0.038;
            burst(this.cx - Math.cos(this.spinAngle) * 23, this.cy - Math.sin(this.spinAngle) * 23, this.color, 1, 45);
          }
        }
      }

      const simulationView = gameplaySimulationView();
      let leftBound = simulationView.left + 24;
      let rightBound = LEVEL_W - 40;
      if (bossArena && bossArena.isLocked()) {
        leftBound = bossArena.left + 34;
        rightBound = bossArena.right - 34;
      }
      this.x = clamp(this.x, leftBound, Math.max(leftBound, rightBound - this.w));

      if (!controlsLocked) this.handleActions(controls);

      if (stageEntryGrace <= 0) {
        for (const hazard of hazards) {
          if (!hazard.dead && hazard.isDangerous() && this.overlaps(hazard)) {
            hazard.damagePlayer(this);
          }
        }
      }
    }

    fallOut() {
      if (this.dead) return;
      this.health = 0;
      this.lives--;
      this.weapon = 0;
      this.dead = true;
      this.respawnTimer = 1.45;
      this.supportPlatform = null;
      this.dropPlatform = null;
      this.vx = 0;
      this.vy = 0;
      if (isLocalPlayerEntity(this)) {
        impactFeedback(0.075, 9);
        showBanner("MISSED THE LANDING", 0.85);
        audio.playerDeath("fall");
      }
    }

    beginDiveSmash() {
      if (this.smashing || this.onGround) return;
      this.smashing = true;
      this.setCrouching(false);
      this.vx *= 0.35;
      this.vy = Math.max(760, this.vy + 320);
      this.spinAngle = 0;
      this.smashTrailTimer = 0;
      this.invuln = Math.max(this.invuln, 0.22);
      burst(this.cx, this.cy, "#fff36d", 10, 155);
      audio.dive();
    }

    resolveEnemySmash(previousBottom) {
      if (this.vy < 120 || this.dead) return false;
      const currentBottom = this.y + this.h;
      let target = null;
      let highestTop = Infinity;

      for (const enemy of enemies) {
        if (enemy.dead) continue;
        const horizontalOverlap = Math.min(this.x + this.w, enemy.x + enemy.w) - Math.max(this.x, enemy.x);
        if (horizontalOverlap < Math.min(16, this.w * 0.32)) continue;
        const top = enemy.y;
        const crossedTop = previousBottom <= top + 18 && currentBottom >= top;
        if (crossedTop && top < highestTop) {
          target = enemy;
          highestTop = top;
        }
      }

      if (!target) return false;

      this.y = target.y - this.h - 2;
      this.vy = this.smashing ? -720 : -525;
      this.onGround = false;
      this.supportPlatform = null;
      this.jumpCount = 1;
      this.invuln = Math.max(this.invuln, 0.34);
      this.stompChainTimer = this.stompChainTimer > 0 ? 1.1 : 0;
      this.stompChain = this.stompChainTimer > 0 ? this.stompChain + 1 : 1;
      this.stompChainTimer = 1.1;

      const damage = this.smashing ? 125 : 72;
      target.hit(damage, this.index);
      target.contactCooldown = Math.max(target.contactCooldown || 0, 0.45);
      target.retreatTimer = Math.max(target.retreatTimer || 0, 0.35);
      target.knockbackVx = (target.cx < this.cx ? -1 : 1) * (this.smashing ? 340 : 230);

      const label = this.smashing ? "DIVE SMASH!" : this.stompChain > 1 ? `STOMP ×${this.stompChain}` : "STOMP!";
      addFloatingText(this.cx, target.y - 18, label, "#fff36d", this.smashing ? 23 : 19);
      burst(this.cx, target.y + 4, this.smashing ? "#ff9d3d" : this.color, this.smashing ? 22 : 13, this.smashing ? 250 : 175);
      blastEffects.push(new BlastEffect(this.cx, target.y + 8, this.smashing ? "#ff9d3d" : this.color, this.smashing ? 2 : 1));
      impactFeedback(this.smashing ? 0.075 : 0.04);
      audio.smash();
      this.smashing = false;
      return true;
    }

    finishGroundSmash() {
      const impactY = this.y + this.h;
      blastEffects.push(new BlastEffect(this.cx, impactY, "#fff36d", 2));
      burst(this.cx, impactY - 4, "#ff9d3d", 24, 260);
      audio.smash();
      for (const enemy of enemies) {
        if (enemy.dead) continue;
        const dx = enemy.cx - this.cx;
        const dy = enemy.cy - impactY;
        if (Math.abs(dx) <= 155 && Math.abs(dy) <= 115) {
          enemy.hit(56 * (1 - Math.abs(dx) / 230) + 18, this.index);
          enemy.knockbackVx = Math.sign(dx || 1) * 285;
        }
      }
      enemyBullets = enemyBullets.filter(bullet => Math.hypot(bullet.cx - this.cx, bullet.cy - impactY) > 135);
    }

    setCrouching(value) {
      const next = Boolean(value);
      if (next === this.crouching) return;

      const feet = this.y + this.h;
      this.crouching = next;
      this.h = next ? this.crouchingHeight : this.standingHeight;
      this.y = feet - this.h;

      if (next) this.vx = 0;
    }

    setAim(x, y) {
      const length = Math.hypot(x || 0, y || 0);
      if (length < 0.08) return;

      this.aimX = x / length;
      this.aimY = y / length;
      if (Math.abs(this.aimX) > 0.025) this.facing = this.aimX < 0 ? -1 : 1;
    }

    updateTimers(dt) {
      this.fireCooldown -= dt;
      this.shotActivity = Math.max(0, this.shotActivity - dt);
      this.invuln -= dt;
      this.muzzle -= dt;
      this.landTimer = Math.max(0, this.landTimer - dt);
      this.recoil = Math.max(0, this.recoil - dt * 8.5);
      this.entryTimer = Math.max(0, this.entryTimer - dt);
      this.specialPose = Math.max(0, this.specialPose - dt);
      this.stompChainTimer = Math.max(0, this.stompChainTimer - dt);
      if (this.stompChainTimer <= 0) this.stompChain = 0;
      this.victoryPose = Math.max(0, this.victoryPose - dt);
      this.portalHidden = Math.max(0, this.portalHidden - dt);
      this.animTime += dt;
    }

    handleActions(controls) {
      if (controls.fire && this.fireCooldown <= 0) this.fire();

      if (controls.powerPressed && this.specials > 0 && !specialAttack) {
        if (this.usePower()) this.specials--;
      }
    }

    resolveCollision(previousBottom, wasOnGround, previousSupport) {
      this.onGround = false;
      this.supportPlatform = null;

      let landingY = Infinity;
      let landingPlatform = null;
      const currentBottom = this.y + this.h;

      if (this.dropPlatform && currentBottom > this.dropPlatform.y + 30) this.dropPlatform = null;

      {
        for (const platform of platforms) {
          if (platform.dead || platform.arenaSuppressed || platform.collidable === false || platform === this.dropPlatform) continue;
          if (this.x + this.w <= platform.x || this.x >= platform.x + platform.w) continue;

          const crossedTop = this.vy >= 0 && previousBottom <= platform.y + 10 && currentBottom >= platform.y;
          const stayedOnTop = wasOnGround && previousSupport === platform && currentBottom >= platform.y - 10;
          if ((crossedTop || stayedOnTop) && platform.y < landingY) {
            landingY = platform.y;
            landingPlatform = platform;
          }
        }
      }

      const groundY = terrainGroundY(this.cx);
      if (Number.isFinite(groundY)) {
        const crossedGround = this.vy >= 0 && previousBottom <= groundY + 12 && currentBottom >= groundY;
        const followsGround = wasOnGround && !previousSupport && Math.abs(currentBottom - groundY) <= 34;
        if ((crossedGround || followsGround) && groundY < landingY) {
          landingY = groundY;
          landingPlatform = null;
        }
      }

      if (landingY < Infinity) {
        this.y = landingY - this.h;
        this.vy = 0;
        this.onGround = true;
        this.supportPlatform = landingPlatform;
        if (landingPlatform) landingPlatform.stepOn();
      }
    }

    fire() {
      if (Math.abs(this.aimX) > 0.01) this.facing = this.aimX < 0 ? -1 : 1;
      const spinningBurst = !this.onGround && this.jumpCount >= 2 && !this.smashing && this.weapon !== 3;
      if (spinningBurst) {
        this.fireSpinBurst();
        return;
      }

      const base = Math.atan2(this.aimY, this.aimX);
      const muzzleY = this.crouching ? this.y + 14 : this.y + 34;
      const verticalShot = this.aimY > 0.82 && Math.abs(this.aimX) < 0.35;
      const originX = verticalShot ? this.cx : this.cx + Math.cos(base) * 58;
      const originY = verticalShot ? this.y + this.h + 8 : muzzleY + Math.sin(base) * 58;

      let angles = [0];
      let cooldown = 0.14;
      let damage = 24;
      let type = "normal";
      let speed = 1080;

      if (this.weapon === 1) {
        angles = [-0.22, -0.11, 0, 0.11, 0.22];
        cooldown = 0.28;
        damage = 14;
        type = "pellet";
        speed = 960;
      } else if (this.weapon === 2) {
        cooldown = 0.06;
        damage = 12;
        type = "rapid";
        speed = 1280;
      } else if (this.weapon === 3) {
        cooldown = 0.42;
        damage = 78;
        type = "rocket";
        speed = 820;
      }

      for (const offset of angles) {
        const angle = base + offset;
        bullets.push(new Bullet(
          originX,
          originY,
          Math.cos(angle) * speed,
          Math.sin(angle) * speed,
          this.index,
          damage,
          type
        ));
      }

      this.fireCooldown = cooldown;
      this.shotActivity = Math.max(0.45, cooldown + 0.14);
      this.muzzle = 0.07;
      this.recoil = this.weapon === 3 ? 1.25 : this.weapon === 1 ? 0.9 : 0.55;
      audio.shoot(this.weapon);
    }

    fireSpinBurst() {
      const profile = this.weapon === 1
        ? { count: 12, speed: 900, damage: 11, cooldown: 0.31, type: "pellet" }
        : this.weapon === 2
          ? { count: 10, speed: 1160, damage: 8, cooldown: 0.15, type: "rapid" }
          : { count: 8, speed: 1020, damage: 15, cooldown: 0.23, type: "normal" };

      const phase = this.spinAngle + this.spinShotPhase;
      const launchRadius = 28;
      for (let i = 0; i < profile.count; i++) {
        const angle = phase + i * Math.PI * 2 / profile.count;
        bullets.push(new Bullet(
          this.cx + Math.cos(angle) * launchRadius,
          this.cy + Math.sin(angle) * launchRadius,
          Math.cos(angle) * profile.speed,
          Math.sin(angle) * profile.speed,
          this.index,
          profile.damage,
          profile.type
        ));
      }

      this.spinShotPhase = (this.spinShotPhase + Math.PI / profile.count) % (Math.PI * 2);
      this.fireCooldown = profile.cooldown;
      this.shotActivity = Math.max(0.45, profile.cooldown + 0.14);
      this.muzzle = 0.08;
      this.recoil = 0.7;
      burst(this.cx, this.cy, this.color, Math.min(18, profile.count), 125);
      audio.shoot(this.weapon);
    }

    usePower() {
      if (specialAttack || levelState === "vehicle" || levelState === "crash" || (activeBoss && activeBoss.introTimer > 0)) return false;
      specialAttack = new ScreenSpecial(this.index);
      this.specialPose = specialAttack.duration;
      this.invuln = Math.max(this.invuln, specialAttack.duration + 0.15);
      impactFeedback(0.025, 11);
      return true;
    }

    hit(damage, knockbackDirection = 0) {
      if (levelState === "vehicle" || levelState === "crash") return;
      if (this.invuln > 0 || this.dead) return;

      this.health -= damage;
      this.invuln = difficulty.hitInvuln;
      if (knockbackDirection) this.knockbackX = knockbackDirection * 215;
      burst(this.cx, this.cy, this.color, 8, 185);
      addFloatingText(this.cx, this.y - 12, `-${Math.round(damage)}`, "#ff7b66", 18);
      impactFeedback(0.045);

      if (this.health <= 0) {
        this.health = 0;
        this.lives--;
        this.weapon = 0;
        this.dead = true;
        this.respawnTimer = 1.5;
        if (isLocalPlayerEntity(this)) impactFeedback(0.09);
        explode(this.cx, this.cy, this.color, 22, false);
        if (isLocalPlayerEntity(this)) audio.playerDeath("combat");
      } else if (isLocalPlayerEntity(this)) {
        audio.playerHit();
      }
    }

    revive() {
      this.dead = false;
      this.setCrouching(false);
      this.health = this.maxHealth;
      this.weapon = 0;

      const bossActive = bossArena && bossArena.isLocked();
      const minimumX = bossActive ? bossArena.left + 72 : WORLD_ZONES[campaignLevel].start + 24;
      const maximumX = bossActive ? bossArena.right - this.w - 72 : WORLD_ZONES[campaignLevel].end - this.w - 40;
      const preferredX = multiplayerRespawnAnchor(this, minimumX, maximumX);
      placePlayerOnSafeGround(this, preferredX, minimumX, maximumX);

      this.supportPlatform = null;
      this.dropPlatform = null;
      this.vx = 0;
      this.vy = 0;
      this.onGround = true;
      this.jumpCount = 0;
      this.spinAngle = 0;
      this.landTimer = 0;
      this.knockbackX = 0;
      this.smashing = false;
      this.stompChain = 0;
      this.stompChainTimer = 0;
      this.victoryPose = 0;
      this.invuln = 2.5;
      this.entryTimer = Math.max(this.entryTimer, 0.35);

      // Only the authority mutates shared combat objects. Presentation stays local
      // so a teammate respawning never shifts another player's camera.
      if (!onlineSession() || isNetworkAuthority()) {
        enemyBullets = enemyBullets.filter(bullet => Math.hypot(bullet.cx - this.cx, bullet.cy - this.cy) > 520);
        debris = debris.filter(piece => Math.hypot(piece.cx - this.cx, piece.cy - this.cy) > 420);
      }
      presentLocalRespawn(this);
    }

    addScore(amount) {
      const points = Math.max(0, Math.round(Number(amount) || 0));
      if (!points) return;
      this.score += points;

      while (this.score >= this.nextLifeScore) {
        this.nextLifeScore += EXTRA_LIFE_SCORE_STEP;
        if (this.lives >= MAX_LIVES) continue;
        this.lives++;
        audio.extraLife();
        showBanner("EXTRA LIFE • SCORE BONUS", 1.8);
        addFloatingText(this.cx, this.y - 24, "1UP", "#8fd7ff", 20);
        burst(this.cx, this.cy, "#8fd7ff", 16, 210);
      }
    }

    upgrade(type) {
      if (type === "health") {
        if (this.health >= this.maxHealth) return false;
        this.health = Math.min(this.maxHealth, this.health + difficulty.recovery);
      } else if (type === "special") {
        if (this.specials >= 3) return false;
        this.specials++;
      } else if (type === "life") {
        if (this.lives >= MAX_LIVES) return false;
        this.lives++;
      } else {
        this.weapon = type;
      }
      audio.pickup(type);
      return true;
    }

    draw() {
      if (this.dead || this.portalHidden > 0) return;
      if (this.invuln > 0 && Math.floor(this.invuln * 14) % 2 === 0) return;

      const aimAngle = this.victoryPose > 0 ? -Math.PI / 2 : Math.atan2(this.aimY, this.aimX);
      const moving = this.onGround && !this.crouching && Math.abs(this.vx) > 1;
      const runPhase = this.animTime * 15 + this.index * 2.4;
      const runSwing = moving ? Math.sin(runPhase) : 0;
      const bodyBob = moving ? Math.abs(Math.sin(runPhase)) * -3 : 0;
      const landingRatio = this.landTimer > 0 ? this.landTimer / 0.16 : 0;
      const squashY = 1 - landingRatio * 0.18;
      const squashX = 1 + landingRatio * 0.16;
      const airborne = !this.onGround;

      ctx.save();
      ctx.translate(this.cx, this.y + this.h / 2 + bodyBob);
      ctx.scale(squashX, squashY);
      ctx.lineCap = "butt";

      if (airborne && (this.jumpCount >= 2 || this.smashing)) {
        const orbitRadius = this.smashing ? 34 : 29;
        const blocks = this.smashing ? 8 : 6;
        for (let i = 0; i < blocks; i++) {
          const angle = this.spinAngle - this.facing * i * 0.48;
          const size = Math.max(4, 10 - i);
          ctx.globalAlpha = 0.72 - i * 0.08;
          ctx.fillStyle = i % 2 ? this.color : "#fff36d";
          ctx.fillRect(Math.cos(angle) * orbitRadius - size / 2, Math.sin(angle) * orbitRadius - size / 2, size, size);
        }
        ctx.globalAlpha = 1;
      }

      // Body animation is independent from the aim so a double-jump somersault
      // remains readable while the weapon continues to point at the target.
      ctx.save();
      if ((this.jumpCount >= 2 || this.smashing) && airborne) ctx.rotate(this.spinAngle);
      ctx.scale(this.facing, 1);

      if (this.crouching) {
        ctx.fillStyle = this.profile.armor;
        ctx.fillRect(-29, 12, 19, 10);
        ctx.fillRect(9, 12, 20, 10);

        ctx.fillStyle = this.color;
        roundRect(-22, -12, 43, 31, 5);
        ctx.fill();

        ctx.fillStyle = this.profile.skin;
        ctx.fillRect(-15, -30, 24, 21);
        ctx.fillStyle = this.profile.helmet;
        ctx.fillRect(-17, -34, 28, 9);
        ctx.fillRect(7, -30, 8, 6);
      } else {
        ctx.fillStyle = this.profile.armor;
        if (airborne) {
          const tuck = this.smashing ? 14 : this.jumpCount >= 2 ? 11 : 4;
          ctx.fillRect(-19, 22, 14, 22 - tuck);
          ctx.fillRect(7, 22, 14, 22 - tuck);
          ctx.fillRect(-24, 35 - tuck, 18, 9);
          ctx.fillRect(9, 35 - tuck, 18, 9);
        } else {
          const leftLeg = Math.round(runSwing * 8);
          const rightLeg = -leftLeg;
          ctx.fillRect(-16 + leftLeg, 24, 13, 27);
          ctx.fillRect(5 + rightLeg, 24, 13, 27);
          ctx.fillRect(-20 + leftLeg, 46, 18, 8);
          ctx.fillRect(5 + rightLeg, 46, 18, 8);
        }

        ctx.fillStyle = this.color;
        roundRect(-20, -18, 40, 49, 5);
        ctx.fill();
        ctx.fillStyle = this.profile.accent;
        ctx.globalAlpha = 0.45;
        ctx.fillRect(-14, -12, 7, 32);
        ctx.globalAlpha = 1;

        ctx.fillStyle = this.profile.skin;
        ctx.fillRect(-13, -46, 26, 25);
        ctx.fillStyle = this.profile.helmet;
        ctx.fillRect(-16, -50, 32, 10);
        ctx.fillRect(10, -44, 9, 7);
        ctx.fillStyle = this.profile.visor;
        ctx.fillRect(this.facing > 0 ? 6 : -10, -35, 4, 4);
        ctx.fillStyle = this.profile.accent;
        if (this.profile.style === "crest") ctx.fillRect(-4, -57, 8, 8);
        else if (this.profile.style === "band") ctx.fillRect(-16, -43, 32, 4);
        else if (this.profile.style === "visor") ctx.fillRect(-11, -38, 22, 5);
        else {
          ctx.strokeStyle = this.profile.accent;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(0, -53, 13, Math.PI, Math.PI * 2);
          ctx.stroke();
        }
      }
      ctx.restore();

      const kick = this.recoil * (this.weapon === 3 ? 10 : 6);
      ctx.save();
      ctx.translate(this.facing * 8 - Math.cos(aimAngle) * kick, this.crouching ? -7 : -8);
      ctx.rotate(aimAngle);

      ctx.fillStyle = this.profile.skin;
      ctx.fillRect(0, -5, 28, 10);

      if (this.weapon === 3) {
        ctx.fillStyle = "#aeb9c7";
        roundRect(20, -7, 61, 15, 3);
        ctx.fill();
        ctx.fillStyle = "#4d5968";
        ctx.fillRect(29, 8, 15, 9);
        ctx.fillStyle = "#ffbd45";
        ctx.fillRect(71, -3, 11, 6);
      } else if (this.weapon === 1) {
        ctx.fillStyle = "#283342";
        roundRect(20, -6, 70, 13, 3);
        ctx.fill();
        ctx.fillStyle = "#86dff0";
        ctx.fillRect(72, -8, 20, 4);
      } else if (this.weapon === 2) {
        ctx.fillStyle = "#32283f";
        roundRect(20, -5, 67, 11, 3);
        ctx.fill();
        ctx.fillStyle = "#ff73d2";
        ctx.fillRect(42, -8, 31, 3);
      } else {
        ctx.fillStyle = "#222b39";
        roundRect(20, -5, 66, 11, 3);
        ctx.fill();
      }

      if (this.muzzle > 0) {
        const muzzleLength = this.weapon === 3 ? 22 : 17;
        ctx.fillStyle = this.weapon === 2 ? "#ff73d2" : "#fff0a6";
        ctx.fillRect(86, -3, muzzleLength, 6);
        ctx.fillRect(91, -7, 9, 14);
      }
      ctx.restore();

      if (this.specialPose > 0) {
        const pulse = Math.floor(this.specialPose * 12) % 2;
        ctx.save();
        ctx.translate(0, -66);
        ctx.fillStyle = pulse ? "#fff36d" : this.profile.accent;
        ctx.fillRect(-4, -18, 8, 18);
        ctx.fillRect(-12, -14, 24, 5);
        ctx.fillRect(-18, -8, 7, 5);
        ctx.fillRect(11, -8, 7, 5);
        ctx.strokeStyle = "#fff36d";
        ctx.lineWidth = 3;
        ctx.strokeRect(-25, -27, 50, 34);
        ctx.restore();
      }

      ctx.restore();

      if (onlineSession()) {
        ctx.save();
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = `900 13px ${UI_FONT}`;
        ctx.fillStyle = this.index === net.localId ? "#ffffff" : this.profile.color;
        ctx.strokeStyle = "rgba(0,0,0,.85)";
        ctx.lineWidth = 4;
        const label = `P${this.index + 1}`;
        ctx.strokeText(label, this.cx, this.y - 14);
        ctx.fillText(label, this.cx, this.y - 14);
        ctx.restore();
      }
    }
  }

  class Bullet extends Entity {
    constructor(x, y, vx, vy, owner, damage, type) {
      const width = type === "rocket" ? 22 : type === "rapid" ? 13 : type === "pellet" ? 8 : 10;
      const height = type === "rocket" ? 11 : type === "pellet" ? 8 : 6;
      super(x - width / 2, y - height / 2, width, height);
      this.vx = vx;
      this.vy = vy;
      this.owner = owner;
      this.damage = damage;
      this.type = type;
      this.speed = Math.hypot(vx, vy);
      this.distanceTravelled = 0;
      const minimumRange = {
        pellet: 2200,
        rapid: 3000,
        rocket: 3600,
        normal: 2700
      }[type] || 2700;
      const screenMultiplier = {
        pellet: 1.55,
        rapid: 2.0,
        rocket: 2.3,
        normal: 1.8
      }[type] || 1.8;
      this.maxDistance = Math.max(minimumRange, SIMULATION_VIEW_W * screenMultiplier);
      this.maxLifetime = Math.max(3.2, this.maxDistance / Math.max(1, this.speed) + 1.2);
      this.target = null;
      this.turnRate = 5.8;
      this.retargetTimer = 0;
      this.trailTimer = 0;
    }

    targetIsOnScreen(target) {
      const view = gameplaySimulationView();
      return target && !target.dead &&
        target.x + target.w >= view.left &&
        target.x <= view.right &&
        target.y + target.h >= view.top &&
        target.y <= view.bottom;
    }

    acquireTarget() {
      let best = null;
      let bestScore = Infinity;
      const currentAngle = Math.atan2(this.vy, this.vx);

      const consider = candidate => {
        if (!this.targetIsOnScreen(candidate)) return;
        const dx = candidate.cx - this.cx;
        const dy = candidate.cy - this.cy;
        const distance = Math.hypot(dx, dy);
        const desiredAngle = Math.atan2(dy, dx);
        const angleDifference = Math.abs(Math.atan2(
          Math.sin(desiredAngle - currentAngle),
          Math.cos(desiredAngle - currentAngle)
        ));
        const score = distance + angleDifference * 115;
        if (score < bestScore) {
          bestScore = score;
          best = candidate;
        }
      };

      for (const enemy of enemies) {
        if (!enemy.dead) consider(enemy);
      }
      if (activeBoss && !activeBoss.dead) consider(activeBoss);
      this.target = best;
    }

    updateHoming(dt) {
      this.retargetTimer -= dt;
      if (!this.targetIsOnScreen(this.target) || this.retargetTimer <= 0) {
        this.acquireTarget();
        this.retargetTimer = 0.12;
      }

      if (this.target) {
        const currentAngle = Math.atan2(this.vy, this.vx);
        const desiredAngle = Math.atan2(this.target.cy - this.cy, this.target.cx - this.cx);
        const difference = Math.atan2(
          Math.sin(desiredAngle - currentAngle),
          Math.cos(desiredAngle - currentAngle)
        );
        const nextAngle = currentAngle + clamp(difference, -this.turnRate * dt, this.turnRate * dt);
        this.speed = Math.min(930, this.speed + 105 * dt);
        this.vx = Math.cos(nextAngle) * this.speed;
        this.vy = Math.sin(nextAngle) * this.speed;
      }

      this.trailTimer -= dt;
      if (this.trailTimer <= 0) {
        this.trailTimer = 0.035;
        const length = Math.hypot(this.vx, this.vy) || 1;
        burst(
          this.cx - this.vx / length * 14,
          this.cy - this.vy / length * 14,
          chance(0.5) ? "#ff7a3d" : "#ffd34d",
          1,
          38
        );
      }
    }

    update(dt) {
      if (this.type === "rocket") this.updateHoming(dt);

      const stepX = this.vx * dt;
      const stepY = this.vy * dt;
      this.x += stepX;
      this.y += stepY;
      this.distanceTravelled += Math.hypot(stepX, stepY);
      this.maxLifetime -= dt;

      if (
        this.distanceTravelled >= this.maxDistance ||
        this.maxLifetime <= 0 ||
        this.x < -500 ||
        this.x > LEVEL_W + 500 ||
        this.y < -700 ||
        this.y > WORLD_H + 700
      ) {
        this.dead = true;
        return;
      }

      const surfaceY = terrainSurfaceY(this.cx);
      if (Number.isFinite(surfaceY) && this.cy >= surfaceY - 2) {
        this.dead = true;
        if (this.type === "rocket") explode(this.cx, this.cy, "#ffac4a", 14);
        else burst(this.cx, this.cy, "#d5c991", 2, 65);
        return;
      }

      for (const hostile of enemyBullets) {
        if (hostile instanceof BossMissile && hostile.launched && !hostile.dead && this.overlaps(hostile)) {
          hostile.takeHit(this.damage, this.owner);
          this.dead = true;
          burst(this.cx, this.cy, "#fff2a4", 4, 120);
          return;
        }
      }

      for (const enemy of enemies) {
        if (!enemy.dead && this.overlaps(enemy)) {
          this.hitTarget(enemy);
          return;
        }
      }

      if (activeBoss && !activeBoss.dead && this.overlaps(activeBoss)) this.hitTarget(activeBoss);
    }

    hitTarget(target) {
      target.hit(this.damage, this.owner);
      this.dead = true;

      if (this.type === "rocket") {
        const radius = 165;
        const targets = activeBoss && !activeBoss.dead ? [...enemies, activeBoss] : enemies;
        for (const other of targets) {
          if (other === target || other.dead) continue;
          const distance = Math.hypot(other.cx - this.cx, other.cy - this.cy);
          if (distance < radius) other.hit(15 + 44 * (1 - distance / radius), this.owner);
        }
        explode(this.cx, this.cy, "#ffac4a", 24);
        impactFeedback(0.035);
      } else {
        burst(this.cx, this.cy, this.type === "rapid" ? "#ff83da" : "#ffe99a", 3, 110);
      }
    }

    drawTargetLock() {
      if (this.type !== "rocket" || !this.targetIsOnScreen(this.target)) return;

      const pulse = 18 + Math.round(Math.sin(time * 12) * 3);
      const x = this.target.cx;
      const y = this.target.cy;
      const arm = 8;

      ctx.save();
      ctx.strokeStyle = "#ffd34d";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x - pulse, y - pulse + arm);
      ctx.lineTo(x - pulse, y - pulse);
      ctx.lineTo(x - pulse + arm, y - pulse);
      ctx.moveTo(x + pulse - arm, y - pulse);
      ctx.lineTo(x + pulse, y - pulse);
      ctx.lineTo(x + pulse, y - pulse + arm);
      ctx.moveTo(x - pulse, y + pulse - arm);
      ctx.lineTo(x - pulse, y + pulse);
      ctx.lineTo(x - pulse + arm, y + pulse);
      ctx.moveTo(x + pulse - arm, y + pulse);
      ctx.lineTo(x + pulse, y + pulse);
      ctx.lineTo(x + pulse, y + pulse - arm);
      ctx.stroke();
      ctx.restore();
    }

    draw() {
      this.drawTargetLock();

      ctx.save();
      ctx.translate(this.cx, this.cy);
      ctx.rotate(Math.atan2(this.vy, this.vx));

      if (this.type === "rocket") {
        ctx.fillStyle = "#ff7a3d";
        ctx.fillRect(-26, -4, 15, 8);
        ctx.fillStyle = "#ffd34d";
        ctx.fillRect(-20, -2, 10, 4);
        ctx.fillStyle = "#dce4ee";
        roundRect(-11, -6, 22, 12, 3);
        ctx.fill();
        ctx.fillStyle = "#586779";
        ctx.fillRect(-5, -9, 8, 3);
        ctx.fillRect(-5, 6, 8, 3);
        ctx.fillStyle = "#ffbd45";
        ctx.fillRect(7, -3, 7, 6);
      } else if (this.type === "pellet") {
        ctx.fillStyle = "#74eaff";
        ctx.fillRect(-5, -3, 12, 6);
      } else if (this.type === "rapid") {
        ctx.fillStyle = "#ff73d2";
        ctx.fillRect(-9, -2, 18, 4);
      } else {
        ctx.fillStyle = "#fff4a0";
        ctx.fillRect(-7, -2, 14, 4);
      }
      ctx.restore();
    }
  }

  class EnemyBullet extends Entity {
    constructor(x, y, vx, vy, damage = 12, size = 10, color = "#ff6750") {
      super(x - size / 2, y - size / 2, size, size);
      this.vx = vx;
      this.vy = vy;
      this.damage = damage;
      this.color = color;
      this.life = 5;
    }

    update(dt) {
      const timeScale = enemyTimeScale();
      this.x += this.vx * dt * timeScale;
      this.y += this.vy * dt * timeScale;
      this.life -= dt * timeScale;

      const simulationView = gameplaySimulationView();
      if (
        this.life <= 0 ||
        this.x < simulationView.left - 450 ||
        this.x > simulationView.right + 600 ||
        this.y < simulationView.top - 250 ||
        this.y > simulationView.bottom + 300
      ) {
        this.dead = true;
        return;
      }

      if (this.cy >= terrainSurfaceY(this.cx) - 2) {
        this.dead = true;
        burst(this.cx, this.cy, this.color, 2, 58);
        return;
      }

      if (bossArena && bossArena.blockHostileProjectile(this)) return;

      for (const player of players) {
        if (!player.dead && this.overlaps(player)) {
          if (levelState === "vehicle" || levelState === "crash") {
            burst(this.cx, this.cy, "#ffd34d", 4, 90);
          } else {
            player.hit(this.damage);
          }
          this.dead = true;
          break;
        }
      }
    }

    draw() {
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.cx, this.cy, this.w / 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }


  class BossMissile extends EnemyBullet {
    constructor(x, y, target, color, damage, launchDelay = 0) {
      const initialAngle = target ? Math.atan2(target.cy - y, target.cx - x) : Math.PI;
      super(x, y, Math.cos(initialAngle) * 115, Math.sin(initialAngle) * 115, damage, 18, color);
      this.target = target;
      this.speed = 115;
      this.turnRate = 1.25;
      this.life = 4.7;
      this.launchDelay = launchDelay;
      this.lockTimer = 0.85;
      this.homingTimer = 1.15;
      this.smokeTimer = 0;
      this.health = 28;
      this.launched = launchDelay <= 0;
      this.lockBroken = false;
    }

    takeHit(damage, owner) {
      if (this.dead) return;
      this.health -= damage;
      burst(this.cx, this.cy, "#fff2a4", 5, 145);
      if (this.health <= 0) {
        this.dead = true;
        if (players[owner]) players[owner].addScore(120);
        explode(this.cx, this.cy, this.color, 18, true, 1);
      }
    }

    update(dt) {
      const scale = enemyTimeScale();

      if (this.launchDelay > 0) {
        this.launchDelay -= dt;
        return;
      }
      this.launched = true;

      const target = this.target && !this.target.dead ? this.target : players.find(player => !player.dead);
      this.lockTimer = Math.max(0, this.lockTimer - dt);
      if (this.lockTimer <= 0) this.homingTimer = Math.max(0, this.homingTimer - dt * scale);

      if (target && this.homingTimer > 0) {
        const desired = Math.atan2(target.cy - this.cy, target.cx - this.cx);
        let current = Math.atan2(this.vy, this.vx);
        const delta = ((desired - current + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
        const activeTurnRate = this.lockTimer > 0 ? 0.95 : 1.65;
        current += clamp(delta, -activeTurnRate * dt, activeTurnRate * dt);
        const targetSpeed = this.lockTimer > 0 ? 135 : 245;
        this.speed += (targetSpeed - this.speed) * Math.min(1, dt * 5.5);
        this.vx = Math.cos(current) * this.speed;
        this.vy = Math.sin(current) * this.speed;
      } else {
        if (!this.lockBroken) {
          this.lockBroken = true;
        }
        this.speed = Math.min(360, this.speed + 90 * dt);
        const current = Math.atan2(this.vy, this.vx);
        this.vx = Math.cos(current) * this.speed;
        this.vy = Math.sin(current) * this.speed;
      }

      this.x += this.vx * dt * scale;
      this.y += this.vy * dt * scale;
      this.life -= dt * scale;
      this.smokeTimer -= dt;
      if (this.smokeTimer <= 0) {
        this.smokeTimer = 0.075;
        burst(this.cx - this.vx * 0.035, this.cy - this.vy * 0.035, "#7b7186", 1, 28);
      }

      const simulationView = gameplaySimulationView();
      if (this.life <= 0 || this.cx < simulationView.left - 420 || this.cx > simulationView.right + 500 || this.cy > terrainSurfaceY(this.cx)) {
        this.dead = true;
        explode(this.cx, this.cy, this.color, 10, false, 1);
        return;
      }

      if (bossArena && bossArena.blockHostileProjectile(this)) return;

      if (this.lockTimer <= 0) {
        for (const player of players) {
          if (!player.dead && this.overlaps(player)) {
            player.hit(this.damage);
            this.dead = true;
            explode(this.cx, this.cy, this.color, 18, true, 1);
            break;
          }
        }
      }
    }

    draw() {
      if (!this.launched) return;
      const angle = Math.atan2(this.vy, this.vx);
      ctx.save();
      ctx.translate(this.cx, this.cy);
      ctx.rotate(angle);
      ctx.fillStyle = "#f1edf8";
      ctx.beginPath();
      ctx.moveTo(12, 0); ctx.lineTo(-7, -7); ctx.lineTo(-13, 0); ctx.lineTo(-7, 7); ctx.closePath();
      ctx.fill();
      ctx.fillStyle = this.color;
      ctx.fillRect(-12, -4, 8, 8);
      ctx.fillStyle = "#ffb642";
      ctx.fillRect(-20, -3, 9, 6);
      ctx.restore();

      if (this.target && !this.target.dead && this.homingTimer > 0) {
        const pulse = 25 + Math.sin(time * 14) * 4;
        ctx.save();
        ctx.strokeStyle = this.lockTimer > 0 ? "#fff36d" : "#ff6b5c";
        ctx.lineWidth = 3;
        ctx.setLineDash(this.lockTimer > 0 ? [8, 6] : [4, 5]);
        ctx.beginPath();
        ctx.arc(this.target.cx, this.target.cy, pulse, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        drawUiIcon(this.lockTimer > 0 ? "lock" : "warning", this.target.cx, this.target.y - 20, 18, this.lockTimer > 0 ? "#fff36d" : "#ff6b5c", 2.4);
        ctx.restore();
      }
    }
  }

  class ScreenSpecial {
    constructor(owner) {
      this.owner = owner;
      this.player = players.find(player => player.index === owner) || players[0];
      this.profile = this.player ? this.player.profile : CHARACTER_PROFILES[0];
      this.mode = this.profile.id;
      this.time = 0;
      this.dead = false;
      const simulationView = gameplaySimulationView();
      this.paddingX = Math.max(120, simulationView.width * 0.10);
      this.left = simulationView.left - this.paddingX;
      this.right = simulationView.right + this.paddingX;
      this.top = simulationView.top - 100;
      this.bottom = simulationView.bottom + 120;
      this.impacts = [];
      this.slashes = [];
      this.targets = this.collectTargets();
      this.targetQueue = [...this.targets];
      this.clearedFire = false;
      this.finalBurst = false;
      this.pulseIndex = 0;
      this.strikeIndex = 0;
      this.freezesEnemies = true;

      if (this.mode === "vanguard") {
        this.duration = 2.75;
        this.nextStrike = 0.34;
        this.strikeCount = clamp(this.targets.length + 4, 7, 12);
      } else if (this.mode === "ember") {
        this.duration = 2.80;
        this.nextStrike = 0.28;
        this.strikeCount = clamp(this.targets.length + 5, 10, 14);
      } else if (this.mode === "ghost") {
        this.duration = 2.50;
        this.nextStrike = 0.24;
        this.strikeCount = Math.max(5, this.targets.length);
      } else {
        this.duration = 3.05;
        this.nextPulse = 0.48;
        const targetCenter = this.targetCenter();
        this.centerX = targetCenter.x;
        this.centerY = targetCenter.y;
        this.novaStart = new Map();
        this.targets.forEach((target, index) => {
          this.novaStart.set(target, { x: target.x, y: target.y, index });
        });
      }

      if (this.player) {
        this.player.invuln = Math.max(this.player.invuln, this.duration + 0.25);
        this.player.specialPose = this.duration;
      }
      showBanner(this.profile.power, 1.4);
      audio.powerStart(this.mode);
    }

    inField(entity) {
      return entity.x + entity.w >= this.left &&
             entity.x <= this.right &&
             entity.y + entity.h >= this.top &&
             entity.y <= this.bottom;
    }

    collectTargets() {
      const targets = enemies.filter(enemy => !enemy.dead && this.inField(enemy));
      if (activeBoss && !activeBoss.dead && this.inField(activeBoss)) targets.push(activeBoss);
      return targets.sort((a, b) => {
        if (a instanceof StageBoss && !(b instanceof StageBoss)) return 1;
        if (b instanceof StageBoss && !(a instanceof StageBoss)) return -1;
        return a.cx - b.cx;
      });
    }

    livingTargets() {
      return this.collectTargets().filter(target => !target.dead);
    }

    targetCenter() {
      if (!this.targets.length) {
        return {
          x: cameraX + visibleWorldW * 0.52,
          y: cameraY + visibleWorldH * 0.36
        };
      }
      const center = this.targets.reduce((sum, target) => {
        sum.x += target.cx;
        sum.y += target.cy;
        return sum;
      }, { x: 0, y: 0 });
      center.x /= this.targets.length;
      center.y /= this.targets.length;
      return {
        x: clamp(center.x, cameraX + 150, cameraX + visibleWorldW - 150),
        y: clamp(center.y - 45, cameraY + 125, cameraY + visibleWorldH * 0.55)
      };
    }

    nextTarget() {
      while (this.targetQueue.length) {
        const target = this.targetQueue.shift();
        if (target && !target.dead && this.inField(target)) return target;
      }
      return null;
    }

    eraseHostileFire(color = this.profile.color) {
      let erased = 0;
      const survivors = [];
      for (const bullet of enemyBullets) {
        if (this.inField(bullet)) {
          if (erased < 34) burst(bullet.cx, bullet.cy, color, 3, 105);
          erased++;
        } else {
          survivors.push(bullet);
        }
      }
      enemyBullets = survivors;
      return erased;
    }

    hitTarget(target, enemyDamage, bossDamage) {
      if (!target || target.dead) return;
      target.hit(target instanceof StageBoss ? bossDamage : enemyDamage, this.owner);
    }

    damageAll(enemyDamage, bossDamage) {
      for (const target of this.livingTargets()) this.hitTarget(target, enemyDamage, bossDamage);
    }

    damageAround(x, y, radius, enemyDamage, bossDamage = enemyDamage) {
      for (const enemy of enemies) {
        if (enemy.dead || !this.inField(enemy)) continue;
        const distance = Math.hypot(enemy.cx - x, enemy.cy - y);
        if (distance < radius) {
          const scale = 1 - distance / radius;
          enemy.hit(enemyDamage * (0.45 + scale * 0.55), this.owner);
        }
      }
      if (activeBoss && !activeBoss.dead && this.inField(activeBoss)) {
        const distance = Math.hypot(activeBoss.cx - x, activeBoss.cy - y);
        if (distance < radius + Math.max(activeBoss.w, activeBoss.h) * 0.35) activeBoss.hit(bossDamage, this.owner);
      }
    }

    update(dt) {
      this.time += dt;
      if (this.mode === "vanguard") this.updateVanguard();
      else if (this.mode === "ember") this.updateEmber();
      else if (this.mode === "ghost") this.updateGhost();
      else this.updateNova(dt);

      for (const impact of this.impacts) impact.life -= dt;
      for (const slash of this.slashes) slash.life -= dt;
      this.impacts = this.impacts.filter(impact => impact.life > 0);
      this.slashes = this.slashes.filter(slash => slash.life > 0);
      if (this.time >= this.duration) this.dead = true;
    }

    updateVanguard() {
      if (!this.clearedFire && this.time >= 0.12) {
        this.clearedFire = true;
        this.eraseHostileFire(this.profile.color);
        this.impacts.push({ type: "shield", x: this.player?.cx || cameraX + visibleWorldW * 0.35, y: this.player?.cy || cameraY + visibleWorldH * 0.62, life: 1.75, maxLife: 1.75 });
      }

      while (this.time >= this.nextStrike && this.strikeIndex < this.strikeCount) {
        const target = this.nextTarget();
        const laneT = (this.strikeIndex + 0.5) / this.strikeCount;
        const x = target ? target.cx : this.left + (this.right - this.left) * laneT;
        const y = target ? target.cy : Math.min(this.bottom - 35, terrainSurfaceY(x) - 18);
        this.impacts.push({ type: "rail", x, y, life: 0.68, maxLife: 0.68 });
        if (target) this.hitTarget(target, 250, 105);
        this.damageAround(x, y, 155, 115, 34);
        explode(x, y, this.strikeIndex % 2 ? this.profile.color : "#ffd34d", 19, false);
        audio.powerStrike("vanguard", this.strikeIndex);
        this.strikeIndex++;
        this.nextStrike += 0.13;
      }

      if (!this.finalBurst && this.time >= 2.02) {
        this.finalBurst = true;
        this.eraseHostileFire(this.profile.color);
        this.damageAll(120, 185);
        this.impacts.push({ type: "barrage", x: cameraX + visibleWorldW * 0.5, y: cameraY + visibleWorldH * 0.48, life: 0.78, maxLife: 0.78 });
        impactFeedback(0.065, 17);
        audio.powerFinish("vanguard");
      }
    }

    updateEmber() {
      if (!this.clearedFire && this.time >= 0.10) {
        this.clearedFire = true;
        this.eraseHostileFire(this.profile.color);
      }

      while (this.time >= this.nextStrike && this.strikeIndex < this.strikeCount) {
        const target = this.nextTarget();
        const laneT = (this.strikeIndex + 0.45) / this.strikeCount;
        const x = target ? target.cx : this.left + (this.right - this.left) * laneT;
        const y = target ? Math.min(target.y + target.h, terrainSurfaceY(target.cx)) : terrainSurfaceY(x);
        this.impacts.push({ type: "fire", x, y: y - 8, life: 1.05, maxLife: 1.05 });
        if (target) this.hitTarget(target, 235, 88);
        this.damageAround(x, y - 55, 205, 130, 38);
        explode(x, y - 35, this.strikeIndex % 2 ? "#ff765e" : "#ffbd45", 17, false);
        audio.powerStrike("ember", this.strikeIndex);
        this.strikeIndex++;
        this.nextStrike += 0.14;
      }

      if (!this.finalBurst && this.time >= 2.02) {
        this.finalBurst = true;
        this.eraseHostileFire(this.profile.color);
        this.damageAll(155, 220);
        this.impacts.push({ type: "inferno", x: cameraX + visibleWorldW * 0.5, y: cameraY + visibleWorldH * 0.52, life: 0.82, maxLife: 0.82 });
        impactFeedback(0.07, 18);
        audio.powerFinish("ember");
      }
    }

    updateGhost() {
      if (!this.clearedFire && this.time >= 0.06) {
        this.clearedFire = true;
        this.eraseHostileFire(this.profile.color);
      }

      while (this.time >= this.nextStrike && this.strikeIndex < this.strikeCount) {
        const target = this.nextTarget();
        const laneT = (this.strikeIndex + 0.5) / this.strikeCount;
        const x = target ? target.cx : this.left + (this.right - this.left) * laneT;
        const y = target ? target.cy : cameraY + visibleWorldH * (0.30 + (this.strikeIndex % 3) * 0.18);
        const direction = this.strikeIndex % 2 ? -1 : 1;
        this.slashes.push({
          x1: x - direction * 130,
          y1: y + 95,
          x2: x + direction * 130,
          y2: y - 95,
          life: 0.55,
          maxLife: 0.55
        });
        if (target) this.hitTarget(target, 310, 135);
        burst(x, y, this.profile.color, 18, 270);
        audio.powerStrike("ghost", this.strikeIndex);
        this.strikeIndex++;
        this.nextStrike += 0.13;
      }

      if (!this.finalBurst && this.time >= 1.72) {
        this.finalBurst = true;
        this.damageAll(135, 245);
        this.impacts.push({ type: "phaseCross", x: cameraX + visibleWorldW * 0.5, y: cameraY + visibleWorldH * 0.5, life: 0.82, maxLife: 0.82 });
        impactFeedback(0.06, 17);
        audio.powerFinish("ghost");
      }
    }

    updateNova(dt) {
      const pullActive = this.time >= 0.10 && this.time < 2.18;
      if (pullActive) {
        const pullProgress = smoothStep(clamp((this.time - 0.10) / 1.85, 0, 1));
        for (const bullet of enemyBullets) {
          if (!this.inField(bullet)) continue;
          const dx = this.centerX - bullet.cx;
          const dy = this.centerY - bullet.cy;
          const distance = Math.max(1, Math.hypot(dx, dy));
          const speed = 420 + pullProgress * 980;
          bullet.x += dx / distance * speed * dt;
          bullet.y += dy / distance * speed * dt;
          bullet.vx *= Math.exp(-4.5 * dt);
          bullet.vy *= Math.exp(-4.5 * dt);
          if (distance < 52) bullet.dead = true;
        }

        const targets = this.targets.filter(target => target && !target.dead && this.inField(target));
        targets.forEach((target, index) => {
          if (target instanceof StageBoss) return;
          const anchor = this.novaStart.get(target) || { x: target.x, y: target.y, index };
