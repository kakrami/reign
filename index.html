  function terrainSegmentAt(x) {
    if (!terrain.length) return null;
    const px = clamp(x, 0, LEVEL_W - 0.001);
    let low = 0;
    let high = terrain.length - 1;

    while (low <= high) {
      const mid = (low + high) >> 1;
      const segment = terrain[mid];
      if (px < segment.x1) high = mid - 1;
      else if (px >= segment.x2) low = mid + 1;
      else return segment;
    }
    return terrain[Math.max(0, Math.min(terrain.length - 1, low))];
  }

  function terrainSurfaceY(x) {
    const segment = terrainSegmentAt(x);
    if (!segment) return GROUND_Y;
    const span = Math.max(1, segment.x2 - segment.x1);
    const t = clamp((x - segment.x1) / span, 0, 1);
    return segment.y1 + (segment.y2 - segment.y1) * t;
  }

  function terrainLaneY(x, low = false) {
    return terrainSurfaceY(x) - (low ? 28 : 72);
  }

  function gravityScaleAt(x) {
    const zone = zoneIndexAt(x);
    if (zone === 2) return 0.64; // Orbital core: deliberate low gravity.

    return { body: "#34392f", top: "#78836f", deep: "#202521", edge: "#4d584d" };
  }

  function drawTerrain(bottom) {
    for (const segment of terrain) {
      if (segment.x2 < cameraX - 260 || segment.x1 > cameraX + visibleWorldW + 260) continue;
      const colors = terrainPalette((segment.x1 + segment.x2) * 0.5);
      const x1 = segment.x1 - 1;
      const x2 = segment.x2 + 1;

      ctx.fillStyle = colors.body;
      ctx.beginPath();
      ctx.moveTo(x1, segment.y1);
      ctx.lineTo(x2, segment.y2);
      ctx.lineTo(x2, bottom);
      ctx.lineTo(x1, bottom);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = colors.top;
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.moveTo(segment.x1, segment.y1 + 4);
      ctx.lineTo(segment.x2, segment.y2 + 4);
      ctx.stroke();

      ctx.strokeStyle = colors.edge;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(segment.x1, segment.y1 + 15);
      ctx.lineTo(segment.x2, segment.y2 + 15);
      ctx.stroke();

      const start = Math.ceil(segment.x1 / 120) * 120;
      for (let x = start; x < segment.x2; x += 120) {
        const y = terrainSurfaceY(x);
        ctx.fillStyle = colors.deep;
        ctx.fillRect(x, y + 62, 76, 7);
      }
    }
  }

    const offsetX = Math.round(viewport ? viewport.offsetLeft : 0);
    const offsetY = Math.round(viewport ? viewport.offsetTop : 0);
    const nextPortrait = vh >= vw;
    const orientationChanged = previousResizePortrait !== null && previousResizePortrait !== nextPortrait;
    const snapCameraForResize = orientationChanged || performance.now() < cameraResizeSnapUntil;
    portrait = nextPortrait;
    previousResizePortrait = portrait;

    // Use only integer backing scales. Fractional canvas scales can produce
    // seams, clipped strokes, and intermittent compositing artifacts in iOS
    // Safari. Phones render at a stable 2x Retina buffer; unusually large
    // displays fall back to 1x before exceeding the safe backing-pixel budget.
    screenW = vw;
    screenH = vh;
    const nativeDpr = Math.max(1, window.devicePixelRatio || 1);
    const retinaPixels = vw * vh * 4;
    dpr = nativeDpr >= 2 && retinaPixels <= 4000000 ? 2 : 1;

    canvas.style.left = offsetX + "px";
    canvas.style.top = offsetY + "px";
    canvas.style.width = vw + "px";
    canvas.style.height = vh + "px";
    canvas.width = Math.max(1, Math.round(vw * dpr));
    canvas.height = Math.max(1, Math.round(vh * dpr));

    const rootStyle = getComputedStyle(document.documentElement);
    safeTop = parseFloat(rootStyle.getPropertyValue("--safe-top")) || 0;
    safeRight = parseFloat(rootStyle.getPropertyValue("--safe-right")) || 0;
    safeBottom = parseFloat(rootStyle.getPropertyValue("--safe-bottom")) || 0;
    safeLeft = parseFloat(rootStyle.getPropertyValue("--safe-left")) || 0;
    fittedTextCache.clear();
    wrappedTextCache.clear();
    ctx.imageSmoothingEnabled = true;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";

    const aspect = vw / vh;
    baseVisibleWorldW = portrait ? 820 : (aspect > 2.4 ? 1620 : 1500);
    const bossScale = activeBoss && !activeBoss.dead && activeBoss.arenaLock !== false ? (portrait ? 1.14 : 1.18) : 1;
    visibleWorldW = baseVisibleWorldW * bossScale;
    viewScale = canvas.width / visibleWorldW;
    visibleWorldH = canvas.height / viewScale;

    const maxCameraX = Math.max(0, LEVEL_W - visibleWorldW);
    cameraX = clamp(cameraX, 0, maxCameraX);
    cameraTargetX = clamp(cameraTargetX, 0, maxCameraX);

    let focusY = terrainSurfaceY(cameraX + visibleWorldW * 0.36);
    const leadPlayer = running ? frontAlivePlayer() : null;
    if (leadPlayer) focusY = terrainSurfaceY(leadPlayer.cx);

    const baselineY = clampCameraY(
      focusY - visibleWorldH * cameraGroundAnchor()
    );
    cameraTargetY = baselineY;

    // Orientation changes alter visibleWorldH immediately. Keep the terrain at the
    // same screen anchor instead of easing from the old portrait camera height.
    if (!running || levelState === "menu" || snapCameraForResize) {
      cameraY = baselineY;
      if (snapCameraForResize) accumulator = 0;
    }
  }

  function updateWorldView(dt) {
    const targetScale = activeBoss && !activeBoss.dead && activeBoss.arenaLock !== false
      ? (portrait ? 1.14 : 1.18)
      : victoryScene
        ? 1.08
        : 1;
    const targetWidth = baseVisibleWorldW * targetScale;
    const blend = 1 - Math.exp(-4.8 * dt);
    visibleWorldW += (targetWidth - visibleWorldW) * blend;
    if (Math.abs(targetWidth - visibleWorldW) < 0.05) visibleWorldW = targetWidth;
    viewScale = canvas.width / visibleWorldW;
    visibleWorldH = canvas.height / viewScale;
  }

  addEventListener("orientationchange", () => {
    clearControls();
    cameraResizeSnapUntil = performance.now() + 700;
    resize();
    requestAnimationFrame(resize);
    setTimeout(resize, 240);
  }, { passive: true });

  if (window.visualViewport) {
    visualViewport.addEventListener("resize", resize, { passive: true });
    visualViewport.addEventListener("scroll", resize, { passive: true });

  function fullscreenActive() {
    return Boolean(document.fullscreenElement || document.webkitFullscreenElement);
  }

  async function toggleFullscreen() {
    try {
      if (fullscreenActive()) {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit) await exit.call(document);
      } else {
        const target = document.documentElement;
        const request = target.requestFullscreen || target.webkitRequestFullscreen;
        if (!request) {
          menuResult = "FULLSCREEN IS NOT SUPPORTED BY THIS BROWSER";
          return;
        }
        try {
          await request.call(target, { navigationUI: "hide" });
        } catch (_) {
          await request.call(target);
        }
      }
    } catch (_) {
      menuResult = "FULLSCREEN REQUEST WAS BLOCKED";
    }
    clearControls();
    setTimeout(resize, 40);
    setTimeout(resize, 220);
  }

  document.addEventListener("webkitfullscreenchange", resize, { passive: true });

  class Sound {
    constructor() {
      this.ctx = null;
      this.master = null;
      this.sfxGain = null;
      this.musicGain = null;
      this.musicVolume = 0.52;
      this.sfxVolume = 0.70;
      this.noiseBuffer = null;
      this.musicTimer = null;
      this.musicLevel = -1;
      this.musicStep = 0;
      this.musicNextTime = 0;
      this.musicMuted = false;
      this.musicPaused = false;
      this.lastImpactAt = -1;
    }

    ensure() {
      if (this.ctx) {
        if (this.ctx.state === "suspended") this.ctx.resume().catch(() => {});
        return;
      }

      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      this.ctx = new AudioContextClass();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.20;
      this.master.connect(this.ctx.destination);
      this.sfxGain = this.ctx.createGain();
      this.sfxGain.gain.value = this.sfxVolume;
      this.sfxGain.connect(this.master);
      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.value = this.musicVolume;
      this.musicGain.connect(this.master);
    }

    toneAt(frequency, duration, type = "square", gain = 0.18, slide = 0, delay = 0) {
      this.ensure();
      if (!this.ctx) return;
      const start = this.ctx.currentTime + Math.max(0, delay);
      const oscillator = this.ctx.createOscillator();
      const amplifier = this.ctx.createGain();
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(Math.max(20, frequency), start);
      if (slide) {
        oscillator.frequency.exponentialRampToValueAtTime(
          Math.max(20, frequency + slide),
          start + duration
        );
      }
      amplifier.gain.setValueAtTime(Math.max(0.001, gain), start);
      amplifier.gain.exponentialRampToValueAtTime(0.001, start + duration);
      oscillator.connect(amplifier);
      amplifier.connect(this.sfxGain || this.master);
      oscillator.start(start);
      oscillator.stop(start + duration + 0.02);
    }

    noiseAt(duration = 0.14, gain = 0.25, filterType = "lowpass", frequency = 1250, delay = 0) {
      this.ensure();
      if (!this.ctx) return;
      if (!this.noiseBuffer) {
        this.noiseBuffer = this.ctx.createBuffer(
          1,
          Math.max(1, Math.floor(this.ctx.sampleRate * 0.65)),
          this.ctx.sampleRate
        );
        const data = this.noiseBuffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      }
      const start = this.ctx.currentTime + Math.max(0, delay);
      const source = this.ctx.createBufferSource();
      const amplifier = this.ctx.createGain();
      const filter = this.ctx.createBiquadFilter();
      filter.type = filterType;
      filter.frequency.value = frequency;
      amplifier.gain.setValueAtTime(Math.max(0.001, gain), start);
      amplifier.gain.exponentialRampToValueAtTime(0.001, start + duration);
      source.buffer = this.noiseBuffer;
      source.connect(filter);
      filter.connect(amplifier);
      amplifier.connect(this.sfxGain || this.master);
      source.start(start);
      source.stop(start + duration + 0.02);
    }

    tone(frequency, duration, type = "square", gain = 0.18, slide = 0) {
      this.toneAt(frequency, duration, type, gain, slide, 0);
    }

    noise(duration = 0.14, gain = 0.25) {
      this.noiseAt(duration, gain, "lowpass", 1250, 0);
    }

    shoot(weapon) {
      if (weapon === 1) {
        this.noiseAt(0.055, 0.10, "bandpass", 900);
        this.toneAt(138, 0.08, "square", 0.11, -50);
      } else if (weapon === 2) {
        this.toneAt(310, 0.035, "square", 0.078, -105);
      } else if (weapon === 3) {
        this.toneAt(112, 0.13, "sawtooth", 0.14, -62);
        this.noiseAt(0.05, 0.07, "highpass", 1500);
      } else {
        this.toneAt(198, 0.055, "square", 0.115, -72);
      }
    }

    jump() { this.toneAt(260, 0.11, "square", 0.11, 165); }

    pickup() {
      this.toneAt(440, 0.07, "square", 0.10, 110);
      this.toneAt(660, 0.08, "square", 0.09, 90, 0.055);
      this.toneAt(880, 0.06, "square", 0.065, -90, 0.12);
    }

    hit() {
      this.noiseAt(0.045, 0.13, "bandpass", 740);
      this.toneAt(95, 0.055, "square", 0.08, -34);
    }

    explode(scale = 1) {
      const s = clamp(scale, 0.65, 1.5);
      this.noiseAt(0.16 * s, 0.24 * s, "lowpass", 980 / s);
      this.noiseAt(0.075, 0.10 * s, "highpass", 1700, 0.018);
      this.toneAt(86 / s, 0.22 * s, "square", 0.13 * s, -48);
    }

    impact(strength = 1, material = "metal") {
      this.ensure();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      if (now - this.lastImpactAt < 0.045) return;
      this.lastImpactAt = now;
      const s = clamp(strength, 0.55, 2.2);
      const metallic = material === "metal";
      this.noiseAt(0.07 + 0.055 * s, 0.10 + 0.07 * s, metallic ? "bandpass" : "lowpass", metallic ? 1050 : 520);
      this.toneAt((metallic ? 92 : 66) / Math.sqrt(s), 0.12 + 0.08 * s, metallic ? "square" : "triangle", 0.08 + 0.045 * s, -38);
      if (s > 1.15) this.noiseAt(0.18, 0.10 * s, "lowpass", 360, 0.035);
    }

    crash(strength = 1.4) {
      const s = clamp(strength, 0.8, 2.4);
      this.impact(s, "metal");
      this.noiseAt(0.34 * s, 0.20 * s, "lowpass", 430 / Math.sqrt(s), 0.02);
      this.noiseAt(0.11, 0.12 * s, "highpass", 2200, 0.045);
      this.toneAt(54 / Math.sqrt(s), 0.42 * s, "sawtooth", 0.14 * s, -28, 0.015);
    }

    bigExplosion(scale = 1.35) {
      const s = clamp(scale, 1, 1.9);
      this.noiseAt(0.52, 0.42, "lowpass", 520 / s);
      this.noiseAt(0.19, 0.22, "bandpass", 1050, 0.025);
      this.noiseAt(0.10, 0.16, "highpass", 2400, 0.055);
      this.toneAt(58 / s, 0.55, "sawtooth", 0.24, -34);
      this.toneAt(112, 0.19, "square", 0.12, -76, 0.10);
      this.noiseAt(0.25, 0.18, "lowpass", 760, 0.18);
    }

    bossExplosion() {
      this.bigExplosion(1.8);
      this.toneAt(42, 0.90, "sawtooth", 0.25, -18);
      this.noiseAt(0.40, 0.26, "lowpass", 420, 0.30);
      this.toneAt(74, 0.34, "square", 0.16, -46, 0.34);
      this.noiseAt(0.30, 0.22, "bandpass", 880, 0.62);
      this.toneAt(52, 0.48, "sawtooth", 0.18, -20, 0.68);
      this.noiseAt(0.52, 0.20, "lowpass", 330, 1.02);
      this.toneAt(38, 0.72, "sawtooth", 0.18, -12, 1.04);
    }

    smash() {
      this.noiseAt(0.11, 0.19, "bandpass", 720);
      this.toneAt(82, 0.18, "square", 0.13, -42);
      this.toneAt(164, 0.08, "square", 0.08, 95, 0.035);
    }

    victoryFanfare(major = false, final = false) {
      const notes = final
        ? [98, 147, 196, 294, 392, 588]
        : major
          ? [110, 165, 220, 330, 440]
          : [131, 196, 262, 392];
      notes.forEach((note, i) => {
        this.toneAt(note, major ? 0.22 : 0.16, i % 2 ? "square" : "triangle", 0.095, 35, 0.32 + i * 0.13);
      });
      if (major) {
        this.noiseAt(0.20, 0.11, "bandpass", 1250, 0.48);
        this.toneAt(final ? 49 : 55, final ? 1.15 : 0.78, "sawtooth", 0.12, 22, 0.28);
      }
    }

    boss() {
      this.toneAt(110, 0.10, "square", 0.12, -20);
      this.toneAt(82, 0.12, "square", 0.11, -16, 0.09);
    }

    special() {
      this.toneAt(118, 0.18, "sawtooth", 0.11, 165);
      this.toneAt(236, 0.12, "square", 0.10, 210, 0.12);
      this.toneAt(472, 0.16, "square", 0.09, -120, 0.27);
    }

    levelStinger(level) {
      const roots = [110, 147, 165, 131, 123, 98];
      const root = roots[level] || 110;
      const pattern = level === 3 ? [1, 1.25, 1.5, 2] : level === 4 ? [1, 1.5, 1.25, 2] : [1, 1.25, 1.5, 2];
      pattern.forEach((ratio, i) => this.toneAt(root * ratio, 0.12, "square", 0.075, 35, i * 0.09));
    }

    midiFrequency(note) {
      return 440 * Math.pow(2, (note - 69) / 12);
    }

    musicTone(note, duration, wave, gain, start, detune = 0) {
      if (!this.ctx || !this.musicGain || note == null) return;
      const oscillator = this.ctx.createOscillator();
      const amplifier = this.ctx.createGain();
      oscillator.type = wave;
      oscillator.frequency.setValueAtTime(this.midiFrequency(note), start);
      oscillator.detune.value = detune;
      amplifier.gain.setValueAtTime(0.0001, start);
      amplifier.gain.exponentialRampToValueAtTime(Math.max(0.001, gain), start + 0.008);
      amplifier.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      oscillator.connect(amplifier);
      amplifier.connect(this.musicGain);
      oscillator.start(start);
      oscillator.stop(start + duration + 0.025);
    }

    musicNoise(duration, gain, frequency, start) {
      if (!this.ctx || !this.musicGain) return;
      if (!this.noiseBuffer) {
        this.noiseBuffer = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * 0.65), this.ctx.sampleRate);
        const data = this.noiseBuffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      }
      const source = this.ctx.createBufferSource();
      const filter = this.ctx.createBiquadFilter();
      const amplifier = this.ctx.createGain();
      source.buffer = this.noiseBuffer;
      filter.type = "bandpass";
      filter.frequency.value = frequency;
      amplifier.gain.setValueAtTime(Math.max(0.001, gain), start);
      amplifier.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      source.connect(filter);
      filter.connect(amplifier);
      amplifier.connect(this.musicGain);
      source.start(start);
      source.stop(start + duration + 0.02);
    }

    scheduleMusicStep(start) {
      const theme = MUSIC_THEMES[this.musicLevel];
      if (!theme || this.musicMuted || this.musicPaused) return;
      const step = this.musicStep;
      const beat = 60 / theme.bpm;
      const sixteenth = beat / 4;
      const leadOffset = theme.lead[step % theme.lead.length];
      const bassOffset = theme.bass[Math.floor(step / 4) % theme.bass.length];
      const arpOffset = theme.arp[step % theme.arp.length];
      const bossBoost = activeBoss && !activeBoss.dead;

      if (step % 2 === 0 && leadOffset != null) {
        this.musicTone(theme.root + 12 + leadOffset, sixteenth * 1.72, theme.wave, bossBoost ? 0.050 : 0.040, start);
      }
      this.musicTone(theme.root + 12 + arpOffset, sixteenth * 0.86, step % 3 ? "square" : "triangle", bossBoost ? 0.026 : 0.020, start, step % 2 ? -5 : 5);
      if (step % 4 === 0) {
        this.musicTone(theme.root - 12 + bassOffset, beat * 0.82, "square", bossBoost ? 0.070 : 0.055, start);
      }

      if (step % 8 === 0) {
        this.musicTone(theme.root - 24, 0.11, "sine", bossBoost ? 0.090 : 0.072, start, 0);
        this.musicNoise(0.045, 0.028, 170, start);
      }
      if (step % 8 === 4) this.musicNoise(0.10, bossBoost ? 0.060 : 0.047, 1150, start);
      if (step % 2 === 1) this.musicNoise(0.024, bossBoost ? 0.020 : 0.014, this.musicLevel === 4 ? 4200 : 3100, start);
      if (bossBoost && step % 8 === 6) this.musicTone(theme.root + 24 + (leadOffset || 0), sixteenth * 1.3, "square", 0.034, start);

      this.musicStep = (step + 1) % 64;
    }

    pumpMusic() {
      if (!this.ctx || this.musicLevel < 0 || this.musicPaused) return;
      const theme = MUSIC_THEMES[this.musicLevel];
      const stepDuration = 60 / theme.bpm / 4;
      const horizon = this.ctx.currentTime + 0.16;
      if (this.musicNextTime < this.ctx.currentTime - 0.25) this.musicNextTime = this.ctx.currentTime + 0.04;
      while (this.musicNextTime < horizon) {
        this.scheduleMusicStep(this.musicNextTime);
        this.musicNextTime += stepDuration;
      }
    }

    startMusic(level) {
      this.ensure();
      if (!this.ctx) return;
      const nextLevel = clamp(level | 0, 0, MUSIC_THEMES.length - 1);
      if (this.musicLevel !== nextLevel) {
        this.musicLevel = nextLevel;
        this.musicStep = 0;
        this.musicNextTime = this.ctx.currentTime + 0.06;
      }
      this.musicPaused = false;
      if (this.musicGain) {
        const now = this.ctx.currentTime;
        this.musicGain.gain.cancelScheduledValues(now);
        this.musicGain.gain.setTargetAtTime(this.musicMuted ? 0.0001 : this.musicVolume, now, 0.035);
      }
      if (!this.musicTimer) this.musicTimer = setInterval(() => this.pumpMusic(), 35);
    }

    stopMusic() {
      this.musicLevel = -1;
      this.musicStep = 0;
      if (this.musicGain && this.ctx) this.musicGain.gain.setTargetAtTime(0.0001, this.ctx.currentTime, 0.04);
      if (this.musicTimer) {
        clearInterval(this.musicTimer);
        this.musicTimer = null;
      }
    }

    setMusicPaused(value) {
      this.musicPaused = Boolean(value);
      if (!this.ctx || !this.musicGain) return;
      const now = this.ctx.currentTime;
      this.musicGain.gain.cancelScheduledValues(now);
      this.musicGain.gain.setTargetAtTime(this.musicPaused || this.musicMuted ? 0.0001 : this.musicVolume, now, 0.03);
      if (!this.musicPaused) this.musicNextTime = now + 0.05;
    }

    toggleMusic() {
      this.ensure();
      this.musicMuted = !this.musicMuted;
      if (this.musicGain && this.ctx) {
        const now = this.ctx.currentTime;
        this.musicGain.gain.cancelScheduledValues(now);
        this.musicGain.gain.setTargetAtTime(this.musicMuted || this.musicPaused ? 0.0001 : this.musicVolume, now, 0.03);
      }
      return !this.musicMuted;
    }
  }

  const audio = new Sound();

  class Entity {
    constructor(x, y, w, h) {
      this.x = x;
      this.y = y;
      this.w = w;
      this.h = h;
      this.vx = 0;
      this.vy = 0;
      this.dead = false;
    }

    get cx() { return this.x + this.w / 2; }
    get cy() { return this.y + this.h / 2; }

    overlaps(other) {
      return this.x < other.x + other.w &&
             this.x + this.w > other.x &&
             this.y < other.y + other.h &&
             this.y + this.h > other.y;
    }
  }

  class Player extends Entity {
    constructor(index, x) {
      super(x, GROUND_Y - 82, 46, 82);
      this.index = index;
      this.color = index ? "#ffd45b" : "#63e5ff";
      this.health = 100;
      this.maxHealth = 100;
      this.lives = 3;
      this.score = 0;
      this.weapon = 0;
      this.weaponTimer = 0;
      this.specials = 2;
      this.facing = 1;
      this.aimX = 1;
      this.aimY = 0;
      this.onGround = true;
      this.fireCooldown = 0;
      this.invuln = 0;
      this.respawnTimer = 0;
      this.jumpHeld = false;
      this.powerHeld = false;
      this.muzzle = 0;
      this.standingHeight = 82;
      this.crouchingHeight = 48;
      this.crouching = false;

      this.maxJumps = 2;
      this.jumpCount = 0;
      this.spinAngle = 0;
      this.landTimer = 0;
      this.recoil = 0;
      this.animTime = 0;
      this.stepTimer = 0;
      this.entryTimer = 0;
      this.airTrailTimer = 0;
      this.supportPlatform = null;
      this.dropPlatform = null;
      this.knockbackX = 0;
      this.specialPose = 0;
      this.smashing = false;
      this.smashTrailTimer = 0;
      this.stompChain = 0;
      this.stompChainTimer = 0;
      this.victoryPose = 0;
      this.portalCooldown = 0;
      this.portalContact = false;
      this.portalDownHeld = false;
      this.portalHidden = 0;
      this.portalTransit = false;
      this.spinShotPhase = 0;
    }

    controls() {
      if (this.index === 0) {
        const useTouch = isTouch && touchStick.active;
        const keyboardMove = (pressed("KeyD") ? 1 : 0) - (pressed("KeyA") ? 1 : 0);
        const down = useTouch ? touchStick.down : pressed("KeyS");
        const airDown = down && !this.onGround;
        let aimX = useTouch ? touchStick.aimX : this.facing;
        let aimY = useTouch ? touchStick.aimY : 0;

        if (airDown) {
          if (!useTouch) aimX = keyboardMove;
          aimY = useTouch ? Math.max(0.35, touchStick.aimY) : 1;
        } else if (down && this.onGround) {
          aimX = useTouch && Math.abs(touchStick.aimX) > 0.18
            ? Math.sign(touchStick.aimX)
            : this.facing;
          aimY = 0;
        }

        return {
          moveX: useTouch ? touchStick.moveX : keyboardMove,
          aimX,
          aimY,
          jump: pressed("KeyW"),
          jumpPressed: takePress("KeyW"),
          down,
          duck: down && this.onGround,
          fire: pressed("KeyF"),
          power: pressed("KeyG"),
          powerPressed: takePress("KeyG")
        };
      }

      const keyboardMove = (pressed("ArrowRight") ? 1 : 0) - (pressed("ArrowLeft") ? 1 : 0);
      const down = pressed("ArrowDown");
      const airDown = down && !this.onGround;
      return {
        moveX: keyboardMove,
        aimX: airDown ? keyboardMove : this.facing,
        aimY: airDown ? 1 : 0,
        jump: pressed("ArrowUp"),
        jumpPressed: takePress("ArrowUp"),
        down,
        duck: down && this.onGround,
        fire: pressed("KeyK"),
        power: pressed("KeyL"),
        powerPressed: takePress("KeyL")
      };
    }

    update(dt) {
      if (this.dead) {
        this.respawnTimer -= dt;
        if (this.respawnTimer <= 0 && this.lives > 0) this.revive();
        return;
      }

      if (this.portalTransit) return;

      if (this.onGround && this.supportPlatform && !this.supportPlatform.dead) {
        this.x += this.supportPlatform.dx;
        this.y += this.supportPlatform.dy;
      }

      const controls = this.controls();
      this.setAim(controls.aimX, controls.aimY);
      this.updateTimers(dt);

      if (levelState === "vehicle") {
        this.x = introVehicle.x + 66 + this.index * 58;
        this.y = introVehicle.y - 63;
        this.setCrouching(false);
        this.vx = 0;
        this.vy = 0;
        this.onGround = true;
        this.jumpCount = 0;
        this.handleActions(controls);
        return;
      }

      if (levelState === "crash") {
        if (introVehicle) {
          this.x = introVehicle.x + 66 + this.index * 58;
          this.y = introVehicle.y - 63;
        }
        this.setCrouching(false);
        this.vx = 0;
        this.vy = 0;
        this.onGround = true;
        return;
      }

      const controlsLocked = this.entryTimer > 0;
      const wantsDuck = Boolean(!controlsLocked && controls.duck && this.onGround);
      this.setCrouching(wantsDuck);

      const move = !controlsLocked && !this.crouching && Math.abs(controls.moveX) >= 0.5
        ? Math.sign(controls.moveX)
        : 0;
      this.knockbackX *= Math.exp(-13 * dt);
      if (Math.abs(this.knockbackX) < 1) this.knockbackX = 0;
      this.vx = move * PLAYER_SPEED + this.knockbackX;

      if (move && this.onGround) {
        this.stepTimer -= dt;
        if (this.stepTimer <= 0) {
          this.stepTimer = 0.12;
          burst(this.cx - move * 15, this.y + this.h - 2, "#8f8a73", 1, 42);
        }
      } else {
        this.stepTimer = 0;
      }

      if (!controlsLocked && controls.jumpPressed) {
        if (controls.down && this.onGround && this.supportPlatform) {
          this.setCrouching(false);
          this.dropPlatform = this.supportPlatform;
          this.onGround = false;
          this.supportPlatform = null;
          this.vy = 185;
          this.y += 12;
          burst(this.cx, this.y + this.h - 2, "#ffd34d", 5, 82);
          audio.tone(155, 0.07, "square", 0.07, -50);
        } else if (controls.down && !this.onGround) {
          this.beginDiveSmash();
        } else {
          const canGroundJump = this.onGround;
          const canAirJump = !this.onGround && this.jumpCount < this.maxJumps;

          if (canGroundJump || canAirJump) {
            const doubleJump = !this.onGround;
            this.setCrouching(false);
            const gravityScale = gravityScaleAt(this.cx);
            this.vy = doubleJump
              ? (gravityScale < 0.8 ? -610 : -690)
              : (gravityScale < 0.8 ? -680 : -760);
            this.onGround = false;
            this.supportPlatform = null;
            this.smashing = false;
            this.jumpCount = doubleJump ? Math.max(2, this.jumpCount + 1) : 1;

            if (doubleJump) {
              this.spinAngle = -Math.PI * 0.45 * this.facing;
              this.airTrailTimer = 0;
              burst(this.cx, this.y + this.h - 3, this.color, 14, 235);
              audio.tone(430, 0.11, "square", 0.12, 320);
            } else {
              audio.jump();
            }
          }
        }
      }
      this.jumpHeld = controls.jump;

      const wasOnGround = this.onGround;
      const previousSupport = this.supportPlatform;
      const fallSpeed = this.vy;
      const previousBottom = this.y + this.h;

      this.vy += GRAVITY * gravityScaleAt(this.cx) * dt;
      this.x += this.vx * dt;
      this.y += this.vy * dt;

      const stompedEnemy = this.resolveEnemySmash(previousBottom);
      if (!stompedEnemy) this.resolveCollision(previousBottom, wasOnGround, previousSupport);

      if (this.onGround) {
        if (!wasOnGround && fallSpeed > 260) {
          this.landTimer = 0.16;
          burst(this.cx, this.y + this.h - 2, "#a29b80", 7, 115);
          audio.tone(92, 0.045, "square", 0.055, -25);
          if (this.smashing) this.finishGroundSmash();
        }
        this.jumpCount = 0;
        this.spinAngle = 0;
        this.smashing = false;
      } else {
        this.setCrouching(false);
        if (this.smashing) {
          this.spinAngle += dt * 26 * this.facing;
          this.smashTrailTimer -= dt;
          if (this.smashTrailTimer <= 0) {
            this.smashTrailTimer = 0.035;
            burst(this.cx, this.y + 10, chance(0.5) ? "#fff36d" : this.color, 2, 55);
          }
        } else if (this.jumpCount >= 2) {
          this.spinAngle += dt * 22 * this.facing;
          this.airTrailTimer -= dt;
          if (this.airTrailTimer <= 0) {
            this.airTrailTimer = 0.038;
            burst(this.cx - Math.cos(this.spinAngle) * 23, this.cy - Math.sin(this.spinAngle) * 23, this.color, 1, 45);
          }
        }
      }

      const leftBound = cameraX + 24;
      let rightBound = LEVEL_W - 40;
      if (activeBoss && !activeBoss.dead && activeBoss.arenaLock !== false) {
        rightBound = Math.min(rightBound, activeBoss.x - 28);
      }
      this.x = clamp(this.x, leftBound, Math.max(leftBound, rightBound - this.w));

      if (!controlsLocked) this.handleActions(controls);

      for (const hazard of hazards) {
        if (!hazard.dead && hazard.isDangerous() && this.overlaps(hazard)) {
          hazard.damagePlayer(this);
        }
      }
    }

    beginDiveSmash() {
      if (this.smashing || this.onGround) return;
      this.smashing = true;
      this.setCrouching(false);
      this.vx *= 0.35;
      this.vy = Math.max(760, this.vy + 320);
      this.spinAngle = 0;
      this.smashTrailTimer = 0;
      this.invuln = Math.max(this.invuln, 0.22);
      burst(this.cx, this.cy, "#fff36d", 10, 155);
      audio.tone(205, 0.10, "square", 0.10, -125);
    }

    resolveEnemySmash(previousBottom) {
      if (this.vy < 120 || this.dead) return false;
      const currentBottom = this.y + this.h;
      let target = null;
      let highestTop = Infinity;

      for (const enemy of enemies) {
        if (enemy.dead) continue;
        const horizontalOverlap = Math.min(this.x + this.w, enemy.x + enemy.w) - Math.max(this.x, enemy.x);
        if (horizontalOverlap < Math.min(16, this.w * 0.32)) continue;
        const top = enemy.y;
        const crossedTop = previousBottom <= top + 18 && currentBottom >= top;
        if (crossedTop && top < highestTop) {
          target = enemy;
          highestTop = top;
        }
      }

      if (!target) return false;

      this.y = target.y - this.h - 2;
      this.vy = this.smashing ? -720 : -525;
      this.onGround = false;
      this.supportPlatform = null;
      this.jumpCount = 1;
      this.invuln = Math.max(this.invuln, 0.34);
      this.stompChainTimer = this.stompChainTimer > 0 ? 1.1 : 0;
      this.stompChain = this.stompChainTimer > 0 ? this.stompChain + 1 : 1;
      this.stompChainTimer = 1.1;

      const damage = this.smashing ? 125 : 72;
      target.hit(damage, this.index);
      target.contactCooldown = Math.max(target.contactCooldown || 0, 0.45);
      target.retreatTimer = Math.max(target.retreatTimer || 0, 0.35);
      target.knockbackVx = (target.cx < this.cx ? -1 : 1) * (this.smashing ? 340 : 230);

      const label = this.smashing ? "DIVE SMASH!" : this.stompChain > 1 ? `STOMP ×${this.stompChain}` : "STOMP!";
      addFloatingText(this.cx, target.y - 18, label, "#fff36d", this.smashing ? 23 : 19);
      burst(this.cx, target.y + 4, this.smashing ? "#ff9d3d" : this.color, this.smashing ? 22 : 13, this.smashing ? 250 : 175);
      blastEffects.push(new BlastEffect(this.cx, target.y + 8, this.smashing ? "#ff9d3d" : this.color, this.smashing ? 2 : 1));
      impactFeedback(this.smashing ? 0.075 : 0.04);
      audio.smash();
      this.smashing = false;
      return true;
    }

    finishGroundSmash() {
      const impactY = this.y + this.h;
      blastEffects.push(new BlastEffect(this.cx, impactY, "#fff36d", 2));
      burst(this.cx, impactY - 4, "#ff9d3d", 24, 260);
      audio.smash();
      for (const enemy of enemies) {
        if (enemy.dead) continue;
        const dx = enemy.cx - this.cx;
        const dy = enemy.cy - impactY;
        if (Math.abs(dx) <= 155 && Math.abs(dy) <= 115) {
          enemy.hit(56 * (1 - Math.abs(dx) / 230) + 18, this.index);
          enemy.knockbackVx = Math.sign(dx || 1) * 285;
        }
      }
      enemyBullets = enemyBullets.filter(bullet => Math.hypot(bullet.cx - this.cx, bullet.cy - impactY) > 135);
      addFloatingText(this.cx, impactY - 92, "GROUND BREAK!", "#fff36d", 21);
    }

    setCrouching(value) {
      const next = Boolean(value);
      if (next === this.crouching) return;

      const feet = this.y + this.h;
      this.crouching = next;
      this.h = next ? this.crouchingHeight : this.standingHeight;
      this.y = feet - this.h;

      if (next) this.vx = 0;
    }

    setAim(x, y) {
      const length = Math.hypot(x || 0, y || 0);
      if (length < 0.08) return;

      this.aimX = x / length;
      this.aimY = y / length;
      if (Math.abs(this.aimX) > 0.12) this.facing = this.aimX < 0 ? -1 : 1;
    }

    updateTimers(dt) {
      this.fireCooldown -= dt;
      this.invuln -= dt;
      this.muzzle -= dt;
      this.landTimer = Math.max(0, this.landTimer - dt);
      this.recoil = Math.max(0, this.recoil - dt * 8.5);
      this.entryTimer = Math.max(0, this.entryTimer - dt);
      this.specialPose = Math.max(0, this.specialPose - dt);
      this.stompChainTimer = Math.max(0, this.stompChainTimer - dt);
      if (this.stompChainTimer <= 0) this.stompChain = 0;
      this.victoryPose = Math.max(0, this.victoryPose - dt);
      this.portalHidden = Math.max(0, this.portalHidden - dt);
      this.animTime += dt;
    }

    handleActions(controls) {
      if (controls.fire && this.fireCooldown <= 0) this.fire();

      if (controls.powerPressed && this.specials > 0 && !specialAttack) {
        if (this.usePower()) this.specials--;
      }
      this.powerHeld = controls.power;
    }

    resolveCollision(previousBottom, wasOnGround, previousSupport) {
      this.onGround = false;
      this.supportPlatform = null;

      let landingY = Infinity;
      let landingPlatform = null;
      const currentBottom = this.y + this.h;

      if (this.dropPlatform && currentBottom > this.dropPlatform.y + 30) this.dropPlatform = null;

      {
        for (const platform of platforms) {
          if (platform.dead || platform === this.dropPlatform) continue;
          if (this.x + this.w <= platform.x || this.x >= platform.x + platform.w) continue;

          const crossedTop = this.vy >= 0 && previousBottom <= platform.y + 10 && currentBottom >= platform.y;
          const stayedOnTop = wasOnGround && previousSupport === platform && currentBottom >= platform.y - 10;
          if ((crossedTop || stayedOnTop) && platform.y < landingY) {
            landingY = platform.y;
            landingPlatform = platform;
          }
        }
      }

      const groundY = terrainSurfaceY(this.cx);
      const crossedGround = this.vy >= 0 && previousBottom <= groundY + 12 && currentBottom >= groundY;
      const followsGround = wasOnGround && !previousSupport && Math.abs(currentBottom - groundY) <= 34;
      if ((crossedGround || followsGround) && groundY < landingY) {
        landingY = groundY;
        landingPlatform = null;
      }

      if (landingY < Infinity) {
        this.y = landingY - this.h;
        this.vy = 0;
        this.onGround = true;
        this.supportPlatform = landingPlatform;
        if (landingPlatform) landingPlatform.stepOn();
      }
    }

    fire() {
      const spinningBurst = !this.onGround && this.jumpCount >= 2 && !this.smashing && this.weapon !== 3;
      if (spinningBurst) {
        this.fireSpinBurst();
        return;
      }

      const base = Math.atan2(this.aimY, this.aimX);
      const muzzleY = this.crouching ? this.y + 14 : this.y + 34;
      const verticalShot = this.aimY > 0.82 && Math.abs(this.aimX) < 0.35;
      const originX = verticalShot ? this.cx : this.cx + Math.cos(base) * 58;
      const originY = verticalShot ? this.y + this.h + 8 : muzzleY + Math.sin(base) * 58;

      let angles = [0];
      let cooldown = 0.14;
      let damage = 22;
      let type = "normal";
      let speed = 1080;

      if (this.weapon === 1) {
        angles = [-0.22, -0.11, 0, 0.11, 0.22];
        cooldown = 0.28;
        damage = 18;
        type = "pellet";
        speed = 930;
      } else if (this.weapon === 2) {
        cooldown = 0.06;
        damage = 12;
        type = "rapid";
        speed = 1280;
      } else if (this.weapon === 3) {
        cooldown = 0.42;
        damage = 72;
        type = "rocket";
        speed = 790;
      }

      for (const offset of angles) {
        const angle = base + offset;
        bullets.push(new Bullet(
          originX,
          originY,
          Math.cos(angle) * speed,
          Math.sin(angle) * speed,
          this.index,
          damage,
          type
        ));
      }

      this.fireCooldown = cooldown;
      this.muzzle = 0.07;
      this.recoil = this.weapon === 3 ? 1.25 : this.weapon === 1 ? 0.9 : 0.55;
      audio.shoot(this.weapon);
    }

    fireSpinBurst() {
      const profile = this.weapon === 1
        ? { count: 12, speed: 900, damage: 11, cooldown: 0.31, type: "pellet" }
        : this.weapon === 2
          ? { count: 10, speed: 1160, damage: 8, cooldown: 0.15, type: "rapid" }
          : { count: 8, speed: 1020, damage: 15, cooldown: 0.23, type: "normal" };

      const phase = this.spinAngle + this.spinShotPhase;
      const launchRadius = 28;
      for (let i = 0; i < profile.count; i++) {
        const angle = phase + i * Math.PI * 2 / profile.count;
        bullets.push(new Bullet(
          this.cx + Math.cos(angle) * launchRadius,
          this.cy + Math.sin(angle) * launchRadius,
          Math.cos(angle) * profile.speed,
          Math.sin(angle) * profile.speed,
          this.index,
          profile.damage,
          profile.type
        ));
      }

      this.spinShotPhase = (this.spinShotPhase + Math.PI / profile.count) % (Math.PI * 2);
      this.fireCooldown = profile.cooldown;
      this.muzzle = 0.08;
      this.recoil = 0.7;
      burst(this.cx, this.cy, this.color, Math.min(18, profile.count), 125);
      audio.shoot(this.weapon);
    }

    usePower() {
      if (specialAttack || levelState === "vehicle" || levelState === "crash" || (activeBoss && activeBoss.introTimer > 0)) return false;
      this.specialPose = 2.1;
      this.invuln = Math.max(this.invuln, 2.2);
      specialAttack = new ScreenSpecial(this.index);
      return true;
    }

    hit(damage, knockbackDirection = 0) {
      if (levelState === "vehicle" || levelState === "crash") return;
      if (this.invuln > 0 || this.dead) return;

      this.health -= damage;
      this.invuln = 1.25;
      if (knockbackDirection) this.knockbackX = knockbackDirection * 215;
      burst(this.cx, this.cy, this.color, 8, 185);
      addFloatingText(this.cx, this.y - 12, `-${Math.round(damage)}`, "#ff7b66", 18);
      impactFeedback(0.045);
      audio.hit();

      if (this.health <= 0) {
        this.health = 0;
        this.lives--;
        this.dead = true;
        this.respawnTimer = 1.5;
        impactFeedback(0.09);
        explode(this.cx, this.cy, this.color, 22);
      }
    }

    revive() {
      this.dead = false;
      this.setCrouching(false);
      this.health = this.maxHealth;

      const safeBase = activeBoss && !activeBoss.dead && activeBoss.arenaLock !== false
        ? Math.max(checkpointX, activeBoss.arenaLeft + 90)
        : checkpointX;
      const bossLimit = activeBoss && !activeBoss.dead && activeBoss.arenaLock !== false
        ? activeBoss.x - this.w - 72
        : LEVEL_W - this.w - 40;

      this.x = clamp(
        safeBase + this.index * 62,
        cameraX + 40,
        Math.max(cameraX + 40, bossLimit)
      );
      this.y = terrainSurfaceY(this.x + this.w / 2) - this.h;
      this.supportPlatform = null;
      this.dropPlatform = null;
      this.vx = 0;
      this.vy = 0;
      this.jumpCount = 0;
      this.spinAngle = 0;
      this.landTimer = 0;
      this.knockbackX = 0;
      this.smashing = false;
      this.stompChain = 0;
      this.stompChainTimer = 0;
      this.victoryPose = 0;
      this.invuln = 2.5;
      addFloatingText(this.cx, this.y - 18, "READY!", this.color, 20);

      enemyBullets = enemyBullets.filter(bullet => {
        return Math.hypot(bullet.cx - this.cx, bullet.cy - this.cy) > 520;
      });
    }

    upgrade(type) {
      if (type === "health") {
        if (this.health >= this.maxHealth) return false;
        this.health = Math.min(this.maxHealth, this.health + 50);
      } else if (type === "special") {
        if (this.specials >= 3) return false;
        this.specials++;
      } else {
        this.weapon = type;
        this.weaponTimer = Infinity;
      }
      audio.pickup();
      return true;
    }

    draw() {
      if (this.dead || this.portalHidden > 0) return;
      if (this.invuln > 0 && Math.floor(this.invuln * 14) % 2 === 0) return;

      const aimAngle = this.victoryPose > 0 ? -Math.PI / 2 : Math.atan2(this.aimY, this.aimX);
      const moving = this.onGround && !this.crouching && Math.abs(this.vx) > 1;
      const runPhase = this.animTime * 15 + this.index * 2.4;
      const runSwing = moving ? Math.sin(runPhase) : 0;
      const bodyBob = moving ? Math.abs(Math.sin(runPhase)) * -3 : 0;
      const landingRatio = this.landTimer > 0 ? this.landTimer / 0.16 : 0;
      const squashY = 1 - landingRatio * 0.18;
      const squashX = 1 + landingRatio * 0.16;
      const airborne = !this.onGround;

      ctx.save();
      ctx.translate(this.cx, this.y + this.h / 2 + bodyBob);
      ctx.scale(squashX, squashY);
      ctx.lineCap = "butt";

      if (airborne && (this.jumpCount >= 2 || this.smashing)) {
        const orbitRadius = this.smashing ? 34 : 29;
        const blocks = this.smashing ? 8 : 6;
        for (let i = 0; i < blocks; i++) {
          const angle = this.spinAngle - this.facing * i * 0.48;
          const size = Math.max(4, 10 - i);
          ctx.globalAlpha = 0.72 - i * 0.08;
          ctx.fillStyle = i % 2 ? this.color : "#fff36d";
          ctx.fillRect(Math.cos(angle) * orbitRadius - size / 2, Math.sin(angle) * orbitRadius - size / 2, size, size);
        }
        ctx.globalAlpha = 1;
      }

      // Body animation is independent from the aim so a double-jump somersault
      // remains readable while the weapon continues to point at the target.
      ctx.save();
      if ((this.jumpCount >= 2 || this.smashing) && airborne) ctx.rotate(this.spinAngle);
      ctx.scale(this.facing, 1);

      if (this.crouching) {
        ctx.fillStyle = "#172131";
        ctx.fillRect(-29, 12, 19, 10);
        ctx.fillRect(9, 12, 20, 10);

        ctx.fillStyle = this.color;
        roundRect(-22, -12, 43, 31, 5);
        ctx.fill();

        ctx.fillStyle = "#d5a67b";
        ctx.fillRect(-15, -30, 24, 21);
        ctx.fillStyle = "#28364a";
        ctx.fillRect(-17, -34, 28, 9);
        ctx.fillRect(7, -30, 8, 6);
      } else {
        ctx.fillStyle = "#172131";
        if (airborne) {
          const tuck = this.smashing ? 14 : this.jumpCount >= 2 ? 11 : 4;
          ctx.fillRect(-19, 22, 14, 22 - tuck);
          ctx.fillRect(7, 22, 14, 22 - tuck);
          ctx.fillRect(-24, 35 - tuck, 18, 9);
          ctx.fillRect(9, 35 - tuck, 18, 9);
        } else {
          const leftLeg = Math.round(runSwing * 8);
          const rightLeg = -leftLeg;
          ctx.fillRect(-16 + leftLeg, 24, 13, 27);
          ctx.fillRect(5 + rightLeg, 24, 13, 27);
          ctx.fillRect(-20 + leftLeg, 46, 18, 8);
          ctx.fillRect(5 + rightLeg, 46, 18, 8);
        }

        ctx.fillStyle = this.color;
        roundRect(-20, -18, 40, 49, 5);
        ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,.25)";
        ctx.fillRect(-14, -12, 7, 32);

        ctx.fillStyle = "#d5a67b";
        ctx.fillRect(-13, -46, 26, 25);
        ctx.fillStyle = "#28364a";
        ctx.fillRect(-16, -50, 32, 10);
        ctx.fillRect(10, -44, 9, 7);
        ctx.fillStyle = "#121820";
        ctx.fillRect(this.facing > 0 ? 6 : -10, -35, 4, 4);
      }
      ctx.restore();

      const kick = this.recoil * (this.weapon === 3 ? 10 : 6);
      ctx.save();
      ctx.translate(this.facing * 8 - Math.cos(aimAngle) * kick, this.crouching ? -7 : -8);
      ctx.rotate(aimAngle);

      ctx.fillStyle = "#d5a67b";
      ctx.fillRect(0, -5, 28, 10);

      if (this.weapon === 3) {
        ctx.fillStyle = "#aeb9c7";
        roundRect(20, -7, 61, 15, 3);
        ctx.fill();
        ctx.fillStyle = "#4d5968";
        ctx.fillRect(29, 8, 15, 9);
        ctx.fillStyle = "#ffbd45";
        ctx.fillRect(71, -3, 11, 6);
      } else if (this.weapon === 1) {
        ctx.fillStyle = "#283342";
        roundRect(20, -6, 70, 13, 3);
        ctx.fill();
        ctx.fillStyle = "#86dff0";
        ctx.fillRect(72, -8, 20, 4);
      } else if (this.weapon === 2) {
        ctx.fillStyle = "#32283f";
        roundRect(20, -5, 67, 11, 3);
        ctx.fill();
        ctx.fillStyle = "#ff73d2";
        ctx.fillRect(42, -8, 31, 3);
      } else {
        ctx.fillStyle = "#222b39";
        roundRect(20, -5, 66, 11, 3);
        ctx.fill();
      }

      if (this.muzzle > 0) {
        const muzzleLength = this.weapon === 3 ? 22 : 17;
        ctx.fillStyle = this.weapon === 2 ? "#ff73d2" : "#fff0a6";
        ctx.fillRect(86, -3, muzzleLength, 6);
        ctx.fillRect(91, -7, 9, 14);
      }
      ctx.restore();

      if (this.specialPose > 0) {
        const pulse = Math.floor(this.specialPose * 12) % 2;
        ctx.save();
        ctx.translate(0, -66);
        ctx.fillStyle = pulse ? "#fff36d" : "#63e5ff";
        ctx.fillRect(-4, -18, 8, 18);
        ctx.fillRect(-12, -14, 24, 5);
        ctx.fillRect(-18, -8, 7, 5);
        ctx.fillRect(11, -8, 7, 5);
        ctx.strokeStyle = "#fff36d";
        ctx.lineWidth = 3;
        ctx.strokeRect(-25, -27, 50, 34);
        ctx.restore();
      }

      ctx.restore();
    }
  }

  class Bullet extends Entity {
    constructor(x, y, vx, vy, owner, damage, type) {
      const width = type === "rocket" ? 22 : type === "rapid" ? 13 : type === "pellet" ? 8 : 10;
      const height = type === "rocket" ? 11 : type === "pellet" ? 8 : 6;
      super(x - width / 2, y - height / 2, width, height);
      this.vx = vx;
      this.vy = vy;
      this.owner = owner;
      this.damage = damage;
      this.type = type;
      this.life = type === "pellet" ? 0.72 : type === "rocket" ? 2.5 : 2.2;

      this.speed = Math.hypot(vx, vy);
      this.target = null;
      this.turnRate = 5.8;
      this.retargetTimer = 0;
      this.trailTimer = 0;
    }

    targetIsOnScreen(target) {
      return target && !target.dead &&
        target.x + target.w >= cameraX &&
        target.x <= cameraX + visibleWorldW &&
        target.y + target.h >= cameraY &&
        target.y <= cameraY + visibleWorldH;
    }

    acquireTarget() {
      let best = null;
      let bestScore = Infinity;
      const currentAngle = Math.atan2(this.vy, this.vx);

      const consider = candidate => {
        if (!this.targetIsOnScreen(candidate)) return;
        const dx = candidate.cx - this.cx;
        const dy = candidate.cy - this.cy;
        const distance = Math.hypot(dx, dy);
        const desiredAngle = Math.atan2(dy, dx);
        const angleDifference = Math.abs(Math.atan2(
          Math.sin(desiredAngle - currentAngle),
          Math.cos(desiredAngle - currentAngle)
        ));
        const score = distance + angleDifference * 115;
        if (score < bestScore) {
          bestScore = score;
          best = candidate;
        }
      };

      for (const enemy of enemies) {
        if (!enemy.dead) consider(enemy);
      }
      if (activeBoss && !activeBoss.dead) consider(activeBoss);
      this.target = best;
    }

    updateHoming(dt) {
      this.retargetTimer -= dt;
      if (!this.targetIsOnScreen(this.target) || this.retargetTimer <= 0) {
        this.acquireTarget();
        this.retargetTimer = 0.12;
      }

      if (this.target) {
        const currentAngle = Math.atan2(this.vy, this.vx);
        const desiredAngle = Math.atan2(this.target.cy - this.cy, this.target.cx - this.cx);
        const difference = Math.atan2(
          Math.sin(desiredAngle - currentAngle),
          Math.cos(desiredAngle - currentAngle)
        );
        const nextAngle = currentAngle + clamp(difference, -this.turnRate * dt, this.turnRate * dt);
        this.speed = Math.min(930, this.speed + 105 * dt);
        this.vx = Math.cos(nextAngle) * this.speed;
        this.vy = Math.sin(nextAngle) * this.speed;
      }

      this.trailTimer -= dt;
      if (this.trailTimer <= 0) {
        this.trailTimer = 0.035;
        const length = Math.hypot(this.vx, this.vy) || 1;
        burst(
          this.cx - this.vx / length * 14,
          this.cy - this.vy / length * 14,
          chance(0.5) ? "#ff7a3d" : "#ffd34d",
          1,
          38
        );
      }
    }

    update(dt) {
      if (this.type === "rocket") this.updateHoming(dt);

      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.life -= dt;

      if (
        this.life <= 0 ||
        this.x < cameraX - 400 ||
        this.x > cameraX + visibleWorldW + 900 ||
        this.y < cameraY - 300 ||
        this.y > cameraY + visibleWorldH + 350
      ) {
        this.dead = true;
        return;
      }

      if (this.cy >= terrainSurfaceY(this.cx) - 2) {
        this.dead = true;
        if (this.type === "rocket") explode(this.cx, this.cy, "#ffac4a", 14);
        else burst(this.cx, this.cy, "#d5c991", 2, 65);
        return;
      }

      for (const hostile of enemyBullets) {
        if (hostile instanceof BossMissile && hostile.launched && !hostile.dead && this.overlaps(hostile)) {
          hostile.takeHit(this.damage, this.owner);
          this.dead = true;
          burst(this.cx, this.cy, "#fff2a4", 4, 120);
          return;
        }
      }

      for (const enemy of enemies) {
        if (!enemy.dead && this.overlaps(enemy)) {
          this.hitTarget(enemy);
          return;
        }
      }

      if (activeBoss && !activeBoss.dead && this.overlaps(activeBoss)) {
        this.hitTarget(activeBoss);
      }
    }

    hitTarget(target) {
      target.hit(this.damage, this.owner);
      this.dead = true;

      if (this.type === "rocket") {
        const radius = 165;
        const targets = activeBoss && !activeBoss.dead ? [...enemies, activeBoss] : enemies;
        for (const other of targets) {
          if (other === target || other.dead) continue;
          const distance = Math.hypot(other.cx - this.cx, other.cy - this.cy);
          if (distance < radius) {
            other.hit(15 + 44 * (1 - distance / radius), this.owner);
          }
        }
        explode(this.cx, this.cy, "#ffac4a", 24);
        impactFeedback(0.035);
      } else {
        burst(this.cx, this.cy, this.type === "rapid" ? "#ff83da" : "#ffe99a", 3, 110);
      }
    }

    drawTargetLock() {
      if (this.type !== "rocket" || !this.targetIsOnScreen(this.target)) return;

      const pulse = 18 + Math.round(Math.sin(time * 12) * 3);
      const x = this.target.cx;
      const y = this.target.cy;
      const arm = 8;

      ctx.save();
      ctx.strokeStyle = "#ffd34d";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x - pulse, y - pulse + arm);
      ctx.lineTo(x - pulse, y - pulse);
      ctx.lineTo(x - pulse + arm, y - pulse);
      ctx.moveTo(x + pulse - arm, y - pulse);
      ctx.lineTo(x + pulse, y - pulse);
      ctx.lineTo(x + pulse, y - pulse + arm);
      ctx.moveTo(x - pulse, y + pulse - arm);
      ctx.lineTo(x - pulse, y + pulse);
      ctx.lineTo(x - pulse + arm, y + pulse);
      ctx.moveTo(x + pulse - arm, y + pulse);
      ctx.lineTo(x + pulse, y + pulse);
      ctx.lineTo(x + pulse, y + pulse - arm);
      ctx.stroke();
      ctx.restore();
    }

    draw() {
      this.drawTargetLock();

      ctx.save();
      ctx.translate(this.cx, this.cy);
      ctx.rotate(Math.atan2(this.vy, this.vx));

      if (this.type === "rocket") {
        ctx.fillStyle = "#ff7a3d";
        ctx.fillRect(-26, -4, 15, 8);
        ctx.fillStyle = "#ffd34d";
        ctx.fillRect(-20, -2, 10, 4);
        ctx.fillStyle = "#dce4ee";
        roundRect(-11, -6, 22, 12, 3);
        ctx.fill();
        ctx.fillStyle = "#586779";
        ctx.fillRect(-5, -9, 8, 3);
        ctx.fillRect(-5, 6, 8, 3);
        ctx.fillStyle = "#ffbd45";
        ctx.fillRect(7, -3, 7, 6);
      } else if (this.type === "pellet") {
        ctx.fillStyle = "#74eaff";
        ctx.fillRect(-4, -4, 8, 8);
      } else if (this.type === "rapid") {
        ctx.fillStyle = "#ff73d2";
        ctx.fillRect(-9, -2, 18, 4);
      } else {
        ctx.fillStyle = "#fff4a0";
        ctx.fillRect(-7, -2, 14, 4);
      }
      ctx.restore();
    }
  }

  class EnemyBullet extends Entity {
    constructor(x, y, vx, vy, damage = 12, size = 10, color = "#ff6750") {
      super(x - size / 2, y - size / 2, size, size);
      this.vx = vx;
      this.vy = vy;
      this.damage = damage;
      this.color = color;
      this.life = 5;
    }

    update(dt) {
      const timeScale = enemyTimeScale();
      this.x += this.vx * dt * timeScale;
      this.y += this.vy * dt * timeScale;
      this.life -= dt * timeScale;

      if (
        this.life <= 0 ||
        this.x < cameraX - 450 ||
        this.x > cameraX + visibleWorldW + 600 ||
        this.y < cameraY - 250 ||
        this.y > cameraY + visibleWorldH + 300
      ) {
        this.dead = true;
        return;
      }

      if (this.cy >= terrainSurfaceY(this.cx) - 2) {
        this.dead = true;
        burst(this.cx, this.cy, this.color, 2, 58);
        return;
      }

      for (const player of players) {
        if (!player.dead && this.overlaps(player)) {
          if (levelState === "vehicle" || levelState === "crash") {
            burst(this.cx, this.cy, "#ffd34d", 4, 90);
          } else {
            player.hit(this.damage);
          }
          this.dead = true;
          break;
        }
      }
    }

    draw() {
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.cx, this.cy, this.w / 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }


  class BossMissile extends EnemyBullet {
    constructor(x, y, target, color, damage, launchDelay = 0) {
      const initialAngle = target ? Math.atan2(target.cy - y, target.cx - x) : Math.PI;
      super(x, y, Math.cos(initialAngle) * 115, Math.sin(initialAngle) * 115, damage, 18, color);
      this.target = target;
      this.speed = 115;
      this.turnRate = 1.25;
      this.life = 4.7;
      this.launchDelay = launchDelay;
      this.lockTimer = 0.68;
      this.homingTimer = 1.55;
      this.smokeTimer = 0;
      this.health = 34;
      this.launched = launchDelay <= 0;
      this.lockBroken = false;
    }

    takeHit(damage, owner) {
      if (this.dead) return;
      this.health -= damage;
      burst(this.cx, this.cy, "#fff2a4", 5, 145);
      if (this.health <= 0) {
        this.dead = true;
        if (players[owner]) players[owner].score += 120;
        addFloatingText(this.cx, this.cy - 18, "MISSILE DOWN", "#63e5ff", 13);
        explode(this.cx, this.cy, this.color, 18, true, 1);
      }
    }

    update(dt) {
      const scale = enemyTimeScale();

      if (this.launchDelay > 0) {
        this.launchDelay -= dt;
        return;
      }
      this.launched = true;

      const target = this.target && !this.target.dead ? this.target : players.find(player => !player.dead);
      this.lockTimer = Math.max(0, this.lockTimer - dt);
      if (this.lockTimer <= 0) this.homingTimer = Math.max(0, this.homingTimer - dt * scale);

      if (target && this.homingTimer > 0) {
        const desired = Math.atan2(target.cy - this.cy, target.cx - this.cx);
        let current = Math.atan2(this.vy, this.vx);
        const delta = ((desired - current + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
        const activeTurnRate = this.lockTimer > 0 ? 1.15 : 2.05;
        current += clamp(delta, -activeTurnRate * dt, activeTurnRate * dt);
        const targetSpeed = this.lockTimer > 0 ? 145 : 275;
        this.speed += (targetSpeed - this.speed) * Math.min(1, dt * 5.5);
        this.vx = Math.cos(current) * this.speed;
        this.vy = Math.sin(current) * this.speed;
      } else {
        if (!this.lockBroken) {
          this.lockBroken = true;
          addFloatingText(this.cx, this.cy - 20, "LOCK BROKEN", "#6dff82", 12);
        }
        this.speed = Math.min(360, this.speed + 90 * dt);
        const current = Math.atan2(this.vy, this.vx);
        this.vx = Math.cos(current) * this.speed;
        this.vy = Math.sin(current) * this.speed;
      }

      this.x += this.vx * dt * scale;
      this.y += this.vy * dt * scale;
      this.life -= dt * scale;
      this.smokeTimer -= dt;
      if (this.smokeTimer <= 0) {
        this.smokeTimer = 0.075;
        burst(this.cx - this.vx * 0.035, this.cy - this.vy * 0.035, "#7b7186", 1, 28);
      }

      if (this.life <= 0 || this.cx < cameraX - 420 || this.cx > cameraX + visibleWorldW + 500 || this.cy > terrainSurfaceY(this.cx)) {
        this.dead = true;
        explode(this.cx, this.cy, this.color, 10, false, 1);
        return;
      }

      if (this.lockTimer <= 0) {
        for (const player of players) {
          if (!player.dead && this.overlaps(player)) {
            player.hit(this.damage);
            this.dead = true;
            explode(this.cx, this.cy, this.color, 18, true, 1);
            break;
          }
        }
      }
    }

    draw() {
      if (!this.launched) return;
      const angle = Math.atan2(this.vy, this.vx);
      ctx.save();
      ctx.translate(this.cx, this.cy);
      ctx.rotate(angle);
      ctx.fillStyle = "#f1edf8";
      ctx.beginPath();
      ctx.moveTo(12, 0); ctx.lineTo(-7, -7); ctx.lineTo(-13, 0); ctx.lineTo(-7, 7); ctx.closePath();
      ctx.fill();
      ctx.fillStyle = this.color;
      ctx.fillRect(-12, -4, 8, 8);
      ctx.fillStyle = "#ffb642";
      ctx.fillRect(-20, -3, 9, 6);
      ctx.restore();

      if (this.target && !this.target.dead && this.homingTimer > 0) {
        const pulse = 25 + Math.sin(time * 14) * 4;
        ctx.save();
        ctx.strokeStyle = this.lockTimer > 0 ? "#fff36d" : "#ff6b5c";
        ctx.lineWidth = 3;
        ctx.setLineDash(this.lockTimer > 0 ? [8, 6] : [4, 5]);
        ctx.beginPath();
        ctx.arc(this.target.cx, this.target.cy, pulse, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        drawUiIcon(this.lockTimer > 0 ? "lock" : "warning", this.target.cx, this.target.y - 20, 18, this.lockTimer > 0 ? "#fff36d" : "#ff6b5c", 2.4);
        ctx.restore();
      }
    }
  }

  class ScreenSpecial {
    constructor(owner) {
      this.owner = owner;
      this.time = 0;
      this.duration = 2.25;
      this.dead = false;
      this.left = cameraX - 90;
      this.right = cameraX + visibleWorldW + 90;
      this.top = cameraY + 64;
      this.bottom = cameraY + visibleWorldH;
      this.clearedFire = false;
      this.nextStrike = 0.48;
      this.strikeIndex = 0;
      this.impacts = [];
      this.targets = this.collectTargets();
      this.laneCount = Math.max(6, Math.min(10, this.targets.length + 3));

      for (const player of players) {
        if (!player.dead) player.invuln = Math.max(player.invuln, 2.1);
      }
      showBanner("IRON TEMPEST");
      audio.special();
    }

    collectTargets() {
      const targets = enemies.filter(enemy => !enemy.dead && this.onScreen(enemy));
      if (activeBoss && !activeBoss.dead && this.onScreen(activeBoss)) targets.push(activeBoss);
      return targets.sort((a, b) => a.cx - b.cx);
    }

    onScreen(entity) {
      return entity.x + entity.w >= cameraX - 30 &&
             entity.x <= cameraX + visibleWorldW + 30 &&
             entity.y + entity.h >= cameraY - 80 &&
             entity.y <= cameraY + visibleWorldH + 80;
    }

    update(dt) {
      this.time += dt;

      if (!this.clearedFire && this.time >= 0.26) {
        this.clearedFire = true;
        const survivors = [];
        let converted = 0;
        for (const bullet of enemyBullets) {
          if (this.onScreen(bullet)) {
            if (converted < 28) burst(bullet.cx, bullet.cy, "#63e5ff", 3, 100);
            converted++;
          } else {
            survivors.push(bullet);
          }
        }
        enemyBullets = survivors;
        addFloatingText(cameraX + visibleWorldW * 0.5, cameraY + 155, "HOSTILE FIRE ERASED", "#63e5ff", 18);
      }

      while (this.time >= this.nextStrike && this.strikeIndex < this.laneCount) {
        this.launchStrike();
        this.strikeIndex++;
        this.nextStrike += 0.13;
      }

      for (const impact of this.impacts) impact.life -= dt;
      this.impacts = this.impacts.filter(impact => impact.life > 0);

      if (this.time >= this.duration) this.dead = true;
    }

    launchStrike() {
      let target = null;
      while (this.targets.length && !target) {
        const candidate = this.targets.shift();
        if (candidate && !candidate.dead && this.onScreen(candidate)) target = candidate;
      }

      const laneT = (this.strikeIndex + 0.5) / this.laneCount;
      const x = target
        ? target.cx
        : this.left + (this.right - this.left) * laneT;
      const y = target
        ? target.cy
        : terrainSurfaceY(x) - 18;

      this.impacts.push({ x, y, life: 0.62, maxLife: 0.62 });

      if (target) {
        const damage = target instanceof StageBoss ? 235 : 220;
        target.hit(damage, this.owner);
      }

      for (const enemy of enemies) {
        if (enemy.dead || enemy === target) continue;
        const distance = Math.hypot(enemy.cx - x, enemy.cy - y);
        if (distance < 145) enemy.hit(145 * (1 - distance / 145) + 45, this.owner);
      }

      explode(x, y, this.strikeIndex % 2 ? "#63e5ff" : "#ffd34d", 18);
      audio.tone(150 + this.strikeIndex * 18, 0.07, "square", 0.07, -65);
    }

    draw() {
      const flight = clamp((this.time - 0.08) / 1.45, 0, 1);
      const craftX = this.left - 220 + (this.right - this.left + 440) * flight;
      const craftY = cameraY + visibleWorldH * 0.18 + Math.sin(this.time * 11) * 4;

      ctx.save();
      ctx.translate(craftX, craftY);
      ctx.fillStyle = "#07111d";
      ctx.fillRect(-104, -30, 182, 60);
      ctx.fillRect(-58, -45, 82, 18);
      ctx.fillRect(-76, 27, 54, 15);
      ctx.fillRect(18, 27, 54, 15);
      ctx.fillStyle = "#dcefff";
      ctx.fillRect(-96, -22, 158, 44);
      ctx.fillRect(-50, -38, 68, 16);
      ctx.fillStyle = "#4b6f89";
      ctx.fillRect(-70, -14, 112, 28);
      ctx.fillStyle = "#63e5ff";
      ctx.fillRect(-10, -31, 35, 10);
      ctx.fillRect(-64, -7, 54, 7);
      ctx.fillStyle = "#ffd34d";
      ctx.fillRect(53, -10, 43, 20);
      ctx.fillRect(10, 20, 24, 8);
      ctx.fillStyle = "#ff6a42";
      ctx.fillRect(-118, -15, 22, 10);
      ctx.fillRect(-128, 5, 32, 10);
      ctx.fillStyle = "#fff36d";
      ctx.font = `900 14px ${UI_FONT}`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("IRON", -18, 3);
      ctx.strokeStyle = "#9ef3ff";
      ctx.lineWidth = 5;
      ctx.strokeRect(-96, -22, 158, 44);
      ctx.restore();

      for (const impact of this.impacts) {
        const ratio = impact.life / impact.maxLife;
        const beamTop = craftY + 18;
        const beamHeight = Math.max(16, impact.y - beamTop);
        const width = 22 + (1 - ratio) * 44;
        ctx.fillStyle = "#082038";
        ctx.fillRect(impact.x - width / 2 - 5, beamTop, width + 10, beamHeight);
        ctx.fillStyle = ratio > 0.48 ? "#fff36d" : "#63e5ff";
        ctx.fillRect(impact.x - width / 2, beamTop, width, beamHeight);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(impact.x - 5, beamTop, 10, beamHeight);
        ctx.strokeStyle = "#fff36d";
        ctx.lineWidth = 5;
        ctx.strokeRect(impact.x - 36, impact.y - 36, 72, 72);
        ctx.strokeRect(impact.x - 22, impact.y - 22, 44, 44);
      }

      if (this.time < 0.46) {
        for (const target of this.targets) {
          if (!target.dead && this.onScreen(target)) {
            ctx.strokeStyle = "#fff36d";
            ctx.lineWidth = 3;
            ctx.strokeRect(target.x - 7, target.y - 7, target.w + 14, target.h + 14);
          }
        }
      }
    }
  }

  class Enemy extends Entity {
    constructor(type, x, y = GROUND_Y) {
      const sizes = {
        runner: [42, 70],
        gunner: [50, 72],
        drone: [58, 38],
        brute: [72, 96],
        turret: [58, 58],
        crawler: [65, 36],
        jet: [82, 44],
        orb: [58, 58],
        stalker: [54, 62],
        sentinel: [66, 88],
        bomber: [78, 48],
        specter: [62, 76]
      };

      const health = {
        runner: 30,
        gunner: 45,
        drone: 36,
        brute: 105,
        turret: 60,
        crawler: 38,
        jet: 72,
        orb: 92,
        stalker: 58,
        sentinel: 138,
        bomber: 96,
        specter: 118
      };

      const speed = {
        runner: 112,
        gunner: 58,
        drone: 78,
        brute: 48,
        turret: 0,
        crawler: 128,
        jet: 126,
        orb: 38,
        stalker: 168,
        sentinel: 34,
        bomber: 96,
        specter: 68
      };

      const [w, h] = sizes[type];
      super(x, y - h, w, h);

      this.type = type;
      this.maxHealth = health[type] * difficulty;
      this.health = this.maxHealth;
      this.speed = speed[type] * rand(0.93, 1.07);
      this.fireTimer = rand(0.8, 1.8);
      this.contactCooldown = 0;
      this.retreatTimer = 0;
      this.knockbackVx = 0;
      this.contactEnabled = ["runner", "crawler", "brute", "stalker"].includes(type);
      this.direction = -1;
      this.phase = rand(0, Math.PI * 2);
      this.attackMode = 0;
      this.chargeTimer = 0;
      this.teleportFlash = 0;
      this.flashTimer = 0;
      this.grounded = !["drone", "jet", "orb", "bomber", "specter"].includes(type);
      this.score = {
        runner: 100,
        gunner: 160,
        drone: 180,
        brute: 350,
        turret: 220,
        crawler: 140,
        jet: 320,
        orb: 420,
        stalker: 260,
        sentinel: 520,
        bomber: 410,
        specter: 620
      }[type];
    }

    target() {
      let best = null;
      let bestDistance = Infinity;

      for (const player of players) {
        if (player.dead) continue;
        const distance = Math.abs(player.cx - this.cx);
        if (distance < bestDistance) {
          bestDistance = distance;
          best = player;
        }
      }
      return best;
    }

    update(dt) {
      if (this.dead) return;
      const player = this.target();
      if (!player) return;

      if (this.grounded) this.y = terrainSurfaceY(this.cx) - this.h;

      const dx = player.cx - this.cx;
      const distance = Math.abs(dx);
      if (distance > 1450) return;

      const toward = dx < 0 ? -1 : 1;
      this.direction = toward;
      this.fireTimer -= dt;
      this.contactCooldown -= dt;
      this.retreatTimer -= dt;
      this.chargeTimer -= dt;
      this.teleportFlash = Math.max(0, this.teleportFlash - dt);
      this.flashTimer = Math.max(0, this.flashTimer - dt);
      this.knockbackVx *= Math.exp(-9 * dt);
      if (Math.abs(this.knockbackVx) < 1) this.knockbackVx = 0;
      this.x += this.knockbackVx * dt;

      const canAttackOnScreen = !specialAttack &&
        this.x + this.w >= cameraX - 80 &&
        this.x <= cameraX + visibleWorldW + 80 &&
        this.y + this.h >= cameraY - 80 &&
        this.y <= cameraY + visibleWorldH + 80;

      if (this.retreatTimer > 0 && this.contactEnabled) {
        this.x -= toward * this.speed * 1.45 * dt;
      } else if (this.type === "runner" || this.type === "crawler") {
        this.x += toward * this.speed * dt;
      } else if (this.type === "stalker") {
        if (this.chargeTimer > 0) {
          this.x += toward * this.speed * 2.15 * dt;
        } else {
          if (distance > 82) this.x += toward * this.speed * 0.72 * dt;
          if (this.fireTimer <= 0 && distance < 520 && canAttackOnScreen) {
            this.chargeTimer = 0.42;
            this.fireTimer = rand(2.0, 2.6) / Math.sqrt(difficulty);
            audio.tone(185, 0.10, "sawtooth", 0.07, 130);
          }
        }
      } else if (this.type === "gunner") {
        if (distance > 520) this.x += toward * this.speed * dt;
        else if (distance < 280) this.x -= toward * this.speed * dt;

        if (this.fireTimer <= 0 && distance < 900 && canAttackOnScreen) {
          this.shootHorizontal(player, 295, 11, "#ff6750", 9);
          this.fireTimer = rand(1.7, 2.3) / Math.sqrt(difficulty);
        }
      } else if (this.type === "sentinel") {
        if (distance > 610) this.x += toward * this.speed * dt;
        else if (distance < 370) this.x -= toward * this.speed * dt;
        if (this.fireTimer <= 0 && distance < 1050 && canAttackOnScreen) {
          const direction = player.cx < this.cx ? -1 : 1;
          const originY = this.projectileOriginY(false);
          for (const vy of [-85, 0, 85]) {
            enemyBullets.push(new EnemyBullet(this.cx, originY, direction * 330, vy, 13 * difficulty, 10, "#b7ff61"));
          }
          this.fireTimer = rand(2.0, 2.55) / Math.sqrt(difficulty);
          audio.tone(245, 0.08, "square", 0.07, 110);
        }
      } else if (this.type === "drone") {
        this.x += toward * this.speed * 0.38 * dt;
        this.y += Math.sin(time * 2.6 + this.phase) * 42 * dt;
        this.y = clamp(this.y, 205, 545);

        if (this.fireTimer <= 0 && distance < 900 && canAttackOnScreen) {
          this.shootVertical(270, 11, "#e96cff", 11);
          this.fireTimer = rand(1.8, 2.4) / Math.sqrt(difficulty);
        }
      } else if (this.type === "brute") {
        if (distance > 76) this.x += toward * this.speed * dt;

        if (this.fireTimer <= 0 && distance < 620 && canAttackOnScreen) {
          const lowShot = this.attackMode % 2 !== 0;
          this.attackMode++;
          this.shootHorizontal(player, 245, 14, "#ffad45", 12, lowShot);
          audio.boss();
          this.fireTimer = rand(2.5, 3.1) / Math.sqrt(difficulty);
        }
      } else if (this.type === "turret") {
        if (this.fireTimer <= 0 && distance < 950 && canAttackOnScreen) {
          this.shootHorizontal(player, 310, 12, "#ff6750", 9);
          this.fireTimer = rand(1.9, 2.5) / Math.sqrt(difficulty);
        }
      } else if (this.type === "jet") {
        this.x += toward * this.speed * 0.48 * dt;
        this.y += Math.sin(time * 3.4 + this.phase) * 58 * dt;
        this.y = clamp(this.y, 170, 480);
        if (this.fireTimer <= 0 && distance < 1050 && canAttackOnScreen) {
          if (this.attackMode++ % 2 === 0) this.shootVertical(330, 13, "#55e8ff", 12);
          else this.shootHorizontal(player, 360, 12, "#55e8ff", 10, false, this.cy);
          this.fireTimer = rand(1.45, 1.9) / Math.sqrt(difficulty);
        }
      } else if (this.type === "orb") {
        this.y += Math.sin(time * 2.1 + this.phase) * 34 * dt;
        this.y = clamp(this.y, 250, 520);
        if (distance > 560) this.x += toward * this.speed * dt;
        if (this.fireTimer <= 0 && distance < 980 && canAttackOnScreen) {
          enemyBullets.push(new EnemyBullet(this.cx, this.cy, -260, 0, 12 * difficulty, 11, "#69ffb0"));
          enemyBullets.push(new EnemyBullet(this.cx, this.cy, 260, 0, 12 * difficulty, 11, "#69ffb0"));
          enemyBullets.push(new EnemyBullet(this.cx, this.cy, 0, 260, 12 * difficulty, 11, "#69ffb0"));
          this.fireTimer = rand(2.15, 2.75) / Math.sqrt(difficulty);
          audio.tone(390, 0.08, "square", 0.07, -95);
        }
      } else if (this.type === "bomber") {
        this.x += toward * this.speed * 0.44 * dt;
        this.y += Math.sin(time * 2.8 + this.phase) * 48 * dt;
        this.y = clamp(this.y, 155, 440);
        if (this.fireTimer <= 0 && distance < 980 && canAttackOnScreen) {
          for (const vx of [-95, 0, 95]) {
            enemyBullets.push(new EnemyBullet(this.cx, this.y + this.h, vx, 315, 14 * difficulty, 12, "#8dff5d"));
          }
          this.fireTimer = rand(2.05, 2.55) / Math.sqrt(difficulty);
          audio.tone(125, 0.11, "sawtooth", 0.08, -55);
        }
      } else if (this.type === "specter") {
        this.y += Math.sin(time * 2.4 + this.phase) * 38 * dt;
        this.y = clamp(this.y, 180, 500);
        if (distance > 620) this.x += toward * this.speed * 0.45 * dt;
        if (this.fireTimer <= 0 && distance < 1100 && canAttackOnScreen) {
          const side = this.attackMode++ % 2 ? -1 : 1;
          this.x = clamp(player.cx + side * 470, cameraX + 120, cameraX + visibleWorldW - this.w - 120);
          this.y = clamp(player.y - 185, 160, 470);
          this.teleportFlash = 0.24;
          for (let i = 0; i < 8; i++) {
            const angle = i * Math.PI / 4;
            enemyBullets.push(new EnemyBullet(this.cx, this.cy, Math.cos(angle) * 275, Math.sin(angle) * 275, 14 * difficulty, 11, "#ff8df4"));
          }
          this.fireTimer = rand(2.7, 3.25) / Math.sqrt(difficulty);
          audio.tone(520, 0.12, "square", 0.08, -260);
        }
      }

      this.x = clamp(this.x, 0, LEVEL_W - this.w);
      if (this.grounded) this.y = terrainSurfaceY(this.cx) - this.h;

      if (this.contactEnabled) {
        for (const target of players) {
          if (!target.dead && this.overlaps(target)) this.resolvePlayerContact(target);
        }
      }
    }

    resolvePlayerContact(target) {
      const playerFeet = target.y + target.h;
      const descendingFromAbove = target.vy > 100 && playerFeet <= this.y + Math.max(26, target.vy * STEP + 18);
      if (descendingFromAbove || target.smashing) return;

      const enemyAway = this.cx < target.cx ? -1 : 1;
      const overlap = Math.min(this.x + this.w, target.x + target.w) - Math.max(this.x, target.x);
      if (overlap > 0) {
        this.x += enemyAway * (overlap + 10);
        this.x = clamp(this.x, 0, LEVEL_W - this.w);
        if (this.grounded) this.y = terrainSurfaceY(this.cx) - this.h;
      }

      if (this.contactCooldown <= 0) {
        const damage = this.type === "brute" ? 18 : this.type === "stalker" ? 14 : this.type === "crawler" ? 12 : 10;
        target.hit(damage, -enemyAway);
        this.contactCooldown = this.type === "brute" ? 1.15 : this.type === "stalker" ? 1.0 : 0.92;
        this.retreatTimer = this.type === "brute" ? 0.78 : this.type === "stalker" ? 0.70 : 0.58;
        this.knockbackVx = enemyAway * (this.type === "brute" ? 265 : this.type === "stalker" ? 250 : 225);
        burst(this.cx, this.cy, "#ffad45", 5, 125);
      }
    }

    projectileOriginY(low = false) {
      if (!this.grounded) return this.cy;
      const ratios = {
        gunner: low ? 0.68 : 0.36,
        brute: low ? 0.74 : 0.38,
        turret: low ? 0.68 : 0.42,
        sentinel: low ? 0.72 : 0.34,
        runner: low ? 0.68 : 0.36,
        stalker: low ? 0.70 : 0.36,
        crawler: 0.48
      };
      const ratio = ratios[this.type] ?? (low ? 0.70 : 0.38);
      return this.y + this.h * ratio;
    }

    shootHorizontal(player, speed, damage, color = "#ff6750", size = 9, low = false, explicitY = null) {
      const direction = player.cx < this.cx ? -1 : 1;
      const originY = Number.isFinite(explicitY) ? explicitY : this.projectileOriginY(low);
      enemyBullets.push(new EnemyBullet(
        this.cx + direction * Math.min(26, this.w * 0.38),
        originY,
        direction * speed,
        0,
        damage * difficulty,
        size,
        color
      ));
      audio.tone(140, 0.065, "sawtooth", 0.07, -32);
    }

    shootVertical(speed, damage, color = "#e96cff", size = 11) {
      enemyBullets.push(new EnemyBullet(
        this.cx,
        this.y + this.h,
        0,
        speed,
        damage * difficulty,
        size,
        color
      ));
      audio.tone(330, 0.065, "sawtooth", 0.07, -32);
    }

    hit(damage, owner) {
      this.health -= damage;
      this.flashTimer = 0.07;
      burst(this.cx, this.cy, "#ffc66e", 3, 135);
      if (damage >= 45) impactFeedback(0.018);

      if (this.health <= 0) {
        this.dead = true;
        if (players[owner]) players[owner].score += this.score;
        addFloatingText(this.cx, this.y - 12, `+${this.score}`, "#ffd34d", 18);
        impactFeedback(this.type === "brute" ? 0.065 : 0.035);
        explode(
          this.cx,
          this.cy,
          this.type === "drone" ? "#ce66ff" : "#ff7848",
          this.type === "brute" ? 20 : 12
        );
      }
    }

    draw() {
      ctx.save();
      ctx.translate(this.cx, this.cy);
      ctx.scale(this.direction, 1);
      if (this.flashTimer > 0) ctx.filter = "brightness(2.7) saturate(0)";

      if (this.type === "runner" || this.type === "gunner") {
        ctx.fillStyle = "#7a3035";
        roundRect(-20, -24, 40, 47, 8);
        ctx.fill();

        ctx.fillStyle = "#a9b8c7";
        ctx.beginPath();
        ctx.arc(0, -34, 13, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#282d35";
        ctx.fillRect(-15, -47, 30, 9);

        ctx.strokeStyle = "#20242b";
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.moveTo(-10, 18);
        ctx.lineTo(-15, 35);
        ctx.moveTo(10, 18);
        ctx.lineTo(15, 35);
        ctx.stroke();

        if (this.type === "gunner") {
          ctx.fillStyle = "#181f2a";
          roundRect(12, -17, 45, 10, 3);
          ctx.fill();
        }
      } else if (this.type === "drone") {
        ctx.fillStyle = "#6b4188";
        ctx.beginPath();
        ctx.ellipse(0, 0, 29, 18, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#dc70ff";
        ctx.beginPath();
        ctx.arc(0, 0, 7, 0, Math.PI * 2);
        ctx.fill();
      } else if (this.type === "brute") {
        ctx.fillStyle = "#57242b";
        roundRect(-35, -41, 70, 74, 12);
        ctx.fill();
        ctx.fillStyle = "#343d49";
        roundRect(-24, -55, 48, 23, 8);
        ctx.fill();
        ctx.fillStyle = "#ffad42";
        ctx.fillRect(18, -17, 45, 14);
      } else if (this.type === "crawler") {
        ctx.fillStyle = "#3f5665";
        roundRect(-32, -18, 64, 36, 14);
        ctx.fill();
        ctx.fillStyle = "#ff554b";
        ctx.beginPath();
        ctx.arc(17, -2, 6, 0, Math.PI * 2);
        ctx.fill();
      } else if (this.type === "jet") {
        ctx.fillStyle = "#33546d";
        ctx.fillRect(-35, -12, 70, 24);
        ctx.fillStyle = "#5deaff";
        ctx.fillRect(-12, -18, 28, 8);
        ctx.fillStyle = "#1b2633";
        ctx.beginPath();
        ctx.moveTo(-38, 0);
        ctx.lineTo(-14, -22);
        ctx.lineTo(22, -8);
        ctx.lineTo(40, 0);
        ctx.lineTo(22, 8);
        ctx.lineTo(-14, 22);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#ff9b42";
        ctx.fillRect(35, -5, 14, 10);
      } else if (this.type === "orb") {
        ctx.fillStyle = "#203b40";
        ctx.fillRect(-22, -22, 44, 44);
        ctx.fillStyle = "#69ffb0";
        ctx.fillRect(-13, -13, 26, 26);
        ctx.fillStyle = "#d8fff0";
        ctx.fillRect(-5, -5, 10, 10);
        ctx.strokeStyle = "#69ffb0";
        ctx.lineWidth = 4;
        ctx.strokeRect(-28, -28, 56, 56);
      } else if (this.type === "stalker") {
        const crouch = this.chargeTimer > 0 ? 8 : 0;
        ctx.fillStyle = "#254832";
