  function drawContinueScreen() {
    drawMenuBackdrop();
    const landscape = screenW > screenH;
    const scale = uiScaleFactor();
    const panelW = Math.min(screenW - 18 * scale, (landscape ? 520 : 410) * scale);
    const panelH = Math.min(screenH - 16 * scale, (landscape ? 300 : 360) * scale);
    const x = Math.round((screenW - panelW) / 2);
    const y = Math.round((screenH - panelH) / 2);
    drawPixelPanel(x, y, panelW, panelH, UI_THEME.panel, UI_THEME.danger, true);

    const snapshot = continueSnapshot;
    const score = snapshot ? snapshot.score.toLocaleString("en-US") : "0";
    const level = snapshot ? WORLD_ZONES[snapshot.level] : WORLD_ZONES[menuLevel];

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = UI_THEME.danger;
    ctx.font = `900 ${(landscape ? 25 : 27) * scale}px ${UI_FONT}`;
    ctx.fillText("MISSION FAILED", screenW / 2, y + 43 * scale);

    ctx.fillStyle = UI_THEME.text;
    ctx.font = `900 ${(landscape ? 15 : 16) * scale}px ${UI_FONT}`;
    ctx.fillText(`SCORE ${score}`, screenW / 2, y + 82 * scale);
    ctx.fillStyle = UI_THEME.muted;
    ctx.font = `800 ${8 * scale}px ${UI_FONT}`;
    ctx.fillText(`${level.short} • LAST CHECKPOINT`, screenW / 2, y + 106 * scale);
    ctx.fillText(`CONTINUE RESTORES ${DIFFICULTY_OPTIONS[menuDifficulty].startLives} LIVES`, screenW / 2, y + 126 * scale);

    const gap = 10 * scale;
    const buttonH = 48 * scale;
    const sidePad = 18 * scale;
    const stacked = !landscape || panelW < 430 * scale;
    if (stacked) {
      const buttonW = panelW - sidePad * 2;
      const firstY = y + 158 * scale;
      uiRects.menu.continueRun = { x: x + sidePad, y: firstY, w: buttonW, h: buttonH };
      uiRects.menu.continueMenu = { x: x + sidePad, y: firstY + buttonH + gap, w: buttonW, h: buttonH };
    } else {
      const buttonW = (panelW - sidePad * 2 - gap) / 2;
      const buttonY = y + panelH - buttonH - 34 * scale;
      uiRects.menu.continueRun = { x: x + sidePad, y: buttonY, w: buttonW, h: buttonH };
      uiRects.menu.continueMenu = { x: x + sidePad + buttonW + gap, y: buttonY, w: buttonW, h: buttonH };
    }

    drawMenuIconButton(uiRects.menu.continueRun, "play", continueFocus === 0, null, UI_THEME.success, "CONTINUE");
    drawMenuIconButton(uiRects.menu.continueMenu, "menu", continueFocus === 1, null, UI_THEME.border, "MAIN MENU");

    ctx.fillStyle = UI_THEME.muted;
    ctx.font = `700 ${7 * scale}px ${UI_FONT}`;
    ctx.textAlign = "right";
    ctx.fillText("v8.6.0 ONLINE", x + panelW - 8 * scale, y + panelH - 7 * scale);
  }

  function drawCharacterPreview(profile, cx, cy, scale, selected = false) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    if (selected) {
      ctx.globalAlpha = 0.18 + Math.sin(time * 5) * 0.04;
      ctx.fillStyle = profile.accent;
      ctx.beginPath();
      ctx.arc(0, -8, 48, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.fillStyle = profile.armor;
    ctx.fillRect(-17, 24, 13, 28);
    ctx.fillRect(5, 24, 13, 28);
    ctx.fillRect(-21, 47, 18, 8);
    ctx.fillRect(5, 47, 18, 8);

    ctx.fillStyle = profile.color;
    roundRect(-21, -19, 42, 51, 5);
    ctx.fill();
    ctx.fillStyle = profile.accent;
    ctx.globalAlpha = 0.5;
    ctx.fillRect(-15, -13, 7, 34);
    ctx.globalAlpha = 1;

    ctx.fillStyle = profile.skin;
    ctx.fillRect(-14, -48, 28, 27);
    ctx.fillStyle = profile.helmet;
    ctx.fillRect(-17, -52, 34, 11);
    ctx.fillRect(10, -46, 9, 8);
    ctx.fillStyle = profile.visor;
    ctx.fillRect(5, -37, 5, 5);

    ctx.fillStyle = profile.accent;
    if (profile.style === "crest") ctx.fillRect(-4, -60, 8, 9);
    else if (profile.style === "band") ctx.fillRect(-17, -44, 34, 4);
    else if (profile.style === "visor") ctx.fillRect(-12, -40, 24, 5);
    else {
      ctx.strokeStyle = profile.accent;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, -55, 14, Math.PI, Math.PI * 2);
      ctx.stroke();
    }

    ctx.fillStyle = profile.skin;
    ctx.fillRect(10, -7, 26, 9);
    ctx.fillStyle = "#222b39";
    roundRect(31, -8, 43, 11, 3);
    ctx.fill();
    ctx.fillStyle = profile.accent;
    ctx.fillRect(67, -5, 10, 5);
    ctx.restore();
  }

  function drawCharacterSelect() {
    drawMenuBackdrop();
    const landscape = screenW > screenH;
    const scale = uiScaleFactor();
    const panelW = Math.min(screenW - 16 * scale, (landscape ? 820 : 430) * scale);
    const panelH = Math.min(screenH - 12 * scale, (landscape ? 430 : 700) * scale);
    const x = Math.round((screenW - panelW) / 2);
    const y = Math.round((screenH - panelH) / 2);
    drawPixelPanel(x, y, panelW, panelH, UI_THEME.panel, UI_THEME.border, true);

    ctx.textBaseline = "middle";
    ctx.textAlign = "center";
    ctx.fillStyle = UI_THEME.text;
    ctx.font = `900 ${(landscape ? 24 : 27) * scale}px ${UI_FONT}`;
    ctx.fillText("SELECT OPERATIVE", screenW / 2, y + (landscape ? 28 : 34) * scale);
    ctx.fillStyle = UI_THEME.muted;
    ctx.font = `800 ${7.5 * scale}px ${UI_FONT}`;
    ctx.fillText("EQUAL CORE STATS • UNIQUE POWER", screenW / 2, y + (landscape ? 49 : 56) * scale);

    const gap = (landscape ? 10 : 9) * scale;
    const cardsTop = y + (landscape ? 66 : 73) * scale;
    const columns = landscape ? 4 : 2;
    const rows = landscape ? 1 : 2;
    const infoH = (landscape ? 58 : 62) * scale;
    const buttonH = (landscape ? 43 : 48) * scale;
    const bottomPad = (landscape ? 14 : 16) * scale;
    const cardsBottom = y + panelH - bottomPad - buttonH - gap - infoH - gap;
    const cardsAreaH = Math.max(100 * scale, cardsBottom - cardsTop);
    const cardW = (panelW - gap * (columns + 1)) / columns;
    const cardH = (cardsAreaH - gap * (rows - 1)) / rows;
    uiRects.menu.characters = [];

    for (let i = 0; i < CHARACTER_PROFILES.length; i++) {
      const profile = CHARACTER_PROFILES[i];
      const col = i % columns;
      const row = Math.floor(i / columns);
      const rect = {
        x: x + gap + col * (cardW + gap),
        y: cardsTop + row * (cardH + gap),
        w: cardW,
        h: cardH
      };
      uiRects.menu.characters.push(rect);
      const selected = i === menuCharacter;
      drawPixelPanel(
        rect.x, rect.y, rect.w, rect.h,
        selected ? UI_THEME.panelActive : UI_THEME.panelSolid,
        selected ? profile.accent : UI_THEME.borderMuted,
        false
      );
      if (selected && characterFocus === 0) {
        ctx.strokeStyle = profile.color;
        ctx.lineWidth = 2 * scale;
        roundRect(rect.x + 3 * scale, rect.y + 3 * scale, rect.w - 6 * scale, rect.h - 6 * scale, 7 * scale);
        ctx.stroke();
      }

      const textReserve = (landscape ? 39 : 44) * scale;
      const previewAreaH = Math.max(70 * scale, rect.h - textReserve);
      const previewScale = Math.min(rect.w / 128, previewAreaH / 122) * (landscape ? 0.92 : 0.98);
      drawCharacterPreview(profile, rect.x + rect.w / 2, rect.y + previewAreaH * 0.54, previewScale, selected);

      ctx.textAlign = "center";
      ctx.fillStyle = selected ? profile.color : UI_THEME.text;
      const nameSize = fitCanvasText(profile.name, rect.w - 10 * scale, (landscape ? 11 : 12) * scale, 7 * scale);
      ctx.font = `900 ${nameSize}px ${UI_FONT}`;
      ctx.fillText(profile.name, rect.x + rect.w / 2, rect.y + rect.h - (landscape ? 25 : 29) * scale);
      ctx.fillStyle = selected ? profile.accent : UI_THEME.muted;
      const roleText = `${profile.role} • ${profile.powerShort}`;
      const roleSize = fitCanvasText(roleText, rect.w - 8 * scale, 6.5 * scale, 5.2 * scale);
      ctx.font = `800 ${roleSize}px ${UI_FONT}`;
      ctx.fillText(roleText, rect.x + rect.w / 2, rect.y + rect.h - (landscape ? 10 : 12) * scale);
    }

    const selectedProfile = CHARACTER_PROFILES[menuCharacter];
    const infoY = cardsBottom + gap;
    const infoX = x + gap;
    const infoW = panelW - gap * 2;
    drawPixelPanel(infoX, infoY, infoW, infoH, UI_THEME.panelSolid, selectedProfile.accent, false);
    const iconX = infoX + (landscape ? 29 : 27) * scale;
    drawUiIcon(selectedProfile.powerIcon, iconX, infoY + infoH / 2, 17 * scale, selectedProfile.color, 2.2 * scale);
    ctx.textAlign = "left";
    ctx.fillStyle = selectedProfile.color;
    const powerSize = fitCanvasText(selectedProfile.power, infoW * 0.42, (landscape ? 11 : 10.5) * scale, 7 * scale);
    ctx.font = `900 ${powerSize}px ${UI_FONT}`;
    ctx.fillText(selectedProfile.power, infoX + 54 * scale, infoY + infoH * 0.34);
    ctx.fillStyle = UI_THEME.muted;
    const descriptionWidth = infoW - 68 * scale;
    const descriptionSize = fitCanvasText(selectedProfile.powerDescription, descriptionWidth, (landscape ? 8 : 7.5) * scale, 5.5 * scale);
    ctx.font = `800 ${descriptionSize}px ${UI_FONT}`;
    ctx.fillText(selectedProfile.powerDescription, infoX + 54 * scale, infoY + infoH * 0.68);

    const buttonGap = 9 * scale;
    const buttonY = y + panelH - bottomPad - buttonH;
    const backW = Math.min(138 * scale, panelW * 0.29);
    const deployW = panelW - gap * 2 - backW - buttonGap;
    const buttonX = x + gap;
    uiRects.menu.characterBack = { x: buttonX, y: buttonY, w: backW, h: buttonH };
    uiRects.menu.characterDeploy = { x: buttonX + backW + buttonGap, y: buttonY, w: deployW, h: buttonH };
    drawMenuIconButton(uiRects.menu.characterBack, "back", characterFocus === 2, null, null, "BACK");
    drawMenuIconButton(uiRects.menu.characterDeploy, "play", characterFocus === 1, null, null, "DEPLOY");

    ctx.fillStyle = UI_THEME.muted;
    ctx.font = `700 ${7 * scale}px ${UI_FONT}`;
    ctx.textAlign = "right";
    ctx.fillText("v8.6.0 ONLINE", x + panelW - 8 * scale, y + panelH - 7 * scale);
  }

  function drawCanvasMenu() {
    // Rebuild hit regions for only the screen currently being drawn. This keeps
    // stale buttons from the previous menu from remaining touch-active.
    uiRects.menu = {};
    if (menuScreen === "character") drawCharacterSelect();
    else if (menuScreen === "continue") drawContinueScreen();
    else if (menuScreen === "multiplayer") drawMultiplayerBrowser();
    else if (menuScreen === "lobby") drawOnlineLobby();
    else drawMainMenu();
  }

  function drawHealthCard(player, x, y) {
    const scale = uiScaleFactor();
    const narrow = screenW < 720;
    const w = narrow
      ? Math.min(184 * scale, Math.max(142 * scale, screenW * 0.43))
      : Math.min(188 * scale, Math.max(160 * scale, screenW * 0.17));
    const h = 44 * scale;
    drawPixelPanel(x, y, w, h, UI_THEME.panel, player.profile.accent, true);
    const ratio = clamp(player.health / player.maxHealth, 0, 1);
    const healthColor = ratio > 0.55 ? UI_THEME.success : ratio > 0.25 ? UI_THEME.warning : UI_THEME.danger;

    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    ctx.fillStyle = player.color;
    const nameSize = fitCanvasText(player.profile.name, w * 0.48, 8.5 * scale, 6 * scale);
    ctx.font = `900 ${nameSize}px ${UI_FONT}`;
    ctx.fillText(player.profile.name, x + 7 * scale, y + 8 * scale);

    ctx.textAlign = "right";
    ctx.fillStyle = UI_THEME.muted;
    const weaponLabel = weaponName(player.weapon);
    const weaponSize = fitCanvasText(weaponLabel, w * 0.36, 7.5 * scale, 5.5 * scale);
    ctx.font = `800 ${weaponSize}px ${UI_FONT}`;
    ctx.fillText(weaponLabel, x + w - 20 * scale, y + 8 * scale);
    drawUiIcon(`weapon${player.weapon}`, x + w - 10 * scale, y + 8 * scale, 9 * scale, UI_THEME.blueBright, 1.4 * scale);

    ctx.fillStyle = "#15171d";
    roundRect(x + 7 * scale, y + 15 * scale, w - 14 * scale, 7 * scale, 3.5 * scale);
    ctx.fill();
    ctx.fillStyle = healthColor;
    roundRect(x + 8 * scale, y + 16 * scale, Math.max(0, (w - 16 * scale) * ratio), 5 * scale, 2.5 * scale);
    ctx.fill();

    const scoreText = player.score >= 1000000
      ? `${Math.round(player.score / 100000) / 10}M`
      : player.score >= 1000
        ? `${Math.round(player.score / 1000)}K`
        : String(player.score);
    const metricY = y + 33.5 * scale;
    const metrics = [
      ["life", String(player.lives), x + w * 0.13, UI_THEME.blue],
      [player.profile.powerIcon, String(player.specials), x + w * 0.43, player.profile.color],
      ["score", scoreText, x + w * 0.73, UI_THEME.blue]
    ];
    ctx.font = `800 ${7.5 * scale}px ${UI_FONT}`;
    ctx.textAlign = "left";
    for (const [icon, value, px, color] of metrics) {
      drawUiIcon(icon, px, metricY, 7.5 * scale, color, 1.3 * scale);
      ctx.fillStyle = UI_THEME.muted;
      ctx.fillText(value, px + 7 * scale, metricY + 0.5 * scale);
    }
    return { w, h };
  }

  function gameUiMode() {
    if (!running) return "menu";
    if (paused || onlineMenuOpen) return "game_menu";
    if (stageIntro || levelTransition || portalWarp) return "cinematic";
    return "gameplay";
  }

  function drawGameMenuAccessButton() {
    uiRects.mute = null;
    uiRects.fullscreen = null;
    if (!running || gameUiMode() === "game_menu" || endingScene) {
      uiRects.pause = null;
      return;
    }

    const scale = uiScaleFactor();
    const pad = 7 * scale;
    const size = (touchUi ? 31 : 29) * scale;
    const height = 29 * scale;
    uiRects.pause = {
      x: screenW - safeRight - pad - size,
      y: safeTop + pad,
      w: size,
      h: height
    };

    drawPixelPanel(
      uiRects.pause.x,
      uiRects.pause.y,
      uiRects.pause.w,
      uiRects.pause.h,
      UI_THEME.panel,
      UI_THEME.border,
      false
    );
    drawUiIcon(
      "menu",
      uiRects.pause.x + uiRects.pause.w / 2,
      uiRects.pause.y + uiRects.pause.h / 2,
      12 * scale,
      UI_THEME.blue,
      1.8 * scale
    );
  }

  function drawCanvasHud() {
    const scale = uiScaleFactor();
    const narrow = screenW < 720;
    const pad = 7 * scale;
    const topPad = pad + safeTop;
    const card = (localPlayer() || players[0]) ? drawHealthCard(localPlayer() || players[0], pad + safeLeft, topPad) : { w: 0, h: 44 * scale };

    const progressW = narrow
      ? Math.min(screenW - (safeLeft + safeRight + 34 * scale), 226 * scale)
      : Math.min(246 * scale, screenW * 0.28);
    const progressX = screenW / 2 - progressW / 2;
    const progressY = narrow ? topPad + card.h + 7 * scale : topPad + 1 * scale;
    ctx.fillStyle = UI_THEME.panel;
    roundRect(progressX, progressY, progressW, 9 * scale, 4.5 * scale);
    ctx.fill();
    ctx.strokeStyle = UI_THEME.border;
    ctx.lineWidth = 1.3 * scale;
    roundRect(progressX + 0.7 * scale, progressY + 0.7 * scale, progressW - 1.4 * scale, 7.6 * scale, 3.8 * scale);
    ctx.stroke();
    ctx.fillStyle = UI_THEME.blue;
    roundRect(progressX + 2.5 * scale, progressY + 2.5 * scale, Math.max(0, (progressW - 5 * scale) * hudState.progress), 4 * scale, 2 * scale);
    ctx.fill();

    const phaseSize = fitCanvasText(hudState.phase, progressW * 1.18, 7.8 * scale, 5.5 * scale);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = UI_THEME.muted;
    ctx.font = `800 ${phaseSize}px ${UI_FONT}`;
    ctx.fillText(hudState.phase, screenW / 2, progressY + 17 * scale);

    let hudBottom = progressY + 24 * scale;
    if (activeBoss && !activeBoss.dead && !activeBoss.hudHidden) {
      const w = Math.min(screenW * (narrow ? 0.76 : 0.58), 390 * scale);
      const x = screenW / 2 - w / 2;
      const y = hudBottom + 8 * scale;
      const ratio = clamp(activeBoss.health / activeBoss.maxHealth, 0, 1);
      ctx.textAlign = "center";
      ctx.textBaseline = "bottom";
      const bossNameSize = fitCanvasText(activeBoss.name, w, 9.5 * scale, 6.5 * scale);
      ctx.font = `800 ${bossNameSize}px ${UI_FONT}`;
      ctx.fillStyle = UI_THEME.text;
      ctx.fillText(activeBoss.name, screenW / 2, y - 3 * scale);
      ctx.fillStyle = UI_THEME.panel;
      roundRect(x, y, w, 8 * scale, 4 * scale);
      ctx.fill();
      ctx.strokeStyle = UI_THEME.border;
      ctx.lineWidth = 1.3 * scale;
      roundRect(x + 0.7 * scale, y + 0.7 * scale, w - 1.4 * scale, 6.6 * scale, 3.3 * scale);
      ctx.stroke();
      ctx.fillStyle = activeBoss.profile.accent;
      roundRect(x + 2.5 * scale, y + 2.5 * scale, Math.max(0, (w - 5 * scale) * ratio), 3 * scale, 1.5 * scale);
      ctx.fill();
      hudBottom = y + 10 * scale;
    }

    if (bannerText && performance.now() < bannerUntil) {
      const remaining = Math.max(0, bannerUntil - performance.now());
      const alpha = Math.min(1, remaining / 180);
      ctx.globalAlpha = alpha;
      const size = fitCanvasText(bannerText, screenW * 0.76, 17 * scale, 10 * scale);
      ctx.font = `900 ${size}px ${UI_FONT}`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const tw = ctx.measureText(bannerText).width;
      const boxH = size + 10 * scale;
      const bannerY = Math.max(screenH * 0.17, hudBottom + boxH * 0.75);
      drawPixelPanel(screenW / 2 - tw / 2 - 11 * scale, bannerY - boxH / 2, tw + 22 * scale, boxH, UI_THEME.panel, UI_THEME.border, false);
      ctx.fillStyle = UI_THEME.text;
      ctx.fillText(bannerText, screenW / 2, bannerY);
      ctx.globalAlpha = 1;
    }
  }

  function drawCanvasTouchControls() {
    if (!touchUi || !running || paused || onlineMenuOpen || stageIntro || levelTransition || portalWarp) return;

    uiRects.buttons = {};
    ctx.save();
    if (touchStick.active && touchStick.radius > 0) {
      const baseX = touchStick.baseX;
      const baseY = touchStick.baseY;
      const stickRadius = touchStick.radius;
      ctx.globalAlpha = 0.74;
      ctx.fillStyle = "rgba(5,6,9,.56)";
      ctx.beginPath(); ctx.arc(baseX, baseY, stickRadius, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = UI_THEME.border;
      ctx.lineWidth = Math.max(1.4, stickRadius * 0.035); ctx.stroke();
      ctx.strokeStyle = UI_THEME.blueSoft;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(baseX - stickRadius * 0.62, baseY); ctx.lineTo(baseX + stickRadius * 0.62, baseY);
      ctx.moveTo(baseX, baseY - stickRadius * 0.62); ctx.lineTo(baseX, baseY + stickRadius * 0.62);
      ctx.stroke();

      const kx = baseX + touchStick.knobX;
      const ky = baseY + touchStick.knobY;
      ctx.fillStyle = UI_THEME.panelRaised;
      ctx.beginPath(); ctx.arc(kx, ky, stickRadius * 0.34, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = UI_THEME.blue;
      ctx.lineWidth = Math.max(1.6, stickRadius * 0.042); ctx.stroke();
    }

    const shortest = Math.min(screenW, screenH);
    const layoutR = clamp(shortest * (portrait ? 0.105 : 0.095), 34, portrait ? 48 : 46);
    const edgeInset = Math.max(15, layoutR * 0.36);
    const edgeX = screenW - safeRight - layoutR - edgeInset;
    const edgeY = screenH - safeBottom - layoutR - Math.max(edgeInset, portrait ? layoutR * 0.48 : layoutR * 0.36);
    const defs = portrait
      ? [
          ["KeyG", "A", edgeX - layoutR * 4.05, edgeY + layoutR * 0.24, layoutR * 0.86, layoutR * 1.08],
          ["KeyF", "B", edgeX - layoutR * 2.02, edgeY, layoutR, layoutR * 1.12],
          ["KeyW", "C", edgeX, edgeY - layoutR * 0.58, layoutR, layoutR * 1.12]
        ]
      : [
          ["KeyG", "A", edgeX - layoutR * 4.35, edgeY + layoutR * 0.12, layoutR * 0.88, layoutR * 1.10],
          ["KeyF", "B", edgeX - layoutR * 2.15, edgeY, layoutR, layoutR * 1.14],
          ["KeyW", "C", edgeX, edgeY - layoutR * 0.92, layoutR * 0.98, layoutR * 1.14]
        ];

    const playerProfile = (localPlayer() || players[0]) ? (localPlayer() || players[0]).profile : CHARACTER_PROFILES[menuCharacter];
    for (const [code, letter, x, y, r, hitR] of defs) {
      uiRects.buttons[code] = { x, y, r: hitR };
      const held = Boolean(touchKeys[code]);
      const buttonColor = code === "KeyG" ? playerProfile.color : UI_THEME.blue;
      const buttonBright = code === "KeyG" ? playerProfile.accent : UI_THEME.blueBright;
      ctx.globalAlpha = held ? 0.98 : (portrait ? 0.86 : 0.80);

      ctx.fillStyle = "rgba(0,0,0,.38)";
      ctx.beginPath(); ctx.arc(x + r * 0.06, y + r * 0.10, r * 1.02, 0, Math.PI * 2); ctx.fill();

      const rim = ctx.createRadialGradient(x - r * 0.25, y - r * 0.35, r * 0.12, x, y, r * 1.05);
      rim.addColorStop(0, held ? "#4a4a4a" : "#3a3a3a");
      rim.addColorStop(0.54, held ? "#1a1a1a" : "#141414");
      rim.addColorStop(1, "#020202");
      ctx.fillStyle = rim;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();

      ctx.strokeStyle = held ? buttonBright : (code === "KeyG" ? buttonColor : "rgba(255,255,255,.42)");
      ctx.lineWidth = Math.max(2.1, r * 0.068);
      ctx.stroke();

      ctx.strokeStyle = held ? "rgba(255,255,255,.18)" : "rgba(255,255,255,.10)";
      ctx.lineWidth = Math.max(1.1, r * 0.028);
      ctx.beginPath(); ctx.arc(x, y, r * 0.80, Math.PI * 0.95, Math.PI * 1.80); ctx.stroke();

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = held ? buttonBright : buttonColor;
      ctx.font = `900 ${Math.max(20, r * 0.96)}px ${UI_FONT}`;
      ctx.fillText(letter, x, y + r * 0.02);
    }
    ctx.restore();
  }

  function drawMouseCrosshair() {
    if (touchUi || !running || paused || onlineMenuOpen || stageIntro || levelTransition || portalWarp || !mouseInput.active) return;
    const player = localPlayer() || players[0];
    if (!player || player.dead || player.portalTransit) return;

    const x = clamp(mouseInput.x, safeLeft + 14, screenW - safeRight - 14);
    const y = clamp(mouseInput.y, safeTop + 14, screenH - safeBottom - 14);
    const weaponRadius = player.weapon === 3 ? 12 : player.weapon === 1 ? 10 : player.weapon === 2 ? 8 : 9;
    const pulse = 1 + Math.sin(performance.now() * 0.012) * 0.08;
    const radius = weaponRadius * pulse;
    const color = mouseInput.fire ? UI_THEME.blueBright : UI_THEME.text;

    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = mouseInput.fire ? 1 : 0.88;
    ctx.strokeStyle = "rgba(0,0,0,.72)";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 1.7;
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.moveTo(-radius - 7, 0); ctx.lineTo(-radius - 2, 0);
    ctx.moveTo(radius + 2, 0); ctx.lineTo(radius + 7, 0);
    ctx.moveTo(0, -radius - 7); ctx.lineTo(0, -radius - 2);
    ctx.moveTo(0, radius + 2); ctx.lineTo(0, radius + 7);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, mouseInput.fire ? 2.4 : 1.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawStageIntroOverlay() {
    if (!stageIntro) return;
    const scale = uiScaleFactor();
    const elapsed = stageIntro.duration - stageIntro.timer;
    const zone = WORLD_ZONES[stageIntro.level];
    const cinematic = Boolean(stageIntro.sequence);
    const titleIn = clamp(elapsed / 0.24, 0, 1);
    const titleOut = cinematic ? clamp((1.62 - elapsed) / 0.34, 0, 1) : clamp(stageIntro.timer / 0.22, 0, 1);
    const titleAlpha = Math.min(titleIn, titleOut);

    if (titleAlpha > 0) {
      ctx.save();
      ctx.globalAlpha = titleAlpha;
      ctx.fillStyle = cinematic ? "rgba(0,0,0,.82)" : "rgba(0,0,0,.64)";
      ctx.fillRect(0, 0, screenW, screenH);
      const enhancedEntry = stageIntro.level > 0 || stageIntro.continuing;
      const panelW = Math.min(screenW * (enhancedEntry ? 0.86 : 0.84), (enhancedEntry ? 500 : 470) * scale);
      const panelH = Math.min((enhancedEntry ? 150 : 122) * scale, screenH * (enhancedEntry ? 0.36 : 0.30));
      const x = screenW / 2 - panelW / 2;
      const y = screenH / 2 - panelH / 2;
      drawPixelPanel(x, y, panelW, panelH, UI_THEME.panel, UI_THEME.border, true);

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = UI_THEME.muted;
      ctx.font = `800 ${8.5 * scale}px ${UI_FONT}`;
      ctx.fillText(stageIntro.continuing ? "CONTINUE" : `LEVEL ${stageIntro.level + 1}`, screenW / 2, y + (enhancedEntry ? 19 : 20) * scale);
      ctx.fillStyle = UI_THEME.text;
      const zoneSize = fitCanvasText(zone.short, panelW * 0.84, 25 * scale, 14 * scale);
      ctx.font = `900 ${zoneSize}px ${UI_FONT}`;
      ctx.fillText(zone.short, screenW / 2, y + panelH * (enhancedEntry ? 0.42 : 0.50));

      if (enhancedEntry) {
        ctx.fillStyle = UI_THEME.blueBright;
        const briefingSize = fitCanvasText(stageIntro.briefing, panelW * 0.78, 10 * scale, 7 * scale);
        ctx.font = `800 ${briefingSize}px ${UI_FONT}`;
        ctx.fillText(stageIntro.briefing, screenW / 2, y + panelH * 0.64);
      }
      ctx.restore();
    }

    if (cinematic && elapsed > 1.25 && stageIntro.timer > 0.62) {
      const stripAlpha = Math.min(clamp((elapsed - 1.25) / 0.3, 0, 1), clamp((stageIntro.timer - 0.62) / 0.35, 0, 1));
      const stripW = Math.min(screenW * 0.72, 350 * scale);
      const stripH = 30 * scale;
      const stripX = screenW / 2 - stripW / 2;
      const stripY = safeTop + 13 * scale;
      ctx.save();
      ctx.globalAlpha = stripAlpha;
      drawPixelPanel(stripX, stripY, stripW, stripH, "rgba(5,6,9,.82)", UI_THEME.border, true);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = UI_THEME.blueBright;
      ctx.font = `900 ${fitCanvasText(stageIntro.briefing, stripW - 28 * scale, 9.5 * scale, 6.5 * scale)}px ${UI_FONT}`;
      ctx.fillText(stageIntro.briefing, screenW / 2, stripY + stripH / 2 + 0.5 * scale);
      ctx.restore();
    }

    if (stageIntro.timer <= 0.62) {
      const goAlpha = Math.min(clamp((0.62 - stageIntro.timer) / 0.12, 0, 1), clamp(stageIntro.timer / 0.16, 0, 1));
      ctx.save();
      ctx.globalAlpha = goAlpha;
      const goW = Math.min(screenW * 0.42, 190 * scale);
      const goH = 46 * scale;
      const goX = screenW / 2 - goW / 2;
      const goY = screenH * 0.72 - goH / 2;
      drawPixelPanel(goX, goY, goW, goH, UI_THEME.panelActive, UI_THEME.blueBright, true);
      drawUiIcon("next", goX + 28 * scale, goY + goH / 2, 14 * scale, UI_THEME.blueBright, 2.2 * scale);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = UI_THEME.text;
      ctx.font = `900 ${20 * scale}px ${UI_FONT}`;
      ctx.fillText("GO!", goX + goW * 0.57, goY + goH / 2 + 1 * scale);
      ctx.restore();
    }
  }

  function drawLevelTransitionOverlay() {
    if (!levelTransition) return;
    const scale = uiScaleFactor();
    const nextZone = WORLD_ZONES[levelTransition.nextLevel];

    ctx.save();
    ctx.fillStyle = "#010207";
    ctx.fillRect(0, 0, screenW, screenH);

    const panelW = Math.min(screenW * 0.84, 480 * scale);
    const panelH = Math.min(136 * scale, screenH * 0.36);
    const x = screenW / 2 - panelW / 2;
    const y = screenH / 2 - panelH / 2;
    drawPixelPanel(x, y, panelW, panelH, UI_THEME.panel, UI_THEME.border, true);

    const iconX = x + 40 * scale;
    const centerY = y + panelH * 0.43;
    drawUiIcon("check", iconX, centerY, 23 * scale, UI_THEME.success, 3 * scale);

    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillStyle = UI_THEME.text;
    const clearText = `LEVEL ${levelTransition.nextLevel} CLEAR`;
    ctx.font = `900 ${fitCanvasText(clearText, panelW - 112 * scale, 20 * scale, 13 * scale)}px ${UI_FONT}`;
    ctx.fillText(clearText, x + 72 * scale, centerY - 11 * scale);
    ctx.fillStyle = UI_THEME.blueBright;
    ctx.font = `800 ${fitCanvasText(nextZone.short, panelW - 112 * scale, 12 * scale, 8 * scale)}px ${UI_FONT}`;
    ctx.fillText(nextZone.short, x + 72 * scale, centerY + 14 * scale);
    drawUiIcon("next", x + panelW - 29 * scale, centerY + 12 * scale, 12 * scale, UI_THEME.blue, 1.8 * scale);

    const progress = clamp(1 - levelTransition.timer / levelTransition.duration, 0, 1);
    const barW = panelW - 40 * scale;
    const barX = x + 20 * scale;
    const barY = y + panelH - 21 * scale;
    ctx.fillStyle = "#15171d";
    roundRect(barX, barY, barW, 6 * scale, 3 * scale);
    ctx.fill();
    ctx.fillStyle = UI_THEME.blue;
    roundRect(barX, barY, barW * progress, 6 * scale, 3 * scale);
    ctx.fill();
    ctx.restore();
  }

  function drawPortalTravelWorld() {
    if (!portalWarp) return;
    const warp = portalWarp;
    const gate = warp.phase === "enter" ? warp.source : warp.phase === "exit" ? warp.destination : null;
    if (!gate) return;

    const phaseDuration = warp.phase === "enter" ? 0.22 : 0.30;
    const progress = clamp(warp.phaseTime / phaseDuration, 0, 1);
    const pulse = Math.sin(progress * Math.PI);
    ctx.save();
    ctx.translate(gate.cx, gate.cy);
    ctx.globalAlpha = 0.82 * pulse;
    ctx.strokeStyle = gate.color;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.ellipse(0, 0, 34 + pulse * 18, 57 + pulse * 24, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 0.45 * pulse;
    ctx.fillStyle = gate.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, 22 + pulse * 10, 45 + pulse * 16, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }


  function drawPauseOverlay() {
    const scale = uiScaleFactor();
    const stacked = portrait && screenW < 560;
    ctx.fillStyle = "rgba(0,0,0,.72)";
    ctx.fillRect(0, 0, screenW, screenH);

    const w = Math.min((stacked ? 390 : 470) * scale, screenW * 0.90);
    const h = Math.min((stacked ? 286 : 190) * scale, screenH * 0.80);
    const px = screenW / 2 - w / 2;
    const py = screenH / 2 - h / 2;
    drawPixelPanel(px, py, w, h, UI_THEME.panel, UI_THEME.border, true);

    drawUiIcon("menu", screenW / 2 - 58 * scale, py + 32 * scale, 19 * scale, UI_THEME.blue, 2.5 * scale);
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.font = `900 ${18 * scale}px ${UI_FONT}`;
    ctx.fillStyle = UI_THEME.text;
    ctx.fillText(onlineMenuOpen ? "ONLINE MENU" : "GAME MENU", screenW / 2 - 31 * scale, py + 32 * scale);
    ctx.textAlign = "center";
    ctx.fillStyle = UI_THEME.muted;
    ctx.font = `800 ${7.5 * scale}px ${UI_FONT}`;
    ctx.fillText(
      onlineMenuOpen ? "THE MATCH CONTINUES WHILE THIS MENU IS OPEN" : "GAMEPLAY IS PAUSED",
      screenW / 2,
      py + 55 * scale
    );

    const gap = 8 * scale;
    const sidePad = 12 * scale;
    const buttonH = (stacked ? 39 : 38) * scale;
    let utilityY;

    if (stacked) {
      const buttonW = w - sidePad * 2;
      const firstY = py + 73 * scale;
      uiRects.pause = { x: px + sidePad, y: firstY, w: buttonW, h: buttonH };
      uiRects.pauseRestart = { x: px + sidePad, y: firstY + buttonH + gap, w: buttonW, h: buttonH };
      uiRects.pauseMenu = { x: px + sidePad, y: firstY + (buttonH + gap) * 2, w: buttonW, h: buttonH };
      utilityY = uiRects.pauseMenu.y + buttonH + gap;
    } else {
      const buttonW = (w - sidePad * 2 - gap * 2) / 3;
      const buttonY = py + 76 * scale;
      uiRects.pause = { x: px + sidePad, y: buttonY, w: buttonW, h: buttonH };
      uiRects.pauseRestart = { x: uiRects.pause.x + buttonW + gap, y: buttonY, w: buttonW, h: buttonH };
      uiRects.pauseMenu = { x: uiRects.pauseRestart.x + buttonW + gap, y: buttonY, w: buttonW, h: buttonH };
      utilityY = buttonY + buttonH + gap;
    }

    const actions = [
      [uiRects.pause, "play", onlineMenuOpen ? "CONTINUE" : "RESUME", UI_THEME.blueBright],
      [uiRects.pauseRestart, "restart", onlineMenuOpen && !isRoomOwner() ? "HOST RESTART" : "RESTART", onlineMenuOpen && !isRoomOwner() ? UI_THEME.muted : UI_THEME.warning],
      [uiRects.pauseMenu, "back", onlineMenuOpen ? (isRoomOwner() ? "RETURN TO LOBBY" : "LEAVE MATCH") : "MAIN MENU", UI_THEME.muted]
    ];
    for (const [rect, icon, label, color] of actions) {
      drawPixelPanel(rect.x, rect.y, rect.w, rect.h, UI_THEME.panelActive, color, false);
      drawUiIcon(icon, rect.x + 17 * scale, rect.y + rect.h / 2, 11.5 * scale, color, 1.8 * scale);
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillStyle = UI_THEME.text;
      const labelSize = fitCanvasText(label, rect.w - 32 * scale, 9 * scale, 6.2 * scale);
      ctx.font = `900 ${labelSize}px ${UI_FONT}`;
      ctx.fillText(label, rect.x + 32 * scale, rect.y + rect.h / 2 + 0.5 * scale);
    }

    const utilityGap = 8 * scale;
    const utilityH = 34 * scale;
    const utilityW = (w - sidePad * 2 - utilityGap) / 2;
    uiRects.mute = { x: px + sidePad, y: utilityY, w: utilityW, h: utilityH };
    uiRects.fullscreen = { x: uiRects.mute.x + utilityW + utilityGap, y: utilityY, w: utilityW, h: utilityH };

    const utilities = [
      [uiRects.mute, "music", audio.musicMuted ? "MUSIC OFF" : "MUSIC ON", audio.musicMuted ? UI_THEME.danger : UI_THEME.blue],
      [uiRects.fullscreen, "fullscreen", fullscreenActive() ? "EXIT FULLSCREEN" : "FULLSCREEN", fullscreenActive() ? UI_THEME.blueBright : UI_THEME.blue]
    ];
    for (const [rect, icon, label, color] of utilities) {
      drawPixelPanel(rect.x, rect.y, rect.w, rect.h, UI_THEME.panelRaised, UI_THEME.borderMuted, false);
      drawUiIcon(icon, rect.x + 16 * scale, rect.y + rect.h / 2, 10 * scale, color, 1.6 * scale);
      ctx.textAlign = "left";
      ctx.fillStyle = UI_THEME.muted;
      const labelSize = fitCanvasText(label, rect.w - 31 * scale, 7.5 * scale, 5.5 * scale);
      ctx.font = `800 ${labelSize}px ${UI_FONT}`;
      ctx.fillText(label, rect.x + 30 * scale, rect.y + rect.h / 2 + 0.5 * scale);
    }

    if (audio.musicMuted) {
      ctx.strokeStyle = UI_THEME.danger;
      ctx.lineWidth = 1.6 * scale;
      ctx.beginPath();
      ctx.moveTo(uiRects.mute.x + 7 * scale, uiRects.mute.y + 7 * scale);
      ctx.lineTo(uiRects.mute.x + 24 * scale, uiRects.mute.y + uiRects.mute.h - 7 * scale);
      ctx.stroke();
    }
  }


  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    if (!running && levelState === "menu") {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawCanvasMenu();
      return;
    }

    if (endingScene) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      endingScene.draw();
      return;
    }

    ctx.fillStyle = "#02040a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    const shakeClock = performance.now() * 0.001;
    const shakeX = screenShake > 0 ? Math.sin(shakeClock * 91) * screenShake : 0;
    const shakeY = screenShake > 0 ? Math.cos(shakeClock * 117) * screenShake * 0.62 : 0;
    const snappedCameraX = Math.round((cameraX + shakeX) * viewScale) / viewScale;
    const snappedCameraY = Math.round((cameraY + shakeY) * viewScale) / viewScale;
    ctx.setTransform(viewScale, 0, 0, viewScale, -snappedCameraX * viewScale, -snappedCameraY * viewScale);
    drawBackground();
    drawStageEntrySequence();
    const hideStageAction = Boolean(stageIntro && stageIntro.hideAction);
    for (const pad of launchPads) if (inView(pad, 120)) pad.draw();
    for (const portal of portals) if (inView(portal, 120)) portal.draw();
    drawPortalTravelWorld();
    if (!hideStageAction && bossArena) bossArena.drawWorld();
    if (!hideStageAction) for (const hazard of hazards) if (inView(hazard, 160)) hazard.draw();
    for (const pickup of pickups) if (inView(pickup)) pickup.draw();
    if (!hideStageAction) for (const setPiece of setPieces) if (inView(setPiece, 360)) setPiece.draw();
    if (!hideStageAction) for (const enemy of enemies) if (inView(enemy, 220)) enemy.draw();
    if (!hideStageAction && activeBoss && !activeBoss.dead) activeBoss.draw();
    for (const death of bossDeaths) if (inView(death, 260)) death.draw();
    if (victoryScene) victoryScene.drawWorld();
    drawVehicle();
    for (const player of players) player.draw();
    if (!hideStageAction) for (const bullet of bullets) if (inView(bullet, 300)) bullet.draw();
    if (!hideStageAction) for (const bullet of enemyBullets) if (inView(bullet, 300)) bullet.draw();
    if (!hideStageAction && specialAttack) specialAttack.draw();
    if (!hideStageAction) for (const piece of debris) if (inView(piece, 260)) piece.draw();
    for (const particle of particles) if (inView(particle, 170)) particle.draw();
    for (const blast of blastEffects) if (inViewRect(blast.x - 180, blast.y - 180, 360, 360, 100)) blast.draw();
    for (const text of floatingTexts) if (inViewRect(text.x - 100, text.y - 30, 200, 60, 80)) text.draw();
    ctx.restore();

    // All overlays and controls use CSS-pixel coordinates. The backing buffer is
    // independently scaled for Retina sharpness, so text stays crisp without
    // changing the visual size or touch targets.
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = true;

    if (victoryScene) victoryScene.drawOverlay();
    if (levelTransition) {
      drawLevelTransitionOverlay();
    } else if (stageIntro) {
      drawStageIntroOverlay();
    } else {
      drawCanvasHud();
      drawCanvasTouchControls();
      drawMouseCrosshair();
    }

    drawGameMenuAccessButton();
    if (paused || onlineMenuOpen) drawPauseOverlay();
  }

  function inView(entity, padding = 120) {
    return inViewRect(entity.x, entity.y, entity.w, entity.h, padding);
  }

  function inViewRect(x, y, w, h, padding = 120) {
    return x + w > cameraX - padding &&
           x < cameraX + visibleWorldW + padding &&
           y + h > cameraY - padding &&
           y < cameraY + visibleWorldH + padding;
  }

  function roundRect(x, y, w, h, radius) {
    const cut = Math.max(0, Math.min(Math.round(radius), Math.floor(w / 4), Math.floor(h / 4)));
    ctx.beginPath();
    ctx.moveTo(x + cut, y);
    ctx.lineTo(x + w - cut, y);
    ctx.lineTo(x + w, y + cut);
    ctx.lineTo(x + w, y + h - cut);
    ctx.lineTo(x + w - cut, y + h);
    ctx.lineTo(x + cut, y + h);
    ctx.lineTo(x, y + h - cut);
    ctx.lineTo(x, y + cut);
    ctx.closePath();
  }

  function loop(now) {
    if (document.hidden) {
      last = now;
      requestAnimationFrame(loop);
      return;
    }

    const frame = Math.min(0.05, (now - last) / 1000);
    last = now;
    screenShake = Math.max(0, screenShake - frame * 42);

    if (!running && levelState === "menu") time += frame;

    if (running && !paused) {
      if (hitStop > 0) {
        hitStop = Math.max(0, hitStop - frame);
      } else {
        accumulator += frame;
        while (accumulator >= STEP) {
          update(STEP);
          accumulator -= STEP;
        }
      }
    }

    draw();
    requestAnimationFrame(loop);
  }

  function resetJoystick(keepAim = false) {
    touchStick.active = false;
    touchStick.pointerId = null;
    touchStick.moveX = 0;
    touchStick.down = false;
    touchStick.knobX = 0;
    touchStick.knobY = 0;
    touchStick.baseX = 0;
    touchStick.baseY = 0;
    touchStick.radius = 0;
    if (!keepAim) {
      touchStick.aimX = 1;
      touchStick.aimY = 0;
    }
  }

  const menuPointerPress = {
    pointerId: null,
    screen: "",
    action: null,
    startX: 0,
    startY: 0,
    cancelled: false
  };

  function clearMenuPointerPress() {
    menuPointerPress.pointerId = null;
    menuPointerPress.screen = "";
    menuPointerPress.action = null;
    menuPointerPress.startX = 0;
    menuPointerPress.startY = 0;
    menuPointerPress.cancelled = false;
  }

  function clearControls() {
    for (const key in keys) keys[key] = false;
    for (const key in touchKeys) touchKeys[key] = false;
    for (const key in queuedPresses) queuedPresses[key] = 0;
    mouseInput.fire = false;
    pointerActions.clear();
    uiRects.buttons = {};
    clearMenuPointerPress();
    resetJoystick(false);
  }

  function canvasPoint(event) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (event.clientX - rect.left) * screenW / Math.max(1, rect.width),
      y: (event.clientY - rect.top) * screenH / Math.max(1, rect.height)
    };
  }

  function updateStickPoint(x, y) {
    if (!touchStick.active || touchStick.radius <= 0) return;
    const max = touchStick.radius * 0.66;
    let dx = x - touchStick.baseX;
    let dy = y - touchStick.baseY;
    const distance = Math.hypot(dx, dy);
    if (distance > max) { dx *= max / distance; dy *= max / distance; }
    touchStick.knobX = dx;
    touchStick.knobY = dy;
    const strength = Math.hypot(dx, dy) / max;
    if (strength > 0.10) {
      const length = Math.hypot(dx, dy) || 1;
      const nx = dx / length;
      const ny = dy / length;
      const down = dy / max > 0.46 && Math.abs(dx / max) < 0.78;
      touchStick.down = down;
      touchStick.aimX = nx;
      touchStick.aimY = ny;
      touchStick.moveX = down || Math.abs(dx / max) < 0.28 ? 0 : Math.sign(dx);
    } else {
      touchStick.moveX = 0;
      touchStick.down = false;
    }
  }

  function refreshTouchActions() {
    for (const code of ["KeyF", "KeyW", "KeyG"]) touchKeys[code] = false;
    for (const codes of pointerActions.values()) {
      for (const code of codes) touchKeys[code] = true;
    }
  }

  function actionCodesAtPoint(point, event) {
    const contactX = Math.max(0, (event.width || 1) * 0.34);
    const contactY = Math.max(0, (event.height || 1) * 0.34);
    const codes = [];

    for (const [code, rect] of Object.entries(uiRects.buttons)) {
      const rx = rect.r * 1.12 + contactX;
      const ry = rect.r * 1.12 + contactY;
      const dx = (point.x - rect.x) / Math.max(1, rx);
      const dy = (point.y - rect.y) / Math.max(1, ry);
      if (dx * dx + dy * dy <= 1) codes.push(code);
    }
    return codes;
  }

  function updateCanvasActions(pointerId, codes) {
    const previous = pointerActions.get(pointerId);
    if (!previous && !codes.length) return false;

    const next = new Set(codes);
    let changed = !previous || previous.size !== next.size;
    if (!changed) {
      for (const code of next) {
        if (!previous.has(code)) {
          changed = true;
          break;
        }
      }
    }

    for (const code of next) {
      if ((!previous || !previous.has(code)) && (code === "KeyF" || code === "KeyW" || code === "KeyG")) {
        queuePress(code);
      }
    }

    if (changed) {
      pointerActions.set(pointerId, next);
      refreshTouchActions();
    }
    return true;
  }

  function releaseCanvasPointer(pointerId) {
    if (touchStick.active && pointerId === touchStick.pointerId) resetJoystick(true);
    if (pointerActions.delete(pointerId)) refreshTouchActions();
  }

  function openCharacterSelect() {
    continueSnapshot = null;
    menuScreen = "character";
    characterFocus = 0;
    menuResult = "";
    audio.ui("confirm");
  }

  function closeCharacterSelect() {
    menuScreen = "main";
    menuFocus = 2;
    audio.ui("back");
  }

  function cycleMenuCharacter(delta) {
    menuCharacter = (menuCharacter + delta + CHARACTER_PROFILES.length) % CHARACTER_PROFILES.length;
    audio.ui("move");
  }

  function menuRectContains(rect, point) {
    if (!rect) return false;
    const padding = touchUi ? 2 * uiScaleFactor() : 0;
    return point.x >= rect.x - padding && point.x <= rect.x + rect.w + padding &&
      point.y >= rect.y - padding && point.y <= rect.y + rect.h + padding;
  }

  function characterIndexAtPoint(point) {
    const cards = uiRects.menu.characters || [];
    for (let i = 0; i < cards.length; i++) {
      if (menuRectContains(cards[i], point)) return i;
    }
    return -1;
  }

  function menuActionAtPoint(point) {
    const m = uiRects.menu;
    const action = (id, rect, activate) => menuRectContains(rect, point) ? { id, activate } : null;

    if (menuScreen === "character") {
      const characterIndex = characterIndexAtPoint(point);
      if (characterIndex >= 0) return { id: `character:${characterIndex}`, activate: () => {
        menuCharacter = characterIndex;
        characterFocus = 0;
        audio.ui("move");
      } };
      return action("character:deploy", m.characterDeploy, begin) ||
        action("character:back", m.characterBack, closeCharacterSelect);
    }

    if (menuScreen === "continue") {
      return action("continue:run", m.continueRun, continueMission) ||
        action("continue:menu", m.continueMenu, abandonContinue);
    }

    if (menuScreen === "multiplayer") {
      const room = (m.roomRows || []).find(rect => menuRectContains(rect, point));
      if (room && room.joinable) return { id: `room:${room.code}`, activate: () => joinOnlineRoom(room.code) };
      return action("multiplayer:create", m.createRoom, createOnlineRoom) ||
        action("multiplayer:enter", m.enterRoom, promptForRoomCode) ||
        action("multiplayer:refresh", m.refreshRooms, refreshOnlineRooms) ||
        action("multiplayer:back", m.onlineBack, () => { resetNetwork("solo"); menuScreen = "main"; menuFocus = 3; });
    }

    if (menuScreen === "lobby") {
      const characterIndex = (m.lobbyCharacters || []).findIndex(rect => menuRectContains(rect, point));
      if (characterIndex >= 0) {
        return { id: `lobby:character:${characterIndex}`, activate: () => selectLobbyCharacter(characterIndex) };
      }
      return (isRoomOwner() ? action("lobby:level-prev", m.lobbyLevelPrev, () => { cycleMenuLevel(-1); sendLobbySettings(); }) : null) ||
        (isRoomOwner() ? action("lobby:level-next", m.lobbyLevelNext, () => { cycleMenuLevel(1); sendLobbySettings(); }) : null) ||
        (isRoomOwner() ? action("lobby:diff-prev", m.lobbyDiffPrev, () => { cycleMenuDifficulty(-1); sendLobbySettings(); }) : null) ||
        (isRoomOwner() ? action("lobby:diff-next", m.lobbyDiffNext, () => { cycleMenuDifficulty(1); sendLobbySettings(); }) : null) ||
        action("lobby:invite", m.copyInvite, copyInviteLink) ||
        action("lobby:primary", m.lobbyPrimary, () => {
          if (isRoomOwner()) {
            if (onlineLobbyReady()) requestOnlineStart();
            else setNetworkStatus("WAITING FOR EVERYONE TO READY UP", "pending");
          } else {
            const row = net.roster.get(net.localId);
            setLocalReady(!(row && row.ready));
          }
        }) ||
        action("lobby:leave", m.leaveRoom, () => leaveOnlineSession(true));
    }

    return action("main:level-prev", m.levelPrev, () => cycleMenuLevel(-1)) ||
      action("main:level-next", m.levelNext, () => cycleMenuLevel(1)) ||
      action("main:diff-prev", m.diffPrev, () => cycleMenuDifficulty(-1)) ||
      action("main:diff-next", m.diffNext, () => cycleMenuDifficulty(1)) ||
      action("main:solo", m.solo, openCharacterSelect) ||
      action("main:multiplayer", m.multiplayer, openMultiplayerMenu) ||
      action("main:music", m.music, () => audio.toggleMusic()) ||
      action("main:fullscreen", m.fullscreen, toggleFullscreen);
  }

  function beginMenuPointerPress(event, point) {
    if (menuPointerPress.pointerId !== null) return false;
    const action = menuActionAtPoint(point);
    if (!action) return false;
    menuPointerPress.pointerId = event.pointerId;
    menuPointerPress.screen = menuScreen;
    menuPointerPress.action = action;
    menuPointerPress.startX = point.x;
    menuPointerPress.startY = point.y;
    menuPointerPress.cancelled = false;
    const focus = menuFocusAtPoint(point);
    if (focus !== null) {
      if (menuScreen === "character") characterFocus = focus;
      else if (menuScreen === "continue") continueFocus = focus;
      else if (menuScreen === "main") menuFocus = focus;
    }
    return true;
  }

  function updateMenuPointerPress(pointerId, point) {
    if (menuPointerPress.pointerId !== pointerId) return false;
    const moved = Math.hypot(point.x - menuPointerPress.startX, point.y - menuPointerPress.startY);
    if (moved > 18 * uiScaleFactor()) menuPointerPress.cancelled = true;
    return true;
  }

  function finishMenuPointerPress(event, point) {
    if (menuPointerPress.pointerId !== event.pointerId) return false;
    const pressed = menuPointerPress.action;
    const released = menuScreen === menuPointerPress.screen ? menuActionAtPoint(point) : null;
    const activate = !menuPointerPress.cancelled && pressed && released && pressed.id === released.id;
    clearMenuPointerPress();
    if (activate) pressed.activate();
    return true;
  }

  function menuFocusAtPoint(point) {
    const m = uiRects.menu;
    if (menuScreen === "character") {
      if (characterIndexAtPoint(point) >= 0) return 0;
      if (uiRectContains(m.characterDeploy, point.x, point.y)) return 1;
      if (uiRectContains(m.characterBack, point.x, point.y)) return 2;
      return null;
    }
    if (menuScreen === "continue") {
      if (uiRectContains(m.continueRun, point.x, point.y)) return 0;
      if (uiRectContains(m.continueMenu, point.x, point.y)) return 1;
      return null;
    }
    if (menuScreen === "multiplayer" || menuScreen === "lobby") {
      const rects = Object.values(m).flatMap(value => Array.isArray(value) ? value : [value]);
      return rects.some(rect => rect && uiRectContains(rect, point.x, point.y)) ? 0 : null;
    }
    if (uiRectContains(m.levelPrev, point.x, point.y) || uiRectContains(m.levelNext, point.x, point.y)) return 0;
    if (uiRectContains(m.diffPrev, point.x, point.y) || uiRectContains(m.diffNext, point.x, point.y)) return 1;
    if (uiRectContains(m.solo, point.x, point.y)) return 2;
    if (uiRectContains(m.multiplayer, point.x, point.y)) return 3;
    if (uiRectContains(m.music, point.x, point.y)) return 4;
    if (uiRectContains(m.fullscreen, point.x, point.y)) return 5;
    return null;
  }

  function updateMouseCursor(point = null) {
    if (touchUi) return;
    if (running && !paused && !onlineMenuOpen) {
      canvas.style.cursor = "none";
      return;
    }
    let interactive = false;
    if (!running && levelState === "menu" && point) interactive = menuFocusAtPoint(point) !== null;
    if ((paused || onlineMenuOpen) && point) {
      interactive = uiRectContains(uiRects.pause, point.x, point.y) ||
        uiRectContains(uiRects.pauseRestart, point.x, point.y) ||
        uiRectContains(uiRects.pauseMenu, point.x, point.y) ||
        uiRectContains(uiRects.mute, point.x, point.y) ||
        uiRectContains(uiRects.fullscreen, point.x, point.y);
    }
    canvas.style.cursor = interactive ? "pointer" : "default";
  }

  function cycleMenuLevel(delta) {
    menuLevel = (menuLevel + delta + WORLD_ZONES.length) % WORLD_ZONES.length;
    audio.ensure();
    audio.levelStinger(menuLevel);
  }

  function cycleMenuDifficulty(delta) {
    menuDifficulty = (menuDifficulty + delta + DIFFICULTY_OPTIONS.length) % DIFFICULTY_OPTIONS.length;
    audio.ui("move");
  }

  function activateMenuFocus() {
    if (menuFocus === 0) cycleMenuLevel(1);
    else if (menuFocus === 1) cycleMenuDifficulty(1);
    else if (menuFocus === 2) openCharacterSelect();
    else if (menuFocus === 3) openMultiplayerMenu();
    else if (menuFocus === 4) audio.toggleMusic();
    else if (menuFocus === 5) toggleFullscreen();
  }

  canvas.addEventListener("pointerdown", event => {
    event.preventDefault();
    const point = canvasPoint(event);
    audio.ensure();
    canvas.setPointerCapture(event.pointerId);

    if (endingScene) {
      endingScene.skip();
      return;
    }

    if (!running && levelState === "menu") {
      beginMenuPointerPress(event, point);
      return;
    }

    if (paused || onlineMenuOpen) {
      if (uiRectContains(uiRects.pause, point.x, point.y)) togglePause();
      else if (uiRectContains(uiRects.pauseRestart, point.x, point.y)) restartCurrentLevel();
      else if (uiRectContains(uiRects.pauseMenu, point.x, point.y)) returnToMenu();
      else if (uiRectContains(uiRects.mute, point.x, point.y)) audio.toggleMusic();
      else if (uiRectContains(uiRects.fullscreen, point.x, point.y)) toggleFullscreen();
      return;
    }

    if (uiRectContains(uiRects.pause, point.x, point.y)) { togglePause(); return; }
    if (uiRectContains(uiRects.mute, point.x, point.y)) { audio.toggleMusic(); return; }
    if (uiRectContains(uiRects.fullscreen, point.x, point.y)) { toggleFullscreen(); return; }
    if (stageIntro || levelTransition || portalWarp) return;

    if (event.pointerType === "mouse" && event.button === 0) {
      mouseInput.active = true;
      mouseInput.x = point.x;
      mouseInput.y = point.y;
      mouseInput.fire = true;
      canvas.style.cursor = "none";
      return;
    }

    if (event.pointerType !== "mouse" && touchUi) {
      const actionCodes = actionCodesAtPoint(point, event);
      if (updateCanvasActions(event.pointerId, actionCodes)) return;

      if (!touchStick.active && point.x <= screenW * 0.5) {
        const radius = portrait
          ? clamp(screenW * 0.11, 40, 50)
          : clamp(screenH * 0.105, 34, 44);
        touchStick.active = true;
        touchStick.pointerId = event.pointerId;
        touchStick.radius = radius;
        touchStick.baseX = clamp(point.x, safeLeft + radius * 0.72, screenW * 0.5 - radius * 0.35);
        touchStick.baseY = clamp(point.y, safeTop + radius * 0.72, screenH - safeBottom - radius * 0.72);
        updateStickPoint(point.x, point.y);
        return;
      }
    }
  });

  canvas.addEventListener("pointermove", event => {
    const point = canvasPoint(event);
    const controlsMenu = updateMenuPointerPress(event.pointerId, point);

    if (event.pointerType === "mouse") {
      if (!running && levelState === "menu") {
        const focus = menuFocusAtPoint(point);
        if (focus !== null) {
          if (menuScreen === "character") {
            characterFocus = focus;
            const characterIndex = characterIndexAtPoint(point);
            if (characterIndex >= 0) menuCharacter = characterIndex;
          } else if (menuScreen === "continue") {
            continueFocus = focus;
          } else if (menuScreen === "main") {
            menuFocus = focus;
          }
        }
        updateMouseCursor(point);
        return;
      }
      if (paused || onlineMenuOpen) {
        updateMouseCursor(point);
        return;
      }
      mouseInput.active = true;
      mouseInput.x = point.x;
      mouseInput.y = point.y;
      updateMouseCursor(point);
      return;
    }

    if (controlsMenu) {
      event.preventDefault();
      return;
    }

    const controlsJoystick = touchStick.active && event.pointerId === touchStick.pointerId;
    const controlsActions = pointerActions.has(event.pointerId);
    if (!controlsJoystick && !controlsActions) return;

    event.preventDefault();
    if (controlsJoystick) updateStickPoint(point.x, point.y);

    // Recalculate the buttons under this contact on every move. A broad finger
    // can hold B+C together, and either button releases as soon as contact leaves it.
    if (controlsActions) updateCanvasActions(event.pointerId, actionCodesAtPoint(point, event));
  });


  canvas.addEventListener("pointerup", event => {
    event.preventDefault();
    const point = canvasPoint(event);
    finishMenuPointerPress(event, point);
    if (event.pointerType === "mouse") mouseInput.fire = false;
    releaseCanvasPointer(event.pointerId);
  });

  for (const name of ["pointercancel", "lostpointercapture"]) {
    canvas.addEventListener(name, event => {
      event.preventDefault();
      if (menuPointerPress.pointerId === event.pointerId) clearMenuPointerPress();
      if (event.pointerType === "mouse") mouseInput.fire = false;
      releaseCanvasPointer(event.pointerId);
    });
  }

  addEventListener("keydown", event => {
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(event.code)) event.preventDefault();
    audio.ensure();

    if (endingScene) {
      if (!event.repeat && ["Enter", "Space", "Escape"].includes(event.code)) endingScene.skip();
      return;
    }

    if (!running && levelState === "menu") {
      if (event.repeat) return;
      if (menuScreen === "multiplayer") {
        if (event.code === "Escape" || event.code === "Backspace") { resetNetwork("solo"); menuScreen = "main"; }
        else if (event.code === "KeyR") refreshOnlineRooms();
        else if (event.code === "Enter" || event.code === "Space") createOnlineRoom();
      } else if (menuScreen === "lobby") {
        if (event.code === "Escape" || event.code === "Backspace") leaveOnlineSession(true);
        else if (event.code === "KeyC") cycleLobbyCharacter(1);
        else if (isRoomOwner() && (event.code === "ArrowLeft" || event.code === "KeyA")) { cycleMenuDifficulty(-1); sendLobbySettings(); }
        else if (isRoomOwner() && (event.code === "ArrowRight" || event.code === "KeyD")) { cycleMenuDifficulty(1); sendLobbySettings(); }
        else if (isRoomOwner() && (event.code === "ArrowUp" || event.code === "KeyW")) { cycleMenuLevel(-1); sendLobbySettings(); }
        else if (isRoomOwner() && (event.code === "ArrowDown" || event.code === "KeyS")) { cycleMenuLevel(1); sendLobbySettings(); }
        else if ((event.code === "Enter" || event.code === "Space") && isRoomOwner() && onlineLobbyReady()) requestOnlineStart();
        else if ((event.code === "Enter" || event.code === "Space") && !isRoomOwner()) { const row = net.roster.get(net.localId); setLocalReady(!(row && row.ready)); }
      } else if (menuScreen === "character") {
        if (event.code === "ArrowUp" || event.code === "KeyW") { characterFocus = (characterFocus + CHARACTER_FOCUS_COUNT - 1) % CHARACTER_FOCUS_COUNT; audio.ui("move"); }
        else if (event.code === "ArrowDown" || event.code === "KeyS") { characterFocus = (characterFocus + 1) % CHARACTER_FOCUS_COUNT; audio.ui("move"); }
        else if ((event.code === "ArrowLeft" || event.code === "KeyA") && characterFocus === 0) cycleMenuCharacter(-1);
        else if ((event.code === "ArrowRight" || event.code === "KeyD") && characterFocus === 0) cycleMenuCharacter(1);
        else if (event.code === "Escape" || event.code === "Backspace") closeCharacterSelect();
        else if (event.code === "Enter" || event.code === "Space") {
          if (characterFocus === 2) closeCharacterSelect();
          else begin();
        }
      } else if (menuScreen === "continue") {
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "KeyW", "KeyS", "KeyA", "KeyD"].includes(event.code)) {
          continueFocus = continueFocus ? 0 : 1;
          audio.ui("move");
        } else if (event.code === "Enter" || event.code === "Space") {
          if (continueFocus === 0) continueMission(); else abandonContinue();
        } else if (event.code === "Escape" || event.code === "Backspace") {
          abandonContinue();
        }
      } else {
        if (event.code === "ArrowUp" || event.code === "KeyW") { menuFocus = (menuFocus + MENU_FOCUS_COUNT - 1) % MENU_FOCUS_COUNT; audio.ui("move"); }
        else if (event.code === "ArrowDown" || event.code === "KeyS") { menuFocus = (menuFocus + 1) % MENU_FOCUS_COUNT; audio.ui("move"); }
        else if (event.code === "ArrowLeft" || event.code === "KeyA") {
          if (menuFocus === 0) cycleMenuLevel(-1); else if (menuFocus === 1) cycleMenuDifficulty(-1);
        } else if (event.code === "ArrowRight" || event.code === "KeyD") {
          if (menuFocus === 0) cycleMenuLevel(1); else if (menuFocus === 1) cycleMenuDifficulty(1);
        } else if (event.code === "Enter" || event.code === "Space") activateMenuFocus();
        else if (event.code === "KeyM") audio.toggleMusic();
        else if (event.code === "KeyX") toggleFullscreen();
      }
      return;
    }

    if (paused || onlineMenuOpen) {
      if (!event.repeat && event.code === "KeyR") restartCurrentLevel();
      else if (!event.repeat && event.code === "KeyQ") returnToMenu();
      else if (!event.repeat && (event.code === "Escape" || event.code === "KeyP")) togglePause();
      else if (!event.repeat && event.code === "KeyM") audio.toggleMusic();
      else if (!event.repeat && event.code === "KeyX") toggleFullscreen();
      return;
    }

    keys[event.code] = true;
    if (!event.repeat && ["KeyW", "KeyE"].includes(event.code)) queuePress(event.code);
    if (!event.repeat && (event.code === "Escape" || event.code === "KeyP")) togglePause();
    if (!event.repeat && event.code === "KeyM") audio.toggleMusic();
    if (!event.repeat && event.code === "KeyX") toggleFullscreen();
  });

  addEventListener("keyup", event => { keys[event.code] = false; });
  addEventListener("blur", () => {
    clearControls();
    last = performance.now();
    if (running && !paused && !endingScene && !onlineSession()) togglePause();
  });
  document.addEventListener("visibilitychange", () => {
    clearControls();
    last = performance.now();
    if (onlineSession()) {
      sendServer({ t: "activity", visible: !document.hidden });
      if (!document.hidden && running) sendServer({ t: "sync" });
    } else if (document.hidden && running && !paused) togglePause();
  });

  updateLevelSelectionPreview();
  levelState = "menu";
  resize();
  startNetworkHeartbeat();
  const initialInviteCode = inviteCodeFromUrl();
  if (initialInviteCode) {
    menuScreen = "multiplayer";
    joinOnlineRoom(initialInviteCode);
  }
  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
