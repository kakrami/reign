          const angle = this.time * (1.45 + (index % 3) * 0.16) + index * Math.PI * 2 / Math.max(1, targets.length);
          const startRadius = Math.max(210, visibleWorldW * 0.30);
          const radius = mix(startRadius, 58 + (index % 3) * 16, pullProgress);
          const desiredX = this.centerX + Math.cos(angle) * radius - target.w * 0.5;
          const desiredY = this.centerY + Math.sin(angle) * radius * 0.52 - target.h * 0.5;
          const follow = Math.min(1, dt * (3.8 + pullProgress * 8.5));
          target.x = mix(target.x, desiredX, follow);
          target.y = mix(target.y, desiredY, follow);
          if (!this.novaStart.has(target)) this.novaStart.set(target, anchor);
        });
      }

      while (this.time >= this.nextPulse && this.pulseIndex < 4) {
        this.impacts.push({ type: "gravity", x: this.centerX, y: this.centerY, life: 0.72, maxLife: 0.72, pulse: this.pulseIndex });
        this.damageAll(64, 52);
        audio.powerStrike("nova", this.pulseIndex);
        this.pulseIndex++;
        this.nextPulse += 0.43;
      }

      if (!this.finalBurst && this.time >= 2.18) {
        this.finalBurst = true;
        this.eraseHostileFire(this.profile.color);
        this.damageAll(335, 285);
        this.impacts.push({ type: "nova", x: this.centerX, y: this.centerY, life: 0.92, maxLife: 0.92 });
        explode(this.centerX, this.centerY, this.profile.color, 40, false);
        impactFeedback(0.10, 22);
        audio.powerFinish("nova");
      }
    }

    draw() {
      if (this.mode === "vanguard") this.drawVanguard();
      else if (this.mode === "ember") this.drawEmber();
      else if (this.mode === "ghost") this.drawGhost();
      else this.drawNova();
      this.drawImpacts();
    }

    drawVanguard() {
      const flight = clamp((this.time - 0.04) / 1.70, 0, 1);
      const craftX = this.left - 240 + (this.right - this.left + 480) * flight;
      const craftY = cameraY + visibleWorldH * 0.16 + Math.sin(this.time * 11) * 4;
      this.craftY = craftY;
      ctx.save();
      ctx.translate(craftX, craftY);
      ctx.fillStyle = "#07111d";
      ctx.fillRect(-118, -34, 205, 68);
      ctx.fillRect(-68, -51, 94, 20);
      ctx.fillRect(-88, 30, 62, 16);
      ctx.fillRect(22, 30, 62, 16);
      ctx.fillStyle = "#dcefff";
      ctx.fillRect(-108, -25, 177, 50);
      ctx.fillRect(-56, -43, 78, 18);
      ctx.fillStyle = "#4b6f89";
      ctx.fillRect(-80, -16, 126, 32);
      ctx.fillStyle = this.profile.color;
      ctx.fillRect(-12, -35, 40, 11);
      ctx.fillRect(-72, -8, 60, 8);
      ctx.fillStyle = "#ffd34d";
      ctx.fillRect(60, -11, 50, 22);
      ctx.fillStyle = "#ff6a42";
      ctx.fillRect(-145, -6, 36, 12);
      ctx.strokeStyle = "#9ef3ff";
      ctx.lineWidth = 5;
      ctx.strokeRect(-108, -25, 177, 50);
      ctx.restore();
    }

    drawEmber() {
      const flight = clamp((this.time - 0.04) / 1.95, 0, 1);
      const x = this.left - 240 + (this.right - this.left + 480) * flight;
      const y = cameraY + visibleWorldH * 0.18;
      const wing = 56 + Math.sin(this.time * 12) * 12;
      ctx.save();
      ctx.translate(x, y);
      ctx.globalAlpha = 0.34;
      ctx.fillStyle = "#ff4c32";
      ctx.beginPath();
      ctx.moveTo(-10, 0);
      ctx.quadraticCurveTo(-90, -wing, -168, -18);
      ctx.quadraticCurveTo(-92, 2, -22, 24);
      ctx.quadraticCurveTo(48, 2, 142, -22);
      ctx.quadraticCurveTo(70, wing, -10, 0);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = "#2b1515";
      ctx.fillRect(-92, -18, 156, 36);
      ctx.fillStyle = "#ff765e";
      ctx.fillRect(-60, -31, 88, 62);
      ctx.fillStyle = "#ffbd45";
      ctx.fillRect(58, -8, 40, 16);
      ctx.fillRect(-110, -5, 22, 10);
      ctx.strokeStyle = "#ffd9a1";
      ctx.lineWidth = 4;
      ctx.strokeRect(-80, -14, 130, 28);
      ctx.restore();

      const sweep = clamp((this.time - 0.14) / 1.95, 0, 1);
      const wallX = this.left + (this.right - this.left) * sweep;
      ctx.save();
      ctx.globalAlpha = 0.18;
      const gradient = ctx.createLinearGradient(wallX - 180, 0, wallX + 80, 0);
      gradient.addColorStop(0, "rgba(255,76,50,0)");
      gradient.addColorStop(0.65, "rgba(255,118,94,.85)");
      gradient.addColorStop(1, "rgba(255,211,77,0)");
      ctx.fillStyle = gradient;
      ctx.fillRect(wallX - 180, cameraY, 260, visibleWorldH);
      ctx.restore();
    }

    drawGhost() {
      ctx.save();
      ctx.globalAlpha = 0.11 + Math.sin(this.time * 18) * 0.025;
      ctx.fillStyle = this.profile.color;
      ctx.fillRect(cameraX, cameraY, visibleWorldW, visibleWorldH);
      ctx.globalAlpha = 0.28;
      ctx.strokeStyle = this.profile.color;
      ctx.lineWidth = 2;
      const spacing = Math.max(90, visibleWorldW / 14);
      for (let x = cameraX - (cameraX % spacing); x < cameraX + visibleWorldW; x += spacing) {
        ctx.beginPath();
        ctx.moveTo(x, cameraY);
        ctx.lineTo(x, cameraY + visibleWorldH);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      for (const target of this.targets) {
        if (!target || target.dead || !this.inField(target)) continue;
        const pulse = 8 + Math.sin(this.time * 14 + target.cx * 0.01) * 4;
        ctx.strokeStyle = this.profile.color;
        ctx.lineWidth = 3;
        ctx.strokeRect(target.x - pulse, target.y - pulse, target.w + pulse * 2, target.h + pulse * 2);
        drawUiIcon("phase", target.cx, target.y - 24, 18, "#ffffff", 2.2);
      }
      ctx.restore();
    }

    drawNova() {
      const charge = clamp(this.time / 2.18, 0, 1);
      ctx.save();
      ctx.globalAlpha = 0.16 + charge * 0.16;
      ctx.fillStyle = "#16071f";
      ctx.fillRect(cameraX, cameraY, visibleWorldW, visibleWorldH);
      ctx.globalAlpha = 1;

      for (const target of this.targets) {
        if (!target || target.dead || !this.inField(target)) continue;
        ctx.globalAlpha = 0.20 + charge * 0.34;
        ctx.strokeStyle = this.profile.accent;
        ctx.lineWidth = 2 + charge * 3;
        ctx.beginPath();
        ctx.moveTo(target.cx, target.cy);
        ctx.quadraticCurveTo(
          mix(target.cx, this.centerX, 0.55) + Math.sin(this.time * 5 + target.cx) * 24,
          mix(target.cy, this.centerY, 0.55),
          this.centerX,
          this.centerY
        );
        ctx.stroke();
      }

      ctx.globalAlpha = 1;
      ctx.translate(this.centerX, this.centerY);
      for (let i = 0; i < 6; i++) {
        const radius = 62 + i * 45 + Math.sin(this.time * (5 + i)) * 10;
        ctx.globalAlpha = 0.64 - i * 0.075;
        ctx.strokeStyle = i % 2 ? this.profile.accent : this.profile.color;
        ctx.lineWidth = 7 - i * 0.72;
        ctx.beginPath();
        ctx.arc(0, 0, radius * (1.30 - charge * 0.48), this.time * (i % 2 ? -1.4 : 1.15), this.time * (i % 2 ? -1.4 : 1.15) + Math.PI * 1.58);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      const core = 32 + charge * 32;
      ctx.fillStyle = "#030107";
      ctx.beginPath();
      ctx.arc(0, 0, core, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = this.profile.color;
      ctx.beginPath();
      ctx.arc(-core * 0.25, -core * 0.28, core * 0.20, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    drawImpacts() {
      for (const impact of this.impacts) {
        const ratio = impact.life / impact.maxLife;
        if (impact.type === "rail") {
          const beamTop = (this.craftY || cameraY + visibleWorldH * 0.16) + 18;
          const beamHeight = Math.max(16, impact.y - beamTop);
          const width = 24 + (1 - ratio) * 48;
          ctx.fillStyle = "#082038";
          ctx.fillRect(impact.x - width / 2 - 6, beamTop, width + 12, beamHeight);
          ctx.fillStyle = ratio > 0.48 ? "#fff36d" : this.profile.color;
          ctx.fillRect(impact.x - width / 2, beamTop, width, beamHeight);
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(impact.x - 5, beamTop, 10, beamHeight);
        } else if (impact.type === "fire") {
          const height = 100 + (1 - ratio) * 135;
          const width = 66 + (1 - ratio) * 48;
          ctx.globalAlpha = Math.min(1, ratio * 1.5);
          ctx.fillStyle = "#ff4c32";
          ctx.beginPath();
          ctx.moveTo(impact.x - width / 2, impact.y);
          ctx.quadraticCurveTo(impact.x - width * 0.58, impact.y - height * 0.55, impact.x, impact.y - height);
          ctx.quadraticCurveTo(impact.x + width * 0.62, impact.y - height * 0.52, impact.x + width / 2, impact.y);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = "#ffd34d";
          ctx.beginPath();
          ctx.moveTo(impact.x - width * 0.22, impact.y);
          ctx.quadraticCurveTo(impact.x, impact.y - height * 0.78, impact.x + width * 0.22, impact.y);
          ctx.closePath();
          ctx.fill();
          ctx.globalAlpha = 1;

    line: "ranged",

    sweep: "ranged",
    lock: "ranged",
    cross: "ranged",
    gravity: "ranged",
    summon: "ranged",
    charge: "pursuit",
    path: "pursuit",
    ground: "mid",
    cone: "mid",
    radial: "mid"
  });

  const BOSS_GROUND_ONLY_ATTACKS = new Set([
    "stomp", "crush", "ram", "burrow", "devour", "iceCharge", "phaseDash"
  ]);

  const BOSS_ATTACK_FOOTPRINT = Object.freeze({
    summon: 8, deploy: 8, echoes: 7,
    gearWall: 7, rootWall: 7, iceField: 7, gravity: 7,
    rain: 6, debris: 6, mortar: 6, bombRun: 6, avalanche: 6,
    missiles: 5, spiral: 5, nova: 5, laser: 5, cross: 5,
    fan: 4, horizontal: 4, wave: 4, roots: 4,
    stomp: 2, crush: 2, ram: 2, railRush: 2,
    swoop: 2, burrow: 2, devour: 2, iceCharge: 2, phaseDash: 1
  });

  function bossAttackFootprint(name) {
    return BOSS_ATTACK_FOOTPRINT[name] ?? 4;
  }

  function bossAttackRole(name) {
    if (BOSS_ATTACK_ROLE_OVERRIDES[name]) return BOSS_ATTACK_ROLE_OVERRIDES[name];
    return BOSS_CUE_ROLES[BOSS_TELEGRAPH_CUES[name]] || "mid";
  }

  function drawBossTelegraph(boss) {
    if (boss.telegraphTimer <= 0 || !boss.telegraphCue) return;
    const duration = Math.max(0.001, boss.telegraphDuration);
    const progress = clamp(1 - boss.telegraphTimer / duration, 0, 1);
    const pulse = 0.5 + 0.5 * Math.sin(time * 18);
    const accent = boss.profile.accent;
    const target = boss.target();
    const direction = boss.faceTarget(target);

    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    // Every attack uses the same visual language: charge at the boss,
    // then a world-space cue showing where the danger will travel or land.
    ctx.globalAlpha = 0.20 + progress * 0.46;
    ctx.strokeStyle = accent;
    ctx.lineWidth = 5 + progress * 5;
    ctx.beginPath();
    ctx.arc(boss.cx, boss.cy, Math.max(boss.w, boss.h) * (0.42 + (1 - progress) * 0.20), 0, Math.PI * 2);
    ctx.stroke();

    const cue = boss.telegraphCue;
    if (cue === "gravity") {
      const x = boss.telegraphTargetX;
      const y = boss.telegraphTargetY;
      if (Number.isFinite(x) && Number.isFinite(y)) {
        const radius = mix(185, 92, progress);
        ctx.globalAlpha = 0.22 + progress * 0.58;
        ctx.strokeStyle = "#fff36d";
        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.strokeStyle = accent;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(x, y, radius * 0.68, time * 1.8, time * 1.8 + Math.PI * 1.5);
        ctx.stroke();
        ctx.globalAlpha = 0.24 + progress * 0.36;
        ctx.beginPath();
        ctx.moveTo(boss.cx, boss.cy);
        ctx.quadraticCurveTo((boss.cx + x) * 0.5, Math.min(boss.cy, y) - 110 - pulse * 35, x, y);
        ctx.stroke();
        for (let i = 0; i < 5; i++) {
          const angle = time * (1.2 + i * 0.08) + i * Math.PI * 0.4;
          const orbit = radius * (0.42 + i * 0.08);
          ctx.fillStyle = i % 2 ? accent : "#fff36d";
          ctx.beginPath();
          ctx.arc(x + Math.cos(angle) * orbit, y + Math.sin(angle) * orbit * 0.55, 4 + progress * 3, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    } else if (cue === "lock" && target) {
      const r = mix(86, 50, progress);
      ctx.globalAlpha = 0.30 + progress * 0.55;
      ctx.strokeStyle = "#fff36d";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(target.cx, target.cy, r, 0, Math.PI * 2);
      ctx.stroke();
      for (let i = 0; i < 4; i++) {
        const angle = i * Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(target.cx + Math.cos(angle) * (r + 16), target.cy + Math.sin(angle) * (r + 16));
        ctx.lineTo(target.cx + Math.cos(angle) * (r - 10), target.cy + Math.sin(angle) * (r - 10));
        ctx.stroke();
      }
    } else if (cue === "line" || cue === "cone" || cue === "charge" || cue === "path") {
      const length = cue === "charge" || cue === "path" ? 390 : 310;
      const spread = cue === "cone" ? 105 : cue === "charge" ? 62 : 28;
      const originX = boss.cx + direction * boss.w * 0.28;
      ctx.globalAlpha = 0.18 + progress * 0.42;
      ctx.fillStyle = accent;
      ctx.beginPath();
      ctx.moveTo(originX, boss.cy - spread * 0.22);
      ctx.lineTo(originX + direction * length, boss.cy - spread);
      ctx.lineTo(originX + direction * length, boss.cy + spread);
      ctx.lineTo(originX, boss.cy + spread * 0.22);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 0.52 + progress * 0.32;
      ctx.strokeStyle = "#fff36d";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(originX, boss.cy);
      ctx.lineTo(originX + direction * length * progress, boss.cy);
      ctx.stroke();
    } else if (cue === "ground") {
      const groundY = terrainSurfaceY(boss.cx) - 5;
      ctx.globalAlpha = 0.22 + progress * 0.48;
      ctx.strokeStyle = accent;
      ctx.lineWidth = 6;
      for (let i = 0; i < 4; i++) {
        const radius = mix(42 + i * 18, 145 + i * 62, progress);
        ctx.beginPath();
        ctx.ellipse(boss.cx, groundY, radius, 10 + i * 4 + pulse * 4, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
    } else if (cue === "sweep") {
      const groundY = terrainLaneY((boss.arenaLeft + boss.arenaRight) * 0.5, true) - 14;
      const fromX = direction > 0 ? boss.arenaLeft + 45 : boss.arenaRight - 45;
      const toX = direction > 0 ? boss.arenaRight - 45 : boss.arenaLeft + 45;
      const leadingX = mix(fromX, toX, progress);
      const gradient = ctx.createLinearGradient(fromX, 0, toX, 0);
      gradient.addColorStop(0, "rgba(255,255,255,0)");
      gradient.addColorStop(clamp(progress - 0.18, 0, 1), accent);
      gradient.addColorStop(progress, "#fff6bd");
      gradient.addColorStop(clamp(progress + 0.08, 0, 1), "rgba(255,255,255,0)");
      ctx.globalAlpha = 0.30 + progress * 0.48;
      ctx.strokeStyle = gradient;
      ctx.lineWidth = 8 + pulse * 3;
      ctx.beginPath();
      ctx.moveTo(fromX, groundY);
      ctx.lineTo(leadingX, groundY);
      ctx.stroke();
      ctx.globalAlpha = 0.20 + progress * 0.28;
      ctx.fillStyle = accent;
      ctx.fillRect(Math.min(fromX, leadingX), groundY - 28, Math.abs(leadingX - fromX), 56);
    } else if (cue === "sky") {
      const left = boss.arenaLeft + 120;
      const right = boss.arenaRight - 120;
      const marks = 4;
      for (let i = 0; i < marks; i++) {
        const x = mix(left, right, (i + 0.5) / marks);
        const groundY = terrainSurfaceY(x) - 5;
        const radius = mix(52, 24, progress);
        const beamTop = mix(groundY - 260, groundY - 105, progress);
        ctx.globalAlpha = 0.18 + progress * 0.42;
        ctx.fillStyle = accent;
        ctx.fillRect(x - 8, beamTop, 16, Math.max(8, groundY - beamTop));
        ctx.globalAlpha = 0.42 + progress * 0.36;
        ctx.strokeStyle = i % 2 ? accent : "#fff6bd";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.ellipse(x, groundY, radius, 11 + pulse * 4, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
    } else if (cue === "summon") {
      for (let i = 0; i < 4; i++) {
        const angle = time * (i % 2 ? -1.5 : 1.35) + i * Math.PI * 0.5;
        const radius = 85 + progress * 50;
        const x = boss.cx + Math.cos(angle) * radius;
        const y = boss.cy + Math.sin(angle) * radius * 0.55;
        ctx.globalAlpha = 0.28 + progress * 0.46;
        ctx.strokeStyle = i % 2 ? accent : "#fff36d";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(x, y, 18 + pulse * 5, 0, Math.PI * 2);
        ctx.stroke();
      }
    } else if (cue === "cross") {
      const centerX = target ? target.cx : boss.cx;
      const centerY = target ? target.cy : boss.cy;
      ctx.globalAlpha = 0.26 + progress * 0.48;
      ctx.strokeStyle = accent;
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(boss.arenaLeft + 70, centerY);
      ctx.lineTo(boss.arenaRight - 70, centerY);
      ctx.moveTo(centerX, cameraY + 80);
      ctx.lineTo(centerX, terrainSurfaceY(centerX));
      ctx.stroke();
      ctx.strokeStyle = "#fff6bd";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(centerX, centerY, mix(70, 34, progress), 0, Math.PI * 2);
      ctx.stroke();
    } else {
      const radius = mix(78, 205, progress);
      ctx.globalAlpha = 0.25 + progress * 0.48;
      ctx.strokeStyle = accent;
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.arc(boss.cx, boss.cy, radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = "#fff36d";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(boss.cx, boss.cy, radius * 0.68, -time * 1.5, -time * 1.5 + Math.PI * 1.45);
      ctx.stroke();
    }

    ctx.restore();
  }

  class StageBoss extends Entity {
    constructor(key, x) {
      const profile = BOSS_PROFILES[key];
      const surfaceY = terrainSurfaceY(x + profile.w / 2);
      const baseY = profile.floating ? surfaceY - profile.h - 150 : surfaceY - profile.h;
      super(x, baseY, profile.w, profile.h);
      this.key = key;
      this.profile = profile;
      this.name = profile.name;
      this.maxHealth = profile.health * enemyHealthScale(true);
      this.health = this.maxHealth;
      this.phase = 0;
      this.introTimer = 1.45;
      this.attackTimer = 2.05;
      this.telegraphTimer = 0;
      this.telegraphDuration = 0;
      this.telegraphCue = "";
      this.telegraphTargetX = null;
      this.telegraphTargetY = null;
      this.pendingAttack = null;
      this.pendingAttackName = null;
      this.pendingAttackCombo = false;
      this.flashTimer = 0;
      this.attackMode = 0;
      this.combatTier = 0;
      this.phaseShield = 0;
      this.vulnerableTimer = 0;
      this.armorPulse = 0;
      this.comboTimer = 0;
      this.comboAttackName = null;
      this.lastAttackName = null;
      this.attackSilence = 0;
      this.stationaryTargetTime = 0;
      this.facing = -1;
      this.cameraBlend = 0;
      this.arenaLock = "arena";
      this.hudHidden = false;
      this.arenaLeft = x - 760;
      this.arenaRight = x + this.w + 260;
      this.score = profile.score;
      this.baseY = baseY;
    }

    target() {
      let best = null;
      let bestDistance = Infinity;
      for (const player of players) {
        if (player.dead) continue;
        const distance = Math.abs(player.cx - this.cx);
        if (distance < bestDistance) { bestDistance = distance; best = player; }
      }
      return best;
    }

    faceTarget(target = this.target()) {
      if (target && Math.abs(target.cx - this.cx) > 8) this.facing = target.cx < this.cx ? -1 : 1;
      return this.facing;
    }

    targetGap(target = this.target()) {
      if (!target) return Infinity;
      if (target.x > this.x + this.w) return target.x - (this.x + this.w);
      if (this.x > target.x + target.w) return this.x - (target.x + target.w);
      return 0;
    }

    targetRangeBand(target = this.target()) {
      const gap = this.targetGap(target);
      const arenaSpan = Math.max(900, this.arenaRight - this.arenaLeft);
      const closeLimit = clamp(this.w * 1.15 + 180, 320, 520);
      const farLimit = clamp(arenaSpan * 0.40, 650, 900);
      if (gap <= closeLimit) return "close";
      if (gap >= farLimit) return "ranged";
      return "mid";
    }

    targetIsElevated(target = this.target()) {
      if (!target) return false;
      const ground = terrainSurfaceY(target.cx);
      return Boolean(target.supportPlatform && target.supportPlatform.arenaOwned) ||
        (Number.isFinite(ground) && target.y + target.h < ground - 72);
    }

    attackSuitability(name, target = this.target()) {
      const role = bossAttackRole(name);
      const targetBand = this.targetRangeBand(target);
      if (role === "pursuit") {
        if (this.targetIsElevated(target) && BOSS_GROUND_ONLY_ATTACKS.has(name)) return 4;
        // Pursuit closes space. It is strongest at range, acceptable at mid
        // distance, and deliberately weaker when already beside the player.
        return targetBand === "ranged" ? 0 : targetBand === "mid" ? 0.65 : 1.6;
      }
      const order = { close: 0, mid: 1, ranged: 2 };
      let score = Math.abs((order[role] ?? 1) - (order[targetBand] ?? 1));
      if (role === "close" && targetBand === "ranged") score += 3;
      if (role === "ranged" && targetBand === "close") score += 1;
      if (this.targetIsElevated(target) && BOSS_GROUND_ONLY_ATTACKS.has(name)) score += 4;
      return score;
    }

    attackFitsTargetRange(name, target = this.target()) {
      return this.attackSuitability(name, target) <= 1;
    }

    selectAttackForTarget(scheduledAttack, attackIndex, previousName = null, skipSummon = false) {
      const attacks = this.profile.attacks || [];
      if (!attacks.length) return scheduledAttack;
      const target = this.target();
      const scheduledAllowed = !(skipSummon && scheduledAttack === "summon") && scheduledAttack !== previousName;
      const scheduledScore = this.attackSuitability(scheduledAttack, target);

      // Keep the authored rotation whenever the scheduled attack is sensible.
      // Search for a substitute only when it is clearly wrong for the range,
      // elevation, or repetition state.
      if (scheduledAllowed && scheduledScore <= 1.1) return scheduledAttack;

      let bestName = scheduledAttack;
      let bestScore = Infinity;
      for (let offset = 0; offset < attacks.length; offset++) {
        const candidate = attacks[(attackIndex + offset) % attacks.length];
        if (skipSummon && candidate === "summon") continue;
        if (candidate === previousName && attacks.length > 1) continue;
        const score = this.attackSuitability(candidate, target) + offset * 0.04;
        if (score < bestScore) {
          bestName = candidate;
          bestScore = score;
        }
      }
      return bestName;
    }

    selectAttackWithinBudget(scheduledAttack, attackIndex, pressure, previousName = null) {
      const attacks = this.profile.attacks || [];
      if (!attacks.length) return scheduledAttack;
      const available = Math.max(1, bossPressureLimit() - pressure);
      const target = this.target();
      let bestName = null;
      let bestScore = Infinity;

      for (let offset = 0; offset < attacks.length; offset++) {
        const candidate = attacks[(attackIndex + offset) % attacks.length];
        if (candidate === previousName && attacks.length > 1) continue;
        const footprint = bossAttackFootprint(candidate);
        const overBudget = Math.max(0, footprint - available);
        const suitability = this.attackSuitability(candidate, target);
        const score = suitability * 5 + overBudget * 3 + footprint * 0.08 + offset * 0.02;
        if (score < bestScore) {
          bestName = candidate;
          bestScore = score;
        }
      }
      return bestName || scheduledAttack;
    }

    updatePassiveState(dt, faceTarget = true) {
      this.phase += dt;
      this.cameraBlend = bossArena && bossArena.boss === this ? bossArena.cameraBlend : 0;
      this.flashTimer = Math.max(0, this.flashTimer - dt);
      this.phaseShield = Math.max(0, this.phaseShield - dt);
      this.vulnerableTimer = Math.max(0, this.vulnerableTimer - dt);
      this.armorPulse = Math.max(0, this.armorPulse - dt);
      const target = this.target();
      if (target && faceTarget) this.faceTarget(target);
      return target;
    }

    updateCombatTier() {
      const healthRatio = clamp(this.health / Math.max(1, this.maxHealth), 0, 1);
      const nextTier = healthRatio <= 0.34 ? 2 : healthRatio <= 0.68 ? 1 : 0;
      if (nextTier > this.combatTier) this.enterCombatTier(nextTier);
    }

    displayFacing() {
      return this.faceTarget();
    }

    visualFacingScale() {
      return this.displayFacing() * (BOSS_FORM_BASE_FACING[this.profile.form] || 1);
    }

    update(dt) {
      const target = this.updatePassiveState(dt, true);
      if (this.introTimer > 0) { this.introTimer -= dt; return; }
      if (bossArena && bossArena.boss === this && !bossArena.combatReady) return;
      if (!target) return;
      if (specialAttack) { this.attackTimer = Math.max(this.attackTimer, 0.45); return; }
      this.updateCombatTier();

      const formFloat = {
        gunship: [34, 1.85], carrier: [28, 1.5], mantis: [38, 1.8],
        core: [24, 1.2], hydra: [7, 0.9], beast: [5, 1.15],
        hunter: [30, 1.75]
      }[this.profile.form] || [this.profile.floating ? 24 : 0, this.profile.floating ? 1.55 : 0.9];
      this.y = this.baseY + Math.sin(this.phase * formFloat[1]) * formFloat[0];

      if (this.telegraphTimer > 0) {
        this.telegraphTimer -= dt;
        if (this.telegraphTimer <= 0 && this.pendingAttackName) {
          this.telegraphTimer = 0;
          this.executePendingBossAttack();
        }
        return;
      }

      if (this.comboTimer > 0) {
        this.comboTimer -= dt;
        if (this.comboTimer <= 0 && this.comboAttackName) {
          const comboName = this.comboAttackName;
          this.comboAttackName = null;
          this.beginBossAttack(comboName, true);
          return;
        }
      }

      const targetMoving = target ? Math.abs(target.vx) + Math.abs(target.vy) : 999;
      const targetFiring = target ? target.shotActivity > 0 : false;
      this.stationaryTargetTime = targetMoving < 42 && targetFiring
        ? Math.min(8, this.stationaryTargetTime + dt)
        : Math.max(0, this.stationaryTargetTime - dt * 1.8);
      this.attackSilence += dt;
      const silenceLimit = this.profile.campaignFinal ? 3.6 : 4.8;
      if (this.attackSilence >= silenceLimit) this.attackTimer = Math.min(this.attackTimer, 0);
      this.attackTimer -= dt;
      if (this.attackTimer <= 0) {
        const scheduledAttack = this.profile.attacks[this.attackMode % this.profile.attacks.length];
        const pressure = bossPressureScore(this);
        let attackName = pressure > bossPressureLimit()
          ? this.selectAttackWithinBudget(scheduledAttack, this.attackMode, pressure, this.lastAttackName)
          : this.selectAttackForTarget(scheduledAttack, this.attackMode, this.lastAttackName);

        // A stationary firing player should provoke movement or arena pressure,
        // not be allowed to hold the trigger against an idle boss.
        if (this.stationaryTargetTime >= 2.2) {
          const pressureAttack = this.selectAttackWithinBudget(scheduledAttack, this.attackMode + 1, pressure - 3, this.lastAttackName);
          if (["pursuit", "ranged"].includes(bossAttackRole(pressureAttack))) attackName = pressureAttack;
          this.stationaryTargetTime = 0;
        }

        this.attackMode++;
        this.beginBossAttack(attackName, false);
        const baseCadence = this.profile.cadence || (2.92 - Math.min(0.58, campaignLevel * 0.11));
        const tierPressure = this.combatTier * difficulty.tierPressure;
        const levelPressure = campaignLevel * difficulty.levelPressure;
        const recoveryWindow = menuDifficulty <= 1 ? 0.18 : menuDifficulty === 2 ? 0.08 : 0;
        const pressureDelay = pressure > bossPressureLimit() ? 0.12 : 0;
        this.attackTimer = Math.max(
          difficulty.bossMinInterval,
          (baseCadence - tierPressure - levelPressure) * enemyCadenceScale(true) + recoveryWindow + pressureDelay
        );
      }

      for (const player of players) {
        if (!player.dead && this.overlaps(player)) {
          const direction = player.cx < this.cx ? -1 : 1;
          player.hit((12 + campaignLevel + this.combatTier * 1.5) * enemyDamageScale(), direction);
        }
      }
    }

    enterCombatTier(tier) {
      this.combatTier = tier;
      this.phaseShield = 0.68;
      this.attackTimer = Math.max(this.attackTimer, tier === 1 ? 1.25 : 1.45);
      this.comboTimer = 0;
      this.comboAttackName = null;
      this.pendingAttack = null;
      this.pendingAttackName = null;
      this.pendingAttackCombo = false;
      this.telegraphTimer = 0;
      this.clearTelegraph();
      if (difficulty.phaseClear) {
        for (const bullet of enemyBullets) {
          if (!bullet.dead) burst(bullet.cx, bullet.cy, this.profile.accent, 2, 70);
          bullet.dead = true;
        }
        for (const enemy of enemies) {
          if (!enemy.dead) explode(enemy.cx, enemy.cy, this.profile.accent, 8, false, 0.45);
          enemy.dead = true;
        }
        for (const piece of debris) {
          if (!piece.dead && Number.isFinite(piece.cx) && Number.isFinite(piece.cy)) burst(piece.cx, piece.cy, this.profile.accent, 3, 85);
          piece.dead = true;
        }
        for (const hazard of hazards) {
          if (!(hazard instanceof Hazard)) hazard.dead = true;
        }
      }
      blastEffects.push(new BlastEffect(this.cx, this.cy, this.profile.accent, tier + 1));
      burst(this.cx, this.cy, this.profile.accent, 18 + tier * 8, 250 + tier * 60);
      if (bossArena && bossArena.boss === this) bossArena.onBossPhase(tier);
      audio.bossPhase(tier);
    }

    attackDefinition(name) {
      const attackMap = {
        horizontal: [() => this.horizontalBurst(), 0.58],
        rain: [() => this.verticalRain(), 0.68],
        debris: [() => this.overheadDrop(), 0.72],
        cross: [() => this.crossFire(), 0.70],
        laser: [() => this.laserSweep(), 0.78],
        wave: [() => this.shockwave(), 0.72],
        spiral: [() => this.energyRing(), 0.76],
        fan: [() => this.fanBurst(), 0.66],
        summon: [() => this.summonMinions(), 0.78],
        missiles: [() => this.missileSalvo(), 0.76],
        nova: [() => this.novaPulse(), 0.82],
        gravity: [() => this.gravityWell(), 1.06],
        stomp: [() => this.stompAdvance(), 0.62],
        railRush: [() => this.railRush(), 0.68],
        roots: [() => this.rootSurge(), 0.66]
      };
      return attackMap[name] || attackMap.horizontal;
    }

    selectComboAttack(previousName) {
      const attacks = this.profile.attacks;
      if (!attacks || attacks.length < 2) return null;
      const candidate = this.selectAttackForTarget(
        attacks[this.attackMode % attacks.length],
        this.attackMode,
        previousName,
        true
      );
      return candidate !== previousName && candidate !== "summon" ? candidate : null;
    }

    beginBossAttack(name, combo = false) {
      const entry = this.attackDefinition(name);
      const duration = entry[1] * difficulty.telegraph * (combo ? 0.78 : 1);
      this.pendingAttack = null;
      this.pendingAttackName = name;
      this.pendingAttackCombo = combo;
      this.prepareTelegraph(name, duration);
      this.telegraphTimer = duration;
      const cuePitch = this.telegraphCue === "gravity" ? 74 : this.telegraphCue === "sky" ? 290 : 210 + campaignLevel * 42;
      audio.tone(cuePitch, Math.min(0.48, duration * 0.55), "sawtooth", 0.08, this.telegraphCue === "gravity" ? -18 : 120);
    }

    executePendingBossAttack() {
      const name = this.pendingAttackName;
      const combo = Boolean(this.pendingAttackCombo);
      this.pendingAttackName = null;
      this.pendingAttackCombo = false;
      if (!name) {
        this.clearTelegraph();
        return;
      }

      const entry = this.attackDefinition(name);
      entry[0]();
      this.lastAttackName = name;
      this.attackSilence = 0;
      this.clearTelegraph();
      this.vulnerableTimer = Math.max(this.vulnerableTimer, combo ? 0.58 : 1.02 + this.combatTier * 0.10);
      if (bossArena && bossArena.boss === this) bossArena.onAttackCommitted();

      if (!combo && this.combatTier > 0 && !this.retreating && difficulty.bossComboMode > 0) {
        const tierAllowed = difficulty.bossComboMode > 1 || this.combatTier >= 2;
        const comboEvery = difficulty.bossComboMode >= 3
          ? (this.combatTier >= 2 ? 2 : 3)
          : difficulty.bossComboMode === 2
            ? (this.combatTier >= 2 ? 2 : 3)
            : 3;
        if (tierAllowed && this.attackMode % comboEvery === 0) {
          const followUp = this.selectComboAttack(name);
          if (followUp) {
            this.comboAttackName = followUp;
            this.comboTimer = difficulty.bossComboMode >= 2 ? 0.28 : 0.42;
          }
        }
      }
    }

    prepareTelegraph(name, duration) {
      this.telegraphCue = BOSS_TELEGRAPH_CUES[name] || "radial";
      this.telegraphDuration = duration;
      this.telegraphTargetX = null;
      this.telegraphTargetY = null;

      if (name === "gravity") {
        const target = this.target();
        const simulationView = gameplaySimulationView();
        const visibleLeft = Math.max(this.arenaLeft + 190, simulationView.left + 170);
        const visibleRight = Math.min(this.arenaRight - 190, simulationView.right - 170);
        const leftX = visibleLeft < visibleRight ? visibleLeft : this.arenaLeft + 260;
        const rightX = visibleLeft < visibleRight ? visibleRight : this.arenaRight - 260;
        const towardBoss = target ? (Math.sign(this.cx - target.cx) || -this.facing) : -this.facing;
        const separation = target ? clamp(Math.abs(this.cx - target.cx) * 0.52, 320, 430) : 360;
        let chosen = target ? target.cx + towardBoss * separation : this.cx - this.facing * 360;
        const bossClearance = this.w * 0.5 + 150;
        if (Math.abs(chosen - this.cx) < bossClearance) chosen = this.cx - towardBoss * bossClearance;
        chosen = clamp(chosen, leftX, rightX);

        const safeAnchor = value => {
          for (let distance = 0; distance <= 280; distance += 24) {
            for (const candidate of distance ? [value - distance, value + distance] : [value]) {
              const centeredX = clamp(candidate, leftX, rightX);
              if (hasSafeRespawnGround(centeredX - 23, 46)) return centeredX;
            }
          }
          return clamp(value, leftX, rightX);
        };

        this.telegraphTargetX = safeAnchor(chosen);
        this.telegraphTargetY = terrainSurfaceY(this.telegraphTargetX) - 135;
      }
    }

    clearTelegraph() {
      this.telegraphCue = "";
      this.telegraphTargetX = null;
      this.telegraphTargetY = null;
      this.telegraphDuration = 0;
    }

    horizontalBurst() {
      const laneY = terrainLaneY((this.arenaLeft + this.arenaRight) * 0.5, this.attackMode % 2 !== 0);
      const count = Math.max(2, 2 + Math.floor(campaignLevel * 0.45) + this.combatTier + bossPatternBonus());
      const direction = this.faceTarget();
      const originX = direction < 0 ? this.x + 10 : this.x + this.w - 10;
      const speed = 275 + campaignLevel * 20;
      for (let i = 0; i < count; i++) {
        enemyBullets.push(new EnemyBullet(originX + direction * i * 42, laneY, direction * speed, 0, (13 + campaignLevel) * enemyDamageScale(), 12, this.profile.accent));
      }
      audio.boss();
    }

    verticalRain() {
      const count = Math.max(3, 3 + Math.floor(campaignLevel * 0.55) + this.combatTier + bossPatternBonus());
      const width = this.arenaRight - this.arenaLeft - 180;
      const shift = this.attackMode % 2 ? 70 : 0;
      for (let i = 0; i < count; i++) {
        const x = this.arenaLeft + 100 + shift + width * (i + 0.5) / count;
        enemyBullets.push(new EnemyBullet(x, gameplaySimulationView().top - 70, 0, 250 + campaignLevel * 22, (11 + campaignLevel) * enemyDamageScale(), 11, this.profile.accent));
      }
      audio.boss();
    }

    overheadDrop() {
      const count = Math.max(3, 3 + Math.ceil(campaignLevel * 0.45) + this.combatTier + bossPatternBonus());
      const width = this.arenaRight - this.arenaLeft - 220;
      const shift = this.attackMode % 2 ? 85 : 0;
      for (let i = 0; i < count; i++) {
        const x = this.arenaLeft + 110 + shift + width * (i + 0.5) / count;
        debris.push(new FallingDebris(x, gameplaySimulationView().top - 110, 34 + campaignLevel * 4, true));
      }
      audio.boss();
    }

    crossFire() {
      this.verticalRain();
      const target = this.target();
      if (!target) return;
      const laneY = terrainLaneY(target.cx, target.crouching);
      enemyBullets.push(new EnemyBullet(this.cx, laneY, -340, 0, 14 * enemyDamageScale(), 12, this.profile.accent));
      enemyBullets.push(new EnemyBullet(this.cx, laneY, 340, 0, 14 * enemyDamageScale(), 12, this.profile.accent));
    }

    laserSweep() {
      const y = terrainLaneY((this.arenaLeft + this.arenaRight) * 0.5, true) - 14;
      const direction = this.faceTarget();
      const beams = scaledEncounterCount(3, 4, 5, 6) + Math.floor(this.combatTier / 2);
      const startX = direction < 0 ? this.arenaRight - 40 : this.arenaLeft + 40;
      for (let i = 0; i < beams; i++) {
        enemyBullets.push(new EnemyBullet(startX - direction * i * 60, y, direction * (365 + this.combatTier * 20), 0, (15 + this.combatTier) * enemyDamageScale(), 15, this.profile.accent));
      }
      if (difficulty.bossComboMode >= 2 && this.combatTier >= 2) {
        const highY = terrainLaneY((this.arenaLeft + this.arenaRight) * 0.5, false);
        const highStartX = direction < 0 ? this.arenaRight + 130 : this.arenaLeft - 130;
        for (let i = 0; i < 5; i++) {
          enemyBullets.push(new EnemyBullet(highStartX - direction * i * 72, highY, direction * 455, 0, 17 * enemyDamageScale(), 13, this.profile.accent));
        }
      }
      audio.tone(95, 0.22, "sawtooth", 0.12, 180);
    }

    shockwave() {
      const groundY = terrainLaneY((this.arenaLeft + this.arenaRight) * 0.5, true) - 3;
      const count = Math.max(2, 2 + Math.floor(campaignLevel / 4) + this.combatTier + bossPatternBonus());
      for (let i = 0; i < count; i++) {
        const speed = 245 + i * 42 + campaignLevel * 10;
        enemyBullets.push(new EnemyBullet(this.cx - 40, groundY, -speed, 0, (14 + campaignLevel) * enemyDamageScale(), 15, this.profile.accent));
        enemyBullets.push(new EnemyBullet(this.cx + 40, groundY, speed, 0, (14 + campaignLevel) * enemyDamageScale(), 15, this.profile.accent));
      }
      burst(this.cx, terrainSurfaceY(this.cx) - 12, this.profile.accent, 18, 220);
      audio.tone(72, 0.28, "sawtooth", 0.14, 110);
    }

    energyRing() {
      const count = Math.max(8, 8 + Math.floor(campaignLevel / 3) + this.combatTier + bossPatternBonus());
      const gap = this.attackMode % count;
      for (let i = 0; i < count; i++) {
        if (i === gap || i === (gap + 1) % count) continue;
        const angle = i * Math.PI * 2 / count;
        const speed = 220 + campaignLevel * 12;
        enemyBullets.push(new EnemyBullet(this.cx, this.cy, Math.cos(angle) * speed, Math.sin(angle) * speed, (13 + campaignLevel) * enemyDamageScale(), 12, this.profile.accent));
      }
      audio.tone(460, 0.17, "square", 0.10, -210);
    }

    fanBurst() {
      const target = this.target();
      if (!target) return;
      const base = Math.atan2(target.cy - this.cy, target.cx - this.cx);
      const count = Math.max(5, 5 + Math.floor(campaignLevel / 4) + this.combatTier + bossPatternBonus());
      for (let i = 0; i < count; i++) {
        if (i === Math.floor(count / 2) && this.attackMode % 2 === 0) continue;
        const offset = (i - (count - 1) / 2) * 0.13;
        const speed = 270 + campaignLevel * 12;
        enemyBullets.push(new EnemyBullet(this.cx, this.cy, Math.cos(base + offset) * speed, Math.sin(base + offset) * speed, (12 + campaignLevel) * enemyDamageScale(), 11, this.profile.accent));
      }
      audio.tone(330, 0.16, "square", 0.11, -170);
    }

    summonMinions() {
      const sets = [
        ["runner", "gunner"], ["jet", "drone"], ["orb", "jet"],
        ["stalker", "bomber"], ["sentinel", "jet"], ["specter", "stalker"]
      ];
      const types = sets[campaignLevel] || sets[0];
      const living = enemies.filter(enemy => !enemy.dead && enemy.x > this.arenaLeft && enemy.x < this.arenaRight).length;
      const cap = difficulty.summonCap + (menuDifficulty >= 2 ? this.combatTier : 0);
      const available = Math.max(0, cap - living);
      if (available <= 0) { this.fanBurst(); return; }
      types.slice(0, available).forEach((type, index) => {
        const side = index % 2 ? 1 : -1;
        const x = clamp(this.cx + side * (250 + index * 90), this.arenaLeft + 180, this.arenaRight - 160);
        const y = ["jet", "drone", "orb", "bomber", "specter"].includes(type) ? terrainSurfaceY(x) - 300 - index * 35 : null;
        spawn(type, x, y);
        burst(x, y == null ? terrainSurfaceY(x) - 60 : y, this.profile.accent, 10, 150);
      });
      audio.tone(175, 0.25, "sawtooth", 0.12, 140);
    }

    missileSalvo() {
      const livingPlayers = players.filter(player => !player.dead);
      const count = Math.min(difficulty.missileCap, Math.max(1, (campaignLevel >= 3 ? 2 : 1) + this.combatTier + Math.max(0, bossPatternBonus())));
      const direction = this.faceTarget();
      const launchX = this.cx + direction * Math.min(70, this.w * 0.32);
      for (let i = 0; i < count; i++) {
        const target = livingPlayers[i % Math.max(1, livingPlayers.length)] || this.target();
        enemyBullets.push(new BossMissile(
          launchX,
          this.cy - 46 + i * 34,
          target,
          this.profile.accent,
          (13 + campaignLevel) * enemyDamageScale(),
          i * 0.22
        ));
      }
      audio.tone(124, 0.22, "sawtooth", 0.12, 180);
    }

    stompAdvance() {
      const target = this.target();
      const direction = target && target.cx < this.cx ? -1 : 1;
      this.faceTarget(target);
      this.baseY = terrainSurfaceY(this.cx) - this.h;
      this.y = this.baseY;
      const groundY = terrainSurfaceY(this.cx) - 8;
      blastEffects.push(new BlastEffect(this.cx, groundY, this.profile.accent, 2));
      for (const side of [-1, 1]) {
        enemyBullets.push(new EnemyBullet(this.cx, groundY - 10, side * (270 + this.combatTier * 45), 0, (15 + this.combatTier * 2) * enemyDamageScale(), 15, this.profile.accent));
      }
      for (const player of players) {
        const grounded = !player.dead && (player.onGround || player.y + player.h >= terrainSurfaceY(player.cx) - 16);
        if (grounded && Math.abs(player.cx - this.cx) < 175) player.hit((20 + this.combatTier * 3) * enemyDamageScale(), player.cx < this.cx ? -1 : 1);
      }
      burst(this.cx, groundY, this.profile.accent, 20, 240);
      audio.crash(1.25 + this.combatTier * 0.12);
    }

    railRush() {
      const baseY = terrainSurfaceY((this.arenaLeft + this.arenaRight) * 0.5);
      const direction = this.attackMode % 2 ? -1 : 1;
      const startX = direction > 0 ? this.arenaLeft - 320 : this.arenaRight + 60;
      const endX = direction > 0 ? this.arenaRight + 320 : this.arenaLeft - 320;
      hazards.push(new RailSweeper(startX, endX, baseY, direction, this.profile.accent, 0.18, 22 + this.combatTier * 2));
      if (difficulty.bossComboMode >= 2 && this.combatTier >= 2) {
        hazards.push(new RailSweeper(direction > 0 ? this.arenaRight + 60 : this.arenaLeft - 320, direction > 0 ? this.arenaLeft - 320 : this.arenaRight + 320, baseY, -direction, "#59ecff", 1.05, 23));
      }
      audio.tone(115, 0.34, "sawtooth", 0.13, 170);
    }

    rootSurge() {
      const target = this.target();
      const count = Math.max(4, 5 + this.combatTier + bossPatternBonus());
      const span = this.arenaRight - this.arenaLeft - 180;
      const safe = target ? clamp(Math.floor((target.cx - this.arenaLeft - 90) / Math.max(1, span) * count), 0, count - 1) : Math.floor(count / 2);
      for (let i = 0; i < count; i++) {
        if (i === safe) continue;
        const x = this.arenaLeft + 90 + span * (i + 0.5) / count;
        hazards.push(new ArenaEruption(x, "root", this.profile.accent, 0.30 + Math.abs(i - safe) * 0.09, 0.44, 70, 150 + this.combatTier * 12, 18 + this.combatTier * 2));
      }
      audio.tone(98, 0.36, "triangle", 0.12, 115);
    }

    gravityWell() {
      const centerX = Number.isFinite(this.telegraphTargetX)
        ? this.telegraphTargetX
        : clamp(this.cx - this.facing * 360, this.arenaLeft + 300, this.arenaRight - 300);
      const centerY = Number.isFinite(this.telegraphTargetY)
        ? this.telegraphTargetY
        : terrainSurfaceY(centerX) - 135;
      hazards.push(new GravitySeed(this.cx, this.cy, centerX, centerY, this.profile.accent, this.combatTier));
      audio.tone(72, 0.24, "sawtooth", 0.13, 260);
    }

    novaPulse() {
      const count = Math.max(9, 10 + this.combatTier + bossPatternBonus());
      const gap = (this.attackMode * 3) % count;
      for (let i = 0; i < count; i++) {
        if (Math.abs(i - gap) <= 1 || Math.abs(i - gap) >= count - 1) continue;
        const angle = i * Math.PI * 2 / count;
        const speed = 215 + (i % 2) * 55;
        enemyBullets.push(new EnemyBullet(this.cx, this.cy, Math.cos(angle) * speed, Math.sin(angle) * speed, (13 + campaignLevel) * enemyDamageScale(), 13, this.profile.accent));
      }
      blastEffects.push(new BlastEffect(this.cx, this.cy, this.profile.accent, 2));
      audio.tone(72, 0.36, "sawtooth", 0.15, 260);
    }

    hit(damage, owner) {
      if (this.introTimer > 0) return;
      if (this.phaseShield > 0) {
        burst(rand(this.x, this.x + this.w), rand(this.y, this.y + this.h), this.profile.accent, 2, 85);
        return;
      }
      const armored = bossArena && bossArena.boss === this && bossArena.state === "fight" && this.vulnerableTimer <= 0 && !specialAttack;
      const armorScale = [0.76, 0.64, 0.56, 0.50][menuDifficulty] ?? 0.64;
      const appliedDamage = armored ? damage * armorScale : damage;
      if (armored) this.armorPulse = 0.14;
      this.health -= appliedDamage;
      this.flashTimer = 0.065;
      burst(rand(this.x, this.x + this.w), rand(this.y, this.y + this.h), armored ? this.profile.accent : "#ffe081", armored ? 2 : 3, armored ? 95 : 145);
      if (appliedDamage >= 45) impactFeedback(0.022);

      if (this.health <= 0) {
        this.dead = true;
        this.health = 0;
        defeatedBosses.add(this.key);
        if (players[owner]) players[owner].addScore(this.score);
        enemyBullets = [];
        impactFeedback(0.10);
        bossDeaths.push(new BossDeathSequence(this));
        victoryScene = new BossVictoryScene(this);
        if (bossArena && bossArena.boss === this) bossArena.beginExit();
        activeBoss = null;

        if (this.profile.checkpoint) checkpointX = this.profile.checkpoint;
        if (this.profile.reward && !Number.isInteger(this.profile.levelEnd) && !this.profile.campaignFinal) {
          const rewardCenter = this.profile.checkpoint || clamp(this.cx, this.arenaLeft + 140, this.arenaRight - 140);
          const rewardOffset = (this.profile.reward.length - 1) * 46;
          this.profile.reward.forEach((type, index) => {
            spawnSurfacePickup(rewardCenter - rewardOffset + index * 92, type, 78, true);
          });
        }

      } else {
        audio.bossHit(appliedDamage);
      }
    }

    draw() {
      const warning = this.telegraphTimer > 0 && Math.floor(this.telegraphTimer * 10) % 2 === 0;
      ctx.save();
      ctx.translate(this.cx, this.cy);
      ctx.scale(this.visualFacingScale(), 1);
      if (this.flashTimer > 0) ctx.globalAlpha = 0.62;
      drawBossForm(this.profile, this.phase, warning);
      ctx.restore();
      drawBossTelegraph(this);
    }
  }


  class OmegaTank extends StageBoss {
    constructor(key, x) {
      super(key, x);
      this.homeX = clamp(x, this.arenaLeft + 260, this.arenaRight - this.w - 60);
      this.tankAction = null;
      this.bodyPitch = 0;
      this.dustTimer = 0;
      this.stabilizers = 0;
    }

    displayFacing() {
      if (this.tankAction && Number.isFinite(this.tankAction.direction)) {
        this.facing = this.tankAction.direction < 0 ? -1 : 1;
        return this.facing;
      }
      return super.displayFacing();
    }

    attackDefinition(name) {
      if (name === "ram") return [() => this.startRam(), 0.68];
      if (name === "mortar") return [() => this.launchSiegeMortars(), 0.76];
      if (name === "crush") return [() => this.startHydraulicCrush(), 0.70];
      return super.attackDefinition(name);
    }

    update(dt) {
      if (!this.tankAction) {
        super.update(dt);
        if (!this.dead) {
          this.y = terrainSurfaceY(this.cx) - this.h;
          this.bodyPitch *= Math.exp(-8 * dt);
          this.stabilizers *= Math.exp(-7 * dt);
        }
        return;
      }

      this.updateActionBase(dt);
      const action = this.tankAction;
      if (action.type === "ram") this.updateRam(action, dt);
      else if (action.type === "crush") this.updateCrush(action, dt);
      else if (action.type === "mortar") this.updateMortarRecovery(action, dt);
      this.y = terrainSurfaceY(this.cx) - this.h;
    }

    updateActionBase(dt) {
      this.updatePassiveState(dt, !this.tankAction || this.tankAction.type !== "ram");
    }

    startRam() {
      const direction = this.faceTarget();
      this.tankAction = {
        type: "ram",
        mode: "windup",
        direction,
        timer: 0.24,
        speed: 0,
        turnsRemaining: difficulty.bossComboMode >= 2 && this.combatTier >= 2 ? 1 : 0
      };
      this.arenaLock = "arena";
      this.dustTimer = 0;
      audio.tone(78, 0.34, "sawtooth", 0.15, 145);
    }

    updateRam(action, dt) {
      if (action.mode === "windup") {
        action.timer -= dt;
        this.bodyPitch += ((action.direction < 0 ? -0.055 : 0.055) - this.bodyPitch) * (1 - Math.exp(-10 * dt));
        if (action.timer <= 0) {
          action.mode = "charge";
          action.speed = 180;
        }
        return;
      }

      if (action.mode === "charge") {
        const maxSpeed = 510 + this.combatTier * 55;
        action.speed = Math.min(maxSpeed, action.speed + (760 + this.combatTier * 90) * dt);
        const leftEdge = this.arenaLeft + 54;
        const rightEdge = this.arenaRight - this.w - 54;
        const destination = action.direction < 0 ? leftEdge : rightEdge;
        const distance = destination - this.x;
        const step = clamp(distance, -action.speed * dt, action.speed * dt);
        this.x += step;
        this.bodyPitch += ((action.direction < 0 ? 0.035 : -0.035) - this.bodyPitch) * (1 - Math.exp(-9 * dt));
        this.dustTimer -= dt;
        if (this.dustTimer <= 0) {
          this.dustTimer = 0.055;
          const dustX = action.direction < 0 ? this.x + this.w - 24 : this.x + 24;
          burst(dustX, terrainSurfaceY(dustX) - 8, "#8f7962", 2, 80 + action.speed * 0.07);
        }
        this.damageWithPlow(action.direction, 18 + this.combatTier * 2);

        if (Math.abs(distance) <= 1.5) {
          this.x = destination;
          this.ramGroundImpact(action.direction);
          action.mode = "impact";
          action.timer = 0.34;
          action.speed = 0;
        }
        return;
      }

      if (action.mode === "impact") {
        action.timer -= dt;
        this.bodyPitch *= Math.exp(-10 * dt);
        if (action.timer > 0) return;
        if (action.turnsRemaining > 0) {
          action.turnsRemaining--;
          action.direction *= -1;
          action.mode = "windup";
          action.timer = 0.32;
          audio.tone(92, 0.22, "square", 0.12, 110);
        } else {
          action.mode = "return";
          action.speed = 0;
        }
        return;
      }

      const target = this.target();
      const targetClearance = target ? target.cx + 280 : this.homeX;
      const returnX = clamp(Math.max(this.homeX, targetClearance), this.arenaLeft + 260, this.arenaRight - this.w - 60);
      const distance = returnX - this.x;
      action.direction = distance < 0 ? -1 : 1;
      action.speed = Math.min(330, action.speed + 520 * dt);
      this.x += clamp(distance, -action.speed * dt, action.speed * dt);
      this.bodyPitch *= Math.exp(-8 * dt);
      if (Math.abs(distance) <= 1.5) {
        this.x = returnX;
        this.finishTankAction(1.15);
      }
    }

    damageWithPlow(direction, damage) {
      const plowLeft = direction < 0 ? this.x - 52 : this.x + this.w - 38;
      const plowRight = direction < 0 ? this.x + 55 : this.x + this.w + 52;
      const plowTop = this.y + this.h * 0.57;
      const plowBottom = this.y + this.h + 12;

      for (const player of players) {
        if (player.dead) continue;
        const overlaps = player.x < plowRight && player.x + player.w > plowLeft &&
          player.y < plowBottom && player.y + player.h > plowTop;
        if (!overlaps) continue;
        player.hit(damage * enemyDamageScale(), direction);
        player.knockbackX = direction * (310 + this.combatTier * 35);
        burst(player.cx, player.y + player.h * 0.72, this.profile.accent, 9, 210);
        audio.impact(1.45, "metal");
      }
    }

    ramGroundImpact(direction) {
      const impactX = direction < 0 ? this.x : this.x + this.w;
      const groundY = terrainSurfaceY(impactX) - 7;
      burst(impactX, groundY, this.profile.accent, 24, 285);
      blastEffects.push(new BlastEffect(impactX, groundY, this.profile.accent, 2));
      const waves = Math.max(1, 1 + this.combatTier + Math.max(0, bossPatternBonus()));
      for (let i = 0; i < waves; i++) {
        const speed = 285 + i * 65;
        enemyBullets.push(new EnemyBullet(impactX, groundY - 10, -speed, 0, (14 + this.combatTier * 2) * enemyDamageScale(), 14, this.profile.accent));
        enemyBullets.push(new EnemyBullet(impactX, groundY - 10, speed, 0, (14 + this.combatTier * 2) * enemyDamageScale(), 14, this.profile.accent));
      }
      audio.crash(1.35 + this.combatTier * 0.15);
      impactFeedback(0.07);
    }

    launchSiegeMortars() {
      const living = players.filter(player => !player.dead);
      const count = scaledEncounterCount(1, 2, 3, 4) + Math.floor(this.combatTier / 2);
      for (let i = 0; i < count; i++) {
        const target = living[i % Math.max(1, living.length)] || this.target();
        const prediction = target ? target.cx + target.vx * (0.45 + i * 0.04) : this.arenaLeft + 260;
        const spread = (i - (count - 1) / 2) * (78 - this.combatTier * 8);
        const targetX = clamp(prediction + spread, this.arenaLeft + 95, this.arenaRight - 95);
        const launchDirection = this.displayFacing();
        debris.push(new SiegeMortar(
          this.cx + launchDirection * 82,
          this.y + 42,
          targetX,
          this.profile.accent,
          i * 0.13,
          this.combatTier
        ));
      }
      this.tankAction = { type: "mortar", timer: 0.96 + this.combatTier * 0.08 };
      this.stabilizers = 1;
      audio.tone(122, 0.26, "sawtooth", 0.13, 195);
    }

    updateMortarRecovery(action, dt) {
      action.timer -= dt;
      this.stabilizers = Math.min(1, this.stabilizers + dt * 5);
      this.bodyPitch = Math.sin(this.phase * 22) * 0.018;
      if (action.timer <= 0) this.finishTankAction(0.95);
    }

    startHydraulicCrush() {
      this.tankAction = { type: "crush", mode: "rear", timer: 0.52 };
      this.arenaLock = true;
      audio.tone(88, 0.30, "sawtooth", 0.13, 90);
    }

    updateCrush(action, dt) {
      action.timer -= dt;
      if (action.mode === "rear") {
        this.bodyPitch += (0.16 - this.bodyPitch) * (1 - Math.exp(-8 * dt));
        this.stabilizers = Math.min(1, this.stabilizers + dt * 4);
        if (action.timer <= 0) {
          action.mode = "slam";
          action.timer = 0.18;
          this.bodyPitch = -0.09;
          this.executeHydraulicCrush();
        }
        return;
      }
      if (action.mode === "slam") {
        this.bodyPitch += (0 - this.bodyPitch) * (1 - Math.exp(-15 * dt));
        if (action.timer <= 0) {
          action.mode = "recover";
          action.timer = 0.52;
        }
        return;
      }
      this.bodyPitch *= Math.exp(-9 * dt);
      this.stabilizers *= Math.exp(-6 * dt);
      if (action.timer <= 0) this.finishTankAction(1.02);
    }

    executeHydraulicCrush() {
      const direction = this.displayFacing();
      const impactX = direction < 0 ? this.x - 38 : this.x + this.w + 38;
      const groundY = terrainSurfaceY(impactX) - 6;
      burst(impactX, groundY, this.profile.accent, 30, 310);
      blastEffects.push(new BlastEffect(impactX, groundY, this.profile.accent, 3));
      const waveCount = Math.max(1, 1 + this.combatTier + Math.max(0, bossPatternBonus()));
      for (let i = 0; i < waveCount; i++) {
        const speed = 250 + i * 58;
        enemyBullets.push(new EnemyBullet(impactX, groundY - 10, direction * speed, 0, (15 + this.combatTier * 2) * enemyDamageScale(), 15, this.profile.accent));
      }
      for (const player of players) {
        if (player.dead) continue;
        const grounded = player.onGround || player.y + player.h >= terrainSurfaceY(player.cx) - 18;
        if (grounded && Math.abs(player.cx - impactX) < 250) player.hit((22 + this.combatTier * 3) * enemyDamageScale(), direction);
      }
      const debrisCount = Math.max(1, 1 + Math.floor(this.combatTier / 2) + Math.max(0, bossPatternBonus()));
      for (let i = 0; i < debrisCount; i++) {
        const x = clamp(impactX - 110 + i * 110, this.arenaLeft + 60, this.arenaRight - 60);
        debris.push(new FallingDebris(x, gameplaySimulationView().top - 80 - i * 35, 30 + i * 4, true));
      }
      audio.crash(1.65);
      impactFeedback(0.09);
    }

    finishTankAction(nextAttackDelay) {
      this.tankAction = null;
      this.arenaLock = true;
      this.bodyPitch = 0;
      this.stabilizers = 0;
      this.attackTimer = Math.max(this.attackTimer, nextAttackDelay);
    }

    draw() {
      const warning = this.telegraphTimer > 0 && Math.floor(this.telegraphTimer * 10) % 2 === 0;
      ctx.save();
      ctx.translate(this.cx, this.cy);
      ctx.rotate(this.bodyPitch);
      ctx.scale(this.visualFacingScale(), 1);
      if (this.flashTimer > 0) ctx.globalAlpha = 0.62;
      drawBossForm(this.profile, this.phase, warning);
      ctx.globalAlpha = 1;

      bossPolygon([[-128,40],[-176,18],[-202,60],[-188,111],[-126,104]], "#202932", this.profile.accent, 5);
      ctx.fillStyle = "#10161d";
      ctx.fillRect(-190, 48, 48, 14);

      if (this.stabilizers > 0.04) {
        const extension = 42 * this.stabilizers;
        ctx.strokeStyle = this.profile.accent;
        ctx.lineWidth = 9;
        ctx.beginPath();
        ctx.moveTo(-82, 78); ctx.lineTo(-112, 104 + extension);
        ctx.moveTo(82, 78); ctx.lineTo(112, 104 + extension);
        ctx.stroke();
        ctx.fillStyle = "#182029";
        ctx.fillRect(-132, 100 + extension, 42, 10);
        ctx.fillRect(90, 100 + extension, 42, 10);
      }
      ctx.restore();
      drawBossTelegraph(this);
    }
  }

  class AegisGunshipBoss extends StageBoss {
    constructor(key, x) {
      super(key, x);
      this.arenaLock = "arena";
      this.flightAction = null;
      this.roll = 0;
      this.dropTimer = 0;
      this.contactTimer = 0;
    }

    flightFacingDirection() {
      const action = this.flightAction;
      if (!action) return null;
      if (action.mode === "reposition") return Math.sign(action.startX - action.fromX) || action.direction;
      if (action.mode === "return") return Math.sign(action.returnX - action.fromX) || -action.direction;
      return action.direction;
    }

    displayFacing() {
      const direction = this.flightFacingDirection();
      if (Number.isFinite(direction) && direction !== 0) {
        this.facing = direction < 0 ? -1 : 1;
        return this.facing;
      }
      return super.displayFacing();
    }

    attackDefinition(name) {
      if (name === "swoop") return [() => this.startSwoop(), 0.58];
      if (name === "bombRun") return [() => this.startBombRun(), 0.64];
      if (name === "deploy") return [() => this.deployWingmen(), 0.56];
      return super.attackDefinition(name);
    }

    update(dt) {
      if (this.flightAction) {
        this.updateFlightAction(dt);
        return;
      }
      super.update(dt);
      if (this.dead || this.introTimer > 0) return;
      const target = this.target();
      if (!target) return;
      const desiredX = clamp(target.cx + 470, this.arenaLeft + 220, this.arenaRight - this.w - 70);
      this.x += (desiredX - this.x) * (1 - Math.exp(-1.9 * dt));
      this.baseY = terrainSurfaceY(this.cx) - this.h - 205;
      this.roll *= Math.exp(-7 * dt);
    }

    startSwoop() {
      const target = this.target();
      const direction = target && target.cx > (this.arenaLeft + this.arenaRight) * 0.5 ? 1 : -1;
      const startX = direction < 0 ? this.arenaRight - this.w - 40 : this.arenaLeft + 40;
      const endX = direction < 0 ? this.arenaLeft + 50 : this.arenaRight - this.w - 50;
      const startY = Math.max(gameplaySimulationView().top + 120, terrainSurfaceY(startX + this.w / 2) - this.h - 320);
      this.flightAction = {
        type: "swoop", mode: "reposition", time: 0, duration: 1.72,
        transitionDuration: 0.42, direction, startX, startY, endX,
        fromX: this.x, fromY: this.y
      };
      this.contactTimer = 0;
      this.arenaLock = "arena";
      audio.tone(102, 0.32, "sawtooth", 0.14, 260);
    }

    startBombRun() {
      const direction = this.attackMode % 2 ? -1 : 1;
      const startX = direction > 0 ? this.arenaLeft - this.w - 80 : this.arenaRight + 80;
      const endX = direction > 0 ? this.arenaRight + 80 : this.arenaLeft - this.w - 80;
      const startY = Math.max(gameplaySimulationView().top + 115, terrainSurfaceY(startX + this.w / 2) - this.h - 275);
      this.flightAction = {
        type: "bombRun", mode: "reposition", time: 0, duration: 2.30,
        transitionDuration: 0.42, direction, startX, startY, endX,
        fromX: this.x, fromY: this.y
      };
      this.dropTimer = 0.08;
      this.arenaLock = "arena";
      audio.tone(148, 0.25, "square", 0.11, 170);
    }

    deployWingmen() {
      const advancedWing = difficulty.bossComboMode >= 2 && this.combatTier >= 2;
      const types = campaignLevel >= 4
        ? (advancedWing ? ["jet", "bomber", "jet"] : ["bomber", "jet"])
        : (advancedWing ? ["jet", "drone", "jet"] : ["drone", "jet"]);
      types.forEach((type, index) => {
        const x = clamp(this.cx - 80 + index * 105, this.arenaLeft + 120, this.arenaRight - 120);
        const y = clamp(this.cy - 55 - index * 26, 150, terrainSurfaceY(x) - 210);
        spawn(type, x, y);
        burst(x, y, this.profile.accent, 8, 135);
      });
      const target = this.target();
      if (target) hazards.push(new ArenaEruption(target.cx, "plasma", this.profile.accent, 0.62, 0.34, 72, 132, 18 + this.combatTier * 2));
      audio.tone(260, 0.16, "square", 0.10, 150);
    }

    updateFlightAction(dt) {
      this.updatePassiveState(dt, false);
      this.contactTimer = Math.max(0, this.contactTimer - dt);
      const action = this.flightAction;
      action.time += dt;

      if (action.mode === "reposition") {
        const p = smoothStep(action.time / action.transitionDuration);
        this.x = mix(action.fromX, action.startX, p);
        this.y = mix(action.fromY, action.startY, p) - Math.sin(Math.PI * p) * 34;
        this.roll = action.direction * 0.12 * Math.sin(Math.PI * p);
        if (p >= 1) {
          action.mode = "attack";
          action.time = 0;
          this.x = action.startX;
          this.y = action.startY;
          this.roll = 0;
        }
        return;
      }

      if (action.mode === "return") {
        const p = smoothStep(action.time / action.transitionDuration);
        this.x = mix(action.fromX, action.returnX, p);
        this.y = mix(action.fromY, action.returnY, p) - Math.sin(Math.PI * p) * 22;
        this.roll = -action.direction * 0.10 * Math.sin(Math.PI * p);
        if (p >= 1) {
          this.flightAction = null;
          this.roll = 0;
          this.baseY = action.returnY;
          this.x = action.returnX;
          this.y = action.returnY;
          this.attackTimer = Math.max(this.attackTimer, 0.88);
        }
        return;
      }

      const p = clamp(action.time / action.duration, 0, 1);
      const eased = smoothStep(p);
      this.x = mix(action.startX, action.endX, eased);

      if (action.type === "swoop") {
        const dive = Math.sin(Math.PI * p);
        const ground = terrainSurfaceY(this.cx) - this.h - 42;
        this.y = action.startY + (ground - action.startY) * dive;
        this.roll = action.direction * (0.18 - Math.abs(0.5 - p) * 0.22);
        if (this.contactTimer <= 0) {
          for (const player of players) {
            if (!player.dead && this.overlaps(player)) {
              player.hit((22 + this.combatTier * 3) * enemyDamageScale(), action.direction);
              player.knockbackX = action.direction * 280;
              this.contactTimer = 0.35;
              audio.impact(1.3, "metal");
            }
          }
        }
      } else {
        this.y = action.startY + Math.sin(p * Math.PI * 3) * 22;
        this.dropTimer -= dt;
        if (this.dropTimer <= 0 && p < 0.90) {
          this.dropTimer = Math.max(0.34, (0.48 - this.combatTier * 0.025) * enemyCadenceScale(true));
          const target = this.target();
          const leadX = target ? target.cx + target.vx * 0.42 : this.cx;
          const targetX = clamp(leadX + rand(-110, 110), this.arenaLeft + 80, this.arenaRight - 80);
          debris.push(new SiegeMortar(this.cx, this.cy + 24, targetX, this.profile.accent, 0, this.combatTier));
        }
      }

      if (p >= 1) {
        const target = this.target();
        const returnX = clamp(target ? target.cx + 470 : this.arenaRight - this.w - 80, this.arenaLeft + 220, this.arenaRight - this.w - 70);
        const returnY = terrainSurfaceY(returnX + this.w / 2) - this.h - 205;
        action.mode = "return";
        action.time = 0;
        action.transitionDuration = 0.48;
        action.fromX = this.x;
        action.fromY = this.y;
        action.returnX = returnX;
        action.returnY = returnY;
      }
    }

    draw() {
      ctx.save();
      ctx.translate(this.cx, this.cy);
      ctx.rotate(this.roll);
      ctx.scale(this.visualFacingScale(), 1);
      if (this.flashTimer > 0) ctx.globalAlpha = 0.62;
      drawBossForm(this.profile, this.phase, this.telegraphTimer > 0 && Math.floor(this.telegraphTimer * 10) % 2 === 0);
      ctx.restore();
      if (this.flightAction && (this.flightAction.mode === "reposition" || this.flightAction.mode === "return")) {
        const direction = this.flightFacingDirection() || this.facing;
        ctx.save();
        ctx.globalAlpha = 0.34;
        ctx.strokeStyle = this.profile.accent;
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(this.cx - direction * 20, this.cy);
        ctx.lineTo(this.cx - direction * 135, this.cy + 10);
        ctx.stroke();
        ctx.globalAlpha = 0.18;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(this.cx - direction * 12, this.cy - 24);
        ctx.lineTo(this.cx - direction * 105, this.cy - 14);
        ctx.stroke();
        ctx.restore();
      }
      if (!this.flightAction) drawBossTelegraph(this);
    }
  }

  class BioLeviathanBoss extends StageBoss {
    constructor(key, x) {
      super(key, x);
      this.arenaLock = "arena";
      this.beastAction = null;
      this.hidden = false;
      this.alpha = 1;
      this.contactTimer = 0;
    }

    attackDefinition(name) {
      if (name === "burrow") return [() => this.startBurrow(), 0.56];
      if (name === "rootWall") return [() => this.rootWall(), 0.62];
      if (name === "devour") return [() => this.startDevour(), 0.58];
      return super.attackDefinition(name);
    }

    update(dt) {
      if (this.beastAction) {
        this.updateBeastAction(dt);
        return;
      }
      super.update(dt);
      if (!this.dead) {
        this.y = terrainSurfaceY(this.cx) - this.h + Math.sin(this.phase * 1.2) * 5;
        this.alpha = 1;
      }
    }

    hit(damage, owner) {
      if (this.hidden) return;
      super.hit(damage, owner);
    }

    startBurrow() {
      const target = this.target();
      const targetX = clamp(target ? target.cx : (this.arenaLeft + this.arenaRight) * 0.5, this.arenaLeft + 150, this.arenaRight - 150);
      this.beastAction = { type: "burrow", mode: "sink", timer: 0.34, startX: this.x, targetX, erupted: false };
      this.arenaLock = "arena";
      audio.tone(72, 0.34, "sawtooth", 0.14, -24);
    }

    rootWall() {
      const target = this.target();
      const count = Math.max(4, 5 + this.combatTier + bossPatternBonus());
      const usable = this.arenaRight - this.arenaLeft - 220;
      let safe = 0;
      if (target) safe = clamp(Math.floor((target.cx - this.arenaLeft - 110) / Math.max(1, usable) * count), 0, count - 1);
      for (let i = 0; i < count; i++) {
        if (Math.abs(i - safe) <= 0) continue;
        const x = this.arenaLeft + 110 + usable * (i + 0.5) / count;
        hazards.push(new ArenaEruption(x, "root", this.profile.accent, 0.34 + i * 0.075, 0.48, 74, 170 + this.combatTier * 15, 19 + this.combatTier * 2));
      }
      audio.tone(96, 0.42, "triangle", 0.13, 120);
    }

    startDevour() {
      const target = this.target();
      const direction = target && target.cx < this.cx ? -1 : 1;
      this.beastAction = { type: "devour", mode: "charge", direction, speed: 210, timer: 0, turn: difficulty.bossComboMode >= 2 && this.combatTier >= 2 };
      this.contactTimer = 0;
      this.arenaLock = "arena";
      audio.tone(64, 0.38, "sawtooth", 0.15, 130);
    }

    updateBeastAction(dt) {
      this.updatePassiveState(dt, false);
      this.contactTimer = Math.max(0, this.contactTimer - dt);
      const action = this.beastAction;

      if (action.type === "burrow") {
        action.timer -= dt;
        if (action.mode === "sink") {
          this.alpha = clamp(action.timer / 0.34, 0, 1);
          this.y += 260 * dt;
          if (action.timer <= 0) {
            action.mode = "underground";
            action.timer = 0.78;
            this.hidden = true;
            this.alpha = 0;
          }
          return;
        }
        if (action.mode === "underground") {
          const travel = smoothStep(1 - action.timer / 0.78);
          this.x = mix(action.startX, action.targetX - this.w / 2, travel);
          if (Math.floor(action.timer * 18) % 3 === 0) {
            const ground = terrainSurfaceY(this.cx);
            burst(this.cx, ground - 5, "#597049", 1, 40);
          }
          if (action.timer <= 0.16 && !action.erupted) {
            action.erupted = true;
            action.mode = "emerge";
            action.timer = 0.36;
            this.hidden = false;
            this.y = terrainSurfaceY(this.cx) + 55;
            const groundY = terrainSurfaceY(this.cx) - 8;
            blastEffects.push(new BlastEffect(this.cx, groundY, this.profile.accent, 3));
            burst(this.cx, groundY, this.profile.accent, 30, 300);
            for (const player of players) {
              if (!player.dead && Math.abs(player.cx - this.cx) < 145 && player.y + player.h > groundY - 170) {
                player.hit((24 + this.combatTier * 3) * enemyDamageScale(), player.cx < this.cx ? -1 : 1);
              }
            }
            for (const direction of [-1, 1]) {
              enemyBullets.push(new EnemyBullet(this.cx, groundY - 12, direction * (300 + this.combatTier * 45), 0, (16 + this.combatTier * 2) * enemyDamageScale(), 15, this.profile.accent));
            }
            audio.crash(1.65);
          }
          return;
        }
        this.alpha = 1 - clamp(action.timer / 0.36, 0, 1);
        this.y += (terrainSurfaceY(this.cx) - this.h - this.y) * (1 - Math.exp(-14 * dt));
        if (action.timer <= 0) this.finishBeastAction(0.86);
        return;
      }

      if (action.type === "devour") {
        action.speed = Math.min(590 + this.combatTier * 65, action.speed + (930 + this.combatTier * 130) * dt);
        this.x += action.direction * action.speed * dt;
        this.y = terrainSurfaceY(this.cx) - this.h;
        if (this.contactTimer <= 0) {
          for (const player of players) {
            if (!player.dead && this.overlaps(player)) {
              player.hit((25 + this.combatTier * 3) * enemyDamageScale(), action.direction);
              player.knockbackX = action.direction * 320;
              this.contactTimer = 0.35;
              audio.impact(1.5, "metal");
            }
          }
        }
        const edge = action.direction < 0 ? this.arenaLeft + 45 : this.arenaRight - this.w - 45;
        const reached = action.direction < 0 ? this.x <= edge : this.x >= edge;
        if (reached) {
          this.x = edge;
          const groundY = terrainSurfaceY(this.cx) - 8;
          burst(this.cx, groundY, this.profile.accent, 24, 260);
          if (action.turn) {
            action.turn = false;
            action.direction *= -1;
            action.speed = 260;
            audio.tone(82, 0.22, "square", 0.11, 90);
          } else {
            this.finishBeastAction(0.92);
          }
        }
      }
    }

    finishBeastAction(delay) {
      this.beastAction = null;
      this.hidden = false;
      this.alpha = 1;
      this.y = terrainSurfaceY(this.cx) - this.h;
      this.attackTimer = Math.max(this.attackTimer, delay);
    }

    draw() {
      if (this.hidden) {
        const ground = terrainSurfaceY(this.cx);
        ctx.save();
        ctx.strokeStyle = this.profile.accent;
        ctx.lineWidth = 6;
        ctx.globalAlpha = 0.65 + Math.sin(time * 15) * 0.2;
        ctx.beginPath();
        ctx.ellipse(this.cx, ground - 4, 105, 22, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = "#fff36d";
        ctx.fillRect(this.cx - 20, ground - 18, 40, 7);
        ctx.restore();
        return;
      }
      ctx.save();
      ctx.globalAlpha = this.alpha;
      ctx.translate(this.cx, this.cy);
      ctx.scale(this.visualFacingScale(), 1);
      if (this.flashTimer > 0) ctx.globalAlpha *= 0.62;
      drawBossForm(this.profile, this.phase, this.telegraphTimer > 0 && Math.floor(this.telegraphTimer * 10) % 2 === 0);
      ctx.restore();
      if (!this.beastAction) drawBossTelegraph(this);
    }
  }

  class FrostTitanBoss extends StageBoss {
    constructor(key, x) {
      super(key, x);
      this.arenaLock = "arena";
      this.iceAction = null;
      this.contactTimer = 0;
      this.stepTimer = 0;
    }

    attackDefinition(name) {
      if (name === "iceCharge") return [() => this.startIceCharge(), 0.60];
      if (name === "iceField") return [() => this.iceField(), 0.64];
      if (name === "avalanche") return [() => this.avalanche(), 0.70];
      return super.attackDefinition(name);
    }
