    victoryScene = null;
    endingScene = null;
    specialAttack = null;
    debris = [];
    portalWarp = null;
    portalArrivalGrace = 0;
    chronoPulse = 0;
    chronoPulseClock = 0;
    triggered = new Set();
    resetCombatDirector();

    rebuildStageWorld(index);
    markScriptsBeforeLevel(index);

    let slot = 0;
    for (const player of players) {
      player.dead = false;
      player.respawnTimer = 0;
      player.lives = Math.max(1, player.lives);
      player.x = entryX + slot * 68;
      player.y = terrainSurfaceY(player.x) - player.standingHeight;
      player.h = player.standingHeight;
      player.vx = 0;
      player.vy = 0;
      player.onGround = true;
      player.jumpCount = 0;
      player.smashing = false;
      player.crouching = false;
      player.health = player.maxHealth;
      player.specials = Math.min(3, player.specials + 1);
      player.invuln = 3.0;
      player.entryTimer = 0;
      player.victoryPose = 0;
      slot++;
    }

    setOpeningCamera(entryX);
    audio.levelStinger(index);
    audio.startMusic(index);
    startStageIntro(index, "onfoot", entryX, false);
  }

  function prepareBossArena(boss) {
    if (!boss) return;
    resetCombatDirector();

    if (boss instanceof RivalHunter && !boss.finalEncounter) {
      boss.arenaLock = false;
      bossArena = null;
      audio.bossWarning(campaignLevel);
      return;
    }

    clearBossArena();
    bossArena = new BossArena(boss);
    stageEntryGrace = Math.max(stageEntryGrace, 1.05);
    const left = bossArena.left - 140;
    const right = bossArena.right + 140;

    for (const enemy of enemies) {
      if (enemy.dead || enemy.x + enemy.w < left || enemy.x > right) continue;
      explode(enemy.cx, enemy.cy, boss.profile.accent, 8, false, 0.45);
      enemy.dead = true;
    }
    for (const bullet of enemyBullets) {
      if (!bullet.dead) burst(bullet.cx, bullet.cy, boss.profile.accent, 2, 70);
      bullet.dead = true;
    }
    for (const hazard of hazards) {
      if (!hazard.dead && hazard.x + hazard.w >= left && hazard.x <= right) hazard.dead = true;
    }
    for (const piece of debris) {
      if (piece.dead || piece.x + piece.w < left || piece.x > right) continue;
      if (Number.isFinite(piece.cx) && Number.isFinite(piece.cy)) burst(piece.cx, piece.cy, boss.profile.accent, 3, 85);
      piece.dead = true;
    }
    audio.bossWarning(campaignLevel);
    bossArena.placeCombatants();
  }

  function startRival(stage, x, finalEncounter = false) {
    const key = finalEncounter ? "reignHunterFinal" : `reignHunter${stage}`;
    if (activeBoss || defeatedBosses.has(key)) return false;
    const gadget = RIVAL_GADGETS[clamp(stage | 0, 0, RIVAL_GADGETS.length - 1)];
    showBanner(finalEncounter ? "REIGN HUNTER • FINAL RIG" : `REIGN HUNTER • ${gadget.label}`, 1.6);
    activeBoss = new RivalHunter(stage, x, finalEncounter);
    prepareBossArena(activeBoss);
    return true;
  }

  function startBoss(key, x) {
    if (activeBoss || defeatedBosses.has(key)) return false;
    const profile = BOSS_PROFILES[key];
    showBanner(profile.name, 1.6);
    const bossFactories = {
      cityOmega: () => new OmegaTank(key, x),
      neonGunship: () => new AegisGunshipBoss(key, x),
      bioLeviathan: () => new BioLeviathanBoss(key, x),
      frostCarrier: () => new AegisGunshipBoss(key, x),
      frostTitan: () => new FrostTitanBoss(key, x),
      reignEmperor: () => new ReignEmperorBoss(key, x)
    };
    activeBoss = bossFactories[key] ? bossFactories[key]() : new StageBoss(key, x);
    prepareBossArena(activeBoss);
    return true;
  }

  function startBossFlyby(profileKey, direction = -1, bombs = 4) {
    const adjustedBombs = Math.max(2, bombs + scaledEncounterCount(-2, -1, 0, 1));
    setPieces.push(new BossFlyby(profileKey, direction, adjustedBombs));
    audio.tone(126, 0.25, "sawtooth", 0.11, 190);
    return true;
  }

  function startLeviathanStalk() {
    const lead = leadingPlayerX(true);
    const count = scaledEncounterCount(2, 3, 4, 5);
    for (let i = 0; i < count; i++) {
      hazards.push(new ArenaEruption(lead + 260 + i * 155, "root", BOSS_PROFILES.bioLeviathan.accent, 0.35 + i * 0.16, 0.42, 66, 140, 17));
    }
    audio.tone(66, 0.40, "sawtooth", 0.13, -20);
    return true;
  }

  function startEmperorEchoAmbush() {
    const lead = leadingPlayerX(true);
    const count = scaledEncounterCount(1, 2, 3, 4);
    for (let i = 0; i < count; i++) {
      const x = lead + 260 + i * 220;
      debris.push(new TimeEcho(x, terrainSurfaceY(x) - BOSS_PROFILES.reignEmperor.h * 0.56 - 40, BOSS_PROFILES.reignEmperor, i * 0.32, 13));
    }
    return true;
  }

  function runScripts() {
    const lead = Math.max(leadingPlayerX(true), introVehicle ? introVehicle.x : 0);

    for (let i = 0; i < scripts.length; i++) {
      if (lead >= scripts[i][0] && !triggered.has(i)) {
        const result = scripts[i][1]();
        if (result !== false) triggered.add(i);
      }
    }
  }

  function resolveEnemySpacing() {
    enemySpacingScratch.length = 0;
    const simulationView = gameplaySimulationView();
    const minX = simulationView.left - 180;
    const maxX = simulationView.right + 180;
    for (const enemy of enemies) {
      if (!enemy.dead && enemy.grounded && enemy.x + enemy.w >= minX && enemy.x <= maxX) {
        enemySpacingScratch.push(enemy);
      }
    }
    enemySpacingScratch.sort((a, b) => a.x - b.x);

    for (let i = 1; i < enemySpacingScratch.length; i++) {
      const left = enemySpacingScratch[i - 1];
      const right = enemySpacingScratch[i];
      if (left.y + left.h <= right.y + 8 || right.y + right.h <= left.y + 8) continue;

      const gap = right.x - (left.x + left.w);
      if (gap >= 10) continue;
      const correction = 10 - gap;

      if (left.type === "turret" && right.type !== "turret") {
        right.x += correction;
      } else if (right.type === "turret" && left.type !== "turret") {
        left.x -= correction;
      } else if (left.type !== "turret" || right.type !== "turret") {
        left.x -= correction * 0.5;
        right.x += correction * 0.5;
      }

      left.x = clamp(left.x, 0, LEVEL_W - left.w);
      right.x = clamp(right.x, 0, LEVEL_W - right.w);
      left.y = terrainSurfaceY(left.cx) - left.h;
      right.y = terrainSurfaceY(right.cx) - right.h;
    }
  }


  function portalDownForPlayer() {
    return touchStick.down || pressed("KeyS");
  }

  function updatePortalWarp(dt) {
    if (!portalWarp) return false;

    const warp = portalWarp;
    warp.phaseTime += dt;
    enemyBullets = [];

    if (warp.phase === "enter") {
      const hidden = Math.floor(warp.phaseTime / 0.055) % 2 === 0 ? 0 : 999;
      for (const traveler of warp.travelers) traveler.player.portalHidden = hidden;

      if (warp.phaseTime >= 0.22) {
        for (const traveler of warp.travelers) traveler.player.portalHidden = 999;
        warp.phase = "pan";
        warp.phaseTime = 0;
        audio.portal("travel");
      }
    } else if (warp.phase === "pan") {
      const raw = clamp(warp.phaseTime / 0.72, 0, 1);
      const eased = raw * raw * (3 - 2 * raw);
      cameraX = warp.startCameraX + (warp.endCameraX - warp.startCameraX) * eased;
      cameraY = warp.startCameraY + (warp.endCameraY - warp.startCameraY) * eased;
      cameraTargetX = cameraX;
      cameraTargetY = cameraY;

      if (raw >= 1) {
        for (const traveler of warp.travelers) {
          const member = traveler.player;
          member.x = traveler.exitX;
          member.y = traveler.exitY;
          member.vx = 0;
          member.vy = 0;
          member.onGround = true;
          member.jumpCount = 0;
          member.facing = warp.direction;
          member.aimX = warp.direction;
          member.aimY = 0;
        }
        warp.phase = "exit";
        warp.phaseTime = 0;
        burst(warp.destination.cx, warp.destination.cy, warp.color, 10, 115);
        audio.portal("exit");
      }
    } else {
      cameraX = warp.endCameraX;
      cameraY = warp.endCameraY;
      cameraTargetX = cameraX;
      cameraTargetY = cameraY;
      const hidden = Math.floor(warp.phaseTime / 0.065) % 2 === 0 ? 999 : 0;
      for (const traveler of warp.travelers) traveler.player.portalHidden = hidden;

      if (warp.phaseTime >= 0.30) {
        for (const traveler of warp.travelers) {
          const member = traveler.player;
          member.portalHidden = 0;
          member.portalTransit = false;
          member.entryTimer = Math.max(member.entryTimer, 0.28);
          member.invuln = Math.max(member.invuln, 1.25);
          member.portalCooldown = 0.85;
        }
        portalArrivalGrace = 0.80;
        enemyBullets = [];
        portalWarp = null;
      }
    }

    return true;
  }

  function updatePortals(dt) {
    for (const portal of portals) portal.update(dt);
    if (portalWarp) return;

    for (const player of players) {
      player.portalCooldown = Math.max(0, player.portalCooldown - dt);
      if (player.dead || player.portalTransit) {
        player.portalContact = false;
        player.portalDownHeld = false;
        continue;
      }

      const down = portalDownForPlayer(player);
      const touching = portals.find(portal => portal.canActivate(player));
      const pressedNow = down && !player.portalDownHeld;
      const enteredWhileHeld = down && Boolean(touching) && !player.portalContact;

      if (touching && player.portalCooldown <= 0 && (pressedNow || enteredWhileHeld)) {
        if (touching.transport(player)) break;
      }

      player.portalContact = portals.some(portal => portal.canActivate(player));
      player.portalDownHeld = down;
    }
  }

  function updateLevelMechanics(dt) {
    for (const pad of launchPads) pad.update(dt);
    updatePortals(dt);

    if (campaignLevel === 5 && levelState === "onfoot" && !specialAttack) {
      chronoPulseClock += dt;
      if (chronoPulseClock >= 7.5) {
        chronoPulseClock = 0;
        chronoPulse = 1.35;
        audio.tone(92, 0.34, "sawtooth", 0.10, 260);
      }
      chronoPulse = Math.max(0, chronoPulse - dt);
    } else {
      chronoPulse = Math.max(0, chronoPulse - dt * 2);
      if (campaignLevel !== 5) chronoPulseClock = 0;
    }
  }

  function update(dt) {
    time += dt;
    updateNetwork(dt);

    if (endingScene) {
      endingScene.update(dt);
      return;
    }

    updateWorldView(dt);

    if (levelTransition) {
      updateLevelTransition(dt);
      updateHud();
      return;
    }

    if (stageIntro) {
      updateStageIntro(dt);
      for (const particle of particles) particle.update(dt);
      for (const text of floatingTexts) text.update(dt);
      pruneDead(particles);
      pruneDead(floatingTexts);
      updateCamera(dt);
      updateHud();
      return;
    }

    if (portalWarp) {
      updatePortalWarp(dt);
      for (const particle of particles) particle.update(dt);
      for (const text of floatingTexts) text.update(dt);
      pruneDead(particles);
      pruneDead(floatingTexts);
      updateHud();
      return;
    }

    portalArrivalGrace = Math.max(0, portalArrivalGrace - dt);
    stageEntryGrace = Math.max(0, stageEntryGrace - dt);

    if (levelState === "vehicle" && introVehicle) {
      introVehicle.x += introVehicle.speed * dt;
    }

    if (levelState === "crash") {
      crashTimer -= dt;
      if (crashTimer <= 0) completeCrash();
    }

    const cinematic = Boolean(victoryScene);
    if (!cinematic) runScripts();
    if (stageIntro) {
      updateCamera(dt);
      updateHud();
      return;
    }

    if (bossArena) bossArena.update(dt);
    for (const platform of platforms) {
      if (!platform.arenaSuppressed) platform.update(dt);
    }
    if (!cinematic) updateLevelMechanics(dt);
    if (portalWarp) {
      updatePortalWarp(0);
      updateHud();
      return;
    }
    for (const player of players) player.update(dt);
    if (!cinematic && specialAttack) {
      specialAttack.update(dt);
      if (specialAttack.dead) specialAttack = null;
    }
    if (!cinematic) {
      for (const bullet of bullets) bullet.update(dt);
      for (const pickup of pickups) pickup.update(dt);
      for (const setPiece of setPieces) setPiece.update(dt);

      if (portalArrivalGrace <= 0 && stageEntryGrace <= 0) {
        for (const enemy of enemies) enemy.update(dt);
        resolveEnemySpacing();
        if (activeBoss && !activeBoss.dead) activeBoss.update(dt);
        if (enemyBullets.length > difficulty.projectileCap) {
          const target = frontAlivePlayer();
          if (target) {
            enemyBullets.sort((a, b) => {
              const ad = Math.hypot(a.cx - target.cx, a.cy - target.cy);
              const bd = Math.hypot(b.cx - target.cx, b.cy - target.cy);
              return ad - bd;
            });
          }
          enemyBullets.length = difficulty.projectileCap;
        }
        for (const bullet of enemyBullets) bullet.update(dt);
      } else {
        enemyBullets = [];
      }
    }
    if (victoryScene) {
      victoryScene.update(dt);
      if (victoryScene.dead) victoryScene = null;
    }
    for (const particle of particles) particle.update(dt);
    for (const blast of blastEffects) blast.update(dt);
    for (const death of bossDeaths) death.update(dt);
    for (const text of floatingTexts) text.update(dt);
    for (const piece of debris) piece.update(dt);
    for (const hazard of hazards) hazard.update(dt);

    pruneDead(enemies);
    pruneDead(bullets);
    pruneDead(enemyBullets);
    pruneDead(pickups);
    pruneDead(particles);
    pruneDead(blastEffects);
    pruneDead(bossDeaths);
    pruneDead(setPieces);
    pruneDead(floatingTexts);
    pruneDead(debris);
    pruneDead(hazards);

    if (players.every(player => player.dead && player.lives <= 0)) {
      finish(false);
      return;
    }

    updateCamera(dt);
    updateHud();
  }

  function updateCamera(dt) {
    const bounds = cameraWorldBounds(visibleWorldW);
    let desiredX;

    if (stageIntro && stageIntro.sequence) {
      desiredX = stageIntro.targetX - visibleWorldW * (portrait ? 0.42 : 0.36);
    } else if (victoryScene) {
      desiredX = victoryScene.x + victoryScene.w * 0.5 - visibleWorldW * 0.5;
    } else if (levelState === "vehicle" && introVehicle) {
      desiredX = introVehicle.x - visibleWorldW * 0.28;
    } else if (levelState === "crash") {
      desiredX = cameraHoldX ?? cameraX;
    } else {
      const focusPlayer = cameraFocusPlayer();
      desiredX = focusPlayer ? focusPlayer.cx - visibleWorldW * 0.34 : cameraX;
    }

    cameraTargetX = clamp(desiredX, bounds.min, bounds.max);
    const horizontalResponse = levelState === "crash" ? 5.0
      : levelState === "vehicle" ? 6.5
      : 7.5;
    const horizontalBlend = 1 - Math.exp(-horizontalResponse * dt);
    const requestedStep = (cameraTargetX - cameraX) * horizontalBlend;
    const maxCameraSpeed = levelState === "vehicle" ? 240 : 360;
    cameraX += clamp(requestedStep, -maxCameraSpeed * dt, maxCameraSpeed * dt);
    if (Math.abs(cameraTargetX - cameraX) < 0.02) cameraX = cameraTargetX;
    cameraX = clamp(cameraX, bounds.min, bounds.max);

    const leadPlayer = cameraFocusPlayer();
    const introFocus = stageIntro && stageIntro.sequence ? stageIntro.targetX : null;
    const terrainFocusX = introFocus ?? (leadPlayer ? leadPlayer.cx : cameraX + visibleWorldW * 0.36);
    const terrainY = terrainSurfaceY(terrainFocusX);
    let desiredY = terrainY - visibleWorldH * cameraGroundAnchor();

    if (leadPlayer && introFocus == null) {
      const topRatio = portrait ? 0.38 : 0.35;
      const bottomRatio = portrait ? 0.72 : 0.70;
      const topSafeLine = cameraY + visibleWorldH * topRatio;
      const bottomSafeLine = cameraY + visibleWorldH * bottomRatio;
      const playerTop = leadPlayer.y;
      const playerBottom = leadPlayer.y + leadPlayer.h;

      if (playerTop < topSafeLine) {
        desiredY = Math.min(desiredY, playerTop - visibleWorldH * topRatio);
      } else if (!leadPlayer.onGround && leadPlayer.vy > 80 && playerBottom > bottomSafeLine) {
        desiredY = Math.max(desiredY, playerBottom - visibleWorldH * bottomRatio);
      } else if (!leadPlayer.onGround) {
        desiredY = Math.min(desiredY, cameraY);
      }
    }

    if (victoryScene) desiredY = victoryScene.y + victoryScene.h * 0.62 - visibleWorldH * 0.55;
    cameraTargetY = clampCameraY(desiredY);

    const movingUp = cameraTargetY < cameraY;
    const verticalResponse = movingUp ? 8.5 : leadPlayer && !leadPlayer.onGround ? 4.2 : 3.2;
    const verticalBlend = 1 - Math.exp(-verticalResponse * dt);
    const verticalStep = (cameraTargetY - cameraY) * verticalBlend;
    const verticalSpeed = movingUp ? 460 : leadPlayer && !leadPlayer.onGround ? 260 : 180;
    cameraY += clamp(verticalStep, -verticalSpeed * dt, verticalSpeed * dt);
    if (Math.abs(cameraTargetY - cameraY) < 0.02) cameraY = cameraTargetY;
    cameraY = clampCameraY(cameraY);
  }

  function updateHud() {
    const lead = Math.max(cameraX, leadingPlayerX(false));
    const zone = WORLD_ZONES[campaignLevel];
    hudState.progress = clamp((lead - zone.start) / Math.max(1, zone.end - zone.start), 0, 1);

    let phase = zone.short;
    if (levelState === "stage_intro") phase = "READY";
    else if (levelState === "vehicle") phase = "ARMORED BREACH";
    else if (levelState === "crash") phase = "BAIL OUT";
    else if (victoryScene) phase = victoryScene.final ? "MISSION COMPLETE" : "VICTORY SEQUENCE";
    else if (activeBoss) phase = activeBoss.name;
    else if (campaignLevel === 0 && lead >= 9872.5) phase = "HIGHWAY COLLAPSE";
    else if (campaignLevel === 0 && lead >= 8800) phase = "INDUSTRIAL DISTRICT";
    else if (campaignLevel === 0 && lead >= 2818.75) phase = "RUINED STREETS";
    else if (campaignLevel === 1 && lead >= 23437.5) phase = "RAIL DECK";
    else if (campaignLevel === 1 && lead >= 20215.91) phase = "FORTRESS INTERIOR";
    else if (campaignLevel === 1 && lead >= 15061.36) phase = "NEON ASCENT";
    else if (campaignLevel === 2 && lead >= 36037.5) phase = "FINAL APPROACH";
    else if (campaignLevel === 2 && lead >= 32672.73) phase = "REACTOR SPINE";
    else if (campaignLevel === 2 && lead >= 27518.18) phase = "ZERO-G CONDUIT";
    else if (campaignLevel === 3 && lead >= 48780.68) phase = "FORGE HEART";
    else if (campaignLevel === 3 && lead >= 45415.91) phase = "LEVIATHAN NEST";
    else if (campaignLevel === 3 && lead >= 39831.82) phase = "ACID ROOT BASIN";
    else if (campaignLevel === 4 && lead >= 61452.27) phase = "TITAN TERMINAL";
    else if (campaignLevel === 4 && lead >= 58087.5) phase = "ABSOLUTE ZERO LINE";
    else if (campaignLevel === 4 && lead >= 52575) phase = "MAGLEV RIDGE";
    else if (campaignLevel === 5 && lead >= 74462.5) phase = "EMPEROR'S GATE";
    else if (campaignLevel === 5 && lead >= 70887.5) phase = "CITADEL CLOCKWORK";
    else if (campaignLevel === 5 && lead >= 65250) phase = "TIMEFALL CHASM";
    const mechanic = campaignLevel === 2 ? " • LOW-G" : campaignLevel === 3 ? " • BIO-PODS" : campaignLevel === 4 ? " • MAGLEV" : campaignLevel === 5 ? (chronoPulse > 0 ? " • TIME SLOWED" : " • TIME GATES") : "";
    hudState.phase = `L${campaignLevel + 1} • ${phase}${mechanic}`;
  }

  function weaponName(weapon) {
    if (weapon === 1) return "SPREAD";
    if (weapon === 2) return "RAPID";
    if (weapon === 3) return "ROCKET";
    return "RIFLE";
  }

  function finish(win) {
    if (gameOver) return;
    onlineMenuOpen = false;
    endingScene = null;
    const player = localPlayer() || players[0];
    const score = players.reduce((sum, entry) => sum + entry.score, 0);
    if (onlineSession()) {
      if (isNetworkAuthority()) sendServer({ t: "result", win: Boolean(win), score });
      menuResult = `${win ? "MISSION COMPLETE" : "MISSION FAILED"} • TEAM SCORE ${score.toLocaleString("en-US")}`;
      returnToOnlineLobby(false);
      return;
    }
    running = false;
    paused = false;
    gameOver = true;
    clearControls();
    audio.stopMusic();
    if (!win) audio.missionFailed();

    if (win) {
      continueSnapshot = null;
      menuResult = `MISSION COMPLETE • SCORE ${score.toLocaleString("en-US")}`;
      menuScreen = "main";
      menuFocus = 0;
    } else {
      continueSnapshot = {
        level: campaignLevel,
        checkpointX,
        score,
        specials: player ? player.specials : 1,
        character: player ? player.characterIndex : menuCharacter,
        difficultyIndex: menuDifficulty
      };
      menuResult = "";
      menuScreen = "continue";
      continueFocus = 0;
    }

    levelState = "menu";
    canvas.style.cursor = "default";
    updateLevelSelectionPreview();
    resize();
  }

  function continueMission() {
    if (!continueSnapshot) return;
    audio.ui("confirm");
    const snapshot = { ...continueSnapshot };
    menuLevel = snapshot.level;
    menuDifficulty = snapshot.difficultyIndex;
    menuCharacter = snapshot.character;
    gameOver = false;
    begin(snapshot);
  }

  function abandonContinue() {
    audio.ui("back");
    continueSnapshot = null;
    gameOver = false;
    menuResult = "";
    menuScreen = "main";
    menuFocus = 0;
    updateLevelSelectionPreview();
    resize();
  }

  function restartCurrentLevel() {
    if (!running) return;
    if (onlineSession()) {
      if (isRoomOwner()) {
        onlineMenuOpen = false;
        clearControls();
        sendServer({ t: "restart" });
      }
      else showBanner("ONLY THE ROOM OWNER CAN RESTART", 1.6);
      return;
    }
    audio.ui("confirm");
    const restartLevel = campaignLevel;
    menuLevel = restartLevel;
    paused = false;
    audio.setMusicPaused(false);
    begin();
  }

  function returnToMenu() {
    if (!running) return;
    onlineMenuOpen = false;
    if (onlineSession()) {
      if (isRoomOwner()) returnToOnlineLobby(true);
      else leaveOnlineSession(true);
      return;
    }
    audio.ui("back");
    menuLevel = campaignLevel;
    running = false;
    paused = false;
    gameOver = false;
    stageIntro = null;
    levelTransition = null;
    portalWarp = null;
    specialAttack = null;
    clearControls();
    audio.stopMusic();
    menuResult = "";
    continueSnapshot = null;
    levelState = "menu";
    menuScreen = "main";
    menuFocus = 0;
    canvas.style.cursor = "default";
    updateLevelSelectionPreview();
    resize();
  }

  function togglePause() {
    if (!running || endingScene) return;
    if (onlineSession()) {
      onlineMenuOpen = !onlineMenuOpen;
      clearControls();
      if (onlineMenuOpen) publishNeutralNetworkInput();
      audio.ui(onlineMenuOpen ? "pause" : "confirm");
      canvas.style.cursor = !touchUi && !onlineMenuOpen ? "none" : "default";
      if (onlineMenuOpen) {
        bannerText = "";
        bannerUntil = 0;
      }
      return;
    }
    paused = !paused;
    if (paused) clearControls();
    audio.ui(paused ? "pause" : "confirm");
    audio.setMusicPaused(paused);
    canvas.style.cursor = !touchUi && !paused ? "none" : "default";
    if (paused) {
      bannerText = "";
      bannerUntil = 0;
    }
  }

  function showBanner(text, duration = 1.4) {

  function zoneIndexAt(x) {
    for (let i = WORLD_ZONES.length - 1; i >= 0; i--) {

    }
    return 0;
  }

  function drawBackground() {
    const zone = clamp(campaignLevel | 0, 0, WORLD_ZONES.length - 1);
    const top = cameraY - 170;
    const bottom = cameraY + visibleWorldH + 200;
    const skyX = cameraX - 300;
    const skyW = visibleWorldW + 600;

    const mutedSky = [
      ["#090d15", "#111b27", "#1a2934", "#29343a", "#403a36"],
      ["#0d0c18", "#171728", "#20283a", "#293943", "#36444b"],
      ["#080a12", "#111522", "#1b2030", "#252b3a", "#303441"],
      ["#0b120e", "#152019", "#223126", "#314134", "#3d4b3e"],
      ["#0b1318", "#16242d", "#263943", "#3a5058", "#51646a"],
      ["#100d17", "#1d1827", "#2d2637", "#40354a", "#504356"]
    ][zone];
    const skyStops = zone === 0 ? [top, 105, 255, 420, 590]
      : zone === 1 ? [top, 120, 290, 455, GROUND_Y]
      : zone === 2 ? [top, 150, 340, 530, GROUND_Y]
      : zone === 3 ? [top, 120, 295, 465, GROUND_Y]
      : zone === 4 ? [top, 115, 295, 465, GROUND_Y]
      : [top, 120, 300, 475, GROUND_Y];

      const y = skyStops[i];

      ctx.fillStyle = mutedSky[i];
      ctx.fillRect(skyX, y, skyW, Math.max(0, nextY - y));
    }

    ctx.save();
    ctx.globalAlpha = 0.68;

    for (const star of stars) {
      if (star.x < cameraX - 100 || star.x > cameraX + visibleWorldW + 100) continue;
      ctx.globalAlpha = star.a * (zone === 0 ? 0.65 : zone === 3 ? 0.55 : 1);
      ctx.fillStyle = zone === 2 ? "#d8fff0" : zone === 3 ? "#dfff9a" : zone === 4 ? "#e9fdff" : zone === 5 ? "#ffd9fb" : "#dcecff";
      const size = Math.max(3, Math.round(star.r * 2));
      ctx.fillRect(Math.round(star.x), Math.round(star.y), size, size);
    }
    ctx.globalAlpha = 1;

    drawZoneAtmosphere(zone, top, bottom);

    if (zone === 0) {
      for (const cloud of clouds) {
        if (cloud.x + cloud.w < cameraX - 200 || cloud.x > cameraX + visibleWorldW + 200) continue;
        ctx.fillStyle = "rgba(174,198,210,.12)";
        const unit = Math.max(12, Math.round(cloud.w / 10));
        ctx.fillRect(cloud.x, cloud.y, unit * 5, unit);
        ctx.fillRect(cloud.x + unit, cloud.y - unit, unit * 3, unit);
        ctx.fillRect(cloud.x + unit * 4, cloud.y + unit, unit * 3, unit);

    } else if (zone === 1) {
      drawNeonFortress();
    } else if (zone === 2) {
      drawOrbitalCore();
    } else if (zone === 3) {
      drawBioforge();
    } else if (zone === 4) {
      drawFrozenMaglev();
    } else {
      drawChronoCitadel();

    ctx.restore();

    // A soft atmospheric veil keeps animated scenery behind enemies, bullets,
    // hazards, and traversal geometry.
    ctx.fillStyle = "rgba(5,8,12,.18)";
    ctx.fillRect(skyX, top, skyW, Math.max(0, GROUND_Y - top));

    drawTerrain(bottom);

    ctx.save();
    ctx.globalAlpha = 0.72;
    for (const decoration of decorations) {
      if (decoration.x > cameraX - 200 && decoration.x < cameraX + visibleWorldW + 200) drawDecoration(decoration);
    }
    ctx.restore();
    for (const platform of platforms) {
      if (!platform.dead && !platform.arenaSuppressed && platform.x + platform.w > cameraX - 100 && platform.x < cameraX + visibleWorldW + 100) drawPlatform(platform);
    }
  }

  function drawZoneAtmosphere(zone, top, bottom) {
    const left = cameraX - 180;

        ctx.lineTo(x + 12, y - 9);
        ctx.lineTo(x + 18, y - 2);
        ctx.lineTo(x - 2, y);

        ctx.lineTo(x + 12, y + 9);

    } else if (zone === 2) {

      for (let i = 0; i < 26; i++) {

        const y = 50 + (i * 83 % 500);
        ctx.fillStyle = i % 3 ? "#d8fff0" : "#69ffb0"; ctx.fillRect(x, y, 20 + i % 4 * 8, 3);
      }
      const sx = cameraX + visibleWorldW * 0.20;

      ctx.save(); ctx.translate(sx, sy); ctx.rotate(time * 0.14);
      ctx.strokeStyle = "#586a9d"; ctx.lineWidth = 12; ctx.beginPath(); ctx.arc(0,0,125,0,Math.PI*2); ctx.stroke();
      ctx.strokeStyle = "#69ffb0"; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(0,0,92,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle = "#1c2445"; ctx.fillRect(-28,-155,56,310); ctx.fillRect(-155,-28,310,56);
      ctx.restore();
    } else if (zone === 3) {
      // Giant vines, drifting spores, pods and distant creature eyes.
      for (let i = 0; i < 24; i++) {
        const x = left + ((i * 157 + Math.sin(time * .7 + i) * 70) % (visibleWorldW + 360));
        const y = 90 + (i * 61 % 500) + Math.sin(time * 1.4 + i) * 18;

        ctx.fillStyle = "#b7ff61"; ctx.fillRect(x + 21, 235 + i * 13, 12, 8);

    } else if (zone === 4) {

      for (let i = 0; i < 5; i++) {

        ctx.strokeStyle = i % 2 ? "#b589ff" : "#7cfff2"; ctx.lineWidth = 22;
        ctx.beginPath(); ctx.moveTo(left, 100 + i * 42); ctx.quadraticCurveTo(cameraX + visibleWorldW * .45, 35 + i * 65 + Math.sin(time*.4+i)*35, right, 130 + i * 36); ctx.stroke();
      }

        const y = 40 + ((i * 73 + time * 55) % 590);

      }

      ctx.fillStyle = "#17334a"; ctx.fillRect(trainX, 480, 520, 58);
      ctx.fillStyle = "#8ff7ff"; ctx.fillRect(trainX + 25, 492, 440, 10);

    } else {
      // Rotating clockwork, broken floating masonry and time streams.
      for (let i = 0; i < 7; i++) {

        const y = 140 + (i % 3) * 145;

  function drawMountains(parallax, base, color, height) {
    ctx.fillStyle = color;
    const start = Math.floor((cameraX * parallax - 320) / 160) * 160;
    ctx.beginPath();
    ctx.moveTo(cameraX - 200, WORLD_H);
    for (let q = start; q < cameraX + visibleWorldW + 500; q += 160) {
      const x = q + (cameraX - cameraX * parallax);
      ctx.lineTo(x, base);
      ctx.lineTo(x + 80, base - height * (0.65 + (Math.abs(q / 160) % 3) * 0.1));
      ctx.lineTo(x + 160, base);

    ctx.lineTo(cameraX + visibleWorldW + 300, WORLD_H);
    ctx.closePath(); ctx.fill();
  }

    const start = Math.floor((cameraX * 0.45 - 250) / 210) * 210;
    for (let q = start; q < cameraX * 0.45 + visibleWorldW + 500; q += 210) {

      const height = 130 + (index * 71 % 210);

      ctx.fillRect(x, GROUND_Y - height, 150, height);

  }

  function drawDecoration(decoration) {
    ctx.save();
    ctx.translate(decoration.x, terrainSurfaceY(decoration.x));
    ctx.scale(decoration.scale, decoration.scale);

    if (decoration.type === "building") {
      const { w, h, style, seed } = decoration;
      const palettes = {
        city: ["#242a30", "#35404a", "#9a8461", "#171c21"],
        neon: ["#1d2030", "#34394d", "#668a9b", "#745c82"],
        core: ["#1c1d29", "#35394a", "#668f83", "#665f80"],

      ctx.fillStyle = palette[1];
      ctx.fillRect(-w / 2 + 18, -h + 22, w - 36, 16);

      const cols = Math.max(3, Math.floor((w - 46) / 46));
      const rows = Math.max(4, Math.floor((h - 70) / 54));
      const gapX = (w - 42) / cols;
      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const code = (row * 11 + col * 17 + seed * 7) % 13;
          const wx = -w / 2 + 24 + col * gapX;
          const wy = -h + 54 + row * 52;
          ctx.fillStyle = code < 3 ? "#080b10" : code < 6 ? palette[3] : palette[2];
          ctx.globalAlpha = code < 6 ? 0.75 : 0.48 + Math.sin(time * 2 + code) * 0.10;

            ctx.globalAlpha = 1;
            ctx.strokeStyle = palette[2];
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(wx, wy + 25);
            ctx.lineTo(wx + Math.max(20, gapX - 15), wy);
            ctx.stroke();
          }

      ctx.globalAlpha = 1;

      // Fire escapes and service ledges visually explain the climbable platform routes.
      ctx.strokeStyle = palette[2];
      ctx.lineWidth = 5;
      const side = (seed & 1) ? 1 : -1;

      ctx.beginPath();

      ctx.fillStyle = palette[2];
      ctx.fillRect(-w / 2 + 12, -h - 18, w - 24, 12);
    } else if (decoration.type === "car") {
      ctx.fillStyle = "#5d282d"; roundRect(-55, -34, 110, 34, 8); ctx.fill();
      ctx.fillStyle = "#232a31"; ctx.fillRect(-30, -57, 57, 25);
      ctx.fillStyle = "#0d1117"; ctx.beginPath(); ctx.arc(-35, 0, 14, 0, Math.PI * 2); ctx.arc(35, 0, 14, 0, Math.PI * 2); ctx.fill();
    } else if (decoration.type === "rubble") {
      ctx.fillStyle = "#6e6963"; ctx.beginPath(); ctx.moveTo(-55, 0); ctx.lineTo(-30, -30); ctx.lineTo(-5, -12); ctx.lineTo(25, -40); ctx.lineTo(58, 0); ctx.fill();
    } else if (decoration.type === "fire") {
      ctx.fillStyle = "#3c3e39"; ctx.fillRect(-22, -22, 44, 22);
      const flicker = Math.floor(time * 10 + decoration.x) % 3;
      ctx.fillStyle = "#d9342b"; ctx.fillRect(-18, -58 - flicker * 4, 36, 38 + flicker * 4);
      ctx.fillStyle = "#ff8a2b"; ctx.fillRect(-11, -77 + flicker * 3, 22, 43);
      ctx.fillStyle = "#ffe05a"; ctx.fillRect(-5, -63 - flicker * 2, 10, 28);
    } else if (decoration.type === "cargo") {
      ctx.fillStyle = "#303858"; ctx.fillRect(-50, -42, 100, 42);
      ctx.strokeStyle = "#59ecff"; ctx.lineWidth = 4; ctx.strokeRect(-45, -37, 90, 32);
    } else if (decoration.type === "antenna") {
      ctx.fillStyle = "#20243d"; ctx.fillRect(-18, -85, 36, 85);
      ctx.fillStyle = "#ff5ed7"; ctx.fillRect(-5, -115, 10, 32);
      ctx.fillRect(-34, -92, 68, 8);
    } else if (decoration.type === "turbine") {
      ctx.fillStyle = "#252b48"; ctx.fillRect(-36, -36, 72, 36);
      ctx.strokeStyle = "#59ecff"; ctx.lineWidth = 8; ctx.beginPath(); ctx.arc(0, -40, 30, 0, Math.PI * 2); ctx.stroke();
    } else if (decoration.type === "crystal") {
      ctx.fillStyle = "#69ffb0"; ctx.beginPath(); ctx.moveTo(0, -92); ctx.lineTo(34, 0); ctx.lineTo(-34, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#d8fff0"; ctx.fillRect(-5, -70, 10, 48);
    } else if (decoration.type === "reactor") {
      ctx.fillStyle = "#28213d"; ctx.fillRect(-42, -78, 84, 78);
      ctx.fillStyle = "#8b5cff"; ctx.fillRect(-26, -62, 52, 48);
      ctx.fillStyle = "#f0c8ff"; ctx.fillRect(-8, -52, 16, 30);
    } else if (decoration.type === "bioPod") {
      ctx.fillStyle = "#1f3d27"; ctx.fillRect(-38, -66, 76, 66);
      ctx.fillStyle = "#8dff5d"; ctx.fillRect(-24, -52, 48, 38);
      ctx.fillStyle = "#e3ffb8"; ctx.fillRect(-7, -45, 14, 24);
    } else if (decoration.type === "vine") {
      ctx.strokeStyle = "#4f853f"; ctx.lineWidth = 14;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-12, -45); ctx.lineTo(14, -82); ctx.lineTo(-4, -126); ctx.stroke();
      ctx.fillStyle = "#8dff5d"; ctx.fillRect(-42, -76, 34, 14); ctx.fillRect(12, -108, 38, 14);
    } else if (decoration.type === "bone") {
      ctx.fillStyle = "#b9c590"; ctx.fillRect(-52, -20, 104, 20);
      ctx.fillRect(-48, -42, 18, 34); ctx.fillRect(30, -42, 18, 34);
    } else if (decoration.type === "iceShard") {
      ctx.fillStyle = "#b8f5ff"; ctx.beginPath(); ctx.moveTo(0, -108); ctx.lineTo(38, 0); ctx.lineTo(-38, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#ffffff"; ctx.fillRect(-5, -82, 10, 58);
    } else if (decoration.type === "maglev") {
      ctx.fillStyle = "#284a60"; ctx.fillRect(-62, -35, 124, 35);
      ctx.fillStyle = "#8ff7ff"; ctx.fillRect(-48, -25, 96, 8);
      ctx.fillStyle = "#132a3a"; ctx.fillRect(-36, -53, 72, 18);
    } else if (decoration.type === "beacon") {
      ctx.fillStyle = "#254759"; ctx.fillRect(-18, -92, 36, 92);
      ctx.fillStyle = "#ff8df4"; ctx.fillRect(-6, -120, 12, 30);
      ctx.fillStyle = "#b8f5ff"; ctx.fillRect(-32, -78, 64, 8);
    } else if (decoration.type === "gear") {
      ctx.save(); ctx.translate(0, -40); ctx.rotate(time * 0.35 + decoration.x);
      ctx.strokeStyle = "#ff8df4"; ctx.lineWidth = 12; ctx.strokeRect(-38, -38, 76, 76);
      ctx.strokeStyle = "#ffd75e"; ctx.lineWidth = 6; ctx.strokeRect(-20, -20, 40, 40); ctx.restore();
    } else if (decoration.type === "obelisk") {
      ctx.fillStyle = "#33204b"; ctx.fillRect(-34, -112, 68, 112);
      ctx.fillStyle = "#ff8df4"; ctx.fillRect(-9, -96, 18, 72);
      ctx.fillStyle = "#ffd75e"; ctx.fillRect(-22, -124, 44, 16);
    } else if (decoration.type === "timeRune") {
      ctx.save();
      ctx.translate(0, -55);
      ctx.rotate(Math.sin(time * 0.7 + decoration.x) * 0.08);
      ctx.fillStyle = "#241535";
      ctx.strokeStyle = "#ff8df4";
      ctx.lineWidth = 7;
      ctx.fillRect(-42, -42, 84, 84);
      ctx.strokeRect(-42, -42, 84, 84);
      ctx.strokeStyle = "#ffd75e";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(-25, 0); ctx.lineTo(0, -25); ctx.lineTo(25, 0); ctx.lineTo(0, 25); ctx.closePath();
      ctx.stroke();
      ctx.restore();
    } else {
      ctx.fillStyle = "#252038"; ctx.fillRect(-60, -24, 120, 24);
      ctx.fillStyle = "#69ffb0"; ctx.fillRect(-50, -16, 100, 6);
    }
    ctx.restore();
  }

  function drawPlatform(platform) {
    if (platform.arenaOwned) {
      const warning = platform.cycleState === "warning";
      const accent = warning ? "#ffd34d" : (platform.accent || "#63e5ff");
      const jitter = warning ? Math.sin(time * 42 + platform.x) * 2.2 : 0;
      ctx.save();
      ctx.translate(jitter, 0);
      ctx.globalAlpha = platform.visualAlpha ?? 1;
      ctx.fillStyle = warning ? "#29220e" : "#111824";
      ctx.fillRect(platform.x, platform.y, platform.w, platform.h);
      ctx.strokeStyle = accent;
      ctx.lineWidth = warning ? 6 : 4;
      ctx.strokeRect(platform.x, platform.y, platform.w, platform.h);
      ctx.fillStyle = accent;
      ctx.fillRect(platform.x + 8, platform.y + 6, platform.w - 16, 5);
      if (warning) {
        ctx.globalAlpha *= 0.78;
        for (let x = platform.x + 10; x < platform.x + platform.w - 12; x += 26) {
          ctx.beginPath();
          ctx.moveTo(x, platform.y + 2);
          ctx.lineTo(x + 12, platform.y + 17);
          ctx.stroke();
        }
      }
      ctx.globalAlpha *= 0.36;
      for (let x = platform.x + 20; x < platform.x + platform.w - 8; x += 34) {
        ctx.fillRect(x, platform.y + platform.h, 7, 42);
      }
      ctx.restore();
      return;
    }
    // Match platforms to the active stage so structures at a boundary do not
    // switch palettes before the stage transition has completed.
    const zone = clamp(campaignLevel | 0, 0, WORLD_ZONES.length - 1);
    const safeColors = ["#7e93a6", "#59ecff", "#69ffb0", "#8dff5d", "#b8f5ff", "#ff8df4"];
    const bodyColors = ["#465465", "#263b5d", "#2b4148", "#34472f", "#315569", "#49305d"];
    const safe = safeColors[zone];
    const body = bodyColors[zone];
    const caution = platform.collapsible ? "#ffd34d" : safe;

    ctx.fillStyle = platform.triggered ? "#6a5446" : body;
    ctx.fillRect(platform.x, platform.y, platform.w, platform.h);
    ctx.strokeStyle = caution;
    ctx.lineWidth = 4;
    ctx.strokeRect(platform.x, platform.y, platform.w, platform.h);

    if (platform.collapsible) {
      for (let x = platform.x + 4; x < platform.x + platform.w - 6; x += 24) {
        ctx.fillStyle = ((x - platform.x) / 24) % 2 < 1 ? "#ffd34d" : "#392d0a";
        ctx.fillRect(x, platform.y + 6, 15, 6);
      }
    } else {
      ctx.fillStyle = safe;
      ctx.fillRect(platform.x + 8, platform.y + 7, platform.w - 16, 5);
    }

    ctx.strokeStyle = zone === 0 ? "#303844" : "#25253d";
    ctx.lineWidth = 5;
    for (let x = platform.x + 20; x < platform.x + platform.w; x += 40) {
      ctx.beginPath();
      ctx.moveTo(x, platform.y + platform.h);
      ctx.lineTo(x - 12, platform.y + 55);
      ctx.stroke();
    }

    if (platform.motion && !platform.triggered) {
      ctx.fillStyle = safe;
      ctx.font = `900 16px ${UI_FONT}`;
      ctx.textAlign = "center";
      const arrow = platform.motion.axis === "x" ? "↔" : "↕";
      ctx.fillText(arrow, platform.x + platform.w / 2, platform.y - 9);
    }

    if (platform.triggered) {
      drawUiIcon("down", platform.x + platform.w / 2, platform.y - 12, 16, "#fff36d", 2.3);
    }
  }

  function drawStageEntrySequence() {
    if (!stageIntro || !stageIntro.sequence) return;
    const sequence = stageIntro.sequence;
    const x = stageIntro.vehicleX;
    const y = stageIntro.vehicleY;
    const elapsed = stageIntro.duration - stageIntro.timer;

    ctx.save();
    if (sequence === "dropship") {
      ctx.translate(x, y);
      ctx.fillStyle = "#1b2435";
      bossPolygon([[-160,10],[-105,-45],[70,-50],[155,-5],[115,35],[-125,38]], "#1b2435");
      ctx.fillStyle = "#344965";
      ctx.fillRect(-88, -28, 132, 48);
      ctx.fillStyle = "#59ecff";
      ctx.fillRect(-68, -18, 76, 8);
      ctx.fillStyle = "#ff5ed7";
      ctx.fillRect(118, 0, 30, 9);
      ctx.globalAlpha = 0.45;
      ctx.fillStyle = "#59ecff";
      ctx.fillRect(-120, 38, 54, 34 + Math.sin(elapsed * 18) * 6);
      ctx.fillRect(55, 34, 54, 38 + Math.cos(elapsed * 17) * 6);
    } else if (sequence === "pod") {
      ctx.translate(x, y);
      ctx.fillStyle = "#263744";
      bossPolygon([[-44,-72],[44,-72],[62,-20],[46,52],[-46,52],[-62,-20]], "#263744");
      ctx.fillStyle = "#69ffb0";
      ctx.fillRect(-28, -45, 56, 11);
      ctx.fillStyle = "#0c151a";
      ctx.fillRect(-31, -20, 62, 54);
      ctx.strokeStyle = "#9fffd0";
      ctx.lineWidth = 5;
      ctx.strokeRect(-32, -21, 64, 56);
      if (elapsed > 2.05) {
        const open = smoothStep(clamp((elapsed - 2.05) / 0.55, 0, 1));
        ctx.fillStyle = "#182127";
        ctx.fillRect(-31 - open * 42, -20, 31, 54);
        ctx.fillRect(open * 42, -20, 31, 54);
      }
    } else if (sequence === "skimmer") {
      ctx.translate(x, y);
      ctx.fillStyle = "#2d4531";
      bossPolygon([[-120,8],[-78,-28],[78,-24],[128,5],[82,34],[-92,36]], "#2d4531");
      ctx.fillStyle = "#9cff58";
      ctx.fillRect(-58, -17, 96, 9);
      ctx.fillStyle = "#17241b";
      ctx.fillRect(-18, -48, 54, 28);
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = "#b9ff4d";
      ctx.fillRect(-92, 37, 58, 11 + Math.sin(elapsed * 20) * 4);
      ctx.fillRect(40, 36, 62, 12 + Math.cos(elapsed * 19) * 4);
    } else if (sequence === "maglev") {
      ctx.translate(x, y);
      ctx.fillStyle = "#263f52";
      roundRect(-205, -36, 410, 90, 18);
      ctx.fill();
      ctx.fillStyle = "#8ff7ff";
      ctx.fillRect(-178, -22, 330, 8);
      ctx.fillStyle = "#0d1c27";
      for (let wx = -158; wx <= 112; wx += 68) ctx.fillRect(wx, -7, 48, 31);
      ctx.fillStyle = "#182a35";
      ctx.fillRect(135, -8, 46, 52);
      if (elapsed > 1.82 && elapsed < 3.28) {
        const open = smoothStep(clamp((elapsed - 1.82) / 0.38, 0, 1)) * clamp((3.28 - elapsed) / 0.35, 0, 1);
        ctx.fillStyle = "#061018";
        ctx.fillRect(135 - open * 34, -8, 46 + open * 68, 52);
      }
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = "#8ff7ff";
      ctx.fillRect(-190, 58, 360, 9);
    } else if (sequence === "rift") {
      const pulse = stageIntro.effect || 0;
      ctx.translate(x + 23, y);
      ctx.globalAlpha = 0.2 + pulse * 0.8;
      ctx.strokeStyle = "#ff8df4";
      ctx.lineWidth = 10 + pulse * 8;
      ctx.beginPath();
      ctx.ellipse(0, 0, 34 + pulse * 42, 88 + pulse * 65, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = "#6fa4ff";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.ellipse(0, 0, 20 + pulse * 25, 70 + pulse * 42, 0, 0, Math.PI * 2);
      ctx.stroke();
      for (let i = 0; i < 8; i++) {
        const angle = elapsed * 2.4 + i * Math.PI / 4;
        const radius = 58 + pulse * 46;
        ctx.fillStyle = i % 2 ? "#ff8df4" : "#6fa4ff";
        ctx.fillRect(Math.cos(angle) * radius - 3, Math.sin(angle) * radius - 3, 6, 6);
      }
    }
    ctx.restore();
  }

  function drawVehicle() {
    if (!introVehicle) return;

    ctx.save();
    ctx.translate(introVehicle.x, introVehicle.y);
    ctx.fillStyle = "#42515d";
    roundRect(0, 10, 190, 62, 14);
    ctx.fill();
    ctx.fillStyle = "#222b34";
    ctx.fillRect(52, -12, 82, 34);
    ctx.fillStyle = "#0b1016";
    ctx.beginPath();
    ctx.arc(42, 72, 24, 0, Math.PI * 2);
    ctx.arc(150, 72, 24, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ffbd48";
    ctx.fillRect(180, 25, 12, 12);
    ctx.restore();
  }

  function uiRectContains(rect, x, y) {
    return rect && x >= rect.x && x <= rect.x + rect.w && y >= rect.y && y <= rect.y + rect.h;
  }

  function uiScaleFactor() {
    const shortestSide = Math.min(screenW, screenH);
    const reference = portrait ? screenW / 430 : shortestSide / 430;
    return clamp(reference, portrait ? 0.80 : 0.78, portrait ? 1.12 : 1.16);
  }

  function drawPixelPanel(x, y, w, h, fill = UI_THEME.panel, edge = UI_THEME.border, shadow = true) {
    const scale = uiScaleFactor();
    const radius = clamp(Math.min(w, h) * 0.16, 6 * scale, 12 * scale);
    if (shadow) {
      ctx.fillStyle = UI_THEME.shadow;
      roundRect(x + 3 * scale, y + 4 * scale, w, h, radius);
      ctx.fill();
    }
    ctx.fillStyle = fill;
    roundRect(x, y, w, h, radius);
    ctx.fill();

    ctx.strokeStyle = edge;
    ctx.lineWidth = 1.7 * scale;
    roundRect(x + ctx.lineWidth / 2, y + ctx.lineWidth / 2, w - ctx.lineWidth, h - ctx.lineWidth, radius);
    ctx.stroke();

    if (h >= 24) {
      ctx.strokeStyle = "rgba(255,255,255,.08)";
      ctx.lineWidth = Math.max(1, scale);
      ctx.beginPath();
      ctx.moveTo(x + radius, y + 3.5 * scale);
      ctx.lineTo(x + w - radius, y + 3.5 * scale);
      ctx.stroke();
    }
  }

  function fitCanvasText(text, maxWidth, startSize, minimum = 8) {
    const key = `${text}|${Math.round(maxWidth)}|${startSize}|${minimum}`;
    const cached = fittedTextCache.get(key);
    if (cached != null) return cached;

    let size = startSize;
    while (size > minimum) {
      ctx.font = `900 ${size}px ${UI_FONT}`;
      if (ctx.measureText(text).width <= maxWidth) break;
      size--;
    }
    fittedTextCache.set(key, size);
    return size;
  }


  function drawMenuBackdrop() {
    const palettes = [
      ["#07101d", "#ff5c48", "#263b50"],
      ["#080726", "#4ce8ff", "#ff5ed7"],
      ["#030b17", "#69ffb0", "#6b60ff"],
      ["#07150d", "#8dff5d", "#7b3f52"],
      ["#071323", "#d6fbff", "#3c7eb0"],
      ["#10071d", "#ff8df4", "#ffd75e"]
    ];
    const [bg, accent, secondary] = palettes[menuLevel];
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, screenW, screenH);
    const horizon = screenH * 0.58;
    ctx.fillStyle = secondary;
    for (let i = 0; i < 18; i++) {
      const w = 12 + (i * 17 % 42);
      const h = 16 + (i * 31 % Math.max(24, screenH * 0.24));
      const x = (i * 67 + time * (5 + menuLevel)) % (screenW + 80) - 40;
      ctx.globalAlpha = 0.18 + (i % 3) * 0.06;
      ctx.fillRect(x, horizon - h, w, h);
    }
    ctx.globalAlpha = 1;
    ctx.strokeStyle = accent;
    ctx.lineWidth = 2;
    for (let y = horizon; y < screenH; y += 12) {
      const spread = (y - horizon) * 0.55;
      ctx.beginPath();
      ctx.moveTo(screenW / 2 - spread, y);
      ctx.lineTo(screenW / 2 + spread, y);
      ctx.stroke();
    }
    for (let i = -7; i <= 7; i++) {
      ctx.beginPath();
      ctx.moveTo(screenW / 2, horizon);
      ctx.lineTo(screenW / 2 + i * screenW * 0.11, screenH);
      ctx.stroke();
    }
  }

  function drawMenuArrow(rect, direction, active = false) {
    drawPixelPanel(
      rect.x, rect.y, rect.w, rect.h,
      active ? UI_THEME.panelActive : UI_THEME.panelSolid,
      active ? UI_THEME.blueBright : UI_THEME.border,
      false
    );
    ctx.fillStyle = active ? UI_THEME.blueBright : UI_THEME.blue;
    ctx.beginPath();
    const cx = rect.x + rect.w / 2;
    const cy = rect.y + rect.h / 2;
    const s = Math.min(rect.w, rect.h) * 0.22;
    if (direction < 0) {
      ctx.moveTo(cx + s, cy - s); ctx.lineTo(cx - s, cy); ctx.lineTo(cx + s, cy + s);
    } else {
      ctx.moveTo(cx - s, cy - s); ctx.lineTo(cx + s, cy); ctx.lineTo(cx - s, cy + s);
    }
    ctx.closePath();
    ctx.fill();
  }

  function drawUiIcon(type, cx, cy, size, color = "#ffffff", lineWidth = 2) {
    const s = Math.max(4, size);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = Math.max(1.4, lineWidth);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    if (type === "back") {
      ctx.beginPath();
      ctx.moveTo(s * 0.22, -s * 0.36);
      ctx.lineTo(-s * 0.30, 0);
      ctx.lineTo(s * 0.22, s * 0.36);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-s * 0.25, 0);
      ctx.lineTo(s * 0.42, 0);
      ctx.stroke();
      ctx.restore();
      return;
    }

    if (type === "play") {
      ctx.beginPath();
      ctx.moveTo(-s * 0.28, -s * 0.42);
      ctx.lineTo(s * 0.46, 0);
      ctx.lineTo(-s * 0.28, s * 0.42);
      ctx.closePath();
      ctx.fill();
    } else if (type === "person") {
      ctx.beginPath();
      ctx.arc(-s * 0.18, -s * 0.18, s * 0.19, 0, Math.PI * 2);
      ctx.arc(s * 0.24, -s * 0.12, s * 0.15, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(-s * 0.18, s * 0.30, s * 0.34, Math.PI, Math.PI * 2);
      ctx.arc(s * 0.24, s * 0.30, s * 0.27, Math.PI, Math.PI * 2);
      ctx.stroke();
    } else if (type === "pause") {
      ctx.fillRect(-s * 0.32, -s * 0.42, s * 0.20, s * 0.84);
      ctx.fillRect(s * 0.12, -s * 0.42, s * 0.20, s * 0.84);
    } else if (type === "restart") {
      ctx.beginPath();
      ctx.arc(0, 0, s * 0.34, -Math.PI * 0.28, Math.PI * 1.45);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-s * 0.43, -s * 0.05);
      ctx.lineTo(-s * 0.47, -s * 0.43);
      ctx.lineTo(-s * 0.10, -s * 0.33);
      ctx.closePath();
      ctx.fill();
    } else if (type === "menu") {
      for (let row = -1; row <= 1; row++) {
        ctx.fillRect(-s * 0.42, row * s * 0.28 - s * 0.055, s * 0.84, s * 0.11);
      }
    } else if (type === "music") {
      ctx.beginPath();
      ctx.moveTo(-s * 0.05, -s * 0.38);
      ctx.lineTo(s * 0.34, -s * 0.49);
      ctx.lineTo(s * 0.34, s * 0.20);
      ctx.moveTo(-s * 0.05, -s * 0.31);
      ctx.lineTo(-s * 0.05, s * 0.30);
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(-s * 0.20, s * 0.32, s * 0.20, s * 0.14, -0.18, 0, Math.PI * 2);
      ctx.ellipse(s * 0.20, s * 0.20, s * 0.20, s * 0.14, -0.18, 0, Math.PI * 2);
      ctx.fill();
    } else if (type === "fullscreen") {
      const a = s * 0.42;
      const b = s * 0.12;
      ctx.beginPath();
      ctx.moveTo(-b, -a); ctx.lineTo(-a, -a); ctx.lineTo(-a, -b);
      ctx.moveTo(b, -a); ctx.lineTo(a, -a); ctx.lineTo(a, -b);
      ctx.moveTo(-a, b); ctx.lineTo(-a, a); ctx.lineTo(-b, a);
      ctx.moveTo(a, b); ctx.lineTo(a, a); ctx.lineTo(b, a);
      ctx.stroke();
    } else if (type === "heart") {
      ctx.beginPath();
      ctx.moveTo(0, s * 0.42);
      ctx.bezierCurveTo(-s * 0.52, s * 0.08, -s * 0.48, -s * 0.38, -s * 0.20, -s * 0.38);
      ctx.bezierCurveTo(-s * 0.04, -s * 0.38, 0, -s * 0.24, 0, -s * 0.18);
      ctx.bezierCurveTo(0, -s * 0.24, s * 0.04, -s * 0.38, s * 0.20, -s * 0.38);
      ctx.bezierCurveTo(s * 0.48, -s * 0.38, s * 0.52, s * 0.08, 0, s * 0.42);
      ctx.fill();
    } else if (type === "life") {
      ctx.beginPath();
      ctx.arc(0, -s * 0.18, s * 0.22, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(0, s * 0.38, s * 0.36, Math.PI, Math.PI * 2);
      ctx.stroke();
    } else if (type === "special") {
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const radius = i % 2 ? s * 0.20 : s * 0.46;
        const angle = -Math.PI / 2 + i * Math.PI / 5;
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
    } else if (type === "shield") {
      ctx.beginPath();
      ctx.moveTo(0, -s * 0.48);
      ctx.lineTo(s * 0.38, -s * 0.30);
      ctx.lineTo(s * 0.30, s * 0.22);
      ctx.quadraticCurveTo(0, s * 0.52, -s * 0.30, s * 0.22);
      ctx.lineTo(-s * 0.38, -s * 0.30);
      ctx.closePath();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, -s * 0.28); ctx.lineTo(0, s * 0.27);
      ctx.moveTo(-s * 0.20, -s * 0.02); ctx.lineTo(s * 0.20, -s * 0.02);
      ctx.stroke();
    } else if (type === "flame") {
      ctx.beginPath();
      ctx.moveTo(0, s * 0.48);
      ctx.bezierCurveTo(-s * 0.44, s * 0.20, -s * 0.30, -s * 0.10, -s * 0.06, -s * 0.46);
      ctx.bezierCurveTo(s * 0.02, -s * 0.16, s * 0.38, -s * 0.12, s * 0.28, s * 0.20);
      ctx.bezierCurveTo(s * 0.22, s * 0.42, s * 0.08, s * 0.48, 0, s * 0.48);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "rgba(0,0,0,.28)";
      ctx.beginPath();
      ctx.moveTo(0, s * 0.34);
      ctx.quadraticCurveTo(-s * 0.14, s * 0.10, s * 0.05, -s * 0.14);
      ctx.quadraticCurveTo(s * 0.22, s * 0.16, 0, s * 0.34);
      ctx.fill();
    } else if (type === "phase") {
      ctx.beginPath();
      ctx.moveTo(-s * 0.42, s * 0.28);
      ctx.lineTo(s * 0.18, -s * 0.42);
      ctx.moveTo(-s * 0.12, s * 0.42);
      ctx.lineTo(s * 0.46, -s * 0.24);
      ctx.stroke();
      ctx.globalAlpha *= 0.55;
      ctx.beginPath();
      ctx.moveTo(-s * 0.48, -s * 0.03);
      ctx.lineTo(s * 0.05, -s * 0.48);
      ctx.stroke();
    } else if (type === "gravity") {
      ctx.beginPath();
      ctx.arc(0, 0, s * 0.42, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 0, s * 0.13, 0, Math.PI * 2);
      ctx.fill();
      for (let i = 0; i < 3; i++) {
        const angle = i * Math.PI * 2 / 3 - Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(angle) * s * 0.20, Math.sin(angle) * s * 0.20);
        ctx.quadraticCurveTo(
          Math.cos(angle + 0.75) * s * 0.48,
          Math.sin(angle + 0.75) * s * 0.48,
          Math.cos(angle + 1.25) * s * 0.38,
          Math.sin(angle + 1.25) * s * 0.38
        );
        ctx.stroke();
      }
    } else if (type === "score") {
      ctx.beginPath();
      ctx.moveTo(0, -s * 0.44);
      ctx.lineTo(s * 0.38, 0);
      ctx.lineTo(0, s * 0.44);
      ctx.lineTo(-s * 0.38, 0);
      ctx.closePath();
      ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, s * 0.10, 0, Math.PI * 2); ctx.fill();
    } else if (type === "strike") {
      ctx.beginPath();
      for (let i = 0; i < 12; i++) {
        const radius = i % 2 ? s * 0.23 : s * 0.48;
        const angle = i * Math.PI / 6;
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "rgba(0,0,0,.34)";
      ctx.fillRect(-s * 0.13, -s * 0.14, s * 0.26, s * 0.28);
    } else if (type === "fire") {
      ctx.beginPath(); ctx.arc(0, 0, s * 0.28, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-s * 0.50, 0); ctx.lineTo(-s * 0.22, 0);
      ctx.moveTo(s * 0.22, 0); ctx.lineTo(s * 0.50, 0);
      ctx.moveTo(0, -s * 0.50); ctx.lineTo(0, -s * 0.22);
      ctx.moveTo(0, s * 0.22); ctx.lineTo(0, s * 0.50);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, s * 0.08, 0, Math.PI * 2); ctx.fill();
    } else if (type === "jump") {
      ctx.beginPath();
      ctx.moveTo(0, -s * 0.48);
      ctx.lineTo(-s * 0.34, -s * 0.10);
      ctx.moveTo(0, -s * 0.48);
      ctx.lineTo(s * 0.34, -s * 0.10);
      ctx.moveTo(0, -s * 0.42);
      ctx.lineTo(0, s * 0.32);
      ctx.moveTo(-s * 0.28, s * 0.42);
      ctx.lineTo(s * 0.28, s * 0.42);
      ctx.stroke();
    } else if (type === "down") {
      ctx.beginPath();
      ctx.moveTo(0, s * 0.48);
      ctx.lineTo(-s * 0.34, s * 0.10);
      ctx.moveTo(0, s * 0.48);
      ctx.lineTo(s * 0.34, s * 0.10);
      ctx.moveTo(0, s * 0.42);
      ctx.lineTo(0, -s * 0.34);
      ctx.stroke();
    } else if (type === "move") {
      ctx.beginPath();
      ctx.moveTo(-s * 0.48, 0); ctx.lineTo(s * 0.48, 0);
      ctx.moveTo(-s * 0.48, 0); ctx.lineTo(-s * 0.25, -s * 0.22);
      ctx.moveTo(-s * 0.48, 0); ctx.lineTo(-s * 0.25, s * 0.22);
      ctx.moveTo(s * 0.48, 0); ctx.lineTo(s * 0.25, -s * 0.22);
      ctx.moveTo(s * 0.48, 0); ctx.lineTo(s * 0.25, s * 0.22);
      ctx.stroke();
    } else if (type === "check") {
      ctx.beginPath();
      ctx.moveTo(-s * 0.42, 0);
      ctx.lineTo(-s * 0.10, s * 0.32);
      ctx.lineTo(s * 0.48, -s * 0.38);
      ctx.stroke();
    } else if (type === "next") {
      ctx.beginPath();
      ctx.moveTo(-s * 0.42, -s * 0.32);
      ctx.lineTo(s * 0.06, 0);
      ctx.lineTo(-s * 0.42, s * 0.32);
      ctx.moveTo(s * 0.02, -s * 0.32);
      ctx.lineTo(s * 0.48, 0);
      ctx.lineTo(s * 0.02, s * 0.32);
      ctx.stroke();
    } else if (type === "warning") {
      ctx.beginPath();
      ctx.moveTo(0, -s * 0.48);
      ctx.lineTo(s * 0.46, s * 0.38);
      ctx.lineTo(-s * 0.46, s * 0.38);
      ctx.closePath();
      ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -s * 0.18); ctx.lineTo(0, s * 0.12); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, s * 0.26, s * 0.05, 0, Math.PI * 2); ctx.fill();
    } else if (type === "lock") {
      ctx.strokeRect(-s * 0.32, -s * 0.02, s * 0.64, s * 0.46);
      ctx.beginPath();
      ctx.arc(0, -s * 0.04, s * 0.24, Math.PI, 0);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(0, s * 0.18, s * 0.06, 0, Math.PI * 2); ctx.fill();
    } else if (type === "keyboard") {
      ctx.strokeRect(-s * 0.48, -s * 0.32, s * 0.96, s * 0.64);
      for (let row = -1; row <= 1; row++) {
        for (let col = -2; col <= 2; col++) {
          ctx.fillRect(col * s * 0.15 - s * 0.04, row * s * 0.14 - s * 0.03, s * 0.08, s * 0.06);
        }
      }
    } else if (type === "weapon0") {
      ctx.fillRect(-s * 0.42, -s * 0.12, s * 0.68, s * 0.22);
      ctx.fillRect(-s * 0.02, s * 0.08, s * 0.18, s * 0.28);
      ctx.fillRect(s * 0.27, -s * 0.06, s * 0.21, s * 0.10);
    } else if (type === "weapon1") {
      ctx.beginPath();
      ctx.moveTo(-s * 0.40, 0); ctx.lineTo(s * 0.42, 0);
      ctx.moveTo(-s * 0.34, -s * 0.12); ctx.lineTo(s * 0.34, -s * 0.32);
      ctx.moveTo(-s * 0.34, s * 0.12); ctx.lineTo(s * 0.34, s * 0.32);
      ctx.stroke();
    } else if (type === "weapon2") {
      ctx.beginPath();
      ctx.moveTo(-s * 0.42, -s * 0.24); ctx.lineTo(-s * 0.06, 0); ctx.lineTo(-s * 0.42, s * 0.24);
      ctx.moveTo(-s * 0.02, -s * 0.24); ctx.lineTo(s * 0.34, 0); ctx.lineTo(-s * 0.02, s * 0.24);
      ctx.stroke();
    } else if (type === "weapon3") {
      ctx.beginPath();
      ctx.moveTo(s * 0.44, 0); ctx.lineTo(-s * 0.08, -s * 0.20); ctx.lineTo(-s * 0.28, 0); ctx.lineTo(-s * 0.08, s * 0.20); ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-s * 0.28, -s * 0.10); ctx.lineTo(-s * 0.46, -s * 0.26);
      ctx.moveTo(-s * 0.28, s * 0.10); ctx.lineTo(-s * 0.46, s * 0.26);
      ctx.stroke();
    }
    ctx.restore();
  }

      ctx.fillText(connected ? `P${id + 1}${ownerText}` : `P${id + 1} • OPEN`, rosterX + 12 * scale, rowY + rowH * 0.34);
      ctx.fillStyle = connected ? CHARACTER_PROFILES[row.character].color : UI_THEME.muted;

    const settingsH = landscape ? 216 * scale : 190 * scale;

    ctx.fillText("MISSION SETUP", settingsX + settingsW / 2, settingsY + 18 * scale);
    const arrowW = 38 * scale;
    const settingRowH = 42 * scale;
    const settingX = settingsX + 10 * scale;
    const settingW = settingsW - 20 * scale;
    const levelY = settingsY + 32 * scale;
    uiRects.menu.lobbyLevelPrev = { x: settingX, y: levelY, w: arrowW, h: settingRowH };
    uiRects.menu.lobbyLevelNext = { x: settingX + settingW - arrowW, y: levelY, w: arrowW, h: settingRowH };
    drawMenuArrow(uiRects.menu.lobbyLevelPrev, -1, false);
    drawMenuArrow(uiRects.menu.lobbyLevelNext, 1, false);
    ctx.fillStyle = UI_THEME.text;
    ctx.font = `900 ${fitCanvasText(WORLD_ZONES[menuLevel].short, settingW - arrowW * 2 - 12 * scale, 10 * scale, 7 * scale)}px ${UI_FONT}`;
    ctx.fillText(WORLD_ZONES[menuLevel].short, settingsX + settingsW / 2, levelY + settingRowH / 2);
    const diffY = levelY + settingRowH + 7 * scale;
    uiRects.menu.lobbyDiffPrev = { x: settingX, y: diffY, w: arrowW, h: settingRowH };
    uiRects.menu.lobbyDiffNext = { x: settingX + settingW - arrowW, y: diffY, w: arrowW, h: settingRowH };
    drawMenuArrow(uiRects.menu.lobbyDiffPrev, -1, false);
    drawMenuArrow(uiRects.menu.lobbyDiffNext, 1, false);
    ctx.fillStyle = UI_THEME.text;
    ctx.font = `900 ${10 * scale}px ${UI_FONT}`;
    ctx.fillText(DIFFICULTY_OPTIONS[menuDifficulty].label, settingsX + settingsW / 2, diffY + settingRowH / 2);
    const characterY = diffY + settingRowH + 8 * scale;
    const characterGap = 5 * scale;
    const characterW = (settingW - characterGap * (CHARACTER_PROFILES.length - 1)) / CHARACTER_PROFILES.length;
    const characterH = 48 * scale;
    uiRects.menu.lobbyCharacters = [];
    CHARACTER_PROFILES.forEach((profile, index) => {
      const rect = {
        x: settingX + index * (characterW + characterGap),
        y: characterY,
        w: characterW,
        h: characterH
      };
      uiRects.menu.lobbyCharacters.push(rect);
      const selected = index === menuCharacter;
      drawPixelPanel(
        rect.x, rect.y, rect.w, rect.h,
        selected ? UI_THEME.panelActive : UI_THEME.panelRaised,
        selected ? profile.accent : UI_THEME.borderMuted,
        false
      );
      if (selected) {
        ctx.strokeStyle = profile.color;
        ctx.lineWidth = 1.8 * scale;
        roundRect(rect.x + 2.5 * scale, rect.y + 2.5 * scale, rect.w - 5 * scale, rect.h - 5 * scale, 5 * scale);
        ctx.stroke();
      }
      drawUiIcon(profile.powerIcon, rect.x + rect.w / 2, rect.y + 16 * scale, 11 * scale, selected ? profile.color : UI_THEME.muted, 1.8 * scale);
      ctx.textAlign = "center";
      ctx.fillStyle = selected ? profile.color : UI_THEME.text;
      const labelSize = fitCanvasText(profile.name, rect.w - 6 * scale, 7.2 * scale, 4.8 * scale);
      ctx.font = `900 ${labelSize}px ${UI_FONT}`;
      ctx.fillText(profile.name, rect.x + rect.w / 2, rect.y + 35 * scale);
      if (selected) {
        ctx.fillStyle = profile.accent;
        ctx.font = `900 ${4.8 * scale}px ${UI_FONT}`;
        ctx.fillText("SELECTED", rect.x + rect.w / 2, rect.y + 44 * scale);
      }
    });

    const bottomY = y + panelH - 92 * scale;
    const actionGap = 8 * scale;
    const actionW = (panelW - side * 2 - actionGap * 2) / 3;
    uiRects.menu.copyInvite = { x: x + side, y: bottomY, w: actionW, h: 40 * scale };
    uiRects.menu.lobbyPrimary = { x: x + side + actionW + actionGap, y: bottomY, w: actionW, h: 40 * scale };
    uiRects.menu.leaveRoom = { x: x + side + (actionW + actionGap) * 2, y: bottomY, w: actionW, h: 40 * scale };
    drawMenuIconButton(uiRects.menu.copyInvite, "play", false, null, UI_THEME.blueBright, "COPY INVITE");
    const localRow = net.roster.get(net.localId);
    const primaryLabel = isRoomOwner() ? (onlineLobbyReady() ? "START" : "WAITING") : (localRow && localRow.ready ? "CANCEL READY" : "READY");
    drawMenuIconButton(uiRects.menu.lobbyPrimary, "play", false, null, isRoomOwner() && !onlineLobbyReady() ? UI_THEME.warning : UI_THEME.success, primaryLabel);
    drawMenuIconButton(uiRects.menu.leaveRoom, "back", false, null, UI_THEME.danger, "LEAVE");
    ctx.fillStyle = networkToneColor();
    ctx.font = `800 ${7 * scale}px ${UI_FONT}`;
    ctx.textAlign = "center";
